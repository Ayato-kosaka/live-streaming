<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ウィジェットの大きさ</title>
<!--
  PRISM の Web ウィジェットの中で、このページが何 px の大きさで描かれているかを
  画面に大きく出すだけのページ（#1022）。
  貯金箱を置く大きさは、ページの中の寸法（CSS px）で決まる。PRISM の箱の見た目と
  「140%」の倍率からは逆算できなかったので、ウィジェットの URL を一時的にここへ
  向けてもらい、小さいときと大きくしたときの2枚を撮ってもらう。
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    color: #fff;
    background: rgba(20, 16, 40, 0.55);
    overflow: hidden;
  }
  /* 10% ごとの目盛り。端に届いているかで、ページが箱いっぱいかが分かる */
  .grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.35) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(255,255,255,0.35) 2px, transparent 2px);
    background-size: 10% 10%;
    outline: 6px solid #ff3d7f; outline-offset: -6px;
  }
  .card {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.75); border-radius: 12px;
    padding: 3vw 4vw; text-align: center; line-height: 1.3;
    white-space: nowrap; max-width: 92vw;
  }
  h1 { margin: 0 0 1vw; font-size: 5vw; font-weight: 700; color: #ffd166; }
  .big { font-size: 11vw; font-weight: 800; font-variant-numeric: tabular-nums; }
  .row { font-size: 4.2vw; font-variant-numeric: tabular-nums; }
  .ref {
    position: fixed; right: 0; bottom: 0; width: 100px; height: 100px;
    background: #06d6a0; color: #000; font: 700 14px/100px system-ui; text-align: center;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="card">
  <h1>ウィジェットの大きさ</h1>
  <div class="big" id="wh">-</div>
  <div class="row" id="dpr">-</div>
  <div class="row" id="scr">-</div>
  <div class="row" id="vv">-</div>
  <div class="row" id="n">-</div>
</div>
<div class="ref">100px</div>
<script>
  // 大きさが変わるたびに描き直す（箱を手で広げたときも追える）
  var count = 0;
  function show() {
    count++;
    var vv = window.visualViewport;
    document.getElementById("wh").textContent =
      window.innerWidth + " × " + window.innerHeight;
    document.getElementById("dpr").textContent =
      "画素の倍率 " + (Math.round(window.devicePixelRatio * 100) / 100);
    document.getElementById("scr").textContent =
      "端末の画面 " + screen.width + " × " + screen.height;
    document.getElementById("vv").textContent = vv
      ? "見えている範囲 " + Math.round(vv.width) + " × " + Math.round(vv.height) +
        "（拡大 " + (Math.round(vv.scale * 100) / 100) + "）"
      : "見えている範囲 -";
    document.getElementById("n").textContent =
      "大きさが変わった回数 " + (count - 1);
  }
  window.addEventListener("resize", show);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", show);
  show();
</script>
</body>
</html>
