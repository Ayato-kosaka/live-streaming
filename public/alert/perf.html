<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アラートのなめらかさ</title>
<!--
  投げ銭アラート（/alertbox）の演出を、あやとのスマホの PRISM の中で何本か流して、
  その端末で何コマ描けたかと、カクついた回数を画面に出すページ（#1079）。
  この箱のブラウザで測った数は、スマホとは CPU が違うので、本物の端末の数をここで取る。

  使いかた: PRISM のウィジェットの URL を一時的に
  https://live-streaming-d3cac.web.app/alert/perf に向けてもらい、出た表を1枚撮ってもらう。
  - 演出は試し表示（`?preview=`）で流す。外の口・ログ・どねるには1本も繋がない
  - 季節は日付で決まる（本番と同じ）。`?theme=halloween` を付けると、そのテーマで流す
  - `?n=2` で各場面を2回ずつ流す
  - 「1,500円 ハロウィン」「1,500円 試作」の2場面は、日付や `?theme=` に関係なくハロウィンで流す。
    試作は演出の質の作り直しの試し（`?fx=lux`。光を焼いた絵を合成だけで動かす。#1079）で、
    いまの段4と同じ条件で並べて、スマホでの重さを比べる
  - 最後の場面だけ、測っているあいだに箱を手で広げたり戻したりしてもらう（画面に頼みを出す）。
    季節テーマを入れてから、アラートは箱の大きさが変わるたびに字を描き直すようになり、
    この箱では広げているあいだの CPU がハロウィン前の 3〜4 倍になった（#1079）

  測り方:
  - 演出は全面の iframe で開く（同じ出どころなので、コマは親と同じ流れで作られる）。
    コマの間隔は親の requestAnimationFrame で取る
  - PRISM は visualViewport.scale が 1 でない（豚が半分に描かれる）。iframe の中は 1 になるので、
    親と同じ幅を react-native-web が読むように、iframe の scale を合わせてから resize を1回送る
  - カクつきは「コマの間が 50ms を超えた回数」。画面のコマが 60 でも 120 でも、目に見える引っかかり
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    color: #fff;
    background: transparent;
    overflow: hidden;
  }
  iframe {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent;
  }
  .tag {
    position: fixed; left: 2vw; top: 2vw; z-index: 2;
    background: rgba(0, 0, 0, 0.6); border-radius: 2vw;
    padding: 1vw 2.4vw; font-size: 3.6vw; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  /* 頼みは上の端に。演出の字（箱の真ん中）を隠さない */
  .tag.ask {
    left: 4vw; right: 4vw; top: 4vw; text-align: center;
    font-size: 5.2vw; padding: 2.4vw; background: rgba(214, 40, 90, 0.88);
  }
  .card {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
    background: rgba(0, 0, 0, 0.82); border-radius: 12px;
    padding: 3vw 4vw; line-height: 1.3; width: 88vw; box-sizing: border-box;
  }
  .card[hidden] { display: none; }
  h1 { margin: 0 0 2vw; font-size: 5.4vw; font-weight: 800; color: #ffd166; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 0.9vw 1vw; font-size: 4vw; text-align: right; white-space: nowrap; }
  th { font-size: 3.2vw; color: #c9c9d6; font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  td.bad { color: #ff7a8a; font-weight: 800; }
  .row { margin-top: 2vw; font-size: 3.4vw; color: #d6d6e2; text-align: center; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 2.4vw; font-size: 4.4vw; font-weight: 800; text-align: center; color: #06d6a0; }
</style>
</head>
<body>
<iframe id="f" title="アラート" allow="autoplay"></iframe>
<div class="tag" id="tag">表が出るまでそのまま</div>
<div class="card" id="card" hidden>
  <h1>アラートのなめらかさ</h1>
  <table>
    <thead><tr><th>場面</th><th>コマ/秒</th><th>カクつき</th><th>最長コマ</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="row" id="dev">-</div>
  <div class="foot">この画面を撮って送ってください</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var theme = q.get("theme");
  var reps = Math.max(1, Math.min(5, Number(q.get("n")) || 1));
  // 場面。貯金箱はふだんずっと出ているもの。絵文字は名簿で絵文字を持っている人の花火と雨
  var STEPS = [
    { name: "貯金箱", q: { preview: "bank", fill: "60" }, sec: 8 },
    { name: "100円", q: { preview: "1", amount: "100" }, sec: 10 },
    { name: "1,000円", q: { preview: "1", amount: "1000" }, sec: 10 },
    { name: "10,000円", q: { preview: "1", amount: "10000" }, sec: 10 },
    { name: "1,000円 絵文字", q: { preview: "1", amount: "1000", emoji: "🌸" }, sec: 12 },
    { name: "5,000円 絵文字", q: { preview: "1", amount: "5000", emoji: "🌸" }, sec: 12 },
    { name: "10,000円 絵文字", q: { preview: "1", amount: "10000", emoji: "🌸" }, sec: 12 },
    // 演出の質の試作（#1079）。いまの段4と並べる。テーマは固定（ページの ?theme= で上書きしない）
    { name: "1,500円 ハロウィン", q: { preview: "1", amount: "1500", theme: "halloween" }, sec: 12 },
    { name: "1,500円 試作", q: { preview: "1", amount: "1500", theme: "halloween", fx: "lux" }, sec: 12 },
    // 投げ銭のときに箱を手で広げる、をそのまま測る（ここだけ、測っているあいだに手を動かしてもらう）
    { name: "1,000円 箱を動かす", q: { preview: "1", amount: "1000", emoji: "🌸" }, sec: 12, ask: "箱を広げたり戻したりしてください" }
  ];
  /* 演出が始まるまでの間（試し表示は開いてから 0.8 秒で投げ銭を出す。季節の絵を読む間もある） */
  var LEAD_MS = 1500;
  var STUTTER_MS = 50;

  var f = document.getElementById("f");
  var tag = document.getElementById("tag");

  // コマの間隔を集める。測っていないあいだも回す（測り始めの1コマを長く数えない）
  var rec = null;
  var last = 0;
  var all = [];
  function tick(ts) {
    if (last && rec) rec.push(ts - last);
    if (last) all.push(ts - last);
    if (all.length > 600) all.shift();
    last = ts;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function wait(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  /* iframe の中の react-native-web が、親（PRISM のページそのもの）と同じ幅を読むようにする */
  function matchScale(w) {
    try {
      var pv = window.visualViewport;
      var iv = w.visualViewport;
      if (!pv || !iv || !w.VisualViewport) return;
      var want = pv.width * pv.scale;
      if (Math.abs(want - iv.width * iv.scale) < 1) return;
      var k = want / iv.width;
      Object.defineProperty(w.VisualViewport.prototype, "scale", { configurable: true, get: function () { return k; } });
      iv.dispatchEvent(new Event("resize"));
    } catch (e) {
      // 合わせられなくても測るのは続ける
    }
  }

  function open(step) {
    var p = new URLSearchParams(step.q);
    if (theme && !step.q.theme) p.set("theme", theme);
    return new Promise(function (resolve) {
      f.onload = function () {
        matchScale(f.contentWindow);
        resolve();
      };
      f.src = "/alertbox/?" + p.toString();
    });
  }

  function median(xs) {
    var s = xs.slice().sort(function (a, b) { return a - b; });
    return s.length ? s[Math.floor(s.length / 2)] : 0;
  }

  async function run() {
    var results = [];
    var total = STEPS.length * reps;
    var done = 0;
    for (var r = 0; r < reps; r++) {
      for (var i = 0; i < STEPS.length; i++) {
        var step = STEPS[i];
        done++;
        tag.textContent = done + " / " + total + "　" + step.name + "　表が出るまでそのまま";
        tag.className = "tag";
        await open(step);
        await wait(LEAD_MS);
        if (step.ask) {
          tag.textContent = step.ask;
          tag.className = "tag ask";
        }
        rec = [];
        var t0 = performance.now();
        await wait(step.sec * 1000);
        var gaps = rec;
        rec = null;
        var sec = (performance.now() - t0) / 1000;
        var stutter = gaps.filter(function (g) { return g > STUTTER_MS; }).length;
        results.push({
          name: step.name,
          fps: gaps.length / sec,
          stutter: stutter,
          max: gaps.length ? Math.max.apply(null, gaps) : 0
        });
      }
    }
    f.src = "about:blank";
    show(results);
  }

  function show(results) {
    var rows = document.getElementById("rows");
    var hz = 1000 / (median(all) || 16.7);
    results.forEach(function (x) {
      var tr = document.createElement("tr");
      var low = x.fps < hz * 0.85;
      tr.innerHTML =
        "<td>" + x.name + "</td>" +
        "<td class='" + (low ? "bad" : "") + "'>" + x.fps.toFixed(0) + "</td>" +
        "<td class='" + (x.stutter > 0 ? "bad" : "") + "'>" + x.stutter + "回</td>" +
        "<td class='" + (x.max > 100 ? "bad" : "") + "'>" + Math.round(x.max) + "ms</td>";
      rows.appendChild(tr);
    });
    var vv = window.visualViewport;
    document.getElementById("dev").textContent =
      innerWidth + "×" + innerHeight +
      "　画素 " + (Math.round(devicePixelRatio * 100) / 100) +
      "　拡大 " + (vv ? Math.round(vv.scale * 100) / 100 : "-") +
      "　画面 " + Math.round(hz) + "コマ/秒" +
      (theme ? "　" + theme : "");
    tag.hidden = true;
    document.getElementById("card").hidden = false;
  }

  run();
})();
</script>
</body>
</html>
