      /* ---- 13. エンディング ---- */
      function renderEnding() {
        const e = DECK.ending;
        return `
          <div class="e-wrap">
            <div data-step="0">${icon("isle")}</div>
            <h2 class="e-main" data-step="0">${escapeHtml(e.main)}</h2>
            <div class="e-sub" data-step="1">${escapeHtml(e.sub)}</div>
            <div class="e-small" data-step="2">${escapeHtml(e.small)}</div>
          </div>`;
      }

      /* ======================= あやと島カード =======================
         焼いた絵と手形は tools/build_deck_photos.py が public/review/ に置く。
         手形は <script src="review/manifest.js"> が window.DECK_PHOTOS に載せる。
         **実行中に外へ取りに行かない**（配信の最中に1枚落ちたら画面が欠ける）。
         ============================================================= */

      /** 手形。載っていなければ null。**null でも面は組み上がる。** */
      const CARD_DATA = window.DECK_PHOTOS || null;

      /** 壁に並べる枚数。8列 × 3段 */
      const CARD_WALL_N = 24;

      /**
       * 壁に出さない景色。
       *
       * 既定の立ち位置は「右下ひとところ」なので、右下が水面の写真だと
       * **人が水の上に立つ。** 立ち位置の寸法は島の /cards と同じもので
       * （docs/nordic-photos.md 5章）、資料の都合で変えると
       * 持って帰ったカードと見え方が食い違う。**寸法ではなく、並べる写真のほうを選ぶ。**
       * 運河・港・フェリーの舷側・噴水の池の5枚。
       */
      const CARD_WALL_SKIP = [
        "JKU73YhxwozamxW0yvuB", "cZBYhipmxZ27S8GUjNbl", "GsM4mnY1VCA3STIBVwPX",
        "J61AISBb5bWXXYasv7Z5", "KYlBP9xJ5dlJJBJrQwDk",
      ];

      /**
       * その人の「島でのえらばれやすさ」（0〜1）。
       *
       * **自前で順位を組まない。** 中身は site/content/residents.ts の score で、
       * 直近90日の投げ銭の総額の順位と、同じ期間の出席日数の順位を
       * それぞれ 0〜1 に直して足して2で割ったもの。島を日替わりで歩く人を
       * 選んでいる重み（components/island/roster.ts）と同じ物差しを、
       * カードに誰を立てるかにも使う（あやと・2026-09-22
       * 「投げ銭順位や出席順位が高い人を優先して」）。
       *
       * 手形に score が無い人（名簿の直近90日より前の人）は 0。
       * **0 は順番が後ろになるだけで、出られなくなってはいけない。**
       */
      function charScore(icon) {
        const ch = CARD_DATA && CARD_DATA.chars[icon];
        return ch && typeof ch.score === "number" ? ch.score : 0;
      }

      /** 点の高い順。**同点は icon 順**にして決め打ちにする（乱数を使わない） */
      function byScore(a, b) {
        return (
          charScore(b.icon) - charScore(a.icon) ||
          (a.icon < b.icon ? -1 : a.icon > b.icon ? 1 : 0)
        );
      }

      /** 壁と表紙に出せる景色を、旅の順に。**右下が水面の5枚は外す** */
      function wallPhotos() {
        const all = [];
        CARD_DATA.days.forEach((d) =>
          d.photos.forEach((p) => {
            if (CARD_WALL_SKIP.indexOf(p.id) < 0) all.push(p);
          })
        );
        return all;
      }

      /**
       * 1枚の写真に立てる人を選ぶ。**その写真に立っている人のうち、いちばん点の高い人。**
       *
       * ただし既に cap 枚出ている人は次点に譲る（同じ顔が壁を埋めないため）。
       * **全員が上限に達していたら、いちばん出ていない人**に回す——
       * 写真は空けないが、上限を超えるぶんまで点の高い人に寄せない
       * （点だけで戻すと、上限2枚のはずの人が24枚中4枚に出た。実測）。
       * `avoid` は「できれば避ける icon」（**隣の1枚と同じ顔にしない**ため。
       * 上限2枚は守れていても、24枚の壁で隣どうしが同じ顔だと目につく。実測で出た）。
       * `used` は icon → もう何枚に出たか。
       */
      function pickWho(photo, used, cap, avoid) {
        const people = (photo.people || []).slice().sort(byScore);
        if (!people.length) return null;
        const n = (w) => used.get(w.icon) || 0;
        // sort が点の高い順に並べてあるので、同数なら先に来たほう＝点の高いほうが残る
        const other = people.filter((w) => w.icon !== avoid);
        const who =
          other.find((w) => n(w) < cap) ||
          // 上限に達した人しか残っていない。**隣と同じ顔にするより、
          // いちばん出ていない人を1枚おまけ**にしたほうが壁は散る
          (other.length ? other.reduce((a, w) => (n(w) < n(a) ? w : a)) : null) ||
          people.reduce((a, w) => (n(w) < n(a) ? w : a));
        used.set(who.icon, n(who) + 1);
        return who;
      }

      /* 壁で同じ顔を何枚まで許すか。**2枚。**
         24枚に対して立てる人が22人いるので、1枚ずつでも壁は埋まる。
         **ただし1枚ずつに切ると、上位も下位もきっちり同じ枚数になって、
         「点の高い人を優先する」が効かなくなる。** 2枚までにすれば上位の人が
         2枚に出られて、それでも壁の 2/24。
         実測では12人が立って、いちばん多い人が3枚（24枚に対して11人×2枚では
         2枚足りず、そのぶんが上の「いちばん出ていない人」に回ったもの）。 */
      const WALL_FACE_CAP = 2;

      /**
       * 壁に出す「写真 × その写真に立っている1人」を選ぶ。
       *
       * **決め打ちで選ぶ。** 乱数を使うと配信のたびに並びが変わって、
       * 前もって撮った確認の絵と突き合わせられなくなる。
       * 写真の選び方は変えない——旅の頭から終わりまで等間隔に取るので、
       * 11日ぶんの景色が満遍なく並ぶ。**変えたのは立つ人の決め方で、
       * 順繰りではなく点の高い順**（上限まで出た人は次点に譲る）。
       */
      function cardWallPicks(n, cap) {
        const all = wallPhotos();
        if (!all.length) return [];
        const step = all.length / n;
        const used = new Map();
        const out = [];
        for (let i = 0; i < n; i++) {
          const p = all[Math.min(all.length - 1, Math.round(i * step))];
          // 直前の1枚と同じ顔は避ける（横に8枚並ぶので、隣どうしがいちばん目につく）
          const prev = out.length ? out[out.length - 1].who.icon : null;
          const who = pickWho(p, used, cap || WALL_FACE_CAP, prev);
          if (who) out.push({ photo: p, who });
        }
        return out;
      }

      /* 同じ人が「その日の主役」（日ごとの区画の大きい1枚）になれる日数の上限。**2日。**
         旅は10日なので、**上限2日なら主役は最低5人に散る**（10日 ÷ 2日）。
         上限を置かないと、ほぼ全部の写真に写っている点いちばんの人が
         10日中8日の主役になった（実測）。順位は使うが、
         「上位が強いこと」と「上位だけが出ること」は別
         （docs/island-design.md 5章「同じ顔で埋めない」）。 */
      const DAY_LEAD_CAP = 2;

      /**
       * 日ごとの主役を、**全日まとめて一度だけ決める。**
       *
       * 1日ずつその場で決めると、どの順で呼ばれたかで結果が変わる。
       * 日の昇順に、その日の代表写真に立っている人のうち点の高い人から配り、
       * 既に上限まで主役になった人は次点に譲る。**前日と同じ人も避ける。**
       * 乱数を使わないので、何度開いても同じ並びになる。
       */
      let DAY_LEADS = null;
      function dayLeads() {
        if (DAY_LEADS) return DAY_LEADS;
        DAY_LEADS = new Map();
        const used = new Map();
        let prev = null;
        ((CARD_DATA && CARD_DATA.days) || []).forEach((d) => {
          const hero = d.photos.find((p) => p.id === d.hero) || d.photos[0];
          if (!hero) return;
          const who = pickWho(hero, used, DAY_LEAD_CAP, prev);
          if (!who) return;
          DAY_LEADS.set(d.day, who.icon);
          prev = who.icon;
        });
        return DAY_LEADS;
      }

      /**
       * 表紙の5枚。**点の上位5人が、1人1枚ずつ立つ。同じ人は2枚に出ない。**
       *
       * 壁と違って、写真を先に決めない。**人を先に決めて、その人が実際に
       * 立っている写真から渡す**（先に写真を決めると、上位の人がたまたま
       * その5枚に居なかっただけで表紙から落ちる）。
       * 写真は旅の頭から終わりまで散らす——i番目の人には「旅の i/(n-1) あたり」に
       * いちばん近い、まだ使っていない自分の写真を渡す。
       * 点の高い順に配るので、左から右へ旅の順にもなる。**決め打ち。**
       */
      function titlePicks(n) {
        const all = wallPhotos();
        if (!all.length) return [];
        const where = new Map(); // icon → その人が立っている写真の位置
        all.forEach((p, i) =>
          (p.people || []).forEach((w) => {
            if (!where.has(w.icon)) where.set(w.icon, []);
            where.get(w.icon).push(i);
          })
        );
        const icons = [...where.keys()].sort((a, b) => byScore({ icon: a }, { icon: b }));
        const taken = new Set();
        const out = [];
        icons.slice(0, n).forEach((icon, i) => {
          const target = n > 1 ? Math.round((i * (all.length - 1)) / (n - 1)) : 0;
          let at = -1;
          where.get(icon).forEach((j) => {
            if (taken.has(j)) return;
            if (at < 0 || Math.abs(j - target) < Math.abs(at - target)) at = j;
          });
          if (at < 0) return; // その人の写真が全部ふさがっていた
          taken.add(at);
          out.push({ photo: all[at], who: all[at].people.find((w) => w.icon === icon) });
        });
        return out;
      }

      /**
       * カード1枚。その日の景色の上に、その日そこにいた人が1人立っている。
       *
       * 立ち位置は島の画面（site/components/cards/cards.ts の cardPlace）と
       * **同じ値**。既定は右下ひとところ・縦の写真は横幅の34%・右端から2%・
       * 下端から5%・傾き0で、台帳の x/y/rot/scale を使うのは
       * **本人が動かしたもの（moved）だけ**（既定のまま使うと右端を越えて
       * 絵が切れ、1人ずつ大きさが変わる。あやと・2026-09-10）。
       * 数字は手形の place から取る。**ここに書き写さない。**
       */
      function cardFace(photo, who, big) {
        const ch = CARD_DATA.chars[who.icon];
        if (!ch) return "";
        const P = CARD_DATA.place;
        const tall = photo.h > photo.w;
        const base = tall ? P.byWidth : P.byHeight;
        const pct = (v) => `${(v * 100).toFixed(2)}%`;
        let at;
        if (!who.moved) {
          // 既定。**右端から測るので、絵の縦横比を知らなくても枠から出ない**
          at = `${tall ? "width" : "height"}:${pct(base)};right:${pct(P.right)};bottom:${pct(P.bottom)}`;
        } else {
          // 動かしたぶん。**枠から出さない**（cardPlace と同じ挟み方）
          const k = Math.min(2, Math.max(0.4, who.scale || 1));
          const w = (tall ? base : (base * photo.h) / Math.max(1, photo.w)) * k;
          const half = Math.min(0.5, w / 2);
          const cx = Math.min(1 - half, Math.max(half, who.x));
          const rot = Math.max(-20, Math.min(20, who.rot || 0));
          at =
            `${tall ? "width" : "height"}:${pct(base * k)};` +
            `left:${pct(cx)};bottom:${pct(Math.min(0.9, Math.max(0, 1 - who.y)))};` +
            `transform:translateX(-50%) rotate(${rot}deg)`;
        }
        const src = (big && photo.big) || photo.small;
        return `
          <div class="akc-card">
            <div class="akc-shot" style="aspect-ratio:${photo.w} / ${photo.h}">
              <img class="akc-photo" src="${src}" alt="" />
              <span class="akc-stand" style="${at}">
                <img src="${ch.src}" width="${ch.w}" height="${ch.h}" alt="" />
              </span>
            </div>
          </div>`;
      }

      /** 「2026-09-17」→「9月17日(水)」。島の中の日付の言い方にそろえる */
      function cardWhen(iso) {
        const w = "日月火水木金土"[new Date(`${iso}T00:00:00Z`).getUTCDay()] || "";
        return `${Number(iso.slice(5, 7))}月${Number(iso.slice(8, 10))}日(${w})`;
      }

      function renderCards() {
        const head = cornerHead("CARDS", "あやと島カード", "isle");
        if (!CARD_DATA || !CARD_DATA.days.length) {
          // 手形が載っていない。**数字だけ並べて誤魔化さない**
          return `${head}<div class="akc"><div class="akc-none note" data-step="0">
            カードの絵がまだ載っていません（review/manifest.js）
          </div></div>`;
        }
        /* 大きい1枚は、**いちばん多くの人に届いた日の代表**。
           同着は後ろの日（旅の終わりに近いほう）。決め打ちなので毎回同じ1枚 */
        const day = CARD_DATA.days.reduce((a, b) => (b.cardCount >= a.cardCount ? b : a));
        const hero = day.photos.find((p) => p.id === day.hero) || day.photos[0];
        /* 大きい1枚に立つのも**点のいちばん高い人。** ここだけ icon 順のままだと、
           区画でいちばん大きく出る1人が順位と関係なく決まる */
        const heroWho = (hero.people || []).slice().sort(byScore)[0];
        const wall = cardWallPicks(CARD_WALL_N).map((c) => cardFace(c.photo, c.who, false)).join("");
        return `
          ${head}
          <div class="akc">
            <p class="akc-lead" data-step="0">その日に投げ銭してくれた人へ、<b>その日の景色に自分のキャラクターが立った1枚</b>が届く。受け取りに行く場所はどこにも無くて、あやと島の「じぶんのこと」に勝手に増えていく。</p>
            <div class="akc-body">
              <div class="akc-hero" data-step="1">
                ${heroWho ? cardFace(hero, heroWho, true) : ""}
                <div class="akc-hero-cap">${escapeHtml(hero.note || "その日の景色")}
                  <span>${cardWhen(day.day)}・この日だけで${day.cardCount}枚が配られた</span>
                </div>
              </div>
              <div class="akc-wall" data-step="2">${wall}</div>
            </div>
            <div class="akc-foot" data-step="3">
              <div class="akc-quote">「ポケカみたいな言うたなww　あやカ！！」「私たちにとっては、ポケカよりあやカ」<i>　9/18 のコメントから</i></div>
              <div class="akc-nums">
                <div class="akc-num"><b>${CARD_DATA.cardCount}</b><span>配られた枚数</span></div>
                <div class="akc-num"><b>${CARD_DATA.photoCount}</b><span>その日の景色</span></div>
                <div class="akc-num"><b>${CARD_DATA.charCount}</b><span>立った人</span></div>
              </div>
            </div>
          </div>`;
      }

      /* ---- 1日ぶんの区画に、その日の写真を添える ----
         **出るのは大きい代表1枚と、その日の他の景色2枚まで。**
         日ごとの行は字が主役なので、写真で3段目を作らない。 */
      /* ---- その日の声 ----
         配信のあとにコメント欄でやりとりした、**その日の気持ち**。
         出来事の段落とは別の層なので、字の大きさも色も分ける。

         **置き場は写真の右の空き。** 日ごとの行は高さが決まっていて
         （.d-list の min-height）、字の下に足すと写真が下から潰れる。
         横はどの日も 750px 以上あまっているので、そこを使う。
         材料が無い日（出発・7日目）は**何も出さない。埋めない。** */
      function dayVoice(d) {
        if (!d.voice || !d.voice.length) return "";
        const lines = d.voice
          .map(
            (v) => `
            <div class="dv-line ${v.w === "me" ? "me" : "fan"}">
              <span class="dv-who">${v.w === "me" ? "あやと" : "視聴者さん"}</span>
              <span class="dv-say">${md(v.t)}</span>
            </div>`
          )
          .join("");
        return `<div class="dv">${lines}</div>`;
      }

      function dayPhoto(dayId, voice) {
        if (!CARD_DATA) return voice ? `<div class="dv-alone">${voice}</div>` : "";
        const key = String(dayId).trim();
        const day = CARD_DATA.days.find((d) => {
          if (d.day === key) return true;
          // 「9/17」。0 を落とした書き方も、付けた書き方も受ける
          const m = key.match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/);
          return !!m && d.day.slice(5) === `${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
        });
        if (!day || !day.photos.length) return voice ? `<div class="dv-alone">${voice}</div>` : "";
        const hero = day.photos.find((p) => p.id === day.hero) || day.photos[0];
        /* 主役（大きい1枚）は dayLeads が全日まとめて決めたぶん。
           **点の高い人から配るが、1人2日までで止める**（DAY_LEAD_CAP）。
           前は日付から順繰りに決めていて順位を見ておらず、点だけで選ぶと
           10日中8日が同じ顔になった。添えの2枚は、その日に立っている人の
           点の高い順から——**1日の中では同じ人を2枚に出さない。** */
        const leadIcon = dayLeads().get(day.day);
        const who =
          (hero.people || []).find((w) => w.icon === leadIcon) || pickWho(hero, new Map(), 1);
        const used = new Map(who ? [[who.icon, 1]] : []);
        const rest = day.photos
          .filter((p) => p.id !== hero.id && CARD_WALL_SKIP.indexOf(p.id) < 0)
          .slice(0, 2)
          .map((p) => {
            const w = pickWho(p, used, 1);
            return w ? `<div class="dp-sub">${cardFace(p, w, false)}</div>` : "";
          })
          .join("");
        const heads = new Set();
        day.photos.forEach((p) => p.people.forEach((w) => heads.add(w.icon)));
        return `
          <div class="dp">
            <div class="dp-main">${who ? cardFace(hero, who, true) : ""}</div>
            ${rest ? `<div class="dp-rest">${rest}</div>` : ""}
            <div class="dp-note">
              ${voice || ""}
              ${hero.note ? `<b>${escapeHtml(hero.note)}</b>` : ""}
              <span>この日の景色に、${heads.size}人が立った</span>
            </div>
          </div>`;
      }

      /* ======================== シーンの並び ======================== */
      const SCENES = [
        { dot: 0, total: 2, render: renderTitle },
        { dot: 1, total: 13, render: renderNumbers },
        { dot: 2, total: 9, render: renderDays, mapByStep: true },
        { dot: 3, total: 4, render: renderCars },
        { dot: 4, total: 5, render: renderPlaces },
        { dot: 5, total: 4, render: renderFood },
        { dot: 6, total: 9, render: renderTroubles },
      ];
      // クイズは1問1画面。ctrl には問題数しか出さない
      DECK.quiz.forEach((_, i) => {
        SCENES.push({
          dot: 7,
          total: 2,
          render: () => renderQuiz(i),
          ctrlTitle: `クイズ ${i + 1}問目 / ${DECK.quiz.length}問`,
          ctrlSubs: [
            "つぎ: 三択を出す",
            "つぎ: 答えあわせ",
            i + 1 < DECK.quiz.length ? "つぎ: 次の問題へ" : "つぎ: 次のコーナーへ",
          ],
        });
      });
      SCENES.push({ dot: 8, total: 10, render: renderPeaks });
      SCENES.push({ dot: 9, total: 11, render: renderViewers });
      /* **カードは「視聴者さんが動かした旅」と「投げ銭」のあいだ。**
         投げ銭するとカードが届く、という順に読めるようにする */
      SCENES.push({ dot: 10, total: 3, render: renderCards });
      SCENES.push({ dot: 11, total: 5, render: renderGift, confettiAt: 5 });
      SCENES.push({ dot: 12, total: DECK.letter.paras.length, render: renderLetter });
      SCENES.push({ dot: 13, total: 2, render: renderEnding, confettiAt: 0, confettiBig: true });

      const DOT_OF_SCENE = SCENES.map((s) => s.dot);
      const DOT_COUNT = DOT_LABELS.length;

      /* ======================== ステート機械 ======================== */
      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const hint = document.getElementById("hint");
      let sceneIdx = 0;
      let stepIdx = 0;
      let interacted = false;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function buildDots() {
        progress.innerHTML = Array.from({ length: DOT_COUNT }, () => '<span class="dot"></span>').join("");
      }
      function updateDots() {
        const cur = DOT_OF_SCENE[sceneIdx];
        [...progress.children].forEach((d, i) => d.classList.toggle("act", i === cur));
      }

      function applySteps() {
        if (IS_CTRL) return; // ctrl には舞台が無い
        stage.querySelectorAll("[data-step]").forEach((el) => {
          /* ふつうは「その歩まで来たら出して、そのまま置く」。
             **`data-solo` を持つものだけは、その歩のときだけ出す。**
             1日ぶんの日誌は3段落あるので、10日ぶんを積むと画面から溢れる。
             積まずに差し替えるほうが、1日を読ませる面になる。 */
          const n = Number(el.dataset.step);
          el.classList.toggle("on", el.hasAttribute("data-solo") ? n === stepIdx : n <= stepIdx);
        });
        stage.querySelectorAll("[data-mark]").forEach((el) => {
          el.classList.toggle("marked", Number(el.dataset.mark) <= stepIdx);
        });
        stage.querySelectorAll("[data-dim]").forEach((el) => {
          el.classList.toggle("dimmed", Number(el.dataset.dim) <= stepIdx);
        });
        const s0 = SCENES[sceneIdx];
        /* 地図は**作り直さない。** class を付け替えるだけにする。
           組み立て直すと CSS の transition が1度も走らず、1日ずつ送っても
           絵がぱっと入れ替わるだけになる。印は data-dmark（上の data-mark とは
           別の欄）で持たせてあるので、歩を進める仕掛けとぶつからない。 */
        if (s0.mapByStep) {
          const dmap = stage.querySelector(".dmap");
          if (dmap) setDeckMapMark(dmap, stepIdx);
        }
        const s = SCENES[sceneIdx];
        if (s.confettiAt != null && stepIdx === s.confettiAt) {
          spawnConfetti(s.confettiBig ? 160 : 90);
        }
      }

      function renderScene() {
        /* **ctrl では区画の中身を組み立てない。**
           クイズの問いと答えを、進行する人の手元に1文字も出さないため
           （隠すのではなく、そもそも作らない）。 */
        if (IS_CTRL) {
          updateDots();
          updateCtrlLabels();
          return;
        }
        stage.innerHTML = SCENES[sceneIdx].render();
        updateDots();
        requestAnimationFrame(() => requestAnimationFrame(applySteps));
      }

      function gotoScene(i, step) {
        sceneIdx = Math.max(0, Math.min(SCENES.length - 1, i));
        stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, step ?? 0));
        if (IS_CTRL) {
          renderScene();
        } else {
          stage.classList.add("fading");
          setTimeout(() => {
            renderScene();
            stage.classList.remove("fading");
          }, reduceMotion ? 0 : 260);
        }
        onStateChanged();
      }

      function advance() {
        dismissHint();
        if (stepIdx < SCENES[sceneIdx].total) {
          stepIdx++;
          applySteps();
          if (IS_CTRL) updateCtrlLabels();
          onStateChanged();
        } else if (sceneIdx < SCENES.length - 1) {
          gotoScene(sceneIdx + 1, 0);
        }
      }
      function back() {
        dismissHint();
        if (stepIdx > 0) {
          stepIdx--;
          applySteps();
          if (IS_CTRL) updateCtrlLabels();
          onStateChanged();
        } else if (sceneIdx > 0) {
          const prev = sceneIdx - 1;
          gotoScene(prev, SCENES[prev].total);
        }
      }
      function dismissHint() {
        if (!interacted) {
          interacted = true;
          setTimeout(() => hint.classList.add("gone"), 4000);
        }
      }

      /* ======================== 紙吹雪 ======================== */
      /* 紙吹雪は島の色で。--accent --gold --roof-mint --roof-sky --roof-coral */
      const COLORS = ["#ff7092", "#ffcf4d", "#7be0b1", "#58c1ee", "#f97690", "#ffd152"];
      function spawnConfetti(count) {
        if (reduceMotion || IS_CTRL) return;
        const layer = document.getElementById("confetti-layer");
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * 100 + "vw";
          c.style.background = COLORS[(Math.random() * COLORS.length) | 0];
          c.style.width = 7 + Math.random() * 9 + "px";
          c.style.height = 7 + Math.random() * 12 + "px";
          c.style.animationDuration = 3.6 + Math.random() * 2.6 + "s";
          c.style.animationDelay = Math.random() * 0.9 + "s";
          layer.appendChild(c);
          setTimeout(() => c.remove(), 7500);
        }
      }

      /* ======================== 入力 ======================== */
      // ctrl ではグローバル入力を登録しない。
      // （登録するとボタンの click と二重に発火して、1タップで2つ以上進む）
      const IS_CTRL = new URLSearchParams(location.search).get("role") === "ctrl";
      /* 縦のあいだは #rotate が画面ぜんぶを覆っている。そこを触って歩が進むと、
         横にした瞬間に知らない区画から始まる。**縦のあいだは歩を進めない。** */
      const PORTRAIT = window.matchMedia("(orientation: portrait)");
      if (!IS_CTRL) {
        window.addEventListener("pointerdown", (ev) => {
          if (ev.button === 2) return;
          if (PORTRAIT.matches) return;
          advance();
        });
        window.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          if (PORTRAIT.matches) return;
          back();
        });
      }
      window.addEventListener("keydown", (ev) => {
        if (PORTRAIT.matches && !IS_CTRL) return;
        const k = ev.key;
        if (k === "Enter" || k === " " || k === "ArrowRight" || k === "ArrowDown") {
          ev.preventDefault();
          advance();
        } else if (k === "Backspace" || k === "ArrowLeft" || k === "ArrowUp") {
          ev.preventDefault();
          back();
        } else if (/^[0-9]$/.test(k)) {
          // 数字キー: 区画の頭出し（リハーサル用）
          const target = DOT_OF_SCENE.indexOf(Number(k));
          if (target >= 0) gotoScene(target, 0);
        } else if (k === "End") {
          // 区画は11あるので、最後のひとつは End で出す
          gotoScene(SCENES.length - 1, 0);
        }
      });

      // 検証・リハーサル用フック
      window.__jump = (i, step) => gotoScene(i, step ?? 0);
      window.__sceneCount = SCENES.length;
      window.__dotOfScene = DOT_OF_SCENE;
      window.__totals = SCENES.map((s) => s.total);
      window.__state = () => ({ scene: sceneIdx, step: stepIdx });

      /* =========================================================
         リモート同期（Firestore）
         - 無指定: ローカル操作のみ（SDK は読み込まない）
         - ?role=view : Firestore の状態に追従（OBS 側）
         - ?role=ctrl : スマホのコントローラ（進行を送る）
         - ?auto=秒数 : 自動進行（同期なしのときの代わり）

         書けるのはあやとだけ。`firestore.rules` の monthlyReview は
           読む … 誰でも（OBS はログインできないので開けてある）
           書く … `islandUsers/{uid}.admin` が立っている人だけ
         なので、**ctrl はログインしてからでないと進行を送れない。**
         同じ端末で島にログインしてあれば、何も押さずに繋がる
         （SDK の版と apiKey を島に合わせてあるのがその仕掛け）。
         ========================================================= */
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDts2gpO2fepPYOdiMyiz5ydTIQHNtY5kM",
        authDomain: "live-streaming-d3cac.firebaseapp.com",
        projectId: "live-streaming-d3cac",
        storageBucket: "live-streaming-d3cac.firebasestorage.app",
        messagingSenderId: "291182823114",
        appId: "1:291182823114:web:84e7d7c52c8d3ca7d39633",
      };
      // ルールが monthlyReview にしか開いていないので、コレクションはそのまま
      const SYNC_COLLECTION = "monthlyReview";
      const SYNC_DOC = "2026nordic-fty8zuh6";

      const params = new URLSearchParams(location.search);
      const ROLE = params.get("role"); // "ctrl" | "view" | null
      const AUTO_SEC = Math.max(0, Number(params.get("auto")) || 0);

      /* Firebase の SDK。**版を島（package.json の firebase ^12）に揃えてある。**
         ログインは localStorage に `firebase:authUser:<apiKey>:[DEFAULT]` の形で
         残るので、同じ apiKey・同じ既定アプリ名・同じ大版なら、島でログイン済みの
         端末はここでも押さずにログイン済みになる。配信の当日に押させない。 */
      const SDK = "https://www.gstatic.com/firebasejs/12.18.0";

      let publishFn = null; // ctrl のときだけ入る。**ログインするまで null**
      let signInFn = null; // 「Google でログイン」の中身

      /* コントローラの札。**「いま押せば OBS が動く」ときだけ緑にする。** */
      let linkOk = false; // Firestore からスナップショットが来ている
      let authOk = false; // ログインしている
      let sendErr = ""; // 直前の送信が落ちた理由。空なら落ちていない
      function refreshCtrlStatus() {
        if (ROLE !== "ctrl") return;
        if (!linkOk) setCtrlStatus(false, "つながっていません");
        else if (!authOk) setCtrlStatus(false, "ログインが要ります");
        else if (sendErr) setCtrlStatus(false, sendErr);
        else setCtrlStatus(true, "同期中");
      }
      let applyingRemote = false;
      let lastConfetti = 0;
      let lastSeenTs = 0; // これより古いスナップショットは無視（連打時の巻き戻り防止）
      let seenFirstSnap = false; // 1枚目を受けたか（紙吹雪の空撃ち防止）

      function onStateChanged() {
        updateCtrlLabels();
        if (publishFn && !applyingRemote) {
          const ts = Date.now();
          lastSeenTs = Math.max(lastSeenTs, ts);
          publishFn({ scene: sceneIdx, step: stepIdx, ts, confetti: lastConfetti })
            .then(() => {
              if (!sendErr) return;
              sendErr = "";
              cEls.banner.classList.remove("show");
              refreshCtrlStatus();
            })
            .catch((e) => {
              const denied = e && (e.code === "permission-denied" || /permission/i.test(String(e)));
              sendErr = denied ? "このアカウントでは操作できません" : "送信失敗";
              refreshCtrlStatus();
              if (denied) showSignIn("進行を動かせるのは、島の管理者のアカウントだけです。入り直してください。");
            });
        }
      }

      /** Firebase のアプリ。ログインと Firestore で**同じものを使う**（別にすると別のログインになる） */
      async function firebaseApp() {
        const { initializeApp, getApps } = await import(`${SDK}/firebase-app.js`);
        return getApps()[0] ?? initializeApp(FIREBASE_CONFIG);
      }

      async function initSync(onRemote) {
        const fsm = await import(`${SDK}/firebase-firestore.js`);
        const db = fsm.getFirestore(await firebaseApp());
        const ref = fsm.doc(db, SYNC_COLLECTION, SYNC_DOC);
        fsm.onSnapshot(
          ref,
          (snap) => {
            if (snap.exists()) onRemote(snap.data(), snap.metadata.hasPendingWrites);
            linkOk = true;
            refreshCtrlStatus();
          },
          () => {
            linkOk = false;
            refreshCtrlStatus();
          }
        );
        return (data) => fsm.setDoc(ref, data);
      }

      /* ---------- ログイン（ctrl だけ） ----------
         OBS（view）は読むだけなので、**そちらでは firebase-auth を落とさない。**
         配信に映っている側に、押せもしないログインの札を出さないため。 */
      async function initAuth(onUser) {
        const am = await import(`${SDK}/firebase-auth.js`);
        const auth = am.getAuth(await firebaseApp());
        am.onAuthStateChanged(auth, onUser);
        return () => am.signInWithPopup(auth, new am.GoogleAuthProvider());
      }

      /** コントローラに「Google でログイン」を出す。押せる札にする（文だけ出さない） */
      function showSignIn(msg) {
        if (ROLE !== "ctrl") return;
        cEls.banner.textContent = "";
        const p = document.createElement("div");
        p.textContent = msg;
        const b = document.createElement("button");
        b.textContent = "Google でログイン";
        b.style.cssText = "margin-top:8px;padding:10px 14px;font-size:15px;touch-action:manipulation";
        b.addEventListener("click", async () => {
          b.disabled = true;
          try {
            if (signInFn) await signInFn();
          } catch (e) {
            /* 落ちた符丁は画面に出さない。読むのはあやとで、できることは
               「もう一度押す」だけ。符丁は console にだけ残す。 */
            console.error("北欧旅ふりかえり: ログインできなかった —", e);
            p.textContent = "ログインできませんでした。もう一度押してください。";
          } finally {
            b.disabled = false;
          }
        });
        cEls.banner.append(p, b);
        cEls.banner.classList.add("show");
      }

      /* ---------- コントローラUI ---------- */
      const cEls = {
        dot: document.getElementById("c-dot"),
        statusText: document.getElementById("c-status-text"),
        banner: document.getElementById("c-banner"),
        corner: document.getElementById("c-corner"),
        step: document.getElementById("c-step"),
        next: document.getElementById("c-next"),
        back: document.getElementById("c-back"),
        grid: document.getElementById("c-grid"),
        confetti: document.getElementById("c-confetti"),
        top: document.getElementById("c-top"),
      };
      function setCtrlStatus(ok, text) {
        if (ROLE !== "ctrl") return;
        cEls.dot.className = "c-dot " + (ok ? "ok" : "ng");
        cEls.statusText.textContent = text || (ok ? "同期中" : "未接続");
      }
      function updateCtrlLabels() {
        if (ROLE !== "ctrl") return;
        const s = SCENES[sceneIdx];
        if (s.ctrlTitle) {
          /* **クイズは、いま何問目かと「つぎに何が起きるか」だけ。**
             問い・選択肢・答えは、あやとも視聴者さんと一緒に初見で答える。 */
          cEls.corner.textContent = s.ctrlTitle;
          cEls.step.textContent = s.ctrlSubs[Math.min(stepIdx, s.ctrlSubs.length - 1)];
        } else {
          const dot = DOT_OF_SCENE[sceneIdx];
          cEls.corner.textContent = DOT_LABELS[dot];
          cEls.step.textContent = `ステップ ${stepIdx}/${s.total} ・ 全体 ${sceneIdx + 1}/${SCENES.length}`;
        }
        [...cEls.grid.children].forEach((b, i) => b.classList.toggle("act", i === DOT_OF_SCENE[sceneIdx]));
      }
      function initCtrlUi() {
        document.body.classList.add("ctrl");
        cEls.next.addEventListener("click", advance);
        cEls.back.addEventListener("click", back);
        cEls.top.addEventListener("click", () => gotoScene(0, 0));
        cEls.confetti.addEventListener("click", () => {
          lastConfetti = Date.now();
          onStateChanged();
        });
        DOT_LABELS.forEach((label, dot) => {
          const b = document.createElement("button");
          b.textContent = `${dot}. ${label}`;
          b.addEventListener("click", () => gotoScene(DOT_OF_SCENE.indexOf(dot), 0));
          cEls.grid.appendChild(b);
        });
        updateCtrlLabels();
      }

      /* ---------- 起動 ---------- */
      buildDots();
      if (IS_CTRL) initCtrlUi();
      renderScene();

      if (ROLE === "ctrl") {
        initSync((data, isLocalEcho) => {
          // 自分の書き込みエコーと古いスナップショットは無視（多重進行・巻き戻り防止）
          if (isLocalEcho) return;
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          sceneIdx = Math.max(0, Math.min(SCENES.length - 1, data.scene ?? 0));
          stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
          lastConfetti = data.confetti || lastConfetti;
          updateCtrlLabels();
          applyingRemote = false;
        })
          .then(async (pub) => {
            setCtrlStatus(false, "ログインを確かめています…");
            /* **ログインが確かめられるまで publishFn を入れない。**
               入れてしまうと、押した瞬間に静かに落ちる。 */
            signInFn = await initAuth((user) => {
              authOk = !!user;
              sendErr = "";
              publishFn = user ? pub : null;
              if (user) {
                cEls.banner.classList.remove("show");
                refreshCtrlStatus();
                onStateChanged();
              } else {
                refreshCtrlStatus();
                showSignIn("進行を動かすにはログインが要ります。島と同じアカウントで入ってください。");
              }
            });
          })
          .catch((e) => {
            linkOk = false;
            setCtrlStatus(false, "つながりません");
            console.error("北欧旅ふりかえり: 進行のつなぎに入れなかった —", e);
            cEls.banner.textContent = "進行がつながりません。電波を確かめて、開き直してください。";
            cEls.banner.classList.add("show");
          });
      } else if (ROLE === "view") {
        hint.classList.add("gone");
        initSync((data) => {
          // 古いスナップショットは無視（順序の入れ替わりによる巻き戻り防止）
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          /* 1枚目のスナップショットでは飛ばさない（OBS を開いた瞬間に前の紙吹雪が飛ぶのを止める）。
             書類は confetti: 0 から始まるので、「開いた直後か」で見る。 */
          if (typeof data.confetti === "number" && data.confetti > lastConfetti) {
            if (seenFirstSnap) spawnConfetti(140);
            lastConfetti = data.confetti;
          }
          seenFirstSnap = true;
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          if (data.scene !== sceneIdx) {
            gotoScene(data.scene ?? 0, data.step ?? 0);
          } else {
            stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
            applySteps();
          }
          applyingRemote = false;
        }).catch(() => {
          /* 繋がらないときはローカル操作のまま */
        });
      }

      if (AUTO_SEC > 0) setInterval(advance, AUTO_SEC * 1000);
    </script>
  </body>
</html>
