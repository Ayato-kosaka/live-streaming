    <style>
      /* =========================================================
         北欧旅 9日間 ふりかえり（2026-09-11 クタイシ → 09-20 ストックホルム）

         **見た目のテーマ:「あやと島の図鑑を、浜で開いたところ」。**
         島の外のページ（/about /streams /map）と同じ紙の型で作る。
         色・角・厚みの決まりは site/app/css/tokens.css と
         docs/island-design.md にある。ここはその写し。

         - 地は --ground-paper。**紙より明るい生成り。**
           紙より暗い地に紙を置くと、紙が「浮いた白い箱」になる
         - 紙は --paper-mottle-b → -a のムラ。影は落とさない（紙の型の決まり）
         - 厚み（--pop）は**区画の見出しの板1種類にだけ**。
           押せるものが1つも無い面なので、厚みは「押せる合図」ではなく
           「木の板の側面」として使う
         - 光らせない。きらめかせない。オーロラ・星・雪は置かない
         - 絵文字は1文字も使わない。印は下の <symbol> で描く

         OBS ブラウザソース 1920x1080 前提。
         クリック / Enter / → で進む、← / Backspace で戻る。
         実行時の外部依存なし（Firestore 同期のときだけ gstatic の SDK）。
         ========================================================= */

      :root {
        /* ---- 紙 ---- */
        --paper: #fffae4;
        --paper-2: #fdf1cf;
        --paper-mottle-a: #eadda9;
        --paper-mottle-b: #efe4b6;
        --paper-out: #f4efcf;
        /* ---- 字 ----
           紙（--paper-mottle-b 〜 -a）に対して実測で
             --ink   7.1〜7.6 : 1
             --ink-2 5.3〜5.6 : 1
             --ink-3 3.3〜3.5 : 1
           **中身を言っている字は --ink-2 まで。** --ink-3 は読ませる気のない
           案内（進み方のヒント）だけに使う。 */
        --ink: #5b3f15;
        --ink-2: #72521b;
        --ink-3: #957128;
        /* ---- 罫線・蛍光ペン・チップ ---- */
        --rule: #a68c2f;
        --hair: rgba(166, 140, 47, 0.34);
        --hair-strong: rgba(166, 140, 47, 0.58);
        --marker: #dcdb93;
        --marker-ink: #3f5200;
        --chip: #cdc104;
        --chip-ink: #43400f;
        /* ---- 木 ---- */
        --frame: #f2b054;
        --frame-dark: #ce8327;
        --frame-deep: #a86115;
        /* ---- 強調 ---- */
        --accent: #ff7092;
        --accent-deep: #da1647;
        --accent-ink: #a81139;
        --gold: #ffcf4d;
        /* ---- 海・砂・屋根 ---- */
        --sea-deep: #0d87de;
        --sea-shallow: #4ddaea;
        --sand: #f9e4a9;
        --sand-wet: #ecce8d;
        --roof-sky: #58c1ee;
        --roof-mint: #7be0b1;
        --roof-gold: #ffd152;
        /* ---- 厚み。**この面では見出しの板だけが使う** ---- */
        --pop: 0 6px 0 var(--frame-dark);
        /* ---- 角。部品の高さの1/3にいちばん近い段を選ぶ ---- */
        --r-0: 8px;
        --r-1: 12px;
        --r-2: 20px;
        --r-3: 30px;
        --r-4: 44px;
        --r-5: 56px;

        /* 地。粒つきの生成り。tokens.css の --ground-paper をそのまま */
        --ground-paper:
          radial-gradient(circle at 50% 50%, rgba(126, 108, 44, 0.055) 0 1.5px, transparent 2px) 0 0 / 54px 54px,
          radial-gradient(circle at 50% 50%, rgba(126, 108, 44, 0.042) 0 1.1px, transparent 1.7px) 21px 27px / 78px 78px,
          radial-gradient(ellipse 150% 84% at 50% 22%, #fbf7e3 0%, var(--paper-out) 48%, #efe9c6 100%) 0 0 / cover;

        /* 紙。**無地にしない。** 明るさが5%ほどムラになっている。
           ただしムラを地（--paper-out）より明るくしない。明るくすると
           そこだけ切り抜いた白い箱に見えて、「紙が載っている」が壊れる。 */
        --sheet:
          radial-gradient(120% 40% at 8% 0%, rgba(255, 255, 255, 0.18), transparent 56%),
          radial-gradient(80% 34% at 94% 62%, rgba(118, 110, 68, 0.10), transparent 60%),
          radial-gradient(60% 26% at 68% 18%, rgba(255, 255, 255, 0.12), transparent 72%),
          radial-gradient(50% 22% at 22% 88%, rgba(118, 110, 68, 0.085), transparent 66%),
          linear-gradient(180deg, var(--paper-mottle-b) 0%, var(--paper-mottle-a) 100%);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
        font-family: "Maru Island", ui-rounded, -apple-system, "Hiragino Maru Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        font-feature-settings: "palt" 1;
        background: var(--ground-paper);
        background-attachment: fixed;
      }

      /* ============ 浜（画面の下ふち） ============
         図鑑を開いている場所。砂は紙より明るくしない。
         動かさない——島に光るものもきらめくものも無い。 */
      #beach { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; z-index: 0; pointer-events: none; }
      #beach .b-sand {
        position: absolute; inset: 0;
        background: linear-gradient(180deg,
          rgba(249, 228, 169, 0) 0%, rgba(249, 228, 169, 0.7) 42%, var(--sand) 74%, var(--sand-wet) 100%);
      }
      #beach .b-sea {
        position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
        background: linear-gradient(180deg, #6ee0f1 0%, var(--sea-shallow) 44%, #2fb9dd 100%);
      }
      /* 波打ち際のレース。弧を横に並べただけ。公式のビーチは白がにごらない。
         外接矩形が画面の横いっぱいになるので**動かさない**（CLAUDE.md の「外接矩形」） */
      #beach .b-foam {
        position: absolute; left: 0; right: 0; bottom: 22px; height: 18px;
        background:
          radial-gradient(circle at 17px 18px, #ffffff 0 13px, transparent 14px) repeat-x 0 0 / 34px 18px,
          radial-gradient(circle at 26px 18px, rgba(255, 255, 255, 0.72) 0 10px, transparent 11px) repeat-x 9px 5px / 52px 18px;
      }

      /* ============ 舞台 ============ */
      #stage {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 54px 110px;
        transition: opacity 0.32s ease;
      }
      #stage.fading { opacity: 0; }

      [data-step] {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      [data-step].on { opacity: 1; transform: none; }
      [data-dim] { transition: opacity 0.4s ease; }
      [data-dim].dimmed { opacity: 0.34; }

      b { color: var(--ink); font-weight: 900; }
      em { font-style: normal; }

      /* ---- 紙 ----
         紙の型には影を落とさない。区切るのは細い罫線。黒い線は1本も使わない。 */
      .sheet {
        background: var(--sheet);
        border: 1px solid var(--hair-strong);
        border-radius: var(--r-0);
      }

      /* ---- 区画の見出し（木の板） ----
         **この面で厚みを持つのはここだけ。** 押せる合図ではなく、板の側面。 */
      .corner-head {
        display: flex; align-items: center; gap: 20px;
        padding: 11px 32px 13px;
        margin-bottom: 18px;
        background: linear-gradient(180deg, #f8c377 0%, var(--frame) 40%, #eaa843 100%);
        border-radius: var(--r-3);
        box-shadow: var(--pop);
      }
      .corner-head .ic { width: 46px; height: 46px; flex: 0 0 46px; }
      /* 板の上に乗る小さい字。**--frame-deep は板に対して 2.53 しか出ない**ので
         使わない。--ink なら 5.13。段は色ではなく大きさと字間で付ける。 */
      .corner-tag {
        font-size: 15px; font-weight: 900; letter-spacing: 0.26em;
        color: var(--ink);
      }
      .corner-title {
        margin: 2px 0 0;
        font-weight: 900; font-size: 36px; line-height: 1.12;
        color: var(--ink); letter-spacing: 0.01em;
      }
      .note { color: var(--ink-2); font-size: 18px; font-weight: 700; line-height: 1.7; text-align: center; }

      /* ---- 平らなチップ。押せないので厚みも影も付けない ---- */
      .chip {
        display: inline-block;
        background: color-mix(in srgb, var(--chip) 34%, var(--paper));
        color: var(--chip-ink);
        border-radius: var(--r-0);
        padding: 5px 14px;
        font-size: 16.5px; font-weight: 800;
      }

      /* ---- 1. 表紙 ----
         **図鑑を見開きで開いたところ。** 左の頁が旅の地図、右の頁が表題。
         字だけの表紙にしない——これは旅の資料なので、
         一発目に「どこを歩いたか」と「誰が立ったか」が見えているほうが強い。
         使う絵は**すべて資料の中にあるもの**（renderDeckMap / cardFace）で、
         表紙のために新しく取りに行かない。 */
      .t-wrap {
        display: flex; align-items: stretch; gap: 34px;
        width: 100%; max-width: 1812px;
      }
      /* 左の頁。**地図の置き場は 0.60（幅÷高さ）**。焼き込みがその比で
         切り出してあるので、ここを崩すと端の街が枠から出る。
         紙の内寸で比を合わせる（padding 14 + 枠線1 を引いた残り） */
      .t-map {
        flex: 0 0 552px; height: 900px; padding: 14px;
        background: var(--sheet);
        border: 1px solid var(--hair-strong);
        border-radius: var(--r-0);
      }
      .t-map svg { width: 100%; height: 100%; display: block; }
      /* 歩を進めると svg に .has-mark が付く（applySteps が舞台の .dmap を
         無条件に呼ぶため）。表紙は日を選んでいないので、**薄くするほうを戻す。**
         光るほうは印の欄を落としてあるので当たらない（renderTitle 側） */
      .t-map .dmap.has-mark .dm-leg,
      .t-map .dmap.has-mark .dm-city,
      .t-map .dmap.has-mark .dm-chip { opacity: 1; }

      /* 右の頁。上から 表題 → 紙（ひとこと＋数字） → 写真の列。
         **高さは左の地図が決める。** 余りは3つのあいだに散らす */
      .t-right {
        flex: 1 1 auto; min-width: 0;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      /* 表紙の板。区画の見出しと**同じ部品**（.corner-head）で、幅だけ中身に合わせる。
         厚みを持つ部品を2種類にしない */
      .corner-head.t-plank {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 7px 24px 9px; margin-bottom: 18px;
        border-radius: var(--r-1);
      }
      .t-plank .ic { width: 40px; height: 40px; flex: 0 0 40px; }
      .t-kicker { font-size: 19px; font-weight: 900; letter-spacing: 0.3em; color: var(--ink); }
      .t-main {
        margin: 0;
        font-size: 116px; font-weight: 900; line-height: 1.06;
        letter-spacing: 0.02em; color: var(--ink);
      }
      /* 表紙の飾り。菱形と点を並べただけの罫。**光らせない** */
      .t-rule {
        width: 300px; height: 14px; margin: 20px 0 0;
        background:
          radial-gradient(circle at 50% 50%, var(--frame-dark) 0 6px, transparent 7px) 50% 50% / 300px 14px no-repeat,
          linear-gradient(90deg, transparent 0 34px, var(--hair-strong) 34px calc(100% - 34px), transparent calc(100% - 34px)) 50% 50% / 100% 2px no-repeat;
      }
      .t-sub { margin-top: 18px; font-size: 31px; font-weight: 900; color: var(--ink); }

      /* ひとことと数字は**紙1枚にまとめる。** 別々の板にすると、
         表題のとなりに読ませるかたまりが2つ増えて、表紙が散らかる */
      .t-sheet { padding: 22px 34px 20px; }
      .t-lead {
        margin: 0; padding: 0 0 18px;
        border-bottom: 1px solid var(--hair);
        /* 2行に割れる。26px だと2行目が「チハイク。」の5文字だけになって、
           紙の下に1行ぶんの空きが立つ。28px にすると8文字残る */
        font-size: 28px; font-weight: 700; line-height: 1.7; color: var(--ink-2);
      }
      .t-nums { display: flex; padding-top: 16px; }
      .t-num {
        flex: 1 1 0; text-align: center;
        border-right: 1px solid var(--hair);
      }
      .t-num:last-child { border-right: 0; }
      .t-num b { display: block; font-size: 50px; font-weight: 900; line-height: 1; color: var(--ink); }
      .t-num.hi b { color: var(--accent-ink); }
      .t-num span { display: block; margin-top: 7px; font-size: 17px; font-weight: 800; color: var(--ink-2); }

      /* 旅の写真。**添え書きを付けない。** 表紙で読ませるのは表題と紙の2つだけで、
         ここは「こういう9日間だった」を絵で言う列。
         高さで揃える（写真は全部たて長なので、幅で揃えると段差が出る） */
      /* 右ふちを紙とそろえる。左寄せのままだと写真の列だけ 25px 手前で終わって、
         見開きの右の頁が1枚だけ短く見える */
      .t-cards { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
      .t-cards .akc-card { box-shadow: var(--shadow-2); }
      .t-cards .akc-shot { height: 292px; width: auto; }

      /* ---- 2. 数字 ----
         1枚の紙に罫を引いた図鑑の表。カードを12枚並べない。 */
      .n-grid {
        display: grid; grid-template-columns: repeat(4, 1fr);
        width: 100%; max-width: 1640px; overflow: hidden;
      }
      .n-cell {
        padding: 22px 18px 20px; text-align: center;
        border-right: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      .n-cell:nth-child(4n) { border-right: 0; }
      .n-cell:nth-child(n + 9) { border-bottom: 0; }
      /* 目を引かせる3つ。枠を変えず、金の淡い地だけで差をつける */
      .n-cell.hi { background: color-mix(in srgb, var(--gold) 26%, transparent); }
      .n-num { font-size: 76px; font-weight: 900; line-height: 1; color: var(--ink); letter-spacing: -0.01em; }
      .n-cell.hi .n-num { color: var(--accent-ink); }
      .n-label { margin-top: 10px; font-size: 20px; font-weight: 800; color: var(--ink-2); }
      .n-foot { margin-top: 22px; font-size: 24px; font-weight: 800; line-height: 1.7; color: var(--ink-2); text-align: center; }

      /* ---- 3. 9日間の道のり ---- */
      .d-wrap { display: flex; gap: 26px; width: 100%; max-width: 1800px; align-items: stretch; }
      .d-map {
        flex: 0 0 468px; position: relative; padding: 14px;
        background: var(--sheet);
        border: 1px solid var(--hair-strong);
        border-radius: var(--r-0);
      }
      .d-map svg { width: 100%; height: 100%; display: block; }
      /* **1日ぶんを1枚ずつ差し替える**（`data-solo`）。積むと3段落×10日で溢れる。
         紙は下に敷いたままにして、上の字だけ入れ替える。地図も動かない。 */
      .d-list { flex: 1; position: relative; min-height: 722px; }
      .d-row {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; gap: 13px;
        padding: 26px 34px;
        overflow: hidden;
      }
      .d-row .d-when {
        display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px;
        font-size: 34px; font-weight: 900; color: var(--ink);
        padding-bottom: 12px; border-bottom: 2px solid var(--hair-strong);
      }
      .d-row .d-when span { color: var(--ink-2); font-weight: 800; font-size: 23px; }
      /* その日をひとことで言う数字。**見出しの中でいちばん強い色**にする */
      .d-row .d-stat {
        margin-left: auto; font-size: 20px; font-weight: 900;
        color: var(--chip-ink); white-space: nowrap;
        background: color-mix(in srgb, var(--chip) 34%, var(--paper));
        border-radius: var(--r-0); padding: 5px 15px;
      }
      .d-row .d-text { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.8; color: var(--ink-2); }

      /* ---- 4. 乗せてくれた人たち ----
         1枚の紙を5列に割る。日ごとに1列で、罫で分ける。 */
      .c-cols { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 1840px; align-items: stretch; }
      .c-day { display: flex; flex-direction: column; padding: 16px 16px 18px; border-right: 1px solid var(--hair); }
      .c-day:last-child { border-right: 0; }
      .c-day-head {
        font-size: 19px; font-weight: 900; color: var(--marker-ink);
        letter-spacing: 0.06em; margin-bottom: 10px;
        background: color-mix(in srgb, var(--marker) 82%, transparent);
        border-radius: var(--r-0); padding: 6px 12px; text-align: center;
      }
      .car-row { padding: 9px 2px; border-bottom: 1px dotted var(--hair-strong); }
      .car-row:last-child { border-bottom: 0; }
      .car-row .car-name { font-size: 17.5px; font-weight: 900; color: var(--ink); line-height: 1.4; }
      .car-row .car-desc { margin-top: 3px; font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--ink-2); }

      /* ---- 5. トラブル ---- */
      .tr-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 1700px; overflow: hidden; }
      .tr-card {
        padding: 17px 24px 19px;
        border-right: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      .tr-grid .tr-card:nth-child(3n) { border-right: 0; }
      .tr-grid .tr-card:nth-child(n + 7) { border-bottom: 0; }
      .tr-head { display: flex; align-items: baseline; gap: 12px; }
      .tr-no { font-size: 32px; font-weight: 900; color: var(--accent-ink); line-height: 1; }
      .tr-title { font-size: 25px; font-weight: 900; color: var(--ink); }
      .tr-day { margin-left: auto; font-size: 16px; font-weight: 800; color: var(--ink-2); }
      .tr-body { margin-top: 8px; font-size: 18px; font-weight: 700; line-height: 1.6; color: var(--ink-2); }

      /* ---- 6. クイズ ---- */
      .q-wrap { width: 100%; max-width: 1340px; text-align: center; }
      .q-head { display: inline-flex; text-align: left; }
      .q-head > div { display: flex; align-items: center; gap: 14px; }
      .q-no { font-size: 22px; font-weight: 900; letter-spacing: 0.22em; color: var(--ink); }
      .q-lv {
        display: inline-block; margin-left: 14px; vertical-align: 1px;
        font-size: 17px; font-weight: 900; letter-spacing: 0.08em;
        border-radius: var(--r-0); padding: 5px 15px; color: var(--ink);
      }
      .q-lv.e { background: var(--roof-mint); }
      .q-lv.n { background: var(--roof-sky); }
      .q-lv.h { background: var(--roof-gold); }
      .q-text { font-size: 52px; font-weight: 900; line-height: 1.42; color: var(--ink); padding: 30px 46px; }
      .q-choices { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
      .qc {
        display: flex; align-items: center; gap: 24px;
        padding: 21px 30px;
        border-radius: var(--r-2);
        transition: background 0.45s ease;
      }
      .qc .qc-key {
        flex: 0 0 58px; height: 58px; border-radius: var(--r-2);
        display: flex; align-items: center; justify-content: center;
        font-size: 27px; font-weight: 900; color: var(--ink);
        background: var(--paper-2);
        border: 1px solid var(--hair-strong);
      }
      .qc .qc-body { font-size: 37px; font-weight: 900; color: var(--ink); }
      .qc-tag .ic { width: 24px; height: 24px; }
      .qc .qc-tag {
        margin-left: auto; display: flex; align-items: center; gap: 9px;
        opacity: 0; transform: translateX(10px); transition: all 0.45s ease;
        font-size: 25px; font-weight: 900; color: var(--ink);
        background: var(--gold); border-radius: var(--r-1); padding: 7px 20px 7px 15px;
      }
      /* 答えは蛍光ペンで引く。枠を光らせない */
      .qc.marked { background: color-mix(in srgb, var(--marker) 72%, transparent); }
      .qc.marked .qc-key { background: var(--gold); border-color: var(--frame-dark); }
      .qc.marked .qc-tag { opacity: 1; transform: none; }

      /* ---- 7. 盛り上がり ---- */
      .p-list { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 1760px; align-items: stretch; overflow: hidden; }
      .p-row {
        display: flex; align-items: center; gap: 22px;
        padding: 12px 24px;
        border-right: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      .p-list .p-row:nth-child(2n) { border-right: 0; }
      .p-list .p-row:nth-child(n + 9) { border-bottom: 0; }
      .p-row.top { background: color-mix(in srgb, var(--gold) 26%, transparent); }
      .p-rank { flex: 0 0 84px; font-size: 32px; font-weight: 900; color: var(--ink-2); line-height: 1; }
      .p-row.top .p-rank { color: var(--accent-ink); font-size: 40px; }
      .p-rank em { font-size: 21px; margin-left: 2px; }
      .p-main { flex: 1; }
      .p-title { font-size: 22px; font-weight: 900; line-height: 1.34; color: var(--ink); }
      .p-quote { margin-top: 4px; font-size: 16.5px; font-weight: 700; line-height: 1.45; color: var(--ink-2); }
      .p-count {
        flex: 0 0 auto; font-size: 22px; font-weight: 900; color: var(--chip-ink);
        background: color-mix(in srgb, var(--chip) 34%, var(--paper));
        border-radius: var(--r-0); padding: 5px 15px;
      }

      /* ---- 8. 視聴者さんが動かした旅 ---- */
      .v-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 1800px; align-items: stretch; overflow: hidden; }
      .v-card {
        padding: 15px 20px 17px; display: flex; flex-direction: column; gap: 8px;
        border-right: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      .v-grid .v-card:nth-child(4n) { border-right: 0; }
      .v-grid .v-card:nth-child(n + 9) { border-bottom: 0; }
      .v-day { font-size: 15px; font-weight: 900; letter-spacing: 0.1em; color: var(--frame-deep); }
      .v-title { font-size: 20px; font-weight: 900; line-height: 1.36; color: var(--ink); }
      .v-body { font-size: 16px; font-weight: 700; line-height: 1.56; color: var(--ink-2); margin-top: auto; }

      /* ---- 9. 通った街と見たもの ---- */
      .pl-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 1760px; align-items: stretch; overflow: hidden; }
      .pl-card {
        padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 8px;
        border-right: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      .pl-grid .pl-card:nth-child(3n) { border-right: 0; }
      .pl-grid .pl-card:nth-child(n + 4) { border-bottom: 0; }
      .pl-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--hair-strong); }
      .pl-country { font-size: 29px; font-weight: 900; color: var(--ink); }
      .pl-when { margin-left: auto; font-size: 16px; font-weight: 800; color: var(--ink-2); }
      .pl-city { font-size: 18px; font-weight: 700; line-height: 1.52; color: var(--ink-2); }
      .pl-city em { font-weight: 900; color: var(--ink); margin-right: 9px; }
      /* その国の豆知識。**チャットで教えてもらったこと**なので、地を替えて下に置く */
      .pl-trivia {
        margin-top: auto; padding: 10px 14px;
        font-size: 16px; font-weight: 800; line-height: 1.6;
        color: var(--chip-ink);
        background: color-mix(in srgb, var(--chip) 26%, var(--paper));
        border-radius: var(--r-0);
      }

      /* ---- 10. 食べたもの・買ったもの ---- */
      .fd-wrap { display: flex; gap: 26px; width: 100%; max-width: 1800px; align-items: stretch; }
      /* 16行を**縦に流して**2列にする。左列に1〜8、右列に9〜16 が来る */
      .fd-left {
        flex: 0 0 1000px;
        display: grid; grid-auto-flow: column;
        grid-template-columns: 1fr 1fr; grid-template-rows: repeat(8, auto);
        gap: 0 26px; align-content: start;
        padding: 16px 28px;
      }
      .fd-row { display: flex; align-items: baseline; gap: 11px; padding: 8px 2px; border-bottom: 1px dotted var(--hair-strong); }
      .fd-name { font-size: 20px; font-weight: 900; color: var(--ink); }
      .fd-where { font-size: 14.5px; font-weight: 800; color: var(--ink-2); }
      .fd-amt { margin-left: auto; font-size: 22px; font-weight: 900; color: var(--accent-ink); white-space: nowrap; }
      .fd-right { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px; }
      .fd-head { font-size: 18px; font-weight: 900; letter-spacing: 0.14em; color: var(--frame-deep); }
      .fd-chips { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
      .fd-note { margin-top: auto; font-size: 19px; font-weight: 800; line-height: 1.72; color: var(--ink-2); }

      /* ---- 11. 投げ銭 ---- */
      .g-wrap { display: flex; gap: 26px; width: 100%; max-width: 1760px; align-items: stretch; }
      .g-left { flex: 0 0 556px; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 26px 34px; }
      .g-left .ic { width: 92px; height: 92px; }
      .g-total-label { font-size: 24px; font-weight: 900; color: var(--ink-2); letter-spacing: 0.1em; }
      .g-total { font-size: 100px; font-weight: 900; line-height: 1; color: var(--accent-ink); }
      .g-goal { font-size: 23px; font-weight: 800; color: var(--ink-2); }
      .g-bar { height: 18px; border-radius: var(--r-0); background: var(--paper-2); overflow: hidden; border: 1px solid var(--hair-strong); }
      .g-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); }
      .g-note { font-size: 19px; font-weight: 800; color: var(--ink-2); line-height: 1.7; }
      .g-right { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px 22px; }
      .g-big {
        display: flex; align-items: center; gap: 22px;
        background: color-mix(in srgb, var(--gold) 30%, transparent);
        border-radius: var(--r-2); padding: 10px 24px;
      }
      .g-big .g-rank { font-size: 38px; font-weight: 900; color: var(--accent-ink); min-width: 92px; }
      .g-big .g-name { font-size: 34px; font-weight: 900; color: var(--ink); }
      .g-big .g-amt { margin-left: auto; font-size: 34px; font-weight: 900; color: var(--ink); }
      .g-row { display: flex; align-items: center; gap: 18px; padding: 5px 24px; border-bottom: 1px dotted var(--hair-strong); }
      .g-row .g-rank { font-size: 21px; font-weight: 900; color: var(--ink-2); min-width: 80px; }
      .g-row .g-name { font-size: 22px; font-weight: 900; color: var(--ink); }
      .g-row .g-amt { margin-left: auto; font-size: 22px; font-weight: 900; color: var(--ink-2); }
      .g-rest { margin-top: 6px; }
      .g-rest-head { font-size: 17px; font-weight: 900; color: var(--frame-deep); letter-spacing: 0.18em; margin-bottom: 8px; }
      .g-chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .g-chip em { color: var(--accent-ink); font-weight: 900; margin-left: 6px; }

      /* ---- 12. 手紙 ---- */
      .l-wrap { width: 100%; max-width: 1320px; padding: 26px 46px 22px; }
      .l-para {
        font-size: 24px; font-weight: 700; line-height: 1.95; color: var(--ink-2);
        margin: 0 0 20px; padding-left: 24px; border-left: 4px solid var(--frame);
      }
      .l-sign {
        display: flex; align-items: center; justify-content: flex-end; gap: 12px;
        font-size: 27px; font-weight: 900; color: var(--ink); margin-top: 4px;
      }
      .l-sign .ic { width: 44px; height: 44px; }

      /* ---- 13. エンディング ---- */
      .e-wrap { text-align: center; }
      .e-wrap .ic { width: 176px; height: 176px; margin-bottom: 10px; }
      .e-main { margin: 0; font-size: 100px; font-weight: 900; line-height: 1.16; color: var(--ink); }
      .e-sub { margin-top: 30px; font-size: 29px; font-weight: 800; color: var(--ink-2); line-height: 1.7; }
      .e-small { margin-top: 46px; font-size: 19px; font-weight: 800; color: var(--ink-2); letter-spacing: 0.08em; }

      /* ============ コントローラ（?role=ctrl） ============
         こちらは**押すためだけの面**。ぜんぶ押せるので、厚みが合図として働く。 */
      body.ctrl { cursor: default; overflow: hidden; }
      body.ctrl #stage, body.ctrl #progress, body.ctrl #hint, body.ctrl #beach { display: none; }
      #ctrl-ui {
        position: fixed; inset: 0; z-index: 40;
        display: none; flex-direction: column; gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
      }
      body.ctrl #ctrl-ui { display: flex; }
      #ctrl-ui .c-head {
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 900; color: var(--ink-2); font-size: 14px;
      }
      #ctrl-ui .c-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      #ctrl-ui .c-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--ink-3); }
      #ctrl-ui .c-dot.ok { background: #1f9c62; }
      #ctrl-ui .c-dot.ng { background: var(--accent-ink); }
      #ctrl-ui .c-now {
        background: var(--sheet); border: 1px solid var(--hair-strong);
        border-radius: var(--r-0); padding: 16px 18px; text-align: center;
      }
      #ctrl-ui .c-corner { font-weight: 900; font-size: clamp(22px, 7vw, 34px); color: var(--ink); }
      #ctrl-ui .c-step { color: var(--ink-2); font-weight: 800; font-size: 14px; margin-top: 4px; }
      #ctrl-ui .c-main { display: flex; gap: 12px; flex: none; }
      #ctrl-ui button {
        font-family: inherit; color: var(--ink);
        border: 0; border-radius: var(--r-2);
        font-weight: 900; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* ダブルタップのズーム由来の余計な発火を止める */
        user-select: none;
        background: linear-gradient(180deg, #fffdf1 0%, var(--paper-2) 100%);
        box-shadow: var(--pop); /* 押せる合図。この面では全部が押せる */
      }
      #ctrl-ui button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--frame-dark); }
      #ctrl-ui .c-back { flex: 1; height: 25vh; font-size: clamp(18px, 5vw, 26px); color: var(--ink-2); }
      #ctrl-ui .c-next {
        flex: 2.4; height: 25vh; font-size: clamp(26px, 8vw, 40px);
        background: linear-gradient(180deg, #ffdd82 0%, var(--gold) 100%);
      }
      #ctrl-ui .c-extra { display: flex; gap: 10px; }
      #ctrl-ui .c-extra button { flex: 1; padding: 12px; font-size: 15px; }
      #ctrl-ui .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; overflow-y: auto; padding-bottom: 8px; }
      #ctrl-ui .c-grid button { padding: 12px 10px; font-size: clamp(13px, 3.6vw, 17px); text-align: left; border-radius: var(--r-1); }
      #ctrl-ui .c-grid button.act { background: linear-gradient(180deg, #ffdd82 0%, var(--gold) 100%); }
      #ctrl-ui .c-banner {
        background: color-mix(in srgb, var(--gold) 30%, var(--paper));
        border: 1px solid var(--hair-strong);
        border-radius: var(--r-0); font-size: 13px; font-weight: 800;
        line-height: 1.6; padding: 10px 14px; display: none; color: var(--ink);
      }
      #ctrl-ui .c-banner.show { display: block; }

      /* ============ 進行UI ============ */
      #progress {
        position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 10px; align-items: center; z-index: 20;
      }
      #progress .dot {
        width: 11px; height: 11px; border-radius: 999px;
        background: color-mix(in srgb, var(--ink-3) 36%, transparent);
        transition: all 0.3s ease;
      }
      #progress .dot.act { width: 34px; background: var(--frame-deep); }
      #hint {
        position: fixed; right: 26px; bottom: 50px; z-index: 20;
        color: var(--ink-3); font-size: 14px; font-weight: 800;
        transition: opacity 1s ease;
      }
      #hint.gone { opacity: 0; }

      /* ============ 紙吹雪 ============
         色は島のもの（--accent --gold --roof-mint --roof-sky --roof-coral）。
         落ちきったら消す。**溜めない**（外接矩形が画面ぜんぶになる） */
      #confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
      .confetti {
        position: absolute; top: -4vh; width: 12px; height: 12px;
        border-radius: 4px; opacity: 0.95; animation: fall linear forwards;
      }
      @keyframes fall {
        0% { transform: translateY(-6vh) rotate(0deg); }
        100% { transform: translateY(112vh) rotate(680deg); }
      }

      /* 印。**絵文字を使わない**ので、必要な印はここから引く。
         上からの光（--gTop*）と接地影は、5原則（輪郭線なし・環境光・接地影・
         彩度と明度・急な変化なし）をアイコンにも効かせるため。 */

      /* =========================================================
         地図（tools/build_deck_map.py が焼いた本物の海岸線）
         ---------------------------------------------------------
         形は本物。site/content/nordic/map.json（Natural Earth の海岸線を
         ランベルト正角円錐で投影したもの。本物との重なり 99.5%）を
         資料ぶんに絞ったものを描いている。

         塗りは島と同じ帯で陸と海を分ける。**輪郭線は1本も引かない**
         （docs/island-design.md 2章）。沖から順に
           深い海 → 浅瀬 → 白い泡 → 濡れた砂 → 砂浜 → 草。
         ========================================================= */
      :root {
        /* 地図にだけ要る島の色。上の :root に無いものをここで足す */
        --sea-mid: #2ea5ef;
        --sea-shelf: #94f4f0;
        --foam: #ffffff;
        --sand-edge: #dcb46a;
        --grass-hi: #71e76f;
        --grass: #52cc5e;
        --grass-lo: #3ab055;
        --grass2: #64de6a;
        --shadow-1: 1px 3px 3px rgba(52, 66, 32, 0.34);
        --shadow-2: 2px 7px 3px rgba(46, 60, 30, 0.38);
        /* 地図の中でしか使わない混色。2か所に書かないよう、ここに1つ置く */
        --dm-route: color-mix(in srgb, var(--gold) 58%, var(--accent) 42%);
        --dm-case: color-mix(in srgb, var(--sea-deep) 58%, var(--ink) 42%);
        --dm-deep: color-mix(in srgb, var(--sea-deep) 74%, var(--ink) 26%);
        --dm-label: color-mix(in srgb, var(--ink) 88%, var(--grass-lo) 12%);
      }

      .dmap {
        display: block; width: 100%; height: 100%;
        border-radius: var(--r-0);
        overflow: hidden;
      }
      .dmap text {
        paint-order: stroke fill;
        stroke-linejoin: round;
        /* OBS で掴むと配信に青い選択が写る */
        user-select: none;
      }

      /* --- 海 --- */
      .dmap .dm-sea-a { stop-color: color-mix(in srgb, var(--sea-mid) 62%, var(--sea-shallow) 38%); }
      .dmap .dm-sea-b { stop-color: var(--sea-deep); }
      .dmap .dm-sea-c { stop-color: var(--dm-deep); }
      .dmap .dm-swell { fill: none; stroke: var(--foam); stroke-width: 3; stroke-linecap: round; opacity: 0.12; }

      /* --- 岸。沖から順に 影 → 浅瀬の棚 → 浅瀬 → 泡のレース → 泡 --- */
      .dmap .dm-drop, .dmap .dm-shelf, .dmap .dm-shallow,
      .dmap .dm-lace, .dmap .dm-foam, .dmap .dm-sand, .dmap .dm-sand-wet {
        fill: none; stroke-linejoin: round;
      }
      /* 陸が海に落とす影。これが無いと陸と海が同じ面に見える */
      .dmap .dm-drop { fill: var(--ink); opacity: 0.2; stroke: none; }
      .dmap .dm-shelf { stroke: var(--sea-shelf); stroke-width: 30; opacity: 0.55; }
      .dmap .dm-shallow { stroke: var(--sea-shallow); stroke-width: 13; opacity: 0.82; }
      /* 泡はぼかさない。不規則な弧が並ぶレースに見せる */
      .dmap .dm-lace { stroke: var(--foam); stroke-width: 9; stroke-dasharray: 6 15; stroke-linecap: round; opacity: 0.42; }
      .dmap .dm-foam { stroke: var(--foam); stroke-width: 4.5; opacity: 0.9; }
      /* 内側の帯。広いほうが奥（乾いた砂）なので、乾いた砂を先に太く引く */
      .dmap .dm-sand { stroke: var(--sand); stroke-width: 10; }
      .dmap .dm-sand-wet { stroke: var(--sand-wet); stroke-width: 4.5; opacity: 0.9; }

      /* --- 陸 --- */
      .dmap .dm-land-a { stop-color: var(--grass-hi); }
      .dmap .dm-land-b { stop-color: var(--grass-lo); }
      .dmap .dm-land { stroke: none; }
      /* 森と山は、同じパスを3枚ずらして重ねて立体にする。奥から 影 → 光 → 本体。
         木1本ずつに面を持たせるとパスの字数が倍になる（木は346本ある） */
      .dmap .dm-wood { fill: var(--grass-lo); opacity: 0.4; }
      .dmap .dm-wood-hi { fill: var(--grass2); opacity: 0.34; }
      .dmap .dm-wood-shade { fill: var(--ink); opacity: 0.11; }
      .dmap .dm-hill { fill: color-mix(in srgb, var(--sand-edge) 62%, var(--ink-3) 38%); opacity: 0.78; }
      .dmap .dm-hill-hi { fill: var(--sand); opacity: 0.72; }
      .dmap .dm-hill-shade { fill: var(--ink); opacity: 0.16; }
      .dmap .dm-lake { fill: var(--sea-shallow); stroke: var(--sand); stroke-width: 2.5; stroke-linejoin: round; }

      /* --- 国と海の名前 ---
         名前の乗る地は、素の草から森のいちばん濃いところまで明るさが4倍ちがう。
         どんな色の字を選んでも、草の上で読めれば森の上で消える。
         **字の下に地を敷いてならす。** フチ（stroke）は字といっしょに消えるので
         読みやすさの勘定に入れてはいけない。 */
      .dmap .dm-wash { fill: color-mix(in srgb, var(--grass-hi) 72%, var(--paper)); opacity: 0.82; }
      .dmap .dm-wash.is-sea { fill: var(--dm-deep); opacity: 0.4; }
      .dmap .dm-country { fill: var(--dm-label); font-weight: 800; letter-spacing: 0.24em; opacity: 0.8; }
      .dmap .dm-sea-name { fill: var(--paper); font-weight: 700; letter-spacing: 0.26em; opacity: 0.72; }

      /* --- 道のり。**色を3つに散らさない。**
         陸の上を行った手段は暖かい色、水と空の上を行った手段は白。
         違いは線の出しかたで言う：車=通しの太線 / 寄り道=細い破線 /
         船=丸い点々 / 飛行機=長い破線 --- */
      /* **線にだけ効かせる。** `.dm-leg path` にすると向きの印（塗りで描く形）まで
         fill: none になって消える */
      .dmap .dm-case, .dmap .dm-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dmap .dm-case { stroke: var(--dm-case); opacity: 0.26; stroke-width: 13; }
      .dmap .dm-line { stroke: var(--dm-route); stroke-width: 7; }
      .dmap .is-side .dm-case { stroke-width: 9; }
      .dmap .is-side .dm-line { stroke-width: 4.5; stroke-dasharray: 2.5 10; }
      .dmap .is-ferry .dm-line { stroke: var(--foam); stroke-width: 5.5; stroke-dasharray: 0.1 12; }
      /* 海の上では下敷きの濃い線がそのまま濃い帯に見える（陸の上では草に沈む） */
      .dmap .is-ferry .dm-case { stroke-width: 11; opacity: 0.1; }
      .dmap .is-fly .dm-line { stroke: var(--foam); stroke-width: 4; stroke-dasharray: 20 14; opacity: 0.85; }
      .dmap .is-fly .dm-case { stroke-width: 9; opacity: 0.1; }
      .dmap .dm-arrow { fill: var(--paper); stroke: none; opacity: 0.95; }
      /* 寄り道の向きの印は出さない。ヴィリニュスで道が分かれるところに本筋の印と
         2つ並び、25 しか離れていないのでどちらの向きの話か読めない */
      .dmap .is-side .dm-arrow { display: none; }
      .dmap .is-ferry .dm-arrow, .dmap .is-fly .dm-arrow { fill: var(--dm-case); opacity: 0.8; }

      /* --- 街 --- */
      .dmap .dm-pin-shadow { fill: var(--ink); opacity: 0.3; }
      .dmap .dm-pin-ring { fill: var(--paper); }
      .dmap .dm-pin-dot { fill: var(--gold); }
      .dmap .is-goal .dm-pin-dot { fill: var(--accent); }
      .dmap .is-side .dm-pin-dot { fill: var(--frame-dark); }
      .dmap .is-land .dm-pin-dot { fill: var(--sea-mid); }
      .dmap .dm-plate { fill: var(--paper); opacity: 0.92; }
      .dmap .dm-name { fill: var(--ink); font-weight: 800; letter-spacing: 0.02em; }
      .dmap .dm-halo { fill: var(--gold); opacity: 0; }

      /* --- 方位・飛行機の札 --- */
      .dmap .dm-compass-disc { fill: var(--paper); opacity: 0.86; }
      .dmap .dm-compass-n { fill: color-mix(in srgb, var(--accent) 50%, var(--ink) 50%); }
      .dmap .dm-compass-s { fill: var(--ink-3); }
      .dmap .dm-compass-t { fill: var(--ink); font-weight: 800; }
      .dmap .dm-chip rect { fill: var(--paper); opacity: 0.92; }
      .dmap .dm-chip text { fill: var(--ink); font-weight: 800; }

      /* --- その日を光らせる。**SMIL は使わない。**
         中身を全部描き直すので、OBS でそのぶんの CPU を毎コマ払う
         （実測: /nordic/sweden が誰も触っていない3秒で CPU 3,180ms） --- */
      .dmap .dm-leg, .dmap .dm-leg path, .dmap .dm-city,
      .dmap .dm-pin, .dmap .dm-halo, .dmap .dm-plate, .dmap .dm-chip {
        transition: opacity 0.42s ease, fill 0.42s ease, stroke-width 0.42s ease,
          transform 0.42s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      /* SVG の transform の原点は既定で (0,0)。街へ寄せた <g> の中で掛ける */
      .dmap .dm-pin, .dmap .dm-halo { transform-origin: 0 0; }
      .dmap.has-mark .dm-leg { opacity: 0.3; }
      .dmap.has-mark .dm-leg.is-on { opacity: 1; }
      .dmap.has-mark .dm-city { opacity: 0.5; }
      .dmap.has-mark .dm-city.is-on { opacity: 1; }
      .dmap.has-mark .dm-chip { opacity: 0.18; }
      .dmap.has-mark .dm-chip.is-on { opacity: 1; }
      /* 光るほうは、薄くするのではなく**太く・大きく**する。
         薄さだけで段を作ると、暗いところに置いた線が消える */
      .dmap .dm-leg.is-on .dm-line { stroke-width: 10.5; }
      .dmap .dm-leg.is-on .dm-case { stroke-width: 18; opacity: 0.4; }
      .dmap .is-side.is-on .dm-line { stroke-width: 7; }
      .dmap .is-ferry.is-on .dm-case, .dmap .is-fly.is-on .dm-case { opacity: 0.22; }
      .dmap .is-ferry.is-on .dm-line { stroke-width: 8.5; stroke-dasharray: 0.1 15; }
      .dmap .is-fly.is-on .dm-line { stroke-width: 6; }
      .dmap .dm-city.is-on .dm-pin { transform: scale(1.38); }
      /* 名札は字を太らせずに**地のほうを金にする。** 太らせると字の幅が変わって、
         重ならないように決めた場所からはみ出す */
      .dmap .dm-city.is-on .dm-plate { fill: var(--gold); opacity: 1; }
      .dmap .dm-city.is-on .dm-halo { opacity: 0.44; transform: scale(1); }
      .dmap .dm-city .dm-halo { transform: scale(0.45); }

      /* =========================================================
         あやと島カード
         ---------------------------------------------------------
         絵は tools/build_deck_photos.py が public/review/ に焼いたもの。
         **外の置き場（firebasestorage / island-api）へは取りに行かない。**
         配信の最中に1枚落ちたら、その場で画面が欠けるため。

         **カードは1枚も押せない。だから厚み（--pop）を付けない**
         （docs/island-design.md 3-3。この面で厚みを持ってよいのは見出しの板だけ）。
         大きい1枚にだけ落ち影を敷く——机に写真が1枚置いてある、の絵。
         厚みと取り違えられないように、右下へずらして、ぼかす。
         ========================================================= */
      .akc { width: 100%; max-width: 1812px; display: flex; flex-direction: column; gap: 14px; }
      .akc-lead { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.6; color: var(--ink-2); }
      .akc-body { display: flex; gap: 32px; align-items: flex-start; }

      .akc-hero { flex: 0 0 400px; }
      .akc-hero .akc-card { box-shadow: var(--shadow-2); }
      .akc-hero-cap { margin-top: 12px; font-size: 17px; font-weight: 800; line-height: 1.5; color: var(--ink); }
      .akc-hero-cap span { display: block; font-size: 15px; font-weight: 700; color: var(--ink-2); }

      .akc-wall { flex: 1 1 auto; display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
      /* 壁の1枚には影を敷かない。24枚ぶん重なると紙が汚れて見えるし、
         OBS で毎フレーム24個のぼかしを払うことになる。細い罫だけで足りる */
      .akc-wall .akc-card { border-color: var(--hair-strong); }

      .akc-card { padding: 4px; background: var(--paper); border: 1px solid var(--hair); border-radius: var(--r-0); }
      .akc-shot { position: relative; overflow: hidden; border-radius: 5px; background: var(--paper-2); }
      .akc-photo { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 写真の上に立つ人。寸法は手形の place（docs/nordic-photos.md 5章 =
         cardPlace と同じ値）。**幅・右・下は JS が書く。** ここは立ち方だけ */
      .akc-stand { position: absolute; line-height: 0; }
      .akc-stand img { display: block; width: 100%; height: auto; }
      /* 接地影（docs/island-design.md 2章の3）。これが無いと、景色の上に紙を
         貼ったように見える。焼くほう（components/nordic/stamp.ts の
         groundShadow）と同じ大きさ——横は背の幅の72%、縦はその1/4。
         ::before で置くので img より先に描かれ、足の下に敷かれる */
      .akc-stand::before {
        content: "";
        position: absolute; left: 50%; bottom: 0;
        width: 72%; aspect-ratio: 4 / 1;
        transform: translate(-50%, 50%);
        background: radial-gradient(closest-side,
          rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.13) 60%, rgba(0, 0, 0, 0) 100%);
      }

      .akc-foot { display: flex; align-items: center; gap: 22px; }
      .akc-quote {
        flex: 1 1 auto; padding: 10px 20px 12px;
        background: var(--sheet); border: 1px solid var(--hair-strong); border-radius: var(--r-0);
        font-size: 19px; font-weight: 800; line-height: 1.55; color: var(--ink);
      }
      .akc-quote i { font-style: normal; color: var(--ink-2); font-weight: 700; font-size: 16px; }
      .akc-nums { display: flex; gap: 20px; flex: 0 0 auto; }
      .akc-num { text-align: center; }
      .akc-num b { display: block; font-size: 34px; line-height: 1.05; color: var(--accent-ink); }
      .akc-num span { font-size: 14px; font-weight: 800; color: var(--ink-2); }
      /* 焼いた絵が1枚も無いとき（手形を載せ忘れ）。**空の枠を並べない** */
      .akc-none { padding: 40px 0; text-align: center; }

      /* ---- 1日ぶんの区画に添える写真 ----
         .d-row は縦に積むフレックスなので、**いちばん下に敷く**（margin-top: auto）。

         **字より先に、写真のほうが縮む。**
         日ごとの行は高さが決まっていて（.d-list の min-height）、字の量は日で違う。
         字の多い日にそのまま足すと、行の overflow: hidden に噛まれて**写真が
         下から切れる。** 切れた写真は「絵が落ちた」に見えるので、切らずに縮める。 */
      .dp {
        margin-top: auto; padding-top: 12px;
        display: flex; align-items: flex-end; gap: 14px;
        flex: 0 1 auto; min-height: 0; height: 248px;
      }
      /* 字は縮ませない。縮めると行の高さに収まったまま字だけが溢れる */
      .d-row:has(.dp) > :not(.dp) { flex-shrink: 0; }
      /* 高さで決める。横幅で決めると、縮んでも写真の大きさが変わらず下が切れる */
      .dp-main { height: 100%; }
      .dp-rest { display: flex; align-items: flex-end; gap: 10px; height: 72%; }
      .dp-sub { height: 100%; }
      .dp .akc-card { height: 100%; box-shadow: var(--shadow-2); }
      .dp .akc-shot { height: 100%; width: auto; }
      .dp-note {
        flex: 1 1 auto; align-self: flex-end; padding: 0 0 10px 6px;
        font-size: 20px; line-height: 1.5; color: var(--ink-2); font-weight: 700;
      }
      .dp-note b { display: block; font-size: 21px; color: var(--ink); }
      /* 写真を添えた日は、区画の残りの高さを使い切る */
      .d-wrap:has(.dp) { flex: 1 1 auto; min-height: 0; }

      /* ---- その日の声 ----
         **写真の右の空きに置く。** 字の下に足すと、行の高さが決まっている
         ぶん写真が潰れる（いちばん字の多い日で、残りが 99px しかない）。
         横はどの日も 750px 以上あまっているので、そちらを使う。
         出来事の段落（24px）より一段小さくして、**別の層だと分かるように**する。 */
      .dp-note .dv { margin-bottom: 9px; }
      .dv { display: flex; flex-direction: column; gap: 5px; }
      .dv-line { display: flex; align-items: baseline; gap: 9px; font-size: 19px; line-height: 1.5; font-weight: 700; color: var(--ink-2); }
      .dv-line.me { color: var(--ink); }
      /* 誰の言葉か。**枠を変えず地の色だけで分ける**（数字の区画と同じ作法） */
      .dv-who { flex: 0 0 auto; font-size: 14px; font-weight: 900; padding: 2px 9px; border-radius: var(--r-0); white-space: nowrap; }
      .dv-line.fan .dv-who { background: color-mix(in srgb, var(--marker) 78%, transparent); color: var(--marker-ink); }
      .dv-line.me .dv-who { background: color-mix(in srgb, var(--chip) 40%, var(--paper)); color: var(--chip-ink); }
      /* 写真が1枚も無い日の逃げ道。**声だけでも、いちばん下に敷く** */
      .dv-alone { margin-top: auto; padding-top: 12px; }
      /* 写真の見出し（.dp-note b）は**塊で改行させる**ために display:block に
         してある。声の中の「ここを強く」はその塊ではないので、戻す。
         戻さないと1本の引用が3段に割れて、写真の上まで伸びる（実際に割れた）。 */
      .dp-note .dv b { display: inline; font-size: inherit; color: var(--ink); font-weight: 900; }

      #ico-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      .ic { display: inline-block; vertical-align: middle; }

      /* ============ 縦向きのときの案内 ============
         この資料は 1920x1080 の横長1枚に組んである。縦で開くと2段組みの
         右の段が画面の外に出て、日ごとの面が地図だけになる。
         **中身を縦用に組み直すのではなく、横にしてもらう。**

         判定は**向き**で見る（幅で見ると、PC の細いウィンドウでも出る）。
         横にした瞬間にこの面は消えて、資料がそのまま出る——JS は何もしない
         ので、回した瞬間のずれが無い。 */
      #rotate {
        display: none;
        position: fixed; inset: 0; z-index: 60;
        align-items: center; justify-content: center;
        padding: 24px;
        background: var(--ground-paper);
        background-attachment: fixed;
        cursor: default;
      }
      @media (orientation: portrait) { #rotate { display: flex; } }
      /* 進行の人は縦で持つ。**ここに案内を出すと操作できなくなる** */
      html.is-ctrl #rotate, body.ctrl #rotate { display: none; }

      #rotate .rot-card {
        width: 100%; max-width: 420px;
        padding: 30px 26px 30px;
        text-align: center;
        background: var(--sheet);
        border: 1px solid var(--hair-strong);
        border-radius: var(--r-2);
      }
      #rotate .rot-ic { display: block; width: 158px; height: 126px; margin: 0 auto 4px; }
      /* 厚み（--pop）を持つのは木の板だけ。資料の中の決まりと同じにする */
      #rotate .rot-plank {
        display: inline-block;
        margin: 8px 0 18px;
        padding: 10px 26px 12px;
        background: linear-gradient(180deg, #f8c377 0%, var(--frame) 40%, #eaa843 100%);
        border-radius: var(--r-3);
        box-shadow: var(--pop);
        /* **板の中で折り返させない。** 6.4vw だと 390px 幅で
           「横向きにしてくださ／い」と割れて、最後の1文字だけがぶら下がる。
           板は一息で読む札なので、入る大きさまで落として1行に収める */
        white-space: nowrap;
        font-size: clamp(17px, 5.1vw, 27px); font-weight: 900; line-height: 1.25;
        color: var(--ink);
      }
      #rotate .rot-sub {
        margin: 6px 0 0;
        font-size: clamp(15px, 4.2vw, 17px); font-weight: 800; line-height: 1.75;
        color: var(--ink-2);
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
        [data-step] { opacity: 0; transform: none; }
        [data-step].on { opacity: 1; }
      }
    </style>
    <!-- 焼いた地図と、焼いた写真の手形。**実行中に外へ取りに行かない。**
         配信の最中に1枚落ちたら、その場で画面が欠けるため。
         どちらも tools/ のスクリプトが作る生成物で、手で直さない。 -->
    <script src="nordic_review_mapdata.js"></script>
    <script src="review/manifest.js"></script>
  </head>

    <main id="stage" role="main" aria-live="polite"></main>
    <div id="progress" aria-hidden="true"></div>

    <!-- 縦向きのときだけ出る案内。**この面の外には何も足していない**ので、
         横にすると資料がそのまま現れる。絵は #ico-defs の光を引いて描く

          sub: "9/20 着。ここから7泊、9月27日に発つまでが北欧旅。",
          small: "あやと島 live-streaming-d3cac.web.app",
        },
      };

      /* ======================== 小道具 ======================== */
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      }
      /** 原文の ** は「ここを強く」の印。逃がしてから太字にする */
      function md(s) {
        return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      }

      /* ======================== 区画 ======================== */
      const DOT_LABELS = [
        "タイトル",
        "数字で見る9日間",
        "9日間の道のり",
        "乗せてくれた人たち",
        "通った街と見たもの",
        "食べたもの・買ったもの",
        "トラブル選手権",
        "クイズ",
        "盛り上がりの瞬間",
        "視聴者さんが動かした旅",
        "あやと島カード",
        "投げ銭ありがとう",
        "案内鳥からの手紙",
        "エンディング",
      ];

      /** 印。**絵文字は使わない**ので、型（body の #ico-defs）から引いて描く */
      function icon(name, cls) {
        return `<svg class="ic${cls ? " " + cls : ""}" viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-${name}" /></svg>`;
      }
      /** 区画の見出し。**この面で厚みを持つのはこの板だけ**（押せる合図ではなく、板の側面） */
      function cornerHead(tag, title, ico) {
        return `
          <div class="corner-head" data-step="0">
            ${icon(ico)}
            <div>
              <div class="corner-tag">${tag}</div>
              <h2 class="corner-title">${title}</h2>
            </div>
          </div>`;
      }

      /* ---- 1. タイトル ----
         見開き。左の頁に旅の地図、右の頁に表題・ひとこと・旅の写真。

         **3歩で組み上がる。**
           0 … 地図と表題（これが何の話か、ここで決まる）
           1 … ひとことと数字
           2 … 旅の写真
         一気に出すと、一発目の1秒で目が散る。
         地図は素の強さ（mark は null）。**日を光らせるのは道のりの区画の仕事**で、
         表紙で光らせると「いま何日目の話か」を聞かれる。 */
      function renderTitle() {
        const t = DECK.title;
        /* 数字は DECK.numbers から**先頭4つをそのまま**取る。
           表紙用に選び直すと、次の区画の表と食い違ったとき気づけない */
        const nums = DECK.numbers.cells
          .slice(0, 4)
          .map(
            (c) => `
              <div class="t-num${c.hi ? " hi" : ""}">
                <b>${escapeHtml(c.n)}</b><span>${escapeHtml(c.label)}</span>
              </div>`
          )
          .join("");
        /* 写真は5枚。**立つのは点（投げ銭と出席の順位）の上位5人で、1人1枚ずつ。**
           写真は旅の頭から終わりまで散らす（titlePicks）。
           **手形が載っていなければ列ごと出さない。** 空の枠を並べない */
        const cards = CARD_DATA
          ? titlePicks(5).map((c) => cardFace(c.photo, c.who, false)).join("")
          : "";
        /* 地図は**全区間を素の強さで**出す。表紙は「どこを歩いたか」の1枚で、
           何日目の話でもないため。
           歩を進める仕掛け（applySteps）は、舞台に .dmap が1つでもあると
           `setDeckMapMark(dmap, stepIdx)` を呼ぶ。道のりの区画では「1歩＝1日」
           なので正しいが、**表紙では歩の数が日付になってしまう**（実際に
           2歩目でワルシャワ〜ビャウィストクだけが光り、残りが 0.3 に沈んだ）。
           印の欄（data-dmark）を落としておけば、どの日にも当たらないので
           何も光らない。薄くなるほう（.has-mark）は下の CSS で戻す。 */
        const map = renderDeckMap(null).replace(/ data-dmark="[^"]*"/g, "");
        return `
          <div class="t-wrap">
            ${map ? `<div class="t-map" data-step="0">${map}</div>` : ""}
            <div class="t-right">
              <div data-step="0">
                <div class="corner-head t-plank">
                  ${icon("book")}
                  <div class="t-kicker">NORDIC 2026</div>
                </div>
                <h1 class="t-main">${escapeHtml(t.main)}</h1>
                <div class="t-rule"></div>
                <div class="t-sub">${escapeHtml(t.sub)}</div>
              </div>
              <div class="t-sheet sheet" data-step="1">
                <p class="t-lead">${escapeHtml(t.lead)}</p>
                <div class="t-nums">${nums}</div>
              </div>
              ${cards ? `<div class="t-cards" data-step="2">${cards}</div>` : ""}
            </div>
          </div>`;
      }

      /* ---- 2. 数字 ----
         1枚の紙に罫を引いた図鑑の表にする。カードを12枚並べない。 */
      function renderNumbers() {
        const cells = DECK.numbers.cells
          .map(
            (c, i) => `
            <div class="n-cell${c.hi ? " hi" : ""}" data-step="${i + 1}">
              <div class="n-num">${escapeHtml(c.n)}</div>
              <div class="n-label">${escapeHtml(c.label)}</div>
            </div>`
          )
          .join("");
        return `
          ${cornerHead("NUMBERS", "数字で見る9日間", "tally")}
          <div class="n-grid sheet">${cells}</div>
          <div class="n-foot" data-step="13">${md(DECK.numbers.foot)}</div>`;
      }

      /* ---- 3. 9日間の道のり ---- */
      /* ======================= 9日間の道のりの地図 =======================
         nordic_review_mapdata.js（tools/build_deck_map.py が焼く）を読んで
         SVG を組み立てる。形は本物の海岸線なので、**ここで座標を作らない。**

         日を移すのは setDeckMapMark のほう。renderDeckMap を呼び直すと
         要素が作り直されて、CSS の transition が1度も走らない。
         =================================================================== */
      function renderDeckMap(mark) {
        var M = window.NORDIC_DECK_MAP;
        if (!M) return "";
        var v = M.view;
        var esc = function (s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        };
        var on = function (list) {
          return mark != null && list.indexOf(mark) >= 0 ? " is-on" : "";
        };

        /* うねり。**動かさない。** 島の海と同じ、うっすら流れる線 */
        var swell = "";
        for (var i = 0; i < 16; i++) {
          var sy = v.y + 26 + i * 56;
          swell +=
            '<path d="M' + (v.x - 60 + (i % 3) * 90) + " " + sy +
            'q40-11 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" />';
        }

        var legs = M.legs
          .map(function (l) {
            /* 向きの印。置く場所と角度は焼き込みが持っている */
            var arrow = l.mid
              ? '<path class="dm-arrow" d="M-4.5 -6L6.5 0L-4.5 6Z" transform="translate(' +
                l.mid[0] + " " + l.mid[1] + ") rotate(" + l.mid[2] + ')" />'
              : "";
            return (
              '<g class="dm-leg is-' + l.move + on([l.mark]) + '" data-leg="' + l.id +
              '" data-dmark="' + l.mark + '">' +
              '<path class="dm-case" d="' + l.d + '" />' +
              '<path class="dm-line" d="' + l.d + '" />' + arrow +
              "</g>"
            );
          })
          .join("");

        /* 街。名札の向き（at）は 470x780 で実際に描いて重なりを数えて決めてある。
           **机上で決めない。** タリンとヘルシンキは 45.8 しか離れていない */
        var NAME = 17;
        var PIN = { goal: 7.5, stay: 6.5, pass: 5.5, side: 5, land: 5.5 };
        var cities = M.cities
          .map(function (c) {
            var r = PIN[c.kind] || 6;
            var w = c.name.length * NAME * 1.02;
            var pad = 7;
            var tx, ty, anchor, px;
            if (c.at === "l") { tx = c.x - r - 8; ty = c.y + NAME * 0.36; anchor = "end"; px = tx - w; }
            else if (c.at === "r") { tx = c.x + r + 8; ty = c.y + NAME * 0.36; anchor = "start"; px = tx; }
            else if (c.at === "u") { tx = c.x; ty = c.y - r - 10; anchor = "middle"; px = tx - w / 2; }
            else { tx = c.x; ty = c.y + r + 10 + NAME * 0.72; anchor = "middle"; px = tx - w / 2; }
            return (
              '<g class="dm-city is-' + c.kind + on(c.marks) + '" data-city="' + c.id +
              '" data-dmark="' + c.marks.join(" ") + '">' +
              '<g transform="translate(' + c.x + " " + c.y + ')">' +
              '<circle class="dm-halo" r="' + (r * 3.2).toFixed(1) + '" />' +
              '<g class="dm-pin">' +
              '<ellipse class="dm-pin-shadow" cx="0.8" cy="2.2" rx="' + (r * 1.05).toFixed(1) +
              '" ry="' + (r * 0.95).toFixed(1) + '" />' +
              '<circle class="dm-pin-ring" r="' + r.toFixed(1) + '" />' +
              '<circle class="dm-pin-dot" r="' + (r * 0.52).toFixed(1) + '" />' +
              "</g></g>" +
              '<rect class="dm-plate" x="' + (px - pad).toFixed(1) +
              '" y="' + (ty - NAME * 0.82).toFixed(1) +
              '" width="' + (w + pad * 2).toFixed(1) +
              '" height="' + (NAME * 1.18).toFixed(1) +
              '" rx="' + (NAME * 0.42).toFixed(1) + '" />' +
              '<text class="dm-name" x="' + tx + '" y="' + ty.toFixed(1) +
              '" font-size="' + NAME + '" text-anchor="' + anchor + '">' + esc(c.name) + "</text>" +
              "</g>"
            );
          })
          .join("");

        /* 国の名前。**地形を全部描いたあとに置く。** 森の下に敷くと木に食われる */
        var labels = M.labels
          .map(function (l) {
            var w = l.name.length * l.size * 1.24;
            return (
              '<g><rect class="dm-wash" x="' + (l.x - w / 2).toFixed(1) +
              '" y="' + (l.y - l.size * 0.82).toFixed(1) +
              '" width="' + w.toFixed(1) + '" height="' + (l.size * 1.24).toFixed(1) +
              '" rx="' + (l.size * 0.62).toFixed(1) + '" filter="url(#dmWash)" />' +
              '<text class="dm-country" x="' + l.x + '" y="' + l.y +
              '" font-size="' + l.size + '" text-anchor="middle">' + esc(l.name) + "</text></g>"
            );
          })
          .join("");

        /* 海の名前。紙の札は敷かない。敷くと街の名札と同じ強さになって、
           どれが街か分からなくなる。**水そのものが一段深くなっている**絵にする */
        var seas = M.seas
          .map(function (s) {
            var w = s.name.length * s.size * 1.26;
            return (
              '<g transform="rotate(' + s.rot + " " + s.x + " " + s.y + ')">' +
              '<rect class="dm-wash is-sea" x="' + (s.x - w / 2).toFixed(1) +
              '" y="' + (s.y - s.size * 0.88).toFixed(1) +
              '" width="' + w.toFixed(1) + '" height="' + (s.size * 1.36).toFixed(1) +
              '" rx="' + (s.size * 0.68).toFixed(1) + '" filter="url(#dmWash)" />' +
              '<text class="dm-sea-name" x="' + s.x + '" y="' + s.y +
              '" font-size="' + s.size + '" text-anchor="middle">' + esc(s.name) + "</text></g>"
            );
          })
          .join("");

        var n = M.north;
        var compass =
          '<g class="dm-compass" transform="translate(' + n.x + " " + n.y + ") rotate(" + n.deg + ')">' +
          '<circle class="dm-compass-disc" r="20" />' +
          '<path class="dm-compass-n" d="M0 -15L4.6 0L0 3L-4.6 0Z" />' +
          '<path class="dm-compass-s" d="M0 15L4.6 0L0 -3L-4.6 0Z" />' +
          '<text class="dm-compass-t" x="0" y="-21.5" font-size="10" text-anchor="middle">N</text></g>';

        /* 飛行機の札。クタイシは切り出した枠の外（東の彼方）なので街として描けない。
           線が枠の右下から入ってくるところに、どこから来たかだけ置く。
           **枠の下ふちから離す。** ちょうど端に置くと、置き場の縦横比が少し
           変わっただけで札が切れる */
        var chip =
          '<g class="dm-chip' + on([0]) + '" data-dmark="0" transform="translate(652 812)">' +
          '<rect x="-104" y="-15" width="208" height="30" rx="15" />' +
          '<text x="0" y="5" font-size="15" text-anchor="middle">クタイシから 3時間35分</text></g>';

        return (
          '<svg class="dmap' + (mark != null ? " has-mark" : "") + '" viewBox="' +
          v.x + " " + v.y + " " + v.w + " " + v.h +
          '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ジョージアを出て、ポーランドからバルト三国を北上し、フェリーで北欧へ抜けるルートの地図">' +
          "<defs>" +
          '<linearGradient id="dmSea" x1="0.1" y1="0" x2="0.35" y2="1">' +
          '<stop class="dm-sea-a" offset="0" /><stop class="dm-sea-b" offset="0.52" /><stop class="dm-sea-c" offset="1" /></linearGradient>' +
          '<linearGradient id="dmLand" x1="0" y1="0" x2="0.2" y2="1">' +
          '<stop class="dm-land-a" offset="0" /><stop class="dm-land-b" offset="1" /></linearGradient>' +
          /* 浅瀬のふちはぼかす。かたい切り替わりを作らない（島の絵の原則5） */
          '<filter id="dmShelf" x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur stdDeviation="9" /></filter>' +
          '<filter id="dmDrop" x="-6%" y="-6%" width="112%" height="112%"><feGaussianBlur stdDeviation="6" /></filter>' +
          '<filter id="dmWash" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.6" /></filter>' +
          '<clipPath id="dmLandClip"><path d="' + M.land + '" /></clipPath>' +
          "</defs>" +
          '<rect x="' + v.x + '" y="' + v.y + '" width="' + v.w + '" height="' + v.h + '" fill="url(#dmSea)" />' +
          '<g class="dm-swell">' + swell + "</g>" +
          '<path class="dm-drop" d="' + M.land + '" filter="url(#dmDrop)" transform="translate(2.5 6)" />' +
          '<path class="dm-shelf" d="' + M.land + '" filter="url(#dmShelf)" />' +
          '<path class="dm-shallow" d="' + M.land + '" />' +
          '<path class="dm-lace" d="' + M.land + '" />' +
          '<path class="dm-foam" d="' + M.land + '" />' +
          '<path class="dm-land" d="' + M.land + '" fill="url(#dmLand)" />' +
          /* 砂浜は陸の内側にだけ出す（外は濡れた砂と泡が受け持つ） */
          '<g clip-path="url(#dmLandClip)">' +
          '<path class="dm-sand" d="' + M.land + '" />' +
          '<path class="dm-sand-wet" d="' + M.land + '" />' +
          '<path class="dm-hill-shade" d="' + M.hills + '" transform="translate(3 3)" />' +
          '<path class="dm-hill-hi" d="' + M.hills + '" transform="translate(-2.5 -3)" />' +
          '<path class="dm-hill" d="' + M.hills + '" />' +
          '<path class="dm-wood-shade" d="' + M.woods + '" transform="translate(1.4 1.8)" />' +
          '<path class="dm-wood-hi" d="' + M.woods + '" transform="translate(-1.2 -1.6)" />' +
          '<path class="dm-wood" d="' + M.woods + '" />' +
          "</g>" +
          '<path class="dm-lake" d="' + M.lakes + '" />' +
          labels + seas + legs + chip + cities + compass +
          "</svg>"
        );
      }

      /** 日を移す。**要素は作り直さない。** class を付け替えるだけ（CSS が transition する） */
      function setDeckMapMark(svg, mark) {
        if (!svg) return;
        svg.classList.toggle("has-mark", mark != null);
        var has = function (el) {
          var a = el.getAttribute("data-dmark");
          return a != null && a.split(" ").indexOf(String(mark)) >= 0;
        };
        svg.querySelectorAll(".dm-leg, .dm-city, .dm-chip").forEach(function (el) {
          el.classList.toggle("is-on", mark != null && has(el));
        });
      }

      function renderDays() {
        const rows = DECK.days
          .map(
            (d, i) => `
            <div class="d-row" data-step="${i}" data-solo>
              <div class="d-when">${escapeHtml(d.when)}
                <span>${escapeHtml(d.date)}・${escapeHtml(d.where)}</span>
                <em class="d-stat">${escapeHtml(d.stat)}</em>
              </div>
              ${d.paras.map((t) => `<p class="d-text">${md(t)}</p>`).join("")}
              ${dayPhoto(d.date, dayVoice(d))}
            </div>`
          )
          .join("");
        return `
          ${cornerHead("ROUTE", "9日間の道のり", "pin")}
          <div class="d-wrap">
            <div class="d-map" data-step="0">${renderDeckMap(null)}</div>
            <div class="d-list sheet">${rows}</div>
          </div>`;
      }

      /* ---- 4. 乗せてくれた人たち ---- */
      function renderCars() {
        const cols = DECK.cars
          .map((g, i) => {
            const items = g.items
              .map(
                (c) => `
                <div class="car-row">
                  <div class="car-name">${escapeHtml(c.name)}</div>
                  ${c.desc ? `<div class="car-desc">${md(c.desc)}</div>` : ""}
                </div>`
              )
              .join("");
            return `<div class="c-day" data-step="${i}"><div class="c-day-head">${escapeHtml(g.head)}</div>${items}</div>`;
          })
          .join("");
        // 日ごとに1列。1日目と5日目が6台ずつなので、5列でちょうど収まる
        return `
          ${cornerHead("18 RIDES", "18台が停まってくれた", "car")}
          <div class="c-cols sheet">${cols}</div>`;
      }

      /* ---- 5. 通った街と見たもの ---- */
      function renderPlaces() {
        const cards = DECK.places
          .map(
            (p, i) => `
            <div class="pl-card" data-step="${i}">
              <div class="pl-head">
                <div class="pl-country">${escapeHtml(p.country)}</div>
                <div class="pl-when">${escapeHtml(p.when)}</div>
              </div>
              ${p.cities
                .map((c) => `<div class="pl-city"><em>${escapeHtml(c.n)}</em>${escapeHtml(c.t)}</div>`)
                .join("")}
              <div class="pl-trivia">${escapeHtml(p.trivia)}</div>
            </div>`
          )
          .join("");
        return `
          ${cornerHead("PLACES", "通った街と、見たもの", "sign")}
          <div class="pl-grid sheet">${cards}</div>`;
      }

      /* ---- 6. 食べたもの・買ったもの ----
         値段は**チャットに出た額**だけを載せる。推測は載せない。 */
      function renderFood() {
        const f = DECK.food;
        // 16行を2列に。左列8行・右列8行で、上から読める順に並べ替える
        const rows = f.prices
          .map(
            (p, i) => `
            <div class="fd-row" data-step="${i < 8 ? 1 : 2}">
              <div class="fd-name">${escapeHtml(p.n)}</div>
              <div class="fd-where">${escapeHtml(p.w)}</div>
              <div class="fd-amt">${escapeHtml(p.a)}</div>
            </div>`
          )
          .join("");
        const chips = f.chips.map((c) => `<span class="chip">${escapeHtml(c)}</span>`).join("");
        return `
          ${cornerHead("PRICES", "食べたもの・買ったもの", "bowl")}
          <div class="fd-wrap">
            <div class="fd-left sheet">${rows}</div>
            <div class="fd-right sheet">
              <div class="fd-head" data-step="3">値段は出なかったけれど</div>
              <div class="fd-chips" data-step="3">${chips}</div>
              <div class="fd-note" data-step="4">${md(f.note)}</div>
            </div>
          </div>`;
      }

      /* ---- 7. トラブル選手権 ---- */
      function renderTroubles() {
        const cards = DECK.troubles.items
          .map(
            (t, i) => `
            <div class="tr-card" data-step="${i}">
              <div class="tr-head">
                <div class="tr-no">${i + 1}</div>
                <div class="tr-title">${escapeHtml(t.title)}</div>
                <div class="tr-day">${escapeHtml(t.day)}</div>
              </div>
              <div class="tr-body">${md(t.body)}</div>
            </div>`
          )
          .join("");
        return `
          ${cornerHead("TROUBLE", "9日で、これだけ起きた", "alert")}
          <div class="tr-grid sheet">${cards}</div>
          <div class="note" data-step="9" style="margin-top:18px">${md(DECK.troubles.note)}</div>`;
      }

      /* ---- 8. クイズ ----
         **進行の画面（ctrl）には、問いも選択肢も答えも出さない。**
         ctrl では render 自体を呼ばないので、DOM にこの文字は載らない。
         答えは光らせずに、蛍光ペンで引く。 */
      const QKEY = ["A", "B", "C"];
      const LV_CLASS = { やさしい: "e", ふつう: "n", むずかしい: "h" };
      function renderQuiz(qi) {
        const q = DECK.quiz[qi];
        const choices = q.choices
          .map(
            (c, i) => `
            <div class="qc" data-step="1" data-mark="${i === q.answer ? 2 : 99}" data-dim="${i === q.answer ? 99 : 2}">
              <div class="qc-key">${QKEY[i]}</div>
              <div class="qc-body">${escapeHtml(c)}</div>
              <div class="qc-tag">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-check" /></svg>こたえ
              </div>
            </div>`
          )
          .join("");
        return `
          <div class="q-wrap">
            <div class="corner-head q-head" data-step="0">
              ${icon("quiz")}
              <div>
                <div class="q-no">QUIZ ${qi + 1} / ${DECK.quiz.length}</div>
                <span class="q-lv ${LV_CLASS[q.lv] || "n"}">${escapeHtml(q.lv)}</span>
              </div>
            </div>
            <div class="q-text sheet" data-step="0">${escapeHtml(q.q)}</div>
            <div class="q-choices sheet">${choices}</div>
          </div>`;
      }

      /* ---- 9. 盛り上がりの瞬間 ---- */
      function renderPeaks() {
        const n = DECK.peaks.items.length;
        // 10位から1位へ、1つずつ開ける
        const rows = DECK.peaks.items
          .map(
            (p, i) => `
            <div class="p-row${p.rank === 1 ? " top" : ""}" data-step="${n - i}">
              <div class="p-rank">${p.rank}<em>位</em></div>
              <div class="p-main">
                <div class="p-title">${escapeHtml(p.title)}</div>
                <div class="p-quote">${escapeHtml(p.quote)}</div>
              </div>
              <div class="p-count">${escapeHtml(p.count)}</div>
            </div>`
          )
          .join("");
        return `
          ${cornerHead("PEAKS", "盛り上がりの瞬間 TOP10", "star")}
          <div class="note" data-step="0" style="margin-bottom:14px">${md(DECK.peaks.note)}</div>
          <div class="p-list sheet">${rows}</div>`;
      }

      /* ---- 10. 視聴者さんが動かした旅 ---- */
      function renderViewers() {
        const cards = DECK.viewers
          .map(
            (v, i) => `
            <div class="v-card" data-step="${i}">
              <div class="v-day">${escapeHtml(v.day)}</div>
              <div class="v-title">${escapeHtml(v.title)}</div>

      /* ---- 11. 投げ銭ありがとう ---- */
      function renderGift() {

        // 1位・2位・3位は1つずつ、4位以下はまとめて出す
        const stepOf = (rank) => (rank === "1位" ? 5 : rank === "2位" ? 4 : rank === "3位" ? 3 : 2);
        const rows = g.top
          .map((t) => {

            <div class="${big ? "g-big" : "g-row"}" data-step="${stepOf(t.rank)}">
              <div class="g-rank">${escapeHtml(t.rank)}</div>

            </div>`;
          })
          .join("");
        const chips = g.rest
          .map((r) => `<span class="chip g-chip">${escapeHtml(r[0])}<em>${escapeHtml(r[1])}</em></span>`)
          .join("");
        return `
          ${cornerHead("THANK YOU", "投げ銭ありがとう", "coin")}
          <div class="g-wrap">
            <div class="g-left sheet">
              <div data-step="0">${icon("coin")}</div>
              <div class="g-total-label" data-step="0">豚の貯金箱</div>
              <div class="g-total" data-step="0">${escapeHtml(g.total)}</div>
              <div class="g-bar" data-step="0"><i></i></div>
              <div class="g-goal" data-step="0">${escapeHtml(g.goal)}</div>

      /* ---- 12. 案内鳥からの手紙 ---- */
      function renderLetter() {
        const paras = DECK.letter.paras
          .map((p, i) => `<p class="l-para" data-step="${i}">${md(p)}</p>`)
          .join("");
        return `
          ${cornerHead("LETTER", "あやと島案内鳥 からの手紙", "bird")}
          <div class="l-wrap sheet">
            ${paras}
            <div class="l-sign" data-step="${DECK.letter.paras.length}">
