<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff7fb" />
    <title>9月のふりかえり授賞式</title>
    <style>
      /* =========================================
         202609 月末配信「1ヶ月ふりかえり授賞式」
         テーマ: オーロラの夜（9月は北欧をヒッチハイクで縦断した月）
         - OBS ブラウザソース 1920x1080 前提
         - クリック / Enter / → で進行、← で戻る
         - 外部依存なし(オフラインOK)

         配色の決めごと:
         - 地は深い紺〜黒。字は白／淡い水色。見出しはオーロラ色のグラデーション
         - 動かすのは #sky の中だけ。transform と opacity だけで動かす
           （background-position / filter を毎フレーム変えない。
             動かす形の外接矩形が大きいほど毎フレームの描き直しが高くつく）
         ========================================= */
      :root {
        --bg-1: #0b1330; /* 夜空のいちばん上 */
        --bg-2: #060b20; /* 中ほど */
        --bg-3: #01030b; /* 地平、ほぼ黒 */
        /* 面は「夜の氷」。透けても字が沈まないよう、地の側をしっかり暗く持つ */
        --surface: rgba(9, 18, 42, 0.74);
        --surface-strong: rgba(13, 25, 54, 0.84);
        --border: rgba(126, 206, 255, 0.26);
        --text: #eef7ff;
        --muted: #a9c7e4;
        /* オーロラ色。見出し・数字・強調はここから取る */
        --aur-green: #6ff2c0;
        --aur-teal: #79e0ff;
        --aur-violet: #c3a3ff;
        --aur-pink: #ff9ecb;
        --gold: #ffd98a;
        /* 夜なので影は「落とす」のではなく「沈める」。黒を濃いめに */
        --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.45);
        --shadow-card: 0 14px 34px rgba(0, 0, 0, 0.52);
        --radius-xl: 26px;
        --radius-md: 16px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, "Hiragino Sans",
          "Noto Sans JP", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        overflow: hidden;
        background: radial-gradient(120% 78% at 50% 4%, rgba(40, 70, 130, 0.5) 0%, rgba(10, 18, 44, 0) 58%),
          linear-gradient(180deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
        background-color: #01030b;
        user-select: none;
        cursor: pointer;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(24px, 4vh, 56px) clamp(28px, 4vw, 72px) clamp(64px, 8vh, 96px);
        transition: opacity 0.35s ease;
      }
      #stage.fading { opacity: 0; }

      /* コーナー見出し */
      .corner-tag {
        font-size: clamp(14px, 1.2vw, 22px);
        font-weight: 900;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .corner-title {
        margin: 0 0 clamp(12px, 2.4vh, 28px);
        font-weight: 950;
        font-size: clamp(30px, 3.4vw, 62px);
        line-height: 1.15;
        text-align: center;
        background: linear-gradient(90deg, #8dffd2, #79e0ff, #c9a8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 6px 26px rgba(80, 220, 200, 0.22);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: clamp(16px, 2.4vh, 30px) clamp(20px, 2vw, 38px);
        max-width: min(94vw, 1560px);
        width: 100%;
        max-height: 78vh;
        overflow: hidden auto;
      }
      .panel::-webkit-scrollbar { width: 0; }

      /* ステップ表示 */
      [data-step] {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      [data-step].on { opacity: 1; transform: none; }

      /* ============ オープニング ============ */
      .hero-title {
        margin: 0;
        font-weight: 950;
        font-size: clamp(48px, 6.2vw, 110px);
        line-height: 1.12;
        text-align: center;
        background: linear-gradient(90deg, #8dffd2, #79e0ff, #c9a8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero-sub {
        text-align: center;
        font-weight: 800;
        color: var(--muted);
        font-size: clamp(18px, 1.7vw, 32px);
        margin: 14px 0 0;
      }
      .stat-row {
        display: flex;
        gap: clamp(12px, 1.4vw, 26px);
        justify-content: center;
        margin-top: clamp(22px, 4vh, 46px);
        flex-wrap: wrap;
      }
      .stat-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2.2vh, 26px) clamp(22px, 2.4vw, 46px);
        text-align: center;
        min-width: clamp(180px, 16vw, 300px);
      }
      .stat-card .num {
        font-size: clamp(38px, 3.8vw, 72px);
        font-weight: 950;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #9dffdd, #a9c0ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .stat-card .label {
        font-weight: 900;
        color: var(--muted);
        font-size: clamp(14px, 1.2vw, 22px);
        margin-top: 4px;
      }
      .program {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        justify-content: center;
        margin-top: clamp(20px, 3.6vh, 40px);
        max-width: 1100px;
      }
      .program span {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 20px;
        font-weight: 900;
        font-size: clamp(14px, 1.15vw, 22px);
        box-shadow: var(--shadow-soft);
      }

      /* ============ タイムライン ============ */
      .chapters { display: flex; gap: clamp(12px, 1.4vw, 24px); align-items: stretch; }
      .chapter {
        flex: 1;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2vh, 24px) clamp(14px, 1.4vw, 26px);
      }
      .chapter h3 {
        margin: 0 0 10px;
        font-size: clamp(18px, 1.6vw, 30px);
        font-weight: 950;
      }
      .chapter ul { list-style: none; margin: 0; padding: 0; }
      .chapter li {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: clamp(5px, 0.8vh, 9px) 0;
        font-size: clamp(14px, 1.15vw, 21px);
        line-height: 1.45;
        border-bottom: 1px dashed rgba(150, 200, 255, 0.2);
      }
      .chapter li:last-child { border-bottom: 0; }
      .chapter .d {
        font-weight: 950;
        color: var(--aur-violet);
        white-space: nowrap;
        font-size: 0.92em;
      }

      /* ============ コメントカード共通 ============ */
      .quote-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2vh, 24px) clamp(18px, 1.8vw, 34px);
        margin: clamp(8px, 1.2vh, 14px) 0;
      }
      .quote-card .who {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .name-pill {
        background: linear-gradient(90deg, rgba(111, 242, 192, 0.2), rgba(163, 140, 255, 0.24));
        border: 1px solid var(--border);
        border-radius: 999px;
        font-weight: 950;
        font-size: clamp(13px, 1.05vw, 20px);
        padding: 3px 14px;
      }
      .stream-tag {
        color: var(--muted);
        font-weight: 800;
        font-size: clamp(12px, 0.95vw, 18px);
      }
      .quote-card .msg {
        font-size: clamp(18px, 1.55vw, 30px);
        font-weight: 800;
        line-height: 1.5;
      }
      .quote-card .note {
        margin-top: 6px;
        color: var(--muted);
        font-weight: 700;
        font-size: clamp(13px, 1vw, 19px);
      }

      /* ============ 初見さん ============ */
      .big-count {
        text-align: center;
        margin: clamp(6px, 1vh, 12px) 0 clamp(10px, 1.6vh, 18px);
      }
      .big-count .n {
        font-size: clamp(64px, 7vw, 130px);
        font-weight: 950;
        background: linear-gradient(180deg, #8dffd2, #a9b8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      .big-count .l { font-weight: 900; color: var(--muted); font-size: clamp(16px, 1.4vw, 26px); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(14px, 1.6vw, 28px); }
      .footnote {
        text-align: center;
        color: var(--muted);
        font-size: clamp(11px, 0.85vw, 16px);
        font-weight: 700;
        margin-top: 8px;
      }

      /* ============ クイズ ============ */
      .quiz-q { margin-bottom: clamp(10px, 1.6vh, 18px); }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(10px, 1.2vh, 16px) clamp(12px, 1.2vw, 20px);
      }
      .choice {
        background: var(--surface-strong);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.2vw, 24px);
        font-weight: 900;
        font-size: clamp(16px, 1.35vw, 26px);
        box-shadow: var(--shadow-soft);
        transition: all 0.4s ease;
      }
      .choice .abc { color: var(--aur-violet); margin-right: 10px; }
      .choice.marked {
        border-color: var(--aur-green);
        background: linear-gradient(90deg, rgba(111, 242, 192, 0.22), rgba(11, 24, 52, 0.92));
        transform: scale(1.02);
      }
      .answer-box {
        margin-top: clamp(10px, 1.6vh, 18px);
        background: linear-gradient(90deg, rgba(255, 217, 138, 0.18), rgba(11, 24, 52, 0.86));
        border: 1px solid rgba(255, 217, 138, 0.42);
        border-radius: var(--radius-md);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.4vw, 26px);
        font-weight: 800;
        font-size: clamp(15px, 1.25vw, 23px);
        line-height: 1.55;
      }
      .answer-box b { color: var(--aur-pink); }

      /* ============ 盛り上がりTOP3 ============ */
      .burst-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .rank-badge {
        font-size: clamp(24px, 2.2vw, 42px);
        font-weight: 950;
        background: linear-gradient(180deg, #ffe4a6, #ffc07a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rank-badge.first { font-size: clamp(30px, 2.8vw, 54px); }
      .burst-title { font-weight: 950; font-size: clamp(20px, 1.9vw, 36px); }
      .burst-meta { color: var(--muted); font-weight: 800; font-size: clamp(13px, 1vw, 19px); }
      .burst-ctx {
        font-weight: 800;
        color: var(--muted);
        font-size: clamp(14px, 1.15vw, 21px);
        margin: 4px 0 10px;
        line-height: 1.5;
      }
      .replay {
        background: rgba(6, 14, 34, 0.6);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: clamp(8px, 1.2vh, 14px) clamp(12px, 1.2vw, 22px);
      }
      .replay .line {
        display: flex;
        gap: 12px;
        align-items: baseline;
        padding: clamp(2px, 0.45vh, 5px) 0;
        font-size: clamp(14px, 1.2vw, 22px);
        line-height: 1.4;
      }
      .replay .t { color: #9bb2cd; font-weight: 800; font-size: 0.82em; white-space: nowrap; }
      .replay .n { font-weight: 950; color: #bda6ff; white-space: nowrap; }
      .replay .m { font-weight: 800; }

      /* ============ ノミネート / ドラムロール / 大賞 ============ */
      .nominee-label {
        font-weight: 950;
        letter-spacing: 0.24em;
        color: var(--muted);
        font-size: clamp(13px, 1.05vw, 20px);
        margin-bottom: 6px;
      }
      .drum {
        text-align: center;
        font-size: clamp(34px, 3.4vw, 64px);
        font-weight: 950;
        letter-spacing: 0.2em;
        margin: clamp(12px, 2vh, 24px) 0;
        color: #c9b6ff;
      }
      .winner-card {
        background: linear-gradient(120deg, rgba(255, 217, 138, 0.18), rgba(163, 140, 255, 0.16), rgba(9, 20, 46, 0.9));
        border: 2px solid rgba(255, 210, 140, 0.62);
        border-radius: var(--radius-xl);
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5), 0 0 26px rgba(255, 190, 100, 0.12);
        padding: clamp(16px, 2.4vh, 30px) clamp(20px, 2vw, 40px);
        margin-top: clamp(10px, 1.6vh, 18px);
        position: relative;
      }
      .winner-card .crown {
        position: absolute;
        top: -clamp(10px, 1vh, 16px);
        top: -14px;
        left: 26px;
        font-size: clamp(26px, 2.2vw, 42px);
        transform: rotate(-12deg);
      }
      .winner-card .prize {
        font-weight: 950;
        letter-spacing: 0.22em;
        color: #ffd07a;
        font-size: clamp(14px, 1.2vw, 22px);
        margin-bottom: 6px;
      }
      .winner-card .msg { font-size: clamp(22px, 2vw, 40px); font-weight: 950; line-height: 1.45; }
      .winner-card .note { margin-top: 8px; color: #e9cfa4; font-weight: 800; font-size: clamp(13px, 1.05vw, 20px); }

      .buzz-word { font-size: clamp(24px, 2.2vw, 44px); font-weight: 950; }
      .buzz-count {
        font-weight: 950;
        color: var(--aur-pink);
        font-size: clamp(14px, 1.15vw, 22px);
        margin-left: 12px;
      }

      /* ============ 手紙 ============ */
      .letter {
        max-width: 1240px;
        font-size: clamp(17px, 1.5vw, 29px);
        font-weight: 800;
        line-height: 1.85;
      }
      .letter p { margin: 0 0 clamp(12px, 2vh, 22px); }
      .letter .sig {
        text-align: right;
        font-weight: 950;
        color: #bda6ff;
        margin-top: clamp(8px, 1.4vh, 16px);
      }

      /* ============ エンディング ============ */
      .ending-emoji { text-align: center; font-size: clamp(48px, 5vw, 92px); margin-bottom: 8px; }

      /* ============ アバター ============ */
      /* 絵が出ないときは頭文字が出る。夜空に白丸だと眩しいので、
         丸のほうを淡い氷色にして、頭文字は濃紺で置く（比を稼ぐのは字ではなく地） */
      .av {
        border-radius: 999px;
        object-fit: cover;
        border: 2px solid rgba(150, 214, 255, 0.55);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
        background: rgba(206, 230, 252, 0.92);
        flex: none;
        display: inline-grid;
        place-items: center;
        font-weight: 950;
        color: rgba(14, 26, 56, 0.88);
        overflow: hidden;
        user-select: none;
      }
      .av-md { width: clamp(34px, 2.6vw, 50px); height: clamp(34px, 2.6vw, 50px); font-size: clamp(13px, 1vw, 19px); }
      .av-sm { width: clamp(20px, 1.5vw, 28px); height: clamp(20px, 1.5vw, 28px); font-size: 11px; border-width: 1.5px; }
      .av-lg { width: clamp(70px, 6vw, 116px); height: clamp(70px, 6vw, 116px); font-size: clamp(20px, 1.8vw, 34px); border-width: 3px; }
      .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* ============ 常連さん表彰 ============ */
      .podium {
        display: flex;
        gap: clamp(10px, 1.2vw, 22px);
        justify-content: center;
        align-items: stretch;
        flex-wrap: wrap;
        margin: clamp(6px, 1vh, 12px) 0 clamp(10px, 1.6vh, 18px);
      }
      .podium-card {
        background: linear-gradient(160deg, rgba(255, 224, 160, 0.16), rgba(11, 23, 50, 0.9));
        border: 2px solid rgba(255, 210, 140, 0.5);
        border-radius: var(--radius-xl);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
        padding: clamp(12px, 1.8vh, 22px) clamp(12px, 1.2vw, 24px);
        text-align: center;
        flex: 1 1 0;
        min-width: clamp(140px, 12vw, 230px);
        max-width: 290px;
        position: relative;
      }
      .podium-card .kaikin-badge {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #ffd98a, #ffb46b);
        color: #3d2708;
        font-weight: 950;
        font-size: clamp(12px, 1vw, 18px);
        letter-spacing: 0.14em;
        border-radius: 999px;
        padding: 4px 18px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        white-space: nowrap;
      }
      .podium-card .av-lg { margin: 10px auto 8px; }
      .podium-card .p-name { font-weight: 950; font-size: clamp(16px, 1.5vw, 28px); }
      .podium-card .p-stat { color: var(--muted); font-weight: 800; font-size: clamp(12px, 1vw, 18px); margin-top: 4px; }
      .special-row { display: flex; gap: clamp(12px, 1.4vw, 24px); }
      .special-card {
        flex: 1;
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.2vw, 20px);
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.4vw, 26px);
      }
      .special-card .prize {
        font-weight: 950;
        letter-spacing: 0.14em;
        color: #ffd07a;
        font-size: clamp(12px, 1vw, 18px);
      }
      .special-card .p-name { font-weight: 950; font-size: clamp(16px, 1.4vw, 26px); }
      .special-card .p-stat { color: var(--muted); font-weight: 800; font-size: clamp(12px, 1vw, 18px); }
      .reg-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px clamp(12px, 1.4vw, 24px); margin-top: clamp(8px, 1.2vh, 14px); }
      .reg-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(6, 14, 34, 0.62);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 6px 14px;
        font-size: clamp(13px, 1.05vw, 20px);
      }
      .reg-row .r-name { font-weight: 950; white-space: nowrap; }
      .reg-row .r-stat { color: var(--aur-violet); font-weight: 950; white-space: nowrap; }
      .reg-row .r-note { color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* ============ 投げ銭ありがとう ============ */
      /* 写真の上に字を置く面。夜のテーマでは写真を**暗く沈めて**から字を乗せる */
      .don-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: saturate(0.75) brightness(0.5);
      }
      .don-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(3, 8, 22, 0.82), rgba(3, 8, 22, 0.7) 40%, rgba(3, 8, 22, 0.86));
      }
      .don-card { margin: clamp(8px, 1.2vh, 14px) 0; }
      .don-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px clamp(12px, 1.4vw, 24px);
        margin-bottom: clamp(8px, 1.2vh, 14px);
      }
      .don-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(8, 17, 40, 0.8);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 6px 14px;
        font-size: clamp(13px, 1.05vw, 20px);
      }
      .don-row .d-rank { font-weight: 950; color: var(--aur-violet); min-width: 2.8em; white-space: nowrap; }
      .don-row .d-name { font-weight: 950; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .don-row .d-amt { font-weight: 950; color: var(--aur-pink); white-space: nowrap; }
      .don-amt-big { font-weight: 950; color: var(--aur-pink); font-size: clamp(18px, 1.6vw, 30px); white-space: nowrap; margin-left: auto; }

      /* ============ コントローラ(?role=ctrl) ============ */
      body.ctrl { cursor: default; overflow: hidden; }
      body.ctrl #stage, body.ctrl #progress, body.ctrl #hint { display: none; }
      #ctrl-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      }
      body.ctrl #ctrl-ui { display: flex; }
      #ctrl-ui .c-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 950;
        color: var(--muted);
        font-size: 14px;
      }
      #ctrl-ui .c-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      #ctrl-ui .c-dot { width: 10px; height: 10px; border-radius: 999px; background: #44546f; }
      #ctrl-ui .c-dot.ok { background: #52d3ab; }
      #ctrl-ui .c-dot.ng { background: #f08aa0; }
      #ctrl-ui .c-now {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: 14px 18px;
        text-align: center;
      }
      #ctrl-ui .c-corner { font-weight: 950; font-size: clamp(20px, 6vw, 30px); }
      #ctrl-ui .c-step { color: var(--muted); font-weight: 800; font-size: 14px; margin-top: 2px; }
      #ctrl-ui .c-main { display: flex; gap: 12px; flex: none; }
      #ctrl-ui button {
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-card);
        font-weight: 950;
        cursor: pointer;
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* ダブルタップズーム由来の余計な発火を防ぐ */
        user-select: none;
      }
      #ctrl-ui button:active { transform: scale(0.97); }
      #ctrl-ui .c-back {
        flex: 1;
        height: 26vh;
        font-size: clamp(18px, 5vw, 26px);
        background: var(--surface-strong);
        color: var(--muted);
      }
      #ctrl-ui .c-next {
        flex: 2.4;
        height: 26vh;
        font-size: clamp(26px, 8vw, 40px);
        color: #fff;
        /* 白字を乗せるので、オーロラ色そのままではなく**沈めた**側を使う */
        background: linear-gradient(120deg, #1d7f66, #3d3496);
        border: 0;
      }
      #ctrl-ui .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
      #ctrl-ui .c-grid button {

        text-align: left;

      #ctrl-ui .c-grid button.act { border-color: var(--aur-green); background: linear-gradient(90deg, rgba(111, 242, 192, 0.24), rgba(11, 24, 52, 0.92)); }

      #ctrl-ui .c-extra button { flex: 1; padding: 12px; font-size: 15px; background: rgba(13, 25, 54, 0.84); }

      /* ============ 進行UI ============ */
      #progress {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 20;

      #progress .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;

      #progress .dot.act {

      /* ============ 紙吹雪 ============ */
      #confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
      .confetti {
        position: absolute;
        top: -4vh;
        width: 14px;
        height: 22px;
        border-radius: 4px;
        opacity: 0.9;
        animation: fall linear forwards;

      @keyframes fall {
        0% { transform: translateY(-6vh) rotate(0deg); }
        100% { transform: translateY(112vh) rotate(720deg); }

      /* ============ 夜空（オーロラ・雪） ============ */
      /* body のいちばん先頭に置いた #sky だけが動く。ほかは一切動かさない。
         - オーロラは**画面上部の帯**にとどめる。画面ぜんぶを覆う形を動かすと
           その面が毎フレーム描き直される（島の海のきらめきで PC が 12.2fps）
         - 動かすのは transform と opacity だけ。background-position も filter も
           毎フレーム変えない。ぼかしは使わず、やわらかい放射グラデーションで出す
         - will-change で各帯を自分の層に載せる。層になっていれば、
           transform / opacity が動いても描き直しが起きない */
      #sky {
        position: fixed;
        inset: 0;
        z-index: -3;
        pointer-events: none;
        overflow: hidden;
        contain: layout paint style;

      /* 星。動かさないので値は一度だけ焼かれる */
      #sky .stars {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.9), transparent 60%),
          radial-gradient(1.2px 1.2px at 27% 8%, rgba(214,238,255,0.8), transparent 60%),
          radial-gradient(1.6px 1.6px at 41% 26%, rgba(255,255,255,0.75), transparent 60%),

      #sky .aurora {
        position: absolute;
        left: -8%;
        right: -8%;
        top: -10%;
        height: 52%;
        contain: paint;
      }
      #sky .band {
        position: absolute;
        inset: 0;
        will-change: transform, opacity;
        transform-origin: 50% 0%;
        backface-visibility: hidden;
      }
      #sky .b1 {
        background: radial-gradient(56% 96% at 26% 4%,

      #sky .b2 {

      @keyframes aur-drift-a {

      @keyframes aur-glow-a { 0% { opacity: 0.55; } 100% { opacity: 0.9; } }
      @keyframes aur-glow-b { 0% { opacity: 0.6; } 100% { opacity: 0.34; } }

      /* 雪。30粒まで。1粒ずつ小さな要素にして transform だけで落とす */

      #sky .snow i:nth-child(11) { left: 55.81vw; width: 5.8px; height: 5.8px; opacity: 0.51; animation-duration: 16.7s; animation-delay: -30.0s; }
      #sky .snow i:nth-child(12) { left: 69.91vw; width: 5.5px; height: 5.5px; opacity: 0.57; animation-duration: 28.3s; animation-delay: -16.8s; }
      #sky .snow i:nth-child(13) { left: 93.05vw; width: 7.1px; height: 7.1px; opacity: 0.82; animation-duration: 32.5s; animation-delay: -26.5s; }
      #sky .snow i:nth-child(14) { left: 37.53vw; width: 7.4px; height: 7.4px; opacity: 0.61; animation-duration: 21.7s; animation-delay: -15.0s; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }

        [data-step].on { opacity: 1; }

      /* ============ 9月ぶんの上書き ============
         テーマ（style_aurora.css）は触らず、9月版の面の都合だけここで直す。
         配信に映すので **1面に収まりきらないことが不具合**。溢れると
         いちばん上（見出しに近い札）が切れる。 */

      /* 皆勤賞が6人いる。既定の min-width だと 1920px で6枚目が下に落ちて、
         5枚＋1枚のぶら下がりになる（実測 1490px > 内寸 1444px）。 */
      .podium-card {
        min-width: clamp(120px, 10vw, 200px);
        max-width: 240px;
      }
      .podium-card .p-stat {
        font-size: clamp(11px, 0.78vw, 15px);
        line-height: 1.5;
      }

      /* 出席日数のリストは2列。14人が1画面に収まる高さにする */
      .reg-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(6px, 0.7vh, 10px) clamp(10px, 1vw, 18px);
      }

      /* 調べもの大賞の札は、引用より「何を教えてくれたか」を読ませたい */
      .guide-what {
        margin-top: 6px;
        font-weight: 800;
        font-size: clamp(13px, 1vw, 19px);
        color: var(--muted);
      }

      /* 表彰台の名前が長い人（@dekobokov6229）で枠からはみ出して隣に重なった。
         札の幅で折り返させる。 */
      .podium-card .p-name {
        font-size: clamp(14px, 1.05vw, 21px);
        overflow-wrap: anywhere;
        line-height: 1.25;
      }
      .podium-card .av-lg { width: clamp(56px, 4.4vw, 86px); height: clamp(56px, 4.4vw, 86px); }

      /* 投げ銭の4位以下は21人。1列だと溢れて上が切れるので3列にする */
      .don-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(5px, 0.6vh, 9px) clamp(8px, 0.8vw, 14px);
      }
      .don-row .d-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 1画面に収まらない面が8つ残っていた（実測 8〜1034px のはみ出し）。
         配信に映るので、溢れた時点で上の札が見えない。詰めて収める。 */
      .panel {
        max-height: 84vh;
        padding: clamp(12px, 1.8vh, 22px) clamp(16px, 1.6vw, 30px);
      }
      .quote-card {
        padding: clamp(8px, 1.1vh, 14px) clamp(12px, 1.2vw, 20px);
        margin-bottom: clamp(6px, 0.8vh, 11px);
      }
      .quote-card .msg { font-size: clamp(15px, 1.24vw, 25px); line-height: 1.45; }
      .quote-card .note { font-size: clamp(12px, 0.95vw, 18px); line-height: 1.5; }
      .corner-title { margin-bottom: clamp(8px, 1.6vh, 18px); }
      .letter p { margin: 0 0 clamp(8px, 1.1vh, 14px); }

      /* まだ3面が 21〜163px はみ出していたぶん */
      .letter p { font-size: clamp(15px, 1.22vw, 25px); line-height: 1.75; }
      .winner-card { padding: clamp(12px, 1.6vh, 20px) clamp(16px, 1.6vw, 28px); }
      .winner-card .msg { font-size: clamp(22px, 2.2vw, 44px); }
      .drum { margin: clamp(6px, 0.9vh, 12px) 0; }

      /* 流行語のノミネート6枚だけ、あと 21px 足りなかった */
      .buzz-word { font-size: clamp(20px, 1.8vw, 34px); }

  <body>
<!-- オーロラの夜: 背景。既存の要素の外側に置く（クラス名は一切触らない） -->

      /* ============================ 基盤 ============================ */
      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      const e = escapeHtml;

      function initials(name) {
        const s = String(name).trim().replace(/…+$/, "");
        return Array.from(s).slice(0, 2).join("") || "？";
      }
      function avatarKey(name) {
        const n = String(name).replace(/^@/, "").replace(/ さん$/, "").trim();
        return AVATAR_ALIAS[n] || n;
      }
      function avatarHtml(name, size) {
        const key = avatarKey(name);
        const src = typeof AVATARS !== "undefined" ? AVATARS[key] : null;
        const cls = `av ${size || "av-md"}`;
        if (src) return `<span class="${cls}"><img src="${src}" alt="" loading="lazy" decoding="async" /></span>`;
        return `<span class="${cls}">${e(initials(key))}</span>`;
      }

      function quoteCard(o, step, extra) {
        return `
          <div class="quote-card" ${step != null ? `data-step="${step}"` : ""}>
            <div class="who">
              ${avatarHtml(o.name, "av-md")}
              <span class="name-pill">${e(o.name)}</span>
              ${o.date ? `<span class="stream-tag">${e(o.date)}</span>` : ""}
              ${extra ? `<span class="stream-tag">${e(extra)}</span>` : ""}
            </div>
            <div class="msg">「${e(o.msg)}」</div>
            ${o.note ? `<div class="note">${e(o.note)}</div>` : ""}
          </div>`;
      }

      /* ======================== 各シーン描画 ======================== */
      const D = REVIEW_DATA;
      const yen = (n) => Number(n).toLocaleString("ja-JP");

      function renderOpening() {
        return `
          <div data-step="0" class="on-load">
            <h1 class="hero-title">${e(D.opening.title)}</h1>
            <p class="hero-sub">${e(D.period)}　${e(D.opening.sub)}</p>
          </div>
          <div class="stat-row" data-step="1">
            ${D.opening.stats.map((s) => `
              <div class="stat-card">
                <div class="num">${e(s.n)}<span style="font-size:0.5em">${e(s.unit)}</span></div>
                <div class="label">${e(s.label)}</div>
              </div>`).join("")}
          </div>`;
      }

      /* ① 皆勤賞: 表彰台と出席日数リストで2面に割る。

      function renderKinkinPodium() {
        const K = D.kinkin;
        return `
          <div class="corner-tag">CORNER 1</div>
          <h2 class="corner-title">皆勤賞</h2>
          <div class="panel">
            <div class="nominee-label" data-step="0" style="text-align:center">

            </div>
            <div class="podium" data-step="1">
              ${K.winners.map((p) => `
                <div class="podium-card">
                  <div class="kaikin-badge">皆勤賞</div>
                  ${avatarHtml(p.name, "av-lg")}
                  <div class="p-name">${e(p.name)}</div>
                  <div class="p-stat">出席 ${K.denom}/${K.denom}日</div>
                  <div class="p-stat">${e(p.word)}</div>
                </div>`).join("")}

          </div>`;

      function renderKinkinList() {

      function renderBuzzNominees() {

      /* ⑤ 盛り上がりの瞬間: 1位あたり step0 見出し / step1 リプレイ */
      function renderBurst(bIndex) {

          <h2 class="corner-title">盛り上がりの瞬間 TOP5</h2>

            <div data-step="0">

      function renderGuides(half) {

      function renderQuiz(qIndex) {

              ${N.featured.map((o, i) => quoteCard(o, i + 2)).join("")}
            </div>
            <div class="footnote" data-step="${N.featured.length + 2}">${e(N.note)}</div>
          </div>`;
      }

      /* ⑨ 投げ銭: 4位以下の一覧と、3位→1位の発表で2面に割る。
         1面に入れると21人ぶんが溢れて、上のほうの順位が切れる（実際に切れた）。 */
      function renderTipsList() {
        const list = D.tips.rows.filter((p) => p.rank >= 4);
        return `
          <div class="corner-tag">CORNER 9 - スペシャル</div>
          <h2 class="corner-title">投げ銭ありがとうスペシャル</h2>
          <div class="panel">
            <div class="nominee-label" data-step="0">💐 応援してくれたみなさん（第4位〜）</div>
            <div class="don-list" data-step="1">
              ${list.map((p) => `
                <div class="don-row">

          </div>`;
      }

      function renderTipsTop() {
        const list = D.tips.rows;
        const at = (r) => list.filter((p) => p.rank === r);
        const card = (p, medal, step) => `
          <div class="special-card don-card" data-step="${step}">

        const top = list[0];
        return `
          <div class="corner-tag">CORNER 9 - スペシャル</div>

          <div class="panel">
            ${at(3).map((p) => card(p, "🥉", 1)).join("")}

            <div class="drum" data-step="3">投げ銭ランキング 第1位は・・・・・・</div>
            <div class="winner-card" data-step="4">
              <div class="crown">👑</div>
              <div class="prize">2026年9月 投げ銭ランキング 第1位</div>
              <div class="note" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:0">
                ${avatarHtml(top.handle, "av-lg")}
                <span class="msg" style="font-size:clamp(22px,2vw,40px)">${e(top.display)}</span>
                <span class="don-amt-big">${yen(top.yen)}円</span>

            <div class="footnote" data-step="4" style="font-size:clamp(14px,1.1vw,21px);font-weight:900">
              合計 ${yen(D.tips.total)}円 ありがとうございました🙏
            </div>
          </div>`;
      }

      /* ⑩ 手紙: 7段落あって1面に入らない（実測 1034px はみ出し）。前後半で2面に */
      function renderLetter(half) {
        const all = D.letter.paragraphs;
        const mid = Math.ceil(all.length / 2);
        const rows = half === 0 ? all.slice(0, mid) : all.slice(mid);
        const last = half === 1;
        return `
          <div class="corner-tag">CORNER 10 - ${half + 1}/2</div>
          <h2 class="corner-title">あやと島案内鳥 からの手紙</h2>
          <div class="panel letter">
            ${rows.map((x, i) => `<p data-step="${i + 1}">${e(x)}</p>`).join("")}
            ${last ? `<div class="sig" data-step="${rows.length + 1}">${e(D.letter.sign)}</div>` : ""}
          </div>`;
      }

      function renderEnding() {
        return `
          <div data-step="0">
            <div class="ending-emoji">🌌</div>
            <h1 class="hero-title">${e(D.ending.title)}</h1>
            <p class="hero-sub">${e(D.ending.sub)}</p>
          </div>`;
      }

      /* ======================== シーン定義 ========================
         **1面に詰めない。** 1920×1080 に収まらないと、いちばん上の札から
         切れていく（8月版の形のまま6人・6語を入れて実際に切れた）。
         コーナーを割って、1面ぶんずつ見せる。 */
      const SCENES = [];
      const CORNER_OF = []; // シーンごとの「どのコーナーか」。手で数えない
      const push = (corner, scene) => { SCENES.push(scene); CORNER_OF.push(corner); };

      push(0, { total: 2, render: renderOpening });
      push(1, { total: 1, render: renderKinkinPodium });
      push(1, { total: 1, render: renderKinkinList });
      push(2, { total: D.buzzwords.nominees.length, render: renderBuzzNominees });
      push(2, { total: 1, render: renderBuzzWinner, confettiAt: 1 });
      push(3, { total: Math.ceil(D.meigen.length / 2), render: () => renderMeigen(0) });
      push(3, { total: Math.floor(D.meigen.length / 2), render: () => renderMeigen(1) });
      push(4, { total: D.funny.categories.length, render: renderFunnyCats });
      push(4, {
        total: D.funny.grandPrix.nominees.length + 2,
        render: renderFunnyGP,
        confettiAt: D.funny.grandPrix.nominees.length + 2,
        confettiBig: true,
      });
      D.bursts.forEach((_, i) => push(5, { total: 1, render: () => renderBurst(i) }));
      push(6, { total: Math.ceil(D.guides.rows.length / 2), render: () => renderGuides(0) });
      push(6, { total: Math.floor(D.guides.rows.length / 2), render: () => renderGuides(1) });
      D.quiz.forEach((_, i) => push(7, { total: 2, render: () => renderQuiz(i) }));
      push(8, { total: D.newcomers.featured.length + 2, render: renderNewcomers });
      push(9, { total: 1, render: renderTipsList });
      push(9, { total: 4, render: renderTipsTop, confettiAt: 4, confettiBig: true });
      push(10, { total: Math.ceil(D.letter.paragraphs.length / 2), render: () => renderLetter(0) });
      push(10, { total: Math.floor(D.letter.paragraphs.length / 2) + 1, render: () => renderLetter(1) });
      push(11, { total: 1, render: renderEnding, confettiAt: 0 });

      const DOT_LABELS = [
        "オープニング",
        "皆勤賞",
        "流行語大賞",
        "名言・いい話",
        "おもしろコメント大賞",
        "盛り上がりTOP5",
        "調べもの大賞",
        "9月おぼえてますかクイズ",
        "はじめまして",
        "投げ銭ありがとう",
        "あやと島案内鳥 からの手紙",
        "エンディング",
      ];
      const DOT_OF_SCENE = CORNER_OF;
      const DOT_COUNT = DOT_LABELS.length;
      if (Math.max(...CORNER_OF) !== DOT_LABELS.length - 1) {
        // ドットの札とコーナー番号がずれると、進行ドットが別の名前を指す。黙って外れる
        console.error("DOT_LABELS とコーナー番号が合わない", Math.max(...CORNER_OF), DOT_LABELS.length);
      }

      /* ======================== ステート機械 ======================== */
      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const hint = document.getElementById("hint");
      let sceneIdx = 0;
      let stepIdx = 0;
      let interacted = false;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function buildDots() {
        progress.innerHTML = Array.from({ length: DOT_COUNT }, () => '<span class="dot"></span>').join("");
      }
      function updateDots() {
        const cur = DOT_OF_SCENE[sceneIdx];
        [...progress.children].forEach((d, i) => d.classList.toggle("act", i === cur));
      }

      function applySteps() {
        let newest = null;
        stage.querySelectorAll("[data-step]").forEach((el) => {
          const on = Number(el.dataset.step) <= stepIdx;
          el.classList.toggle("on", on);
          if (on && (!newest || Number(el.dataset.step) >= Number(newest.dataset.step))) newest = el;
        });
        // 長いパネルでも、いま出た要素が見えるようにスクロール
        if (newest) newest.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
        stage.querySelectorAll("[data-mark]").forEach((el) => {
          el.classList.toggle("marked", Number(el.dataset.mark) <= stepIdx);
        });
        const s = SCENES[sceneIdx];
        if (s.confettiAt != null && stepIdx === s.confettiAt) {
          spawnConfetti(s.confettiBig ? 160 : 90);
        }
      }

      function renderScene() {
        stage.innerHTML = SCENES[sceneIdx].render();
        updateDots();
        // 初期ステップ(0)を即時表示
        requestAnimationFrame(() => requestAnimationFrame(applySteps));
      }

      function gotoScene(i, step) {
        sceneIdx = Math.max(0, Math.min(SCENES.length - 1, i));
        stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, step ?? 0));
        stage.classList.add("fading");
        setTimeout(() => {
          renderScene();
          stage.classList.remove("fading");
        }, reduceMotion ? 0 : 280);
        onStateChanged();
      }

      function advance() {
        dismissHint();
        if (stepIdx < SCENES[sceneIdx].total) {
          stepIdx++;
          applySteps();
          onStateChanged();
        } else if (sceneIdx < SCENES.length - 1) {
          gotoScene(sceneIdx + 1, 0);
        }
      }
      function back() {
        dismissHint();
        if (stepIdx > 0) {
          stepIdx--;
          applySteps();
          onStateChanged();
        } else if (sceneIdx > 0) {
          const prev = sceneIdx - 1;
          gotoScene(prev, SCENES[prev].total);
        }
      }
      function dismissHint() {
        if (!interacted) {
          interacted = true;
          setTimeout(() => hint.classList.add("gone"), 4000);
        }
      }

      /* ======================== 紙吹雪 ======================== */
      const COLORS = ["#f6a9c7", "#b9b7ff", "#9be7d5", "#ffc8a8", "#ffd98a", "#dbe6ff"];
      function spawnConfetti(count) {
        if (reduceMotion) return;
        const layer = document.getElementById("confetti-layer");
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * 100 + "vw";
          c.style.background = COLORS[(Math.random() * COLORS.length) | 0];
          c.style.width = 8 + Math.random() * 10 + "px";
          c.style.height = 14 + Math.random() * 12 + "px";
          c.style.animationDuration = 3.6 + Math.random() * 2.6 + "s";
          c.style.animationDelay = Math.random() * 0.9 + "s";
          layer.appendChild(c);
          setTimeout(() => c.remove(), 7500);
        }
      }

      /* ======================== 入力 ======================== */
      // 注意: ctrl モードではグローバル入力を登録しない。
      // (登録するとボタンの click と pointerdown が二重発火し、1タップで2つ以上進むバグになる)
      const IS_CTRL = new URLSearchParams(location.search).get("role") === "ctrl";
      if (!IS_CTRL) {
        window.addEventListener("pointerdown", (ev) => {
          if (ev.button === 2) return;
          advance();
        });
        window.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          back();
        });
      }
      window.addEventListener("keydown", (ev) => {
        const k = ev.key;
        if (k === "Enter" || k === " " || k === "ArrowRight" || k === "ArrowDown") {
          ev.preventDefault();
          advance();
        } else if (k === "Backspace" || k === "ArrowLeft" || k === "ArrowUp") {
          ev.preventDefault();
          back();
        } else if (/^[0-9]$/.test(k)) {
          // 数字キー: コーナー頭出し(リハーサル用)
          const dot = Number(k);
          const target = DOT_OF_SCENE.indexOf(dot);
          if (target >= 0) gotoScene(target, 0);
        }
      });

      // 検証・リハーサル用フック
      window.__jump = (i, step) => gotoScene(i, step ?? 0);
      window.__sceneCount = SCENES.length;

      /* =========================================================
         リモート同期(Firestore)
         - 無指定: 従来どおりローカル操作のみ(SDKは読み込まない)
         - ?role=view : Firestoreの状態に追従(スマホOBSオーバーレイ用)
         - ?role=ctrl : スマホ用コントローラ(進行操作を配信画面へ送る)
         - ?auto=秒数 : 自動進行(同期なしのフォールバック)

         ▼▼ 書けるのはあやとだけ ▼▼
         `firestore.rules` の monthlyReview は
           読む   … 誰でも(OBS はログインできないので、ここは開けてある)
           書く   … `islandUsers/{uid}.admin` が立っている人だけ
         になっている。だから **ctrl はログインしてからでないと進行を送れない。**

         同じ端末で島(`/`)にログインしてあれば、ここは何も押さずに繋がる
         (下の SDK の版と apiKey を島に合わせてあるのはそのため)。
         繋がらないときだけ、コントローラーに「Google でログイン」が出る。
         ========================================================= */
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDts2gpO2fepPYOdiMyiz5ydTIQHNtY5kM",
        authDomain: "live-streaming-d3cac.firebaseapp.com",
        projectId: "live-streaming-d3cac",
        storageBucket: "live-streaming-d3cac.firebasestorage.app",
        messagingSenderId: "291182823114",
        appId: "1:291182823114:web:84e7d7c52c8d3ca7d39633",
      };
      const SYNC_COLLECTION = "monthlyReview";
      const SYNC_DOC = "202609-37a538"; // 簡易ガード用トークン入りID

      const params = new URLSearchParams(location.search);
      const ROLE = params.get("role"); // "ctrl" | "view" | null
      const AUTO_SEC = Math.max(0, Number(params.get("auto")) || 0);

      /* Firebase の SDK。**版を島(`site/package.json` の firebase ^12)に揃えてある。**
         ログインは localStorage に `firebase:authUser:<apiKey>:[DEFAULT]` の形で
         残るので、同じ apiKey・同じ既定アプリ名・同じ大版なら、島でログイン済みの
         端末はここでも押さずにログイン済みになる。配信の当日に押させない。 */
      const SDK = "https://www.gstatic.com/firebasejs/12.18.0";

      let publishFn = null; // ctrl時のみセット。**ログインするまで null**
      let signInFn = null; // ctrl時のみセット。「Google でログイン」の中身

      /* コントローラーの札。**「いま押せば OBS が動く」ときだけ緑にする。**
         Firestore に繋がっただけでも、ログインしただけでも足りない。
         別々の場所から `setCtrlStatus` を呼んでいると、あとから来たほうが
         上書きして「同期中と出ているのに押しても動かない」が起きる
         （実際に起きた。配信の最中にこれをやられると原因が分からない）。 */
      let linkOk = false; // Firestore からスナップショットが来ている
      let authOk = false; // ログインしている
      let sendErr = ""; // 直前の送信が落ちた理由。空なら落ちていない
      function refreshCtrlStatus() {
        if (ROLE !== "ctrl") return;
        if (!linkOk) setCtrlStatus(false, "つながっていません");
        else if (!authOk) setCtrlStatus(false, "ログインが要ります");
        else if (sendErr) setCtrlStatus(false, sendErr);
        else setCtrlStatus(true, "同期中");
      }
      let applyingRemote = false;
      let lastConfetti = 0;
      let lastSeenTs = 0; // これより古いスナップショットは無視(連打時の巻き戻り防止)
      let seenFirstSnap = false; // 1枚目のスナップショットを受けたか(紙吹雪の空撃ち防止)

      function onStateChanged() {
        updateCtrlLabels();
        if (publishFn && !applyingRemote) {
          const ts = Date.now();
          lastSeenTs = Math.max(lastSeenTs, ts);
          /* **落ちた理由を出す。** 「送信失敗」だけだと、配信の最中に
             ログインの問題なのか電波なのかが分からない。 */
          publishFn({ scene: sceneIdx, step: stepIdx, ts, confetti: lastConfetti })
            .then(() => {
              if (!sendErr) return;
              sendErr = "";
              cEls.banner.classList.remove("show");
              refreshCtrlStatus();
            })
            .catch((e) => {
              const denied = e && (e.code === "permission-denied" || /permission/i.test(String(e)));
              sendErr = denied ? "このアカウントでは操作できません" : "送信失敗";
              refreshCtrlStatus();
              if (denied) showSignIn("進行を動かせるのは、島の管理者のアカウントだけです。入り直してください。");
            });
        }
      }

      /** Firebase のアプリ。ログインと Firestore で**同じものを使う**(そうしないと別のログインになる)。 */
      async function firebaseApp() {
        const { initializeApp, getApps } = await import(`${SDK}/firebase-app.js`);
        return getApps()[0] ?? initializeApp(FIREBASE_CONFIG);
      }

      async function initSync(onRemote) {
        if (!FIREBASE_CONFIG) throw new Error("FIREBASE_CONFIG未設定");
        const fsm = await import(`${SDK}/firebase-firestore.js`);
        const db = fsm.getFirestore(await firebaseApp());
        const ref = fsm.doc(db, SYNC_COLLECTION, SYNC_DOC);
        fsm.onSnapshot(
          ref,
          (snap) => {
            if (snap.exists()) onRemote(snap.data(), snap.metadata.hasPendingWrites);
            /* ここは「繋がった」だけを伝える。**緑にするかは
               `refreshCtrlStatus` が決める**（ログインと送信の成否も見る）。 */
            linkOk = true;
            refreshCtrlStatus();
          },
          () => {
            linkOk = false;
            refreshCtrlStatus();
          }
        );
        return (data) => fsm.setDoc(ref, data);
      }

      /* ---------- ログイン(ctrl だけ) ----------
         進行を書けるのはあやとだけ(`firestore.rules` の monthlyReview)。
         OBS(view)は読むだけなので、**そちらでは firebase-auth を落とさない。**
         配信に映っている側に、押せもしないログインの札を出さないため。 */
      async function initAuth(onUser) {
        const am = await import(`${SDK}/firebase-auth.js`);
        const auth = am.getAuth(await firebaseApp());
        /* 島でログイン済みの端末なら、ここが最初から user 付きで呼ばれる。
           そのときは何も押さずに「同期中」まで行く。 */
        am.onAuthStateChanged(auth, onUser);
        return () => am.signInWithPopup(auth, new am.GoogleAuthProvider());
      }

      /** コントローラーに「Google でログイン」を出す。押せる札にする(文だけ出さない)。 */
      function showSignIn(msg) {
        if (ROLE !== "ctrl") return;
        cEls.banner.textContent = "";
        const p = document.createElement("div");
        p.textContent = msg;
        const b = document.createElement("button");
        b.textContent = "Google でログイン";
        b.style.cssText = "margin-top:8px;padding:10px 14px;font-size:15px;touch-action:manipulation";
        b.addEventListener("click", async () => {
          b.disabled = true;
          try {
            if (signInFn) await signInFn();
          } catch (e) {
            /* 落ちた符丁（`auth/popup-blocked` など）は画面に出さない。
               読むのはあやとで、できることは「もう一度押す」だけ。
               符丁は console にだけ残す。 */
            console.error("ふりかえり授賞式: ログインできなかった —", e);
            p.textContent = "ログインできませんでした。もう一度押してください。";
          } finally {
            b.disabled = false;
          }
        });
        cEls.banner.append(p, b);
        cEls.banner.classList.add("show");
      }

      /* ---------- コントローラUI ---------- */
      const cEls = {
        dot: document.getElementById("c-dot"),
        statusText: document.getElementById("c-status-text"),
        banner: document.getElementById("c-banner"),
        corner: document.getElementById("c-corner"),
        step: document.getElementById("c-step"),
        next: document.getElementById("c-next"),
        back: document.getElementById("c-back"),
        grid: document.getElementById("c-grid"),
        confetti: document.getElementById("c-confetti"),
        top: document.getElementById("c-top"),
      };
      function setCtrlStatus(ok, text) {
        if (ROLE !== "ctrl") return;
        cEls.dot.className = "c-dot " + (ok ? "ok" : "ng");
        cEls.statusText.textContent = text || (ok ? "同期中" : "未接続");
      }
      function updateCtrlLabels() {
        if (ROLE !== "ctrl") return;
        const dot = DOT_OF_SCENE[sceneIdx];
        cEls.corner.textContent = DOT_LABELS[dot];
        const local = SCENES.map((s, i) => (DOT_OF_SCENE[i] === dot ? i : null)).filter((v) => v != null);
        const pagePos = local.indexOf(sceneIdx) + 1;
        cEls.step.textContent = `画面 ${pagePos}/${local.length} ・ ステップ ${stepIdx}/${SCENES[sceneIdx].total} ・ 全体 ${sceneIdx + 1}/${SCENES.length}`;
        [...cEls.grid.children].forEach((b, i) => b.classList.toggle("act", i === dot));
      }
      function initCtrlUi() {
        document.body.classList.add("ctrl");
        cEls.next.addEventListener("click", advance);
        cEls.back.addEventListener("click", back);
        cEls.top.addEventListener("click", () => gotoScene(0, 0));
        cEls.confetti.addEventListener("click", () => {
          lastConfetti = Date.now();
          onStateChanged();
        });
        DOT_LABELS.forEach((label, dot) => {
          const b = document.createElement("button");
          b.textContent = `${dot}. ${label}`;
          b.addEventListener("click", () => gotoScene(DOT_OF_SCENE.indexOf(dot), 0));
          cEls.grid.appendChild(b);
        });
        updateCtrlLabels();
      }

      /* ---------- 起動 ---------- */
      buildDots();
      renderScene();

      if (ROLE === "ctrl") {
        initCtrlUi();
        initSync((data, isLocalEcho) => {
          // 自分の書き込みエコーと古いスナップショットは無視(多重進行・巻き戻り防止)
          if (isLocalEcho) return;
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          // 他の操作元(PC等)の状態も反映してコントローラ表示を同期
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          sceneIdx = Math.max(0, Math.min(SCENES.length - 1, data.scene ?? 0));
          stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
          lastConfetti = data.confetti || lastConfetti;
          updateCtrlLabels();
          applyingRemote = false;
        })
          .then(async (pub) => {
            setCtrlStatus(false, "ログインを確かめています…");
            /* **ログインが確かめられるまで publishFn を入れない。**
               入れてしまうと、押した瞬間に静かに 403 で落ちる。
               配信の最中にそれが起きると、何が悪いのか分からない。 */
            signInFn = await initAuth((user) => {
              authOk = !!user;
              sendErr = "";
              publishFn = user ? pub : null;
              if (user) {
                cEls.banner.classList.remove("show");
                refreshCtrlStatus();
                onStateChanged();
              } else {
                refreshCtrlStatus();
                showSignIn("進行を動かすにはログインが要ります。島と同じアカウントで入ってください。");
              }
            });
          })
          .catch((e) => {
            linkOk = false;
            setCtrlStatus(false, "つながりません");
            /* ここはコントローラ（あやとの手元）なので字を出してよいが、
               書いてよいのは**これから何をするか**だけ。
               前は `Firestore につながりませんでした(<符丁>)` と、置き場の
               名前と落ちた符丁をそのまま出していた。手元でそれを読んでも
               打つ手は変わらないし、コントローラを画面共有した日には
               置き場の名前ごと映る。詳しいことは console にだけ残す。 */
            console.error("ふりかえり授賞式: 進行のつなぎに入れなかった —", e);
            cEls.banner.textContent = "進行がつながりません。電波を確かめて、開き直してください。";
            cEls.banner.classList.add("show");
          });
      } else if (ROLE === "view") {
        hint.classList.add("gone");
        initSync((data) => {
          // 古いスナップショットは無視(順序入れ替わりによる巻き戻り防止)
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          /* **1枚目のスナップショットでは飛ばさない。** OBS を開いた瞬間に
             前の紙吹雪が飛ぶのを止めるため。
             前は「lastConfetti が 0 でなければ」で見ていたが、月ごとの書類は
             `confetti: 0` から始まるので、**その月の1回目がいつも飲まれていた**
             （エミュレータに2枚のブラウザを繋いで確かめた）。
             「開いた直後か」と「まだ一度も飛ばしていないか」は別のこと。 */
          if (typeof data.confetti === "number" && data.confetti > lastConfetti) {
            if (seenFirstSnap) spawnConfetti(140);
            lastConfetti = data.confetti;
          }
          seenFirstSnap = true;
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          if (data.scene !== sceneIdx) {
            gotoScene(data.scene ?? 0, data.step ?? 0);
          } else {
            stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
            applySteps();
          }
          applyingRemote = false;
        }).catch(() => {
          /* 未設定・接続不可: ローカル操作のまま */
        });
      }

      if (AUTO_SEC > 0) setInterval(advance, AUTO_SEC * 1000);
    </script>
  </body>
