<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff7fb" />
    <title>8月のふりかえり授賞式</title>
    <style>
      /* =========================================
         202608 月末配信「1ヶ月ふりかえり授賞式」
         - OBS ブラウザソース 1920x1080 前提
         - クリック / Enter / → で進行、← で戻る
         - 外部依存なし(オフラインOK)
         ========================================= */
      :root {
        --bg-1: #fbe8f3; /* pink */
        --bg-2: #e9ecff; /* lavender */
        --bg-3: #e6fff6; /* mint */
        --surface: rgba(255, 255, 255, 0.62);
        --surface-strong: rgba(255, 255, 255, 0.82);
        --border: rgba(255, 255, 255, 0.7);
        --text: #2b2b35;
        --muted: #6b6b78;
        --pink: #f6a9c7;
        --lav: #b9b7ff;
        --mint: #9be7d5;
        --peach: #ffc8a8;
        --gold: #ffd98a;
        --shadow-soft: 0 10px 30px rgba(40, 25, 60, 0.1);
        --shadow-card: 0 12px 28px rgba(40, 25, 60, 0.12);
        --radius-xl: 26px;
        --radius-md: 16px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, "Hiragino Sans",
          "Noto Sans JP", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 8%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 55%),
          linear-gradient(180deg, var(--bg-2), var(--bg-1) 42%, var(--bg-3));
        user-select: none;
        cursor: pointer;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(24px, 4vh, 56px) clamp(28px, 4vw, 72px) clamp(64px, 8vh, 96px);
        transition: opacity 0.35s ease;
      }
      #stage.fading { opacity: 0; }

      /* コーナー見出し */
      .corner-tag {
        font-size: clamp(14px, 1.2vw, 22px);
        font-weight: 900;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .corner-title {
        margin: 0 0 clamp(12px, 2.4vh, 28px);
        font-weight: 950;
        font-size: clamp(30px, 3.4vw, 62px);
        line-height: 1.15;
        text-align: center;
        background: linear-gradient(90deg, #ff86b2, #9c9bff, #69e6c9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 6px 18px rgba(255, 150, 205, 0.14);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: clamp(16px, 2.4vh, 30px) clamp(20px, 2vw, 38px);
        max-width: min(94vw, 1560px);
        width: 100%;
        max-height: 78vh;
        overflow: hidden auto;
      }
      .panel::-webkit-scrollbar { width: 0; }

      /* ステップ表示 */
      [data-step] {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      [data-step].on { opacity: 1; transform: none; }

      /* ============ オープニング ============ */
      .hero-title {
        margin: 0;
        font-weight: 950;
        font-size: clamp(48px, 6.2vw, 110px);
        line-height: 1.12;
        text-align: center;
        background: linear-gradient(90deg, #ff86b2, #9c9bff, #69e6c9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero-sub {
        text-align: center;
        font-weight: 800;
        color: var(--muted);
        font-size: clamp(18px, 1.7vw, 32px);
        margin: 14px 0 0;
      }
      .stat-row {
        display: flex;
        gap: clamp(12px, 1.4vw, 26px);
        justify-content: center;
        margin-top: clamp(22px, 4vh, 46px);
        flex-wrap: wrap;
      }
      .stat-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2.2vh, 26px) clamp(22px, 2.4vw, 46px);
        text-align: center;
        min-width: clamp(180px, 16vw, 300px);
      }
      .stat-card .num {
        font-size: clamp(38px, 3.8vw, 72px);
        font-weight: 950;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #ff86b2, #b58aff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .stat-card .label {
        font-weight: 900;
        color: var(--muted);
        font-size: clamp(14px, 1.2vw, 22px);
        margin-top: 4px;
      }
      .program {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        justify-content: center;
        margin-top: clamp(20px, 3.6vh, 40px);
        max-width: 1100px;
      }
      .program span {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 20px;
        font-weight: 900;
        font-size: clamp(14px, 1.15vw, 22px);
        box-shadow: var(--shadow-soft);
      }

      /* ============ タイムライン ============ */
      .chapters { display: flex; gap: clamp(12px, 1.4vw, 24px); align-items: stretch; }
      .chapter {
        flex: 1;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2vh, 24px) clamp(14px, 1.4vw, 26px);
      }
      .chapter h3 {
        margin: 0 0 10px;
        font-size: clamp(18px, 1.6vw, 30px);
        font-weight: 950;
      }
      .chapter ul { list-style: none; margin: 0; padding: 0; }
      .chapter li {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: clamp(5px, 0.8vh, 9px) 0;
        font-size: clamp(14px, 1.15vw, 21px);
        line-height: 1.45;
        border-bottom: 1px dashed rgba(120, 120, 150, 0.18);
      }
      .chapter li:last-child { border-bottom: 0; }
      .chapter .d {
        font-weight: 950;
        color: #b58aff;
        white-space: nowrap;
        font-size: 0.92em;
      }

      /* ============ コメントカード共通 ============ */
      .quote-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(14px, 2vh, 24px) clamp(18px, 1.8vw, 34px);
        margin: clamp(8px, 1.2vh, 14px) 0;
      }
      .quote-card .who {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .name-pill {
        background: linear-gradient(90deg, rgba(246,169,199,0.35), rgba(185,183,255,0.35));
        border: 1px solid var(--border);
        border-radius: 999px;
        font-weight: 950;
        font-size: clamp(13px, 1.05vw, 20px);
        padding: 3px 14px;
      }
      .stream-tag {
        color: var(--muted);
        font-weight: 800;
        font-size: clamp(12px, 0.95vw, 18px);
      }
      .quote-card .msg {
        font-size: clamp(18px, 1.55vw, 30px);
        font-weight: 800;
        line-height: 1.5;
      }
      .quote-card .note {
        margin-top: 6px;
        color: var(--muted);
        font-weight: 700;
        font-size: clamp(13px, 1vw, 19px);
      }

      /* ============ 初見さん ============ */
      .big-count {
        text-align: center;
        margin: clamp(6px, 1vh, 12px) 0 clamp(10px, 1.6vh, 18px);
      }
      .big-count .n {
        font-size: clamp(64px, 7vw, 130px);
        font-weight: 950;
        background: linear-gradient(180deg, #69e6c9, #9c9bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      .big-count .l { font-weight: 900; color: var(--muted); font-size: clamp(16px, 1.4vw, 26px); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(14px, 1.6vw, 28px); }
      .footnote {
        text-align: center;
        color: var(--muted);
        font-size: clamp(11px, 0.85vw, 16px);
        font-weight: 700;
        margin-top: 8px;
      }

      /* ============ クイズ ============ */
      .quiz-q { margin-bottom: clamp(10px, 1.6vh, 18px); }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(10px, 1.2vh, 16px) clamp(12px, 1.2vw, 20px);
      }
      .choice {
        background: var(--surface-strong);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.2vw, 24px);
        font-weight: 900;
        font-size: clamp(16px, 1.35vw, 26px);
        box-shadow: var(--shadow-soft);
        transition: all 0.4s ease;
      }
      .choice .abc { color: #b58aff; margin-right: 10px; }
      .choice.marked {
        border-color: #69e6c9;
        background: linear-gradient(90deg, rgba(155,231,213,0.45), rgba(255,255,255,0.85));
        transform: scale(1.02);
      }
      .answer-box {
        margin-top: clamp(10px, 1.6vh, 18px);
        background: linear-gradient(90deg, rgba(255,217,138,0.4), rgba(255,255,255,0.7));
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.4vw, 26px);
        font-weight: 800;
        font-size: clamp(15px, 1.25vw, 23px);
        line-height: 1.55;
      }
      .answer-box b { color: #e0669a; }

      /* ============ 盛り上がりTOP3 ============ */
      .burst-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .rank-badge {
        font-size: clamp(24px, 2.2vw, 42px);
        font-weight: 950;
        background: linear-gradient(180deg, #ffd98a, #ffb46b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rank-badge.first { font-size: clamp(30px, 2.8vw, 54px); }
      .burst-title { font-weight: 950; font-size: clamp(20px, 1.9vw, 36px); }
      .burst-meta { color: var(--muted); font-weight: 800; font-size: clamp(13px, 1vw, 19px); }
      .burst-ctx {
        font-weight: 800;
        color: var(--muted);
        font-size: clamp(14px, 1.15vw, 21px);
        margin: 4px 0 10px;
        line-height: 1.5;
      }
      .replay {
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: clamp(8px, 1.2vh, 14px) clamp(12px, 1.2vw, 22px);
      }
      .replay .line {
        display: flex;
        gap: 12px;
        align-items: baseline;
        padding: clamp(2px, 0.45vh, 5px) 0;
        font-size: clamp(14px, 1.2vw, 22px);
        line-height: 1.4;
      }
      .replay .t { color: #b0aec2; font-weight: 800; font-size: 0.82em; white-space: nowrap; }
      .replay .n { font-weight: 950; color: #8f7bd6; white-space: nowrap; }
      .replay .m { font-weight: 800; }

      /* ============ ノミネート / ドラムロール / 大賞 ============ */
      .nominee-label {
        font-weight: 950;
        letter-spacing: 0.24em;
        color: var(--muted);
        font-size: clamp(13px, 1.05vw, 20px);
        margin-bottom: 6px;
      }
      .drum {
        text-align: center;
        font-size: clamp(34px, 3.4vw, 64px);
        font-weight: 950;
        letter-spacing: 0.2em;
        margin: clamp(12px, 2vh, 24px) 0;
        color: #8f7bd6;
      }
      .winner-card {
        background: linear-gradient(120deg, rgba(255,217,138,0.55), rgba(255,200,168,0.4), rgba(255,255,255,0.75));
        border: 2px solid rgba(255, 210, 140, 0.9);
        border-radius: var(--radius-xl);
        box-shadow: 0 16px 40px rgba(255, 170, 90, 0.25);
        padding: clamp(16px, 2.4vh, 30px) clamp(20px, 2vw, 40px);
        margin-top: clamp(10px, 1.6vh, 18px);
        position: relative;
      }
      .winner-card .crown {
        position: absolute;
        top: -clamp(10px, 1vh, 16px);
        top: -14px;
        left: 26px;
        font-size: clamp(26px, 2.2vw, 42px);
        transform: rotate(-12deg);
      }
      .winner-card .prize {
        font-weight: 950;
        letter-spacing: 0.22em;
        color: #d98a2b;
        font-size: clamp(14px, 1.2vw, 22px);
        margin-bottom: 6px;
      }
      .winner-card .msg { font-size: clamp(22px, 2vw, 40px); font-weight: 950; line-height: 1.45; }
      .winner-card .note { margin-top: 8px; color: #8a6a3a; font-weight: 800; font-size: clamp(13px, 1.05vw, 20px); }

      .buzz-word { font-size: clamp(24px, 2.2vw, 44px); font-weight: 950; }
      .buzz-count {
        font-weight: 950;
        color: #e0669a;
        font-size: clamp(14px, 1.15vw, 22px);
        margin-left: 12px;
      }

      /* ============ 手紙 ============ */
      .letter {
        max-width: 1240px;
        font-size: clamp(17px, 1.5vw, 29px);
        font-weight: 800;
        line-height: 1.85;
      }
      .letter p { margin: 0 0 clamp(12px, 2vh, 22px); }
      .letter .sig {
        text-align: right;
        font-weight: 950;
        color: #8f7bd6;
        margin-top: clamp(8px, 1.4vh, 16px);
      }

      /* ============ エンディング ============ */
      .ending-emoji { text-align: center; font-size: clamp(48px, 5vw, 92px); margin-bottom: 8px; }

      /* ============ アバター ============ */
      .av {
        border-radius: 999px;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 3px 8px rgba(40, 25, 60, 0.14);
        background: rgba(255, 255, 255, 0.9);
        flex: none;
        display: inline-grid;
        place-items: center;
        font-weight: 950;
        color: rgba(55, 55, 75, 0.7);
        overflow: hidden;
        user-select: none;
      }
      .av-md { width: clamp(34px, 2.6vw, 50px); height: clamp(34px, 2.6vw, 50px); font-size: clamp(13px, 1vw, 19px); }
      .av-sm { width: clamp(20px, 1.5vw, 28px); height: clamp(20px, 1.5vw, 28px); font-size: 11px; border-width: 1.5px; }
      .av-lg { width: clamp(70px, 6vw, 116px); height: clamp(70px, 6vw, 116px); font-size: clamp(20px, 1.8vw, 34px); border-width: 3px; }
      .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* ============ 常連さん表彰 ============ */
      .podium {
        display: flex;
        gap: clamp(12px, 1.6vw, 28px);
        justify-content: center;
        align-items: stretch;
        margin: clamp(6px, 1vh, 12px) 0 clamp(10px, 1.6vh, 18px);
      }
      .podium-card {
        background: linear-gradient(160deg, rgba(255,238,200,0.75), rgba(255,255,255,0.85));
        border: 2px solid rgba(255, 210, 140, 0.9);
        border-radius: var(--radius-xl);
        box-shadow: 0 14px 34px rgba(255, 170, 90, 0.22);
        padding: clamp(14px, 2vh, 24px) clamp(18px, 1.8vw, 34px);
        text-align: center;
        min-width: clamp(180px, 17vw, 320px);
        position: relative;
      }
      .podium-card .kaikin-badge {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #ffd98a, #ffb46b);
        color: #6b4a12;
        font-weight: 950;
        font-size: clamp(12px, 1vw, 18px);
        letter-spacing: 0.14em;
        border-radius: 999px;
        padding: 4px 18px;
        box-shadow: 0 6px 14px rgba(255, 170, 90, 0.35);
        white-space: nowrap;
      }
      .podium-card .av-lg { margin: 10px auto 8px; }
      .podium-card .p-name { font-weight: 950; font-size: clamp(16px, 1.5vw, 28px); }
      .podium-card .p-stat { color: var(--muted); font-weight: 800; font-size: clamp(12px, 1vw, 18px); margin-top: 4px; }
      .special-row { display: flex; gap: clamp(12px, 1.4vw, 24px); }
      .special-card {
        flex: 1;
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.2vw, 20px);
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.4vw, 26px);
      }
      .special-card .prize {
        font-weight: 950;
        letter-spacing: 0.14em;
        color: #d98a2b;
        font-size: clamp(12px, 1vw, 18px);
      }
      .special-card .p-name { font-weight: 950; font-size: clamp(16px, 1.4vw, 26px); }
      .special-card .p-stat { color: var(--muted); font-weight: 800; font-size: clamp(12px, 1vw, 18px); }
      .reg-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px clamp(12px, 1.4vw, 24px); margin-top: clamp(8px, 1.2vh, 14px); }
      .reg-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 6px 14px;
        font-size: clamp(13px, 1.05vw, 20px);
      }
      .reg-row .r-name { font-weight: 950; white-space: nowrap; }
      .reg-row .r-stat { color: #b58aff; font-weight: 950; white-space: nowrap; }
      .reg-row .r-note { color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* ============ コントローラ(?role=ctrl) ============ */
      body.ctrl { cursor: default; overflow: hidden; }
      body.ctrl #stage, body.ctrl #progress, body.ctrl #hint { display: none; }
      #ctrl-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      }
      body.ctrl #ctrl-ui { display: flex; }
      #ctrl-ui .c-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 950;
        color: var(--muted);
        font-size: 14px;
      }
      #ctrl-ui .c-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      #ctrl-ui .c-dot { width: 10px; height: 10px; border-radius: 999px; background: #ccc; }
      #ctrl-ui .c-dot.ok { background: #52d3ab; }
      #ctrl-ui .c-dot.ng { background: #f08aa0; }
      #ctrl-ui .c-now {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        padding: 14px 18px;
        text-align: center;
      }
      #ctrl-ui .c-corner { font-weight: 950; font-size: clamp(20px, 6vw, 30px); }
      #ctrl-ui .c-step { color: var(--muted); font-weight: 800; font-size: 14px; margin-top: 2px; }
      #ctrl-ui .c-main { display: flex; gap: 12px; flex: none; }
      #ctrl-ui button {
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-card);
        font-weight: 950;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #ctrl-ui button:active { transform: scale(0.97); }
      #ctrl-ui .c-back {
        flex: 1;
        height: 26vh;
        font-size: clamp(18px, 5vw, 26px);
        background: var(--surface-strong);
        color: var(--muted);
      }
      #ctrl-ui .c-next {
        flex: 2.4;
        height: 26vh;
        font-size: clamp(26px, 8vw, 40px);
        color: #fff;
        background: linear-gradient(120deg, #ff86b2, #9c9bff);
        border: 0;
      }
      #ctrl-ui .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
      #ctrl-ui .c-grid button {
        padding: 12px 10px;
        font-size: clamp(13px, 3.6vw, 17px);
        background: rgba(255, 255, 255, 0.7);
        text-align: left;
      }
      #ctrl-ui .c-grid button.act { border-color: #ff86b2; background: linear-gradient(90deg, rgba(246,169,199,0.3), rgba(255,255,255,0.85)); }
      #ctrl-ui .c-extra { display: flex; gap: 8px; }
      #ctrl-ui .c-extra button { flex: 1; padding: 12px; font-size: 15px; background: rgba(255, 255, 255, 0.7); }
      #ctrl-ui .c-banner {
        background: linear-gradient(90deg, rgba(255,200,168,0.5), rgba(255,255,255,0.8));
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.6;
        padding: 10px 14px;
        display: none;
      }
      #ctrl-ui .c-banner.show { display: block; }

      /* ============ 進行UI ============ */
      #progress {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);

      // ページ内表示名 → AVATARSキー の別名
      const AVATAR_ALIAS = { "aoi1685": "aoi" };

      /* ============================ 基盤 ============================ */
      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      const e = escapeHtml;

      function initials(name) {
        const s = String(name).trim().replace(/…+$/, "");
        return Array.from(s).slice(0, 2).join("") || "？";
      }
      function avatarKey(name) {
        const n = String(name).replace(/^@/, "").replace(/ さん$/, "").trim();
        return AVATAR_ALIAS[n] || n;
      }
      function avatarHtml(name, size) {
        const key = avatarKey(name);
        const src = typeof AVATARS !== "undefined" ? AVATARS[key] : null;
        const cls = `av ${size || "av-md"}`;
        if (src) return `<span class="${cls}"><img src="${src}" alt="" loading="lazy" decoding="async" /></span>`;
        return `<span class="${cls}">${e(initials(key))}</span>`;
      }

      function quoteCard(o, step, extra) {
        return `
          <div class="quote-card" ${step != null ? `data-step="${step}"` : ""}>
            <div class="who">
              ${avatarHtml(o.name, "av-md")}
              <span class="name-pill">${e(o.name)}</span>
              ${o.date ? `<span class="stream-tag">${e(o.date)}</span>` : ""}
              ${extra ? `<span class="stream-tag">${e(extra)}</span>` : ""}
            </div>
            <div class="msg">「${e(o.msg)}」</div>
            ${o.note ? `<div class="note">${e(o.note)}</div>` : ""}
          </div>`;
      }

      /* ======================== 各シーン描画 ======================== */
      const D = REVIEW_DATA;

      function renderOpening() {
        return `
          <div data-step="0" class="on-load">
            <h1 class="hero-title">${e(D.meta.title)}</h1>
            <p class="hero-sub">${e(D.meta.periodLabel)}　${e(D.meta.sub)}</p>
          </div>
          <div class="stat-row" data-step="1">
            ${D.meta.stats.map((s) => `
              <div class="stat-card"><div class="num">${e(s.n)}</div><div class="label">${e(s.l)}</div></div>`).join("")}
          </div>
          <div class="program" data-step="2">
            ${D.meta.program.map((p) => `<span>${e(p)}</span>`).join("")}
          </div>`;
      }

      function renderTimeline() {
        return `
          <div class="corner-tag">CORNER 1</div>
          <h2 class="corner-title">今月の軌跡</h2>
          <div class="panel">
            <div class="chapters">
              ${D.timeline.map((ch, i) => `
                <div class="chapter" data-step="${i + 1}">
                  <h3>${e(ch.emoji)} ${e(ch.name)}</h3>
                  <ul>${ch.items.map((it) => `<li><span class="d">${e(it.d)}</span><span>${e(it.t)}</span></li>`).join("")}</ul>
                </div>`).join("")}
            </div>
          </div>`;
      }

      function renderNewcomers() {
        const f = D.newcomers.featured;
        return `
          <div class="corner-tag">CORNER 2 - リスナー表彰 ①</div>
          <h2 class="corner-title">初見さんいらっしゃい</h2>
          <div class="panel">
            <div class="big-count" data-step="1">
              <span class="n">${D.newcomers.count}</span><span class="l">人</span>
              <div class="l">今月はじめてコメントしてくれました 👏</div>
            </div>
            <div class="grid-2">
              ${f.map((o, i) => quoteCard(o, i + 2, "初コメント")).join("")}
            </div>
            <div class="footnote" data-step="2">${e(D.newcomers.footnote)}</div>
          </div>`;
      }

      function renderRegulars() {
        const R = D.regulars;
        return `
          <div class="corner-tag">CORNER 2 - リスナー表彰 ②</div>
          <h2 class="corner-title">常連さん表彰</h2>
          <div class="panel">
            <div data-step="1">
              <div class="nominee-label" style="text-align:center">🏆 皆勤賞 — 35配信ぜんぶ来てくれました</div>
              <div class="podium">
                ${R.kaikin.map((p) => `
                  <div class="podium-card">
                    <div class="kaikin-badge">皆勤賞</div>
                    ${avatarHtml(p.name, "av-lg")}
                    <div class="p-name">${e(p.name)}</div>
                    <div class="p-stat">${e(p.stat)}</div>
                    <div class="p-stat">${e(p.note)}</div>
                  </div>`).join("")}
              </div>
            </div>
            <div class="special-row" data-step="2">
              ${R.specials.map((p) => `
                <div class="special-card">
                  ${avatarHtml(p.name, "av-lg")}
                  <div>
                    <div class="prize">👑 ${e(p.prize)}</div>
                    <div class="p-name">${e(p.name)}</div>
                    <div class="p-stat">${e(p.stat)} ・ ${e(p.note)}</div>
                  </div>
                </div>`).join("")}
            </div>
            <div data-step="3">
              <div class="reg-list">
                ${R.list.map((p) => `
                  <div class="reg-row">
                    ${avatarHtml(p.name, "av-sm")}
                    <span class="r-name">${e(p.name)}</span>
                    <span class="r-stat">${e(p.stat)}</span>
                    <span class="r-note">${e(p.note)}</span>
                  </div>`).join("")}
              </div>
              <div class="footnote">${e(R.note)}</div>
            </div>
          </div>`;
      }

      // クイズ: 1問あたり 3ステップ(問題 / 選択肢 / 正解)
      function renderQuiz(qIndex) {
        const q = D.quiz[qIndex];
        const abc = ["A", "B", "C", "D"];
        return `
          <div class="corner-tag">CORNER 3 - Q${qIndex + 1}/${D.quiz.length}</div>
          <h2 class="corner-title">どの配信でしょうクイズ</h2>
          <div class="panel">
            <div class="quiz-q" data-step="0">
              ${quoteCard({ name: q.who, msg: q.msg }, null)}
              <div class="burst-ctx">このコメントが飛び出したのは、どの配信でしょう？(チャットで回答してね)</div>
            </div>
            <div class="choices" data-step="1">
              ${q.choices.map((c, i) => `
                <div class="choice" ${i === q.answerIndex ? 'data-mark="2"' : ""}>
                  <span class="abc">${abc[i]}</span>${e(c)}
                </div>`).join("")}
            </div>
            <div class="answer-box" data-step="2">
              <b>正解: ${abc[q.answerIndex]} ${e(q.choices[q.answerIndex])}</b><br />${e(q.expl)}
            </div>
          </div>`;
      }

      // 盛り上がり: 1ランクあたり 2ステップ(タイトル / リプレイ)
      function renderBurst(bIndex) {
        const b = D.bursts[bIndex];
        return `
          <div class="corner-tag">CORNER 4</div>
          <h2 class="corner-title">盛り上がりの瞬間 TOP3</h2>
          <div class="panel">
            <div data-step="0">
              <div class="burst-head">
                <span class="rank-badge ${b.rank === 1 ? "first" : ""}">${b.rank === 1 ? "👑 " : ""}第${b.rank}位</span>
                <span class="burst-title">${e(b.title)}</span>
              </div>
              <div class="burst-meta">${e(b.meta)}</div>
              <div class="burst-ctx">${e(b.ctx)}</div>
            </div>
            <div class="replay" data-step="1">
              ${b.replay.map((l, i) => `
                <div class="line" data-step="1" style="transition-delay:${Math.min(i * 0.28, 3.2)}s">
                  <span class="t">${e(l.t)}</span>${avatarHtml(l.n, "av-sm")}<span class="n">${e(l.n)}</span><span class="m">${e(l.m)}</span>
                </div>`).join("")}
              ${b.note ? `<div class="footnote" data-step="1" style="transition-delay:3.4s">${e(b.note)}</div>` : ""}
            </div>
          </div>`;
      }

      function renderBuzzwords() {
        const B = D.buzzwords;
        const w = B.nominees[B.winnerIndex];
        return `
          <div class="corner-tag">CORNER 5</div>
          <h2 class="corner-title">今月の流行語大賞</h2>
          <div class="panel">
            <div class="nominee-label" data-step="0">NOMINEES</div>
            ${B.nominees.map((n, i) => `
              <div class="quote-card" data-step="${i + 1}">
                <div class="who"><span class="buzz-word">${e(n.word)}</span><span class="buzz-count">${e(n.count)}</span></div>
                <div class="note">${e(n.ex)}</div>
              </div>`).join("")}
            <div class="drum" data-step="${B.nominees.length + 1}">大賞は・・・・・・</div>
            <div class="winner-card" data-step="${B.nominees.length + 2}">
              <div class="crown">👑</div>
              <div class="prize">2026年8月 流行語大賞</div>
              <div class="msg">${e(w.word)}</div>
              <div class="note">${e(B.comment)}</div>
            </div>
          </div>`;
      }

      function renderMeigen() {
        return `
          <div class="corner-tag">CORNER 6</div>
          <h2 class="corner-title">名言・いい話アワード</h2>
          <div class="panel">
            ${D.meigen.map((m, i) => quoteCard(m, i + 1)).join("")}
          </div>`;
      }

      function renderFunny() {
        const F = D.funny;
        const gp = F.grandPrix;
        const w = gp.nominees[gp.winnerIndex];
        const base = F.categories.length; // 部門のステップ数
        return `
          <div class="corner-tag">CORNER 7 - グランドフィナーレ</div>
          <h2 class="corner-title">おもしろコメント大賞</h2>
          <div class="panel">
            <div class="grid-2">
              ${F.categories.map((c, i) => `
                <div class="quote-card" data-step="${i + 1}">
                  <div class="who">
                    <span class="name-pill">${e(c.emoji)} ${e(c.cat)}</span>
                    ${avatarHtml(c.name, "av-md")}
                    <span class="stream-tag">${e(c.name)} ・ ${e(c.date)}</span>
                  </div>
                  <div class="msg">「${e(c.msg)}」</div>
                </div>`).join("")}
            </div>
            <div class="nominee-label" data-step="${base + 1}" style="margin-top:14px">GRAND PRIX NOMINEES</div>
            ${gp.nominees.map((n, i) => quoteCard(n, base + 2 + i)).join("")}
            <div class="drum" data-step="${base + 2 + gp.nominees.length}">おもしろコメント大賞は・・・・・・</div>
            <div class="winner-card" data-step="${base + 3 + gp.nominees.length}">
              <div class="crown">👑</div>
              <div class="prize">2026年8月 おもしろコメント大賞</div>
              <div class="msg">「${e(w.msg)}」</div>
              <div class="note" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                ${avatarHtml(w.name, "av-md")}<span>${e(w.name)} ・ ${e(w.date)}<br />${e(gp.comment)}</span>
              </div>
            </div>
          </div>`;
      }

      function renderLetter() {
        return `
          <div class="corner-tag">CORNER 8</div>
          <h2 class="corner-title">Claude からの手紙</h2>
          <div class="panel letter">
            ${D.letter.paragraphs.map((p, i) => `<p data-step="${i + 1}">${e(p)}</p>`).join("")}
            <div class="sig" data-step="${D.letter.paragraphs.length + 1}">${e(D.letter.sig)}</div>
          </div>`;
      }

      function renderEnding() {
        return `
          <div data-step="0">
            <div class="ending-emoji">${e(D.ending.emoji)}</div>
            <h1 class="hero-title">${e(D.ending.title)}</h1>
            <p class="hero-sub">${e(D.ending.sub)}</p>
          </div>
          <p class="hero-sub" data-step="1" style="font-size:clamp(14px,1.2vw,22px)">${e(D.ending.ps)}</p>`;
      }

      /* ======================== シーン定義 ======================== */
      const SCENES = [];
      SCENES.push({ total: 2, render: renderOpening });
      SCENES.push({ total: D.timeline.length, render: renderTimeline });
      SCENES.push({ total: D.newcomers.featured.length + 1, render: renderNewcomers });
      SCENES.push({ total: 3, render: renderRegulars });
      D.quiz.forEach((_, i) => SCENES.push({ total: 2, render: () => renderQuiz(i) }));
      D.bursts.forEach((_, i) => SCENES.push({ total: 1, render: () => renderBurst(i) }));
      SCENES.push({
        total: D.buzzwords.nominees.length + 2,
        render: renderBuzzwords,
        confettiAt: D.buzzwords.nominees.length + 2,
      });
      SCENES.push({ total: D.meigen.length, render: renderMeigen });
      SCENES.push({
        total: D.funny.categories.length + 3 + D.funny.grandPrix.nominees.length,
        render: renderFunny,
        confettiAt: D.funny.categories.length + 3 + D.funny.grandPrix.nominees.length,
        confettiBig: true,
      });
      SCENES.push({ total: D.letter.paragraphs.length + 1, render: renderLetter });
      SCENES.push({ total: 1, render: renderEnding, confettiAt: 0 });

      // 進行ドット用: シーンを10コーナーに割当(リスナー表彰2画面・クイズ4画面・TOP3 3画面をまとめる)
      const DOT_OF_SCENE = [];
      {
        let dot = 0;
        SCENES.forEach((s, i) => {
          if (i === 0) dot = 0; // opening
          else if (i === 1) dot = 1; // timeline
          else if (i <= 3) dot = 2; // newcomers + regulars
          else if (i <= 3 + D.quiz.length) dot = 3; // quiz
          else if (i <= 3 + D.quiz.length + D.bursts.length) dot = 4; // bursts
          else dot = 5 + (i - (4 + D.quiz.length + D.bursts.length)); // 5..9
          DOT_OF_SCENE.push(dot);
        });
      }
      const DOT_COUNT = 10;
      const DOT_LABELS = [
        "オープニング",
        "今月の軌跡",
        "リスナー表彰(初見さん/常連さん)",
        "どの配信でしょうクイズ",
        "盛り上がりTOP3",
        "流行語大賞",
        "名言・いい話",
        "おもしろコメント大賞",
        "Claudeからの手紙",
        "エンディング",
      ];

      /* ======================== ステート機械 ======================== */
      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const hint = document.getElementById("hint");
      let sceneIdx = 0;
      let stepIdx = 0;
      let interacted = false;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function buildDots() {
        progress.innerHTML = Array.from({ length: DOT_COUNT }, () => '<span class="dot"></span>').join("");
      }
      function updateDots() {
        const cur = DOT_OF_SCENE[sceneIdx];
        [...progress.children].forEach((d, i) => d.classList.toggle("act", i === cur));
      }

      function applySteps() {
        let newest = null;
        stage.querySelectorAll("[data-step]").forEach((el) => {
          const on = Number(el.dataset.step) <= stepIdx;
          el.classList.toggle("on", on);
          if (on && (!newest || Number(el.dataset.step) >= Number(newest.dataset.step))) newest = el;
        });
        // 長いパネルでも、いま出た要素が見えるようにスクロール
        if (newest) newest.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
        stage.querySelectorAll("[data-mark]").forEach((el) => {
          el.classList.toggle("marked", Number(el.dataset.mark) <= stepIdx);
        });
        const s = SCENES[sceneIdx];
        if (s.confettiAt != null && stepIdx === s.confettiAt) {
          spawnConfetti(s.confettiBig ? 160 : 90);
        }
      }

      function renderScene() {
        stage.innerHTML = SCENES[sceneIdx].render();
        updateDots();
        // 初期ステップ(0)を即時表示
        requestAnimationFrame(() => requestAnimationFrame(applySteps));
      }

      function gotoScene(i, step) {
        sceneIdx = Math.max(0, Math.min(SCENES.length - 1, i));
        stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, step ?? 0));
        stage.classList.add("fading");
        setTimeout(() => {
          renderScene();
          stage.classList.remove("fading");
        }, reduceMotion ? 0 : 280);
        onStateChanged();
      }

      function advance() {
        dismissHint();
        if (stepIdx < SCENES[sceneIdx].total) {
          stepIdx++;
          applySteps();
          onStateChanged();
        } else if (sceneIdx < SCENES.length - 1) {
          gotoScene(sceneIdx + 1, 0);
        }
      }
      function back() {
        dismissHint();
        if (stepIdx > 0) {
          stepIdx--;
          applySteps();
          onStateChanged();
        } else if (sceneIdx > 0) {
          const prev = sceneIdx - 1;
          gotoScene(prev, SCENES[prev].total);
        }
      }
      function dismissHint() {
        if (!interacted) {
          interacted = true;
          setTimeout(() => hint.classList.add("gone"), 4000);
        }
      }

      /* ======================== 紙吹雪 ======================== */
      const COLORS = ["#f6a9c7", "#b9b7ff", "#9be7d5", "#ffc8a8", "#ffd98a", "#dbe6ff"];
      function spawnConfetti(count) {
        if (reduceMotion) return;
        const layer = document.getElementById("confetti-layer");
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * 100 + "vw";
          c.style.background = COLORS[(Math.random() * COLORS.length) | 0];
          c.style.width = 8 + Math.random() * 10 + "px";
          c.style.height = 14 + Math.random() * 12 + "px";
          c.style.animationDuration = 3.6 + Math.random() * 2.6 + "s";
          c.style.animationDelay = Math.random() * 0.9 + "s";
          layer.appendChild(c);
          setTimeout(() => c.remove(), 7500);
        }
      }

      /* ======================== 入力 ======================== */
      window.addEventListener("pointerdown", (ev) => {
        if (ev.button === 2) return;
        advance();
      });
      window.addEventListener("contextmenu", (ev) => {
        ev.preventDefault();
        back();
      });
      window.addEventListener("keydown", (ev) => {
        const k = ev.key;
        if (k === "Enter" || k === " " || k === "ArrowRight" || k === "ArrowDown") {
          ev.preventDefault();
          advance();
        } else if (k === "Backspace" || k === "ArrowLeft" || k === "ArrowUp") {
          ev.preventDefault();
          back();
        } else if (/^[0-9]$/.test(k)) {
          // 数字キー: コーナー頭出し(リハーサル用)
          const dot = Number(k);
          const target = DOT_OF_SCENE.indexOf(dot);
          if (target >= 0) gotoScene(target, 0);
        }
      });

      // 検証・リハーサル用フック
      window.__jump = (i, step) => gotoScene(i, step ?? 0);
      window.__sceneCount = SCENES.length;

      /* =========================================================
         リモート同期(Firestore)
         - 無指定: 従来どおりローカル操作のみ(SDKは読み込まない)
         - ?role=view : Firestoreの状態に追従(スマホOBSオーバーレイ用)
         - ?role=ctrl : スマホ用コントローラ(進行操作を配信画面へ送る)
         - ?auto=秒数 : 自動進行(同期なしのフォールバック)

         ▼▼ セットアップ(1回だけ) ▼▼
         1. Firebaseコンソール → Firestore Database を作成
         2. ルールに monthlyReview コレクションの read/write 許可を追加
         3. プロジェクト設定 → マイアプリ → Webアプリを追加し、
            表示された firebaseConfig を下の FIREBASE_CONFIG に貼り付け
         ========================================================= */
      const FIREBASE_CONFIG = null; /* ← ここに { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." } を貼る */
      const SYNC_COLLECTION = "monthlyReview";
      const SYNC_DOC = "202608-kx7f3q"; // 簡易ガード用トークン入りID

      const params = new URLSearchParams(location.search);
      const ROLE = params.get("role"); // "ctrl" | "view" | null
      const AUTO_SEC = Math.max(0, Number(params.get("auto")) || 0);

      let publishFn = null; // ctrl時のみセット
      let applyingRemote = false;
      let lastConfetti = 0;

      function onStateChanged() {
        updateCtrlLabels();
        if (publishFn && !applyingRemote) {
          publishFn({ scene: sceneIdx, step: stepIdx, ts: Date.now(), confetti: lastConfetti }).catch(() => setCtrlStatus(false, "送信失敗"));
        }
      }

      async function initSync(onRemote) {
        if (!FIREBASE_CONFIG) throw new Error("FIREBASE_CONFIG未設定");
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js");
        const fsm = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
        const app = initializeApp(FIREBASE_CONFIG);
        const db = fsm.getFirestore(app);
        const ref = fsm.doc(db, SYNC_COLLECTION, SYNC_DOC);
        fsm.onSnapshot(
          ref,
          (snap) => { if (snap.exists()) onRemote(snap.data()); setCtrlStatus(true); },
          () => setCtrlStatus(false, "接続エラー")
        );
        return (data) => fsm.setDoc(ref, data);
      }

      /* ---------- コントローラUI ---------- */
      const cEls = {
        dot: document.getElementById("c-dot"),
        statusText: document.getElementById("c-status-text"),
        banner: document.getElementById("c-banner"),
        corner: document.getElementById("c-corner"),
        step: document.getElementById("c-step"),
        next: document.getElementById("c-next"),
        back: document.getElementById("c-back"),
        grid: document.getElementById("c-grid"),
        confetti: document.getElementById("c-confetti"),
        top: document.getElementById("c-top"),
      };
      function setCtrlStatus(ok, text) {
        if (ROLE !== "ctrl") return;
        cEls.dot.className = "c-dot " + (ok ? "ok" : "ng");
        cEls.statusText.textContent = text || (ok ? "同期中" : "未接続");
      }
      function updateCtrlLabels() {
        if (ROLE !== "ctrl") return;
        const dot = DOT_OF_SCENE[sceneIdx];
        cEls.corner.textContent = DOT_LABELS[dot];
        const local = SCENES.map((s, i) => (DOT_OF_SCENE[i] === dot ? i : null)).filter((v) => v != null);
        const pagePos = local.indexOf(sceneIdx) + 1;
        cEls.step.textContent = `画面 ${pagePos}/${local.length} ・ ステップ ${stepIdx}/${SCENES[sceneIdx].total} ・ 全体 ${sceneIdx + 1}/${SCENES.length}`;
        [...cEls.grid.children].forEach((b, i) => b.classList.toggle("act", i === dot));
      }
      function initCtrlUi() {
        document.body.classList.add("ctrl");
        cEls.next.addEventListener("click", advance);
        cEls.back.addEventListener("click", back);
        cEls.top.addEventListener("click", () => gotoScene(0, 0));
        cEls.confetti.addEventListener("click", () => {
          lastConfetti = Date.now();
          onStateChanged();
        });
        DOT_LABELS.forEach((label, dot) => {
          const b = document.createElement("button");
          b.textContent = `${dot}. ${label}`;
          b.addEventListener("click", () => gotoScene(DOT_OF_SCENE.indexOf(dot), 0));
          cEls.grid.appendChild(b);
        });
        updateCtrlLabels();
      }

      /* ---------- 起動 ---------- */
      buildDots();
      renderScene();

      if (ROLE === "ctrl") {
        initCtrlUi();
        initSync((data) => {
          // 他の操作元(PC等)の状態も反映してコントローラ表示を同期
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          sceneIdx = Math.max(0, Math.min(SCENES.length - 1, data.scene ?? 0));
          stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
          lastConfetti = data.confetti || lastConfetti;
          updateCtrlLabels();
          applyingRemote = false;
        })
          .then((pub) => { publishFn = pub; setCtrlStatus(true); onStateChanged(); })
          .catch(() => {
            setCtrlStatus(false, "設定が必要");
            cEls.banner.textContent =
              "Firestore が未設定です。Firebaseコンソールで ①Firestore作成 ②Webアプリ登録 → firebaseConfig をこのHTMLの FIREBASE_CONFIG に貼ってデプロイしてください。";
            cEls.banner.classList.add("show");
          });
      } else if (ROLE === "view") {
        hint.classList.add("gone");
        initSync((data) => {
          if (typeof data.confetti === "number" && data.confetti > lastConfetti) {
            if (lastConfetti !== 0) spawnConfetti(140);
            lastConfetti = data.confetti;
          }
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          if (data.scene !== sceneIdx) {
            gotoScene(data.scene ?? 0, data.step ?? 0);
          } else {
            stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
            applySteps();
          }
          applyingRemote = false;
        }).catch(() => {
          /* 未設定・接続不可: ローカル操作のまま */
        });
      }

      if (AUTO_SEC > 0) setInterval(advance, AUTO_SEC * 1000);
    </script>
  </body>
</html>
