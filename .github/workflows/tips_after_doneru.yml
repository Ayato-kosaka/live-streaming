name: 投げ銭の台帳を入れ直す

# Doneru の取り込みが終わったあとに、**Doneru の投げ銭に依存する3本を、
# 取り込みと同じ順でもう一度回す。**
#
#     1. doneru_supporters.py  対応表（`islandDonors`）と名簿（`nordicDays`）
#     2. island_tips.py        投げ銭の台帳（`islandTips`）
#     3. island_cards.py       カード（`islandCards`）
#
# **順番は `schedule_fetch_chat.yml` の `island_stats` に合わせてある**
# （あちらは 1 を最後に置いているが、それは「落ちたら後ろが止まる」のを
# 避けるための置き場所で、依存の向きは 1 → 2。理由は下の各ステップに書いた）。
#
# ## なぜ要るか — 順番を、両方とも定時実行の運に任せていた
#
# この3本を回しているのは `schedule_fetch_chat.yml`（Fetch YouTube Chat Data）の
# `island_stats` ジョブで、**このリポジトリで1か所しかない**。
# ところがその台帳が読む BigQuery の `doneru_donations` を埋めるのは
# **別のワークフロー**（`fetch_doneru_donations.yml`）。
#
# どちらも定時実行で、指定した時刻からの遅れが **1時間49分〜3時間32分**
# ばらつく（直近12回の実測。`CLAUDE.md`）。指定は 20:00 と 20:30 で30分しか
# 離れていないので、**どちらが先に走るかは毎晩の運。**
#
# 2026-09-16 は負けた晩だった（UTC）:
#
#     22:32  Fetch YouTube Chat Data    ← この中で台帳を作っている
#     23:11  Fetch Doneru Donations     ← 台帳の材料を入れている
#
# 台帳を作るほうが、材料を入れるほうより **39分早く走った。**
# 台帳は毎晩7日ぶんを引き直すので失われはしないが、**投げてくれた晩に
# カードが出ず、翌朝になる。** `/cards` は「その日の写真が、そのまま
# 置いてあります」と言っているので、それは嘘になる。
#
# **赤くならない。** 両方とも緑で終わる。違うのは、投げてくれた人の手元に
# その晩カードが在るかどうかだけ。
#
# ## 直しかた — 材料が入ったあとに、読むほうをもう一度回す
#
# 取り込みのワークフローに1行足すのではなく、**別のワークフローにして
# `workflow_run` で繋ぐ。** `schedule_fetch_chat.yml` は最後の step が
# `YOUTUBE_COOKIES` の Secret を書き換えるので、あれを触ると毎晩の取り込みが
# 死ぬ（`rebake.yml` を別立てにしてあるのと同じ理由）。
#
# **`conclusion` は見ない。** `Fetch Doneru Donations` は落ちた回にも
# `doneru_health.py` まで走るし、`Fetch YouTube Chat Data` のほうは
# 「表に無い どねID が投げ銭してきた」ときに最後の step が `exit 1` で終わる
# （あれは失敗ではなく**あやとへの呼び出し**で、BigQuery には入っている）。
# 成功のときだけ繋ぐと、**呼び出しの出た晩だけ台帳が古いまま**になる。
#
# **繋ぎはワークフローの `name:` で解決される。** あちらの名前を書き換えると
# 黙って切れる（エラーにならない。**走らなくなるだけ**で、赤も出ない）。
# 下の cron はそのときの保険。
#
# 繋ぎが生きているかは、`Fetch Doneru Donations` を **`probe: true`** で
# 押せば確かめられる。あちらは1バイトも書かずに終わるので、**本番を
# 汚さずに「繋いだ先が起きるか」だけを見られる。**
#
# ## 同じ晩に2回走っても、台帳も対応表も動かない
#
# 毎晩 `schedule_fetch_chat.yml` の中で1回、ここでもう1回走ることになるが、
# **2回目で行は増えない・消えない・上書きされない。**
#
#   - 対応表（`islandDonors`）に書くのは**表に無い どねID だけ**
#     （`doneru_supporters.py` の `known is None` の枝）。2回目はもう表に
#     在るので、`state` も `firstSeenAt` も触らない
#   - 名簿（`nordicDays`）は `merge()` が channelId で重複を潰す
#
#   - 書類IDは `sourceEventId` の SHA-1（`island_tips.py` の `doc_id`）。
#     同じ寄付は毎回同じ書類に当たる
#   - `same()` が11欄を見て、**同じなら書かない**（`changed` から外れる）
#   - 書くときも `batch.set(..., merge=True)` だけで、消す道が1本も無い
#   - カードのほうも鍵が `{画像ID}__{チャンネルID}` で決まり、既にある書類の
#     `x/y/rot/scale` には触らない（**本人が動かしたカードが元に戻らない**）
#
# ## 誰にカードが配られるかは、1ミリも変えていない
#
# 変えるのは**いつ台帳に入るか**だけ。`doneru_supporters.py` も `island_tips.py` も
# `island_cards.py` も `functions/src/streamEvents.ts` も1バイト触っていない。
# カードが渡るのは、いままでどおり**その日に投げ銭してくれた人**
# （`docs/island-cards.md`、`docs/island-incident-2026-09-14-cards.md`）。
#
# ## ログ
#
# このリポジトリは公開で、Actions のログも誰でも読める。
# 1人ずつの明細は `python/logsafe.py` が公開の場では1行も出さない
# （`GITHUB_ACTIONS` を見ている）。ここで出るのは件数だけ。

on:
  # **cron は保険。** 繋ぎが本体（`workflow_run`）。
  # 取り込みの実測（21:49〜23:32 UTC）より後ろに置く。ここが2時間遅れても
  # 03:30 UTC なので、どちらに転んでも取り込みの後ろに入る。
  # `rebake.yml` と同じ分に重ねる理由が無いので30分ずらしてある。
  schedule:
    - cron: "30 1 * * *"

  # 繋ぎ先は**材料を入れるほう**（`Fetch Doneru Donations`）。
  # `Fetch YouTube Chat Data` は自分の中で台帳を作ってから終わるので、
  # あちらが後になった晩は、その時点でもう新しい。繋ぐ必要が無い。
  workflow_run:
    workflows: ["Fetch Doneru Donations"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "見るだけ（Firestore に1バイトも書かない）。まずこのまま押す"
        required: false
        default: true
        type: boolean

# 台帳とカードを2本が同時に書かないように1本ずつ
concurrency:
  group: island-tips
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tips:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # cron と繋ぎで来たぶんは、押す人がいない。入力も空で来る
      # （`inputs.*` が空文字になる）。**ここで決めて env に置き、以降は
      # env だけを見る。** `!inputs.dry_run` を直接書くと、空文字が false と
      # 読まれて**たまたま**動く形になる（`rebake.yml` と同じ手当て）。
      - name: 今回の押しかたを決める
        env:
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_run" ]; then
            echo "TIPS_DRY=0" >> "$GITHUB_ENV"
            echo "毎晩ぶん（$EVENT）: 台帳とカードを入れ直します"
          else
            if [ "$IN_DRY" = "false" ]; then
              echo "TIPS_DRY=0" >> "$GITHUB_ENV"
            else
              echo "TIPS_DRY=1" >> "$GITHUB_ENV"
            fi
            echo "手で押したぶん: dry_run=$IN_DRY"
          fi

      # **いちばん先に置く。** 台帳（`island_tips.py`）は Doneru のぶんを
      # `islandDonors` を通してチャンネルIDに直す。対応表が古いまま台帳を
      # 作ると、**その晩に初めて投げてくれた人のぶんが誰にも紐付かない。**
      # `schedule_fetch_chat.yml` の中でも「辞書 → 台帳」の順になっている
      # （あちらの `island_channels.py` のコメント）。ここも同じ向きに揃える。
      #
      # ## `state: "new"` を書くのはここだけ
      #
      # 紐付け待ちを issue に映す係（`donor_calls.py`）が数えているのは
      # `islandDonors` の `state: "new"` で、それを置くのはこのスクリプト。
      # 昨夜これを繋がなかったので、**2026-09-17 は「紐付け待ち 0人」と
      # 出たまま、台帳のほうは「紐付いていないぶん 1件」と言っていた。**
      # カードが渡らなかった人がいるのに、見張りが 0人 と言っていた。
      #
      # ## 同じ晩に2回走っても、名簿は動かない
      #
      #   - `islandDonors` に書くのは **対応表に無い どねID だけ**
      #     （`known is None` の枝）。2回目はもう表に在るので、
      #     `state` も `firstSeenAt` も**上書きしない**。
      #     あやとが紐付けたあと（`linked`）に走っても `new` に戻らない
      #   - `nordicDays` は `merge(old, people)` が channelId で重複を潰す。
      #     同じ人は2回並ばない。`set(..., merge=True)` だけで消す道が無い
      #   - 新規がいない晩は BigQuery が1本増えるだけ（`fetch_first` は
      #     新規が出た晩しか呼ばれない）
      #
      # ## 落ちても、後ろを止めない（**ここだけ取り込みと変える**）
      #
      # `schedule_fetch_chat.yml` はこれを**いちばん最後**に置いて、
      # 落ちたらそこで終わる形にしてある。**あちらは後ろに何も無いから
      # それでよい。** ここは先頭なので、同じ扱いにすると
      # **「紐付け待ちが1人いる晩は、台帳もカードも走らない」**——
      # このワークフローを作った目的そのものが消える。
      #
      # 終了コードは向こうの docstring どおり 0 / 1 / 2 の3つ。
      # **1（紐付けてほしい）では赤くしない。** それを赤で知らせるのを
      # やめるために `donor_calls.py` を作ってあり、issue のほうに出る。
      # **2（元データが読めない）は赤くする。** あれは仕組みが壊れている
      # ほうなので、下の「元データが読めなかったか」で最後に落とす。
      - name: Doneru の投げ銭を名簿に足す
        run: |
          set -uo pipefail
          rc=0
          if [ "$TIPS_DRY" = "1" ]; then
            python python/doneru_supporters.py --days 3 --dry-run || rc=$?
          else
            python python/doneru_supporters.py --days 3 || rc=$?
          fi
          echo "DONERU_RC=$rc" >> "$GITHUB_ENV"
          echo "終了コード: $rc（0=ぜんぶ紐付いている / 1=紐付けてほしい / 2=元データが読めない）"

      # 呼び方は `schedule_fetch_chat.yml` の `island_stats` と同じ
      # （引数なし＝直近7日ぶん）。**2か所で違う窓を引かない。**
      - name: 投げ銭の台帳を更新
        run: |
          set -euo pipefail
          if [ "$TIPS_DRY" = "1" ]; then
            python python/island_tips.py --dry-run
          else
            python python/island_tips.py
          fi

      # **台帳のあとに置く。** 台帳に入っただけではカードは1枚もできない。
      # 作るのはここ（`islandTips` × `islandStreamEventImage` の `role: "card"`）と、
      # 画像を貼ったときの `functions/src/streamEvents.ts` の `mintForImage` の2か所で、
      # 台帳が新しくなった晩にこちらを回さないと、カードは翌朝まで出ない。
      - name: カードを作る
        run: |
          set -euo pipefail
          if [ "$TIPS_DRY" = "1" ]; then
            python python/island_cards.py --dry-run
          else
            python python/island_cards.py
          fi

      # `nordic_supporters.py`（その日いた人の名簿）は**ここに足さない。**
      # あれが引くのは BigQuery の `chat_messages`（YouTube のスパチャ）で、
      # **`doneru_donations` を1行も読まない。** 材料を入れるのは
      # `fetch_chat_data.py`＝同じ `schedule_fetch_chat.yml` の中なので、
      # あちらでは既に「入れてから読む」順が守られている。
      # Doneru の完了に繋いでも新しくなるものが1つも無く、
      # `nordicDays.updatedAt` だけが毎晩もう1回動く。
      # （Doneru のぶんの名簿は、真上の `doneru_supporters.py` が
      # `merge()` で同じ `nordicDays` に足している。そちらは繋いである）

      # **紐付け待ち（終了コード 1）では赤くしない。** それは
      # `donor_calls.py` が issue に映す。ここで落とすのは
      # **元データが読めなかったとき（2）だけ。**
      - name: 元データが読めなかったら赤くする
        run: |
          set -euo pipefail
          if [ "${DONERU_RC:-0}" = "2" ]; then
            {
              echo "### Doneru の寄付の表が読めませんでした"
              echo ""
              echo '`doneru_donations` が作り直しの途中か、権限が変わったかです。'
              echo '**対応表（islandDonors）の問題ではないので、そちらは触らないこと。**'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${DONERU_RC:-0}" = "1" ]; then
            echo "紐付け待ちが残っています（issue のほうに出ます）"
          fi

      # **黙って赤くならない。** 繋ぎと cron で走るぶんは誰も見ていないので、
      # せめてどこで落ちたかを要約に残す（run の1枚目に出る。ログを開かずに読める）。
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo "### 台帳を入れ直せませんでした"
            echo ""
            echo '**投げ銭が消えたという意味ではありません。** 元は BigQuery に在ります。'
            echo 'この晩は台帳（`islandTips`）とカード（`islandCards`）が古いままで、'
            echo '投げてくれた人の `/cards` に、その日のカードが出ていない可能性があります。'
            echo ""
            echo '毎晩の取り込み（Fetch YouTube Chat Data）の中でも同じ3本が走るので、'
            echo '**翌朝には追いつきます。** 今すぐ直すなら、このワークフローを'
            echo '`dry_run: false` で手で押してください。'
          } >> "$GITHUB_STEP_SUMMARY"
