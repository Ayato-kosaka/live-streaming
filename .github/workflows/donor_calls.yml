name: 紐付け待ちを issue に映す

# 投げ銭してくれたのに どねID が YouTube と紐付いていない人を数えて、
# **issue を1本、開けたり閉じたりする**（`python/donor_calls.py`）。
#
# ## なぜ要るか
#
# いままでは `python/doneru_supporters.py` が終了コード 1 で落ちて、
# 毎晩の取り込みが赤くなることで知らせていた。**その赤が3回見逃された。**
# 赤は Actions の一覧の中にしか出ないうえ、**「起きたこと」であって
# 「いま残っていること」ではない。** 次の晩に緑が積まれれば下へ流れていく。
#
# 赤を強くするのではなく、**いまの状態そのものを、人が毎日見る場所に置く。**
# 用事が残っているあいだは issue が開いたまま、終わればこちらで閉じる。
#
# ## 繋ぎ先（`workflow_run`）
#
# 数える元は Firestore の `islandDonors`。そこへ「表に無い どねID」を
# `state: "new"` で書き込むのは `doneru_supporters.py` で、**それを回す口は
# 2つしかない。** その2つの後ろに繋ぐ。
#
# | 回す口 | ワークフロー名 |
# | --- | --- |
# | 毎晩の取り込みの中（最後のステップ） | `Fetch YouTube Chat Data` |
# | Doneru の取り込みが終わったあと | `投げ銭の台帳を入れ直す` |
#
# **`Fetch Doneru Donations` には繋がない（2026-09-17 に外した）。**
# あれは BigQuery に材料を入れるだけで、`islandDonors` を1行も書かない。
# そして `投げ銭の台帳を入れ直す` が**同じ引き金で動く**ので、繋いだままだと
# 2本が同時に出て**競争になる。** 負けた晩は、対応表がまだ新しくなる前に
# ここが数えることになる。
#
# 実際に 2026-09-17 の晩がそれだった。ここは「対応表 30件 / 紐付け待ち 0人」と
# 言い、同じ晩の台帳は「Doneru で紐付いていないぶん 1件」と言っていた。
# **カードが渡らなかった人がいるのに、見張りが 0人 と言った。**
#
# `concurrency` で1本ずつにしても直らない。**あれは順番を作る道具ではない**
# （待つのは1本だけで、同じ group に3本目が来ると待っているほうが捨てられる）。
# 直すのは**引き金の張り替え**で、順番そのものを作る。
#
# **cron を当てにしない。** このリポジトリで定時実行が実際に発火した実績が
# あるのは `Fetch YouTube Chat Data`（20:00 UTC）と `Fetch Doneru Donations`
# （20:30 UTC）の古参2本だけで、しかも1時間49分〜3時間32分遅れて走る。
# 2026-09-10 に載せた `rebake.yml` の cron（01:00 UTC）は、翌朝 03:45 まで
# 待っても発火しなかった。下の cron は**保険**として置いてある
# （取り込み自体が発火しなかった晩の受け皿）。
#
# **`conclusion` は見ない。** 繋ぎ先の最後の step は「表に無い どねID が
# 投げ銭してきた」ときに `exit 1` で終わる。**あれは失敗ではなく呼び出し**で、
# Firestore にはもう `state: "new"` が入っている。成功のときだけ繋ぐと、
# **呼び出しの出た晩だけ issue が立たない**——いちばん要る晩に立たない。
#
# **繋ぎはワークフローの `name:` で解決される。** あちらの名前を変えると
# 黙って切れる。**赤くならない。走らなくなるだけ。**
# 生きているかは `Fetch Doneru Donations` を `probe: true` で押して確かめる
# （1バイトも書かずに40秒で終わる）。
#
# 繋ぎ先を2本にしてあるのは、片方が消えても止まらないようにするため。
# 2本とも走った晩は2回回るが、**2回目は同じ本文なので何も書かない**
# （`donor_calls.py` の `decide()`）。
#
# **`投げ銭の台帳を入れ直す` 自身も `workflow_run` で起きる。** 繋ぎの繋ぎに
# なるので、生きているかは**押して1回見るまで当てにしない**
# （`CLAUDE.md`「新しく載せた cron は、発火を1回見るまで当てにしない」と同じ）。
# 2026-09-17 に `Fetch Doneru Donations` を `probe: true` で押して、
# Doneru → 台帳 → ここ、の3段が繋がることを見てある。
#
# ## 手で押すときの既定は「見るだけ」
#
# `apply` の既定は false。押し間違えても issue は動かない
# （`--apply` を付けないと GitHub API を1回も叩かない）。
# **押す人のいないとき（cron と、取り込みに繋いで来たぶん）だけ apply で走る。**

on:
  workflow_run:
    # **`doneru_supporters.py` を回したワークフローだけ。**
    # `Fetch Doneru Donations` は `islandDonors` を1行も書かないうえ、
    # `投げ銭の台帳を入れ直す` と同じ引き金なので競争になる（上の表）
    workflows: ["Fetch YouTube Chat Data", "投げ銭の台帳を入れ直す"]
    types: [completed]

  schedule:
    # 保険。取り込みの実測（21:49〜23:32 UTC）より後ろ
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      apply:
        description: "issue を実際に開く／書き換える／閉じる（off なら数えるだけ）"
        required: false
        default: false
        type: boolean

# 取り込みと Doneru が続けて終わった晩に2本同時に走ると、
# 同じ issue を2本立てにいく。1本ずつ通す
concurrency:
  group: donor-calls
  cancel-in-progress: false

permissions:
  contents: read
  # issue を開く・書き換える・閉じる
  issues: write

jobs:
  donor_calls:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # **`requirements.txt` を丸ごと入れない。** ここが読むのは Firestore だけで、
      # BigQuery も YouTube API も Pillow も1行も通らない。
      # 毎晩ひとりでに走って「用事が残っていること」を知らせる係なので、
      # **関係のない依存が1つ壊れただけで止まる**形にしたくない。
      # GitHub を叩くほうは標準ライブラリ（urllib）だけで足りている
      - name: Firestore のクライアントだけ入れる
        run: |
          python -m pip install --upgrade pip
          pip install "google-cloud-firestore>=2.16.0"
          # 素性の見張り（下の step）が `island_channels` などを読み込むので、
          # BigQuery の口も要る。**入れないと見張りが ImportError で落ちる。**
          # ここを削るなら、見張りのほうも一緒に外すことになる（#500）
          pip install -r python/requirements.txt

      # 偽の Firestore と偽の GitHub で回すだけ。外へは1バイトも出ない。
      # **本番を触る前に、判断のところ（`decide`）が生きているかを見る。**
      # ここが壊れたまま apply で走ると、空振りの issue が毎晩開くか、
      # 本当にカードの渡らなかった朝に黙るかのどちらかになる。
      #
      # **兄弟2本（`bake_down.yml` / `ingest_down.yml`）には最初から在って、
      # ここにだけ無かった。** `donor_calls_selftest.py` は 800行あって対照まで
      # 付いているのに、**どこからも走っていなかった**（20 run すべて）。
      # 書いてあるだけの見張りは、無いのと同じ（`docs/island-misses.md` #123）。
      # **公開のログに素性が出ないこと**を、口を開く前に見る（#500）。
      # このリポジトリは公開で、Actions のログも誰でも読める。実際に3回出ている
      # （#180 Doneru の鍵 / #217 Anthropic の鍵 / #379 名簿 1,065 実行ぶん）。
      # **消すのは出たあと。出る前に止めたいので、口より手前に置く。**
      #
      # **同じ job に置くことが要る。** job が違えばランナーが別なので、
      # 隣の job で通っていてもこちらの出力は1文字も守られていない。
      # 認証もクエリも要らず 0.5 秒で終わる。落ちたら下は1行も走らない。
      # 置き忘れは `python/logsafe_wiring_selftest.py` が見ている
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      - name: 判断のところを、偽物で先に回す
        run: python python/donor_calls_selftest.py

      - name: 紐付け待ちを数えて、issue を合わせる
        env:
          # 手で押したときだけ既定が「見るだけ」。
          # cron と、取り込みに繋いで来たぶんは**読む人がいない**ので apply
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name != 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python python/donor_calls.py --apply
          else
            python python/donor_calls.py
          fi

      # **黙って赤くならない。** 毎晩ひとりでに走るものは、落ちたことに
      # 誰も気づかない。せめてどこで落ちたかを要約に残す
      # （要約は run の1枚目に出るので、ログを開かずに読める）
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo "### 呼び出しを映せませんでした"
            echo ""
            echo 'issue が**いまの状態と食い違ったまま**になっています。'
            echo '手で押し直すか、`python python/donor_calls.py` を手元で回してください。'
          } >> "$GITHUB_STEP_SUMMARY"
