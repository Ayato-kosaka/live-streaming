name: 切り抜きの mp4 を取る

# 配信の「この区間だけ」を mp4 にして artifact で渡す。旅は17日あって毎日出てくるので、
# **1本ずつ手で回せる形**にしてある。clip_day1.yml は1日目専用で場面表が埋め込みだった。
#
# **なぜ Actions か。** 作業箱から googlevideo に取りに行くと必ず 403 になる。
# 署名付き URL は取りに来た IP に紐づくのに、箱の出口は接続ごとに別の IP へ移る
# （実測 160.79.106.128〜137）。ランナーは1つの IP で最後まで通る。
# 詳しくは docs/clip-download.md。
#
# **Cookie は `YOUTUBE_COOKIES` を読む。書き換えない。**
#
# 2本目（`YOUTUBE_COOKIES_CLIP`）を用意してもらう前提で書いていたが、
# **前提が違っていた。** あやとの言葉（2026-09-22、#322）:
#
#   > YOUTUBE_COOKIES を使いまわしてください。
#   > これ、本アカじゃない、yt dlp 専用クッキー。
#
# こちらは「あれはあやと本人のアカウントなので、切り抜きの荒い弾かれ方に
# 巻き込むと毎晩の取り込みごと止まる」と読んでいた。**本人のではなかった。**
# 巻き込む相手が居ないので、2本目は要らない。
#
# **ただし読むだけ。`cookies/update` は絶対に使わない。**
# あれを使うと Secret 自体が書き換わる（`schedule_fetch_chat.yml` の最後の
# step がやっているのがそれ）。切り抜きが書き換えると、毎晩の取り込みが
# 掴む Cookie が変わる。**取り込みが止まると島の数字が全部止まる。**
# ここが握ってよいのは `/tmp` に置いた写しだけ。
#
# **毎晩の取り込みと同時に走らせない**（下の concurrency）。同じセッションを
# 2か所から同時に使うと、片方が無効化されることがある。手で押すものなので、
# 取り込みの時間帯（21:49〜23:32 UTC）を避ければ足りる。
#
# 無ければ無いまま走る。

on:
  workflow_dispatch:
    inputs:
      video:
        description: "配信ID（例 f3W2JxAHsQs）"
        required: true
        default: "f3W2JxAHsQs"
      sections:
        description: "区間。コンマ区切り。0:54:10-0:55:30,0:57:40-0:59:20"
        required: true
        default: "0:54:10-0:55:30,0:57:40-0:59:20,1:46:00-1:47:40"
      height:
        description: "縦の画素数"
        default: "720"
      rounds:
        description: "口を全部当たるのを何周するか"
        default: "3"
      pause:
        description: "1周ごとに空ける秒数"
        default: "120"

# **毎晩の取り込みと同じ枠に入れる。** 名前をあちらと揃えてあるので、
# 片方が走っているあいだ、もう片方は待つ（`schedule_fetch_chat.yml:15`）。
# 同じ Cookie のセッションを2か所から同時に使うと、片方が無効化されることがある。
#
# **取り込みを待たせる側になることは承知のうえ。** こちらは手で押すもので
# 数分で終わる。取り込みはもともと1時間49分〜3時間32分遅れて走っているので、
# 数分の待ちは誤差の内。**逆に、取り込みが Cookie ごと死ぬのは island の数字が
# 全部止まる。** 待たせるほうが安い。
concurrency:
  group: fetch-chat-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # **24 に揃えてある。** ここの node が要るのは PO Token を作る
      # bgutil の依存を入れるところだけで、走らせるのは deno のほう
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 道具を入れる
        run: |
          python3 -m pip install --quiet --upgrade yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          python3 -m yt_dlp --version
          ffmpeg -version | head -1
          # PO Token を作る側。**無いと媒体の URL を渡してもらえない。**
          # deno で走らせるので node_modules だけ用意する（build は要らない）。
          git clone --depth 1 --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          npm --prefix /tmp/bgutil/server install --silent

      - name: PO Token が本当に作れるか見る
        # **ここを黙って素通りさせない。** 作れていないのに「ボット確認が出た」と
        # 読むと、口の当たり直しを何時間も続けることになる（実際そうなった）。
        run: |
          deno run --allow-all /tmp/bgutil/server/src/generate_once.ts --version

      - name: Cookie があれば置く
        # 秘密情報が無ければ何もしない。**中身はログに出さない。**
        env:
          # **読むだけ。** 書き換えないこと（上の説明）
          CK: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$CK" ]; then
            # 毎晩の取り込みが握っている Secret なので、形は向こうに合わせる。
            # base64 のことも生のこともある。**どちらでも受ける。**
            # 中身は絶対に出さない。
            printf '%s' "$CK" | base64 -d > /tmp/clip_cookies.txt 2>/dev/null \
              || printf '%s' "$CK" > /tmp/clip_cookies.txt
            grep -q "youtube" /tmp/clip_cookies.txt || printf '%s' "$CK" > /tmp/clip_cookies.txt
            echo "CLIP_COOKIES_FILE=/tmp/clip_cookies.txt" >> "$GITHUB_ENV"
            echo "Cookie あり（$(wc -l < /tmp/clip_cookies.txt) 行）"
          else
            echo "Cookie なし。無いまま走る"
          fi

      - name: 落として切る
        env:
          BGUTIL_HOME: /tmp/bgutil/server
          CLIP_HEIGHT: ${{ inputs.height || '720' }}
          CLIP_ROUNDS: ${{ inputs.rounds || '3' }}
          CLIP_PAUSE: ${{ inputs.pause || '120' }}
          VIDEO: ${{ inputs.video || 'f3W2JxAHsQs' }}
          SPANS: ${{ inputs.sections || '0:54:10-0:55:30,0:57:40-0:59:20,1:46:00-1:47:40' }}
        run: python3 tools/clip/fetch.py "$VIDEO" "$SPANS"

      - name: 渡す
        # 落とせなかった回も report.md だけは渡す。**通らなかった記録が要る。**
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clip-${{ inputs.video || 'f3W2JxAHsQs' }}-${{ github.run_id }}
          path: out/
          retention-days: 30
          compression-level: 0
