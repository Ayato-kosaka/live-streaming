name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 島の投げ銭（#1405）の鍵2本は、**空なら1行も書かない。**
      # Stripe のアカウントを作る前から、このワークフローは毎回回る。鍵が無いあいだ
      # 口は 503（`tip not configured`）を返す作りなので、ここで落とすと
      # 投げ銭と関係のない口まで配れなくなる。
      # 鍵は `env:` で渡す（`run:` の字に `${{ }}` で直に埋めると、値がスクリプトの
      # 一部として読まれる）。
      #
      # 案内鳥の鍵（`YOUTUBE_GUIDE_REFRESH_TOKEN`。チャンネル「あやと島案内鳥」）も
      # 同じ形で、**空なら書かない。** 鍵が無いあいだ、島の投げ銭を配信のチャットに
      # 書く仕組みは書かずにログに1行残すだけで、口は止まらない（決定の記録 0019）。
      - name: 🏗️ `.env` ファイルの作成
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          YOUTUBE_GUIDE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_GUIDE_REFRESH_TOKEN }}
        run: |
          echo "YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}" >> functions/.env
          echo "YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> functions/.env
          echo "YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}" >> functions/.env
          for k in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -n "${!k}" ]; then
              printf '%s=%s\n' "$k" "${!k}" >> functions/.env
            else
              echo "::notice::$k が空なので .env に書かない（島の投げ銭の口は 503 のまま）"
            fi
          done
          if [ -n "$YOUTUBE_GUIDE_REFRESH_TOKEN" ]; then
            printf '%s=%s\n' YOUTUBE_GUIDE_REFRESH_TOKEN "$YOUTUBE_GUIDE_REFRESH_TOKEN" >> functions/.env
          else
            echo "::notice::YOUTUBE_GUIDE_REFRESH_TOKEN が空なので .env に書かない（島の投げ銭を配信のチャットに書かない）"
          fi

      - name: 📦 依存関係のインストール
        run: npm ci
        working-directory: functions

      - name: 🔨 TypeScript ビルド
        run: npm run build
        working-directory: functions

      - name: 🚀 Deploy to Firebase
        uses: jsryudev/deploy-firebase-functions@v20.0.1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: live-streaming-d3cac
          FUNCTIONS_DIR: functions
