name: スタンプのことば

# LINE スタンプの、住人のことば(#716)。
#
# やることは2つ。
#
#   seed    … あやとが選んだ25人を Firestore（`islandStampLine`）へ置く
#   suggest … その人が実際に何度も言っている言い回しを BigQuery から引いて、
#             提案（`suggested`）として置く
#   table   … 入っている中身を**あやとと話すための表**にして issue に貼る
#   arrange … 提案のことばを、**人が手で直したもの**に差し替える
#   dig     … **決めかねている人だけ**を深く掘って、候補を増やして issue に貼る
#             （門を外した側・緩めた側・語で探した側。**1バイトも書かない**）
#
# ## なぜ `run_admin_script.yml` ではなく、別のワークフローなのか
#
# **名簿を ARGS に取れない。** ARGS は実行ステップの env として
# **公開のログに出る**（`run_admin_script.yml` に実際にそう書いてある）。
# 25人の名簿は「誰が選ばれたか」そのもので、選ばれかたが
# 「協力してくれた人」なので、**それはそのまま投げ銭の順位表**
# （`docs/island-money.md`「実額は視聴者には一切見せない」）。
#
# だから名簿は **`repository_dispatch` の `client_payload`** で渡す。
# 出来事の中身（`$GITHUB_EVENT_PATH`）はジョブの中からしか読めず、
# どの REST の口にも UI にも出てこない。
#
#   gh api -X POST repos/<owner>/<repo>/dispatches --input payload.json
#   payload.json:
#     {"event_type":"stamp-line",
#      "client_payload":{"op":"seed","picks":["…","…"],"apply":true}}
#
# **そのうえで**、ジョブの頭で1件ずつ `::add-mask::` に入れる。
# 伏せ字は保険で、本体は「スクリプトが1文字も出さない」こと
# （`python/admin/stamp_line_seed.py` / `stamp_line_suggest.py`）。
#
# ## 名簿を要らない側は、手で押せる
#
# `suggest` は Firestore に置いてある書類を見て回るので、**名簿を渡さない。**
# だから `workflow_dispatch` からも押せるようにしてある（`op: suggest`）。
# `seed` と `arrange` を `workflow_dispatch` から押すことはできない——
# **入力に名簿もことばも取る口を作らない**（`workflow_dispatch` の入力は
# 公開のログに出る）。あちらは `repository_dispatch` の `client_payload` だけ。
#
# **`repository_dispatch` は、既定ブランチのワークフローしか走らせない。**
# 枝に載せただけの新しい口は、`client_payload` では押せない（2026-10-12 に
# ここで詰まった）。枝のまま試すには `workflow_dispatch`——あちらは
# `ref` を選べる。ただし**入力は公開のログに出る**ので、名簿は渡せない。
#
# `dig` は押せる。**名前を1つも取らない道があるから**——誰を掘るかを
# 渡さないと、`suggested` が2本以上残っている人（＝まだ決めかねている人）を
# 入れ物から自分で集める。`words`（探す語）は名前ではないので入力でよい
# （その語で探した結果は、どのみち issue の表に出る）。
# **名前で指したいときは `repository_dispatch` から。**
#
# ## 採点表（`check`）も `client_payload` だけ
#
# 2026-10-10 から、あやとが #716 で挙げた名セリフを渡せる
# （`suggest` の下見が「しきいを変えると何本当たるか」を数え、
# `table` が「出たか・落ちたか・データに無いか」を表にする）。
#
#   {"event_type":"stamp-line",
#    "client_payload":{"op":"table","apply":true,
#      "check":[{"name":"…","lines":["…"],"words":["…"]}]}}
#
# **名前とことばの組なので、`workflow_dispatch` の入力には取らない**
# （入力は公開のログに出る）。ジョブの頭で1件ずつ伏せ字にする。
#
# ## `table` だけが、名前とことばを外へ出す
#
# あやと（2026-10-09）:
#
# > 住人25人ぶんのセリフの件、チケットで会話しましょう。名前やコメント出しても問題ない。
# > Aで進めて
#
# 出してよいのは **issue の本文ひとつ**で、**公開の Actions ログには
# 1文字も出さない**（`python/admin/stamp_line_table.py` が件数しか出さない）。
# 出さないものは変わらない——**金額・順位・それを当てられる数**
# （`docs/island-money.md`）。だから表は強さで並べず、出す数は
# 「その人がその字を打った回数」まで。
#
# そのために、このジョブだけ `issues: write` を持つ。
# **既定は下見**で、`apply` を立てたときだけ貼る。

on:
  repository_dispatch:
    types: [stamp-line]
  workflow_dispatch:
    inputs:
      op:
        description: "何をするか。**seed と arrange は押せません**（名簿とことばを入力に取らない）"
        required: true
        default: suggest
        type: choice
        options: [suggest, table, dig]
      apply:
        description: "書くか（既定は下見で、1バイトも書かない）"
        required: false
        default: false
        type: boolean
      issue:
        description: "table / dig のとき、どの issue に貼るか（番号だけ）"
        required: false
        default: "716"
        type: string
      mode:
        description: "table のとき、どちらの表か（既定は決まったセリフの表）"
        required: false
        default: decided
        type: choice
        options: [decided, candidates]
      words:
        description: "dig のとき、掘る人ぜんぶに当てる語（読点区切り。**名前は書かない**——入力は公開のログに出ます）"
        required: false
        default: ""
        type: string
      top:
        description: "dig のとき、1人あたり「その人だけ」を何本出すか（数字だけ）"
        required: false
        default: ""
        type: string

# `table` が issue にコメントを貼る。**それ以外は読むだけ。**
permissions:
  contents: read
  issues: write

# 同時に走らせると読み書きが交錯するので1本ずつ
concurrency:
  group: stamp-line
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      # **いちばん先に伏せる。** ここより下で何かが字になる前に。
      #
      # 読めなかったときに素通ししない。ここは名簿が公開ログへ出る前の
      # 最後の関所なので、`|| true` で空にして先へ進むと
      # 「伏せるものが無かった」と同じ顔で名簿が通る。読めないなら止める
      # （`run_admin_script.yml` の同じ step と同じ決め）。
      - name: 名簿を伏せ字にする
        shell: bash
        run: |
          set -uo pipefail
          # 伏せるのは5つ（下の drop を入れて）。名簿（`picks`）・**手で直したことば
          # （`fix[].id` `fix[].name` `fix[].lines[]`）**・**採点表
          # （`check[]`。あやとが「この字が名セリフだ」と挙げた、名前と
          # ことばの組）**・**深掘りの相手（`who[]`。名前と探す語）**。
          # あとから足したものを入れ忘れると、そこだけ素通りする道ができる。
          #
          # **`drop[].name` も同じ。** 「候補から外す」も名前で指すので、
          # 2026-10-13 に 🤤 を外したとき、ここに入っていないのが分かった
          # （そのときはスクリプトが名前を1字も出さないので漏れなかった）
          #
          # **`fix[].name` を入れ忘れない。** 2026-10-12 に「書類IDの
          # 代わりに名前で指せる」道を足したので、`fix` の中に名前が
          # 入るようになった（前は `id` しか無かった）
          if ! raw="$(jq -r '
            [ (.client_payload.picks // [])[],
              (.inputs.picks // [])[],
              ((.client_payload.fix // [])[] | (.id, .name,
                 ((.lines // [])[] | (.text, .from)))),
              ((.client_payload.check // [])[]
                 | (.name, ((.lines // [])[]), ((.words // [])[]))),
              ((.client_payload.who // [])[]
                 | (.name, ((.words // [])[]))),
              ((.client_payload.drop // [])[] | (.name, .id)) ]
            | map(select(type == "string"))
            | .[]
          ' "$GITHUB_EVENT_PATH" 2>/dev/null)"; then
            echo "::error::出来事の中身が読めませんでした（jq が落ちた）。何も走らせません"
            exit 1
          fi
          n=0
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            # **短すぎる字は伏せない。** GitHub が嫌うし、伏せても
            # ログが読めなくなるだけ。形で落ちるぶんはスクリプトが弾く
            [ "${#v}" -lt 6 ] && continue
            echo "::add-mask::$v"
            n=$((n + 1))
          done <<< "$raw"
          # 伏せた値そのものは出さない。件数だけ
          echo "名簿の $n 件を伏せ字にしました"

      - name: 何をするかを決める
        id: pick
        shell: bash
        run: |
          set -uo pipefail
          if ! op="$(jq -r '.client_payload.op // .inputs.op // ""' "$GITHUB_EVENT_PATH")"; then
            echo "::error::出来事の中身が読めませんでした。何も走らせません"
            exit 1
          fi
          case "$op" in
            seed)    script=stamp_line_seed ;;
            suggest) script=stamp_line_suggest ;;
            table)   script=stamp_line_table ;;
            arrange) script=stamp_line_arrange ;;
            dig)     script=stamp_line_dig ;;
            *)
              echo "::error::op は seed / suggest / table / arrange / dig です: $op"
              exit 1
              ;;
          esac
          # **押せるのは、ファイルが在るものだけ。**
          if [ ! -f "python/admin/${script}.py" ]; then
            echo "::error::python/admin/${script}.py がありません"
            exit 1
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
          # 書くかどうかも、出来事の中身から読む（**既定は下見**）。
          # 式の中で `inputs` と `client_payload` を混ぜると、押され方が
          # 違う日にどちらかが無くて評価が落ちる。1か所で jq に決めさせる
          apply="$(jq -r '
            (.client_payload.apply // .inputs.apply // false) | tostring
          ' "$GITHUB_EVENT_PATH")"
          [ "$apply" = "true" ] || apply=false
          echo "apply=$apply" >> "$GITHUB_OUTPUT"
          # `table` の行き先。**数字だけ通す**——あとで ARGS の JSON に
          # そのまま入るので、`716 || …` のようなものを通さない
          issue="$(jq -r '
            (.client_payload.issue // .inputs.issue // 716) | tostring
          ' "$GITHUB_EVENT_PATH")"
          case "$issue" in
            ''|*[!0-9]*) echo "::error::issue は番号だけ: $issue"; exit 1 ;;
          esac
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          # **ARGS は jq に組ませる。** 入力の字をそのまま YAML の中の
          # JSON へ差し込むと、引用符ひとつで形が壊れる（`words` は
          # 人が打つ字なので、そこに `"` が入りうる）。
          #
          # **`words` と `top` は、渡されたときだけ入れる。**
          # いつも入れると、`table` のような別の op まで本数が変わる
          # （あちらも ARGS の `top` を読む）。
          args="$(jq -cn \
            --argjson apply "$apply" \
            --argjson issue "$issue" \
            --arg words "$(jq -r '(.inputs.words // "") | tostring' \
                           "$GITHUB_EVENT_PATH")" \
            --arg top "$(jq -r '(.inputs.top // "") | tostring' \
                         "$GITHUB_EVENT_PATH")" \
            --arg mode "$(jq -r '(.inputs.mode // "") | tostring' \
                          "$GITHUB_EVENT_PATH")" \
            '{apply: $apply, issue: $issue}
             + (if $words == "" then {} else {words: $words} end)
             + (if ($top | test("^[0-9]+$")) then {top: ($top | tonumber)}
                else {} end)
             + (if ($mode | test("^(decided|candidates)$"))
                then {mode: $mode} else {} end)')"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "走らせるもの: $script / 書く: $apply / 行き先: #$issue"

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # **明細を出す前に、伏せる側が効いているかを見る。**
      # ここから回るものはどれも「誰が選ばれたか」に触るので、
      # `python/logsafe.py` が素通しになったら1行も走らせない。
      # 認証もクエリも要らず 0.5 秒で終わる。
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      # **決め方そのものも、本物に1行も書く前に回す。**
      # 偽の Firestore と偽の BigQuery で動くので、ここで落ちたら
      # 本番には1バイトも行かない（`channel_alias` と同じ形）。
      - name: 決め方の見張り（偽のデータで動かす）
        run: |
          set -euo pipefail
          python3 python/admin/stamp_line_seed_selftest.py
          python3 python/admin/stamp_line_suggest_selftest.py
          python3 python/admin/stamp_line_table_selftest.py
          python3 python/admin/stamp_line_arrange_selftest.py
          python3 python/admin/stamp_line_dig_selftest.py
          python3 python/stamp_line_pick_selftest.py

      - name: 実行
        working-directory: python/admin
        # **ARGS に名簿を入れない。** 真偽値だけを渡す。
        # 名簿は `$GITHUB_EVENT_PATH` からスクリプトが読む
        env:
          ARGS: ${{ steps.pick.outputs.args }}
          # `table` が issue に貼るのに使う。**値はログに出ない**
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: python "${{ steps.pick.outputs.script }}.py"
