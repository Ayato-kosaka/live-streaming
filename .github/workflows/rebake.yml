                      out.append(ch)
                      i += 1
                      continue
                  if ch in "[{":
                      j = _close(s, i)
                      if j < 0:  # 閉じていない（注釈の中の括弧など）。手を付けない
                          out.append(ch)
                          i += 1
                          continue
                      inner = _sorted(s[i + 1 : j])
                      parts = [x.strip() for x in _items(inner)]
                      parts = [x for x in parts if x]
                      out.append(ch + ",".join(sorted(parts)) + s[j])
                      i = j + 1
                      continue
                  if ch.isspace():
                      if out and out[-1] != " ":
                          out.append(" ")
                      i += 1
                      continue
                  out.append(ch)
                  i += 1
              return "".join(out)


          def body(text: str) -> str:
              """比べるための姿。**並び替えただけの差は消し、値の差は残す。**

              そのまま字面を比べていたので、**並びが毎晩入れ替わるファイルは
              中身が何ヶ月凍っていても永遠に「0.0日」だった。** 2026-09-16 の
              焼き直しで `cityStreams.ts` が 107 行動いたが、空白を除いた文字は
              1つも増減しておらず、57 か所すべてが**同じ日どうしの入れ替わり**
              だった。見張り（`(7, "いまいる街の配信が増える…")`）は構造上
              一度も鳴れない（`docs/island-misses.md` #106）。

              **やりすぎない。** 潰すのは兄弟の並びと空白だけで、
              **数字が1つ動けば必ず字面が変わる。**
              """
              return _sorted(STAMP.sub("", text)).strip()


          def stale_days(path: str) -> float:
              """いまの中身になってから何日たったか。この回で焼き変わっていれば 0。"""
              with open(path, encoding="utf-8") as f:
                  cur = body(f.read())
              # **`git diff` で「変わった」と読まない。** 並び替えただけでも差分は出る。
              # いま焼いたものを HEAD と**正規化して**比べて、同じなら凍っている側へ回す
              head = git("show", f"HEAD:{path}")
              if not head or body(head) != cur:
                  return 0.0
              intro = None
              for line in git("log", "-n", str(DEPTH), "--format=%H %ct", "--", path).splitlines():
                  if not line.strip():
                      continue
                  sha, ts = line.split()
                  if body(git("show", f"{sha}:{path}")) != cur:
                      break
                  intro = int(ts)
              if intro is None:
                  # 履歴のいちばん新しい commit と中身が違う = さっき変わったばかり
                  return 0.0
              return (time.time() - intro) / 86400


          def main() -> int:
              paths = (sys.argv[1:] or os.environ.get("REBAKE_PATHS", "").split())
              rows, bad = [], []
              for path in paths:
                  name = os.path.basename(path)
                  if name not in WATCH:
                      rows.append((name, "—", "—", "見ていない（表に無い）"))
                      continue
                  limit, why = WATCH[name]
                  if limit == 0:
                      rows.append((name, "—", "見ない", why))
                      continue
                  d = stale_days(path)
                  ok = d < limit
                  rows.append((name, f"{d:.1f}日", f"{limit}日まで", why if ok else f"**{why}**"))
                  if not ok:
                      bad.append((name, d, limit, why))

              md = [
                  "",
                  "#### 凍っていないか（中身が最後に変わってから何日たったか）",
                  "",
                  "| ファイル | 最後に変わってから | 見のがす範囲 | 毎晩どう動くはずか |",
                  "| --- | ---: | ---: | --- |",
              ]
              md += ["| " + " | ".join(str(x) for x in r) + " |" for r in rows]
              md.append("")
              if bad:
                  md += [
                      "**凍っています。** 焼きはしたのに、中身が何日も同じままです。",
                      "",
                      "**commit は止めていません。** 入れるものが1バイトも無いので止めようがなく、",
                      "同じ晩に動いた他の焼き込みまで巻き添えにしないためです。",
                      "この run は最後に赤くなります。",
                      "",
                      "見るところは3つです。",
                      "",
                      "1. **そのスクリプトは本当に本番を引いているか** — `python/data/*.json` の",
                      "   取り置きを焼き直しているだけなら、何度回しても答えは同じです",
                      "2. **上流の表が止まっていないか** — `countries.ts` のような人が書く表を",
                      "   待っているものは、そこが増えるまで下流も動きません",
                      "3. **取り込みが止まっていないか** — `Fetch YouTube Chat Data` が何晩も",
                      "   落ちていれば、BigQuery を引いても昨日と同じ答えが返ります",
                      "",
                  ]
              else:
                  md += ["凍っているものはありませんでした。", ""]

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("\n".join(md) + "\n")
              print("\n".join(md))

              for name, d, limit, why in bad:
                  print(f"::error::{name} の中身が {d:.1f} 日変わっていません"
                        f"（{limit}日まで見のがします）。{why}")

              out = os.environ.get("GITHUB_ENV")
              if out and bad:
                  with open(out, "a", encoding="utf-8") as f:
                      f.write("REBAKE_FROZEN=1\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      # **焼いた TS がビルドを通ることを、commit の前に確かめる。**
      # 自動生成なので構文が壊れることは滅多にないが、壊れたときに起きるのは
      # 「master が赤くなる」ではなく「**Hosting のデプロイが落ちて、次に誰かが
      # 配るまで誰も気づかない**」。commit の前に落としたほうがずっと安い。
      #
      # dry_run のときも通す。**dry_run は本番の予行なので、予行で確かめない
      # ものは予行の意味がない。**
      #
      # 中身は Hosting が走らせている `build:island`
      # （`npm --prefix site ci && npm --prefix site run build`）と同じ。
      # **同じものを先にここで通す**から、通れば Hosting も通る。
      - name: Node の用意
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: site の依存を入れる
        working-directory: site
        run: npm ci

      # `NEXT_DIST_DIR` は付けない。既定の `.next` は `site/tsconfig.json` の
      # include にもう入っているので、Next が include を書き足さずに済む
      # （書き足されると tsconfig.json が汚れる。commit は名指しなので混ざりは
      #   しないが、汚れずに終わるほうがよい）
      - name: site のビルドが通るか
        working-directory: site
        run: npx next build

      # ------------------------------------------------------------------
      # **site 側の見張り3本。`npm ci` の後、commit と deploy の前。**
      #
      # 3本とも 2026-09-17 の棚卸しまで**どこからも走っていなかった**
      # （`docs/island-misses.md` #125）。走らなかった理由は「`tsc` が要る＝
      # `site/node_modules` が要る」で、それはこの step のすぐ上で入っている。
      # **入れたあとに置けば済む話だった。**
      #
      # ## なぜ commit の前に置くか（`chatter_selftest` とは向きが違う）
      #
      # 下の「セリフの届いていない人がいないか」は deploy の後ろに在って、
      # 赤くても焼き直しを止めない。あれは「セリフを書き足してほしい」という
      # **お願い**で、壊れているわけではないから。
      #
      # こちらの3本は**壊れているかどうか**を見ている。しかもこの run は
      # `site/content/` を master に入れて **Hosting を配るところまでやる**ので、
      # 選びかたが壊れたまま通すと、その壊れが本番の島にそのまま乗る。
      # だから commit の前に置いて、落ちたら配らない。
      #
      # ## 毎晩の数字では落ちない
      #
      # 3本とも**こしらえた名簿で回る**（本番の `content/residents.ts` を
      # 1行も読まない）。焼き直しで数字が動いても、ここは動かない。
      # 落ちるのは、選びかたのコードを触ったときだけ。
      # ------------------------------------------------------------------

      # 表紙（`/`）に立つ12人の選びかた。`folk.ts` には出席日数だけを見る
      # 古い写しが戻ってきたことがあり、そのとき **`roster.ts` を直しても
      # 視聴者さんの見る表紙は1ピクセルも変わっていなかった**
      - name: 表紙の島が、投げ銭と出席の両方を見て人を選んでいるか
        working-directory: site
        run: node selftest/folk_selftest.mjs

      # 選びかたの式そのもの（順位 → 点 → 重み）。あやとの決め（2026-09-15）の
      # 「額1位は皆勤と同じくらい」「頻度はどうでも良い」が式に残っているか
      - name: えらばれかたの式が、決めたとおりか
        working-directory: site
        run: node selftest/roster_selftest.mjs

      # 読めなかった回を「まだ来ていません」と言い換えていないか（#118）。
      # ルーレットの画面はログインしないと1行も描かないので、**この箱の
      # ブラウザでは開けない。** 巡回も撮影も届かない面で、ここだけが見ている
      - name: コメントが読めなかったとき、黙って飲み込んでいないか
        working-directory: site
        run: node selftest/chatdown_selftest.mjs

      # ------------------------------------------------------------------
      # **分かち合う1枚（`site/public/og.png`）を撮り直す。**
      #
      # リンクを貼ったときに出るあの絵は、**焼いた日のまま止まる。**
      # 中の言葉はもう全部「画面が出しているもの」を撮っただけなので
      # （`docs/island-misses.md` #134）、**撮り直せば正しくなる**——のだが、
      # 撮り直す人がいなかった。旅のしるべ（何日目・どこ）は開いた日で決まるので、
      # 置いておくと**翌日には嘘になる。** #134 は、ここに繋ぐまで半分しか
      # 直っていない（「直せる形にした」は「直る」ではない）。
      #
      # ## なぜここに置くか
      #
      # 焼いたあと（新しい数字が入った島を撮るため）で、`npm ci` と
      # `next build` のあと（撮るのは**書き出したもの**）で、commit の前
      # （絵が変わった晩は、その晩の commit に一緒に乗せる）。
      #
      # ## なぜ絵のバイト列を見ないか
      #
      # 同じ入力で2回撮っても、島は住人が歩き波が動くので**756,000画素の
      # 3.8〜4.6% が入れ替わる**（実測。md5 は3回とも別物）。バイトで繋ぐと
      # **中身が同じ 540KB のコミットが毎晩積まる。** 見るのは絵ではなく
      # **絵に写るべき字**で、いま配ってあるぶんが `tools/sprites/og-stamp.json`。
      #
      # ## 落ちても、その晩の焼き直しは止めない
      #
      # `continue-on-error` なのは諦めるためではない。**絵が古いままなのと、
      # 島の数字が古いままなのは別の話**で、撮れなかったからといって数字まで
      # 止めると直せるものまで止まる。黙らないための赤は、deploy のうしろに
      # 別の step で置いてある（`OG_BAD`）。ここを直に赤くすると、
      # その晩ぶんの数字が丸ごと配られなくなる。
      # ------------------------------------------------------------------
      - name: 分かち合う絵を撮り直す
        id: og
        continue-on-error: true
        env:
          # **`site/.next` ではない。** `output: "export"` の書き出し先は、
          # distDir が既定（`.next`）のときだけ `out` になる。手元の手引きは
          # どこも `NEXT_DIST_DIR` を付けて回すので（並列で `.next` を
          # 奪い合わないため）書き出しが distDir の中に入り、**ここだけ素の
          # `next build` なので `out` に入る。** 取り違えると、絵を撮る前に
          # 0秒で「配るものがありません」で落ちる（実際に2晩そうなった）
          DIST: site/out
          PORT: "4519"
        run: |
          set -uo pipefail
          # **落ちた理由を、あとから読める場所に残す。** ここは
          # `continue-on-error` なので、赤くなるのは deploy のうしろの step。
          # そこまで100本ぶんログが流れたあとでは、**この step の中身に
          # たどり着けない**（実際に、初回の失敗で理由が読めなかった）。
          # 取っておいて、赤くする step がもう一度出す
          tools/sprites/ognight.sh > /tmp/og.log 2>&1 && code=0 || code=$?
          cat /tmp/og.log
          exit "$code"

      # **落ちたことを、deploy のうしろまで持っていく。**
      # `continue-on-error` の step は job を赤くしないので、ここで印だけ立てる
      - name: 撮れなかったことを覚えておく
        if: ${{ !cancelled() && steps.og.outcome == 'failure' }}
        run: echo "OG_BAD=1" >> "$GITHUB_ENV"

      # 差し替えた晩だけ、commit するファイルに足す。
      # **`git add -A` を使わない**という決まりはここでも同じで、
      # 名指ししたものしか master に入らない
      - name: 撮り直した絵を、commit するものに足す
        if: ${{ !cancelled() && env.OG_CHANGED == '1' }}
        run: |
          set -euo pipefail
          echo "REBAKE_PATHS=$REBAKE_PATHS site/public/og.png tools/sprites/og-stamp.json" >> "$GITHUB_ENV"
          echo "分かち合う絵が変わったので、commit するものに足しました"

      # **測った答えを、次の晩へ持ち越す。**
      # 覚え（`dead_watch_seen.json`）が master に載らないと、翌晩はまた
      # 「17本が新顔」と読んで赤くなる。**毎晩赤い見張りは、誰も読まない。**
      #
      # 足すのはここ——上の「中の数が縮んでいないか」と「凍っていないか」は
      # `site/content/*.ts` の形を見る道具なので、JSON を先に混ぜると
      # そちらの分母が狂う。**og と同じ場所・同じやり方。**
      #
      # `git add -A` は使わない。名指ししたものしか master に入らない。
      # 測れなかった晩はスクリプトが1バイトも書かないので、ここは何もしない
      - name: 押しても見られない配信の取り置きを、commit するものに足す
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          p="python/data/dead_streams.json python/data/dead_watch_seen.json"
          if git diff --quiet -- $p; then
            echo "押しても見られない配信の取り置きは、変わっていません"
            exit 0
          fi
          echo "REBAKE_PATHS=$REBAKE_PATHS $p" >> "$GITHUB_ENV"
          echo "押しても見られない配信の取り置きが変わったので、commit するものに足しました"
          git --no-pager diff --stat -- $p

      - name: 見るだけで終わる
        if: env.REBAKE_DRY == '1'
        run: |
          {
            echo ""
            echo "**見るだけ（dry_run）で終わりました。** commit も deploy もしていません。"
            echo ""
            echo "焼いた中身で \`next build\` が通ることまでは確かめてあります。"
            echo "上の数字でよければ、同じ入力のまま **dry_run のチェックを外して**もう一度押します。"
            if [ "$REBAKE_DEPLOY" = "1" ]; then
              echo ""
              echo "> deploy を on にしてありますが、dry_run が優先なので配っていません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: master に入れる
        id: commit
        if: env.REBAKE_DRY == '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- $REBAKE_PATHS; then
            echo "変わっていません。commit しません"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**変わっていないので commit しませんでした。**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $REBAKE_PATHS
          # 絵まで撮り直した晩は、題にも出す。**「数字を取り直す」だけだと、
          # あとから履歴を見た人が og.png の入れ替わりを数字の巻き添えだと読む**
          title="島に焼き込んである数字を取り直す（$REBAKE_SCRIPTS）"
          why="焼き込みは配り直しても動かない。取り込みが毎晩進むぶん、置いたままだと画面の数字だけが止まる。"
          if [ "${OG_CHANGED:-0}" = "1" ]; then
            title="$title／分かち合う絵も撮り直す"
            why="$why"$'\n\n'"分かち合う1枚（og.png）は、写っている字が変わったので撮り直した。あの絵は焼いた日で止まるので、旅が進むと翌日から嘘になる。"
          fi
          git commit -m "$title" -m "$why"
          # 毎晩ひとりでに走るので、焼いているあいだに誰かが master へ入れていることが
          # ある。**そのまま push すると落ちて、その晩ぶんが黙って消える。**
          # 取り込んでから押す（rebase なので、載せ直すのは自分の1コミットだけ）
          # **`--autostash` を外さない。** この直前で `next build` を通しているので、
          # Next が `tsconfig.json` の include や `next-env.d.ts` を書き足していると
          # 作業ツリーが汚れている。素の `git pull --rebase` は汚れていると
          # 「unstaged changes がある」で止まり、**その晩ぶんが黙って消える。**
          # commit は名指しなので、退避したぶんが混ざることはない
          git pull --rebase --autostash origin master
          git push origin HEAD:master
          echo "changed=1" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**master に入れました。**" >> "$GITHUB_STEP_SUMMARY"

      # 焼き込みは Hosting を配り直して初めて画面に出る。
      # **deploy を on にしたときだけ**（手で押したときの既定は off。cron は on）
      - name: Hosting を配る
        if: env.REBAKE_DRY == '0' && env.REBAKE_DEPLOY == '1' && steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run firebase-hosting-deploy-prod.yml --ref master
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Hosting のデプロイを起動しました。** 10分ほどで画面に出ます。" >> "$GITHUB_STEP_SUMMARY"

      - name: 配っていないときの案内
        if: env.REBAKE_DRY == '0' && env.REBAKE_DEPLOY != '1' && steps.commit.outputs.changed == '1'
        run: |
          {
            echo ""
            echo "**まだ画面には出ていません。** 焼き込みは配り直して初めて入れ替わります。"
            echo "Actions の「Firebase Hosting Deploy」を手で起動するか、deploy を on にしてもう一度押してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      # **ショートの棚を取り直せなかったぶんを、ここで赤にする。**
      # commit と deploy のあとに置くのは「凍っていたら赤くする」と同じ理由で、
      # 止めても入るものが増えるわけではなく、同じ晩の他の6本を道連れにするだけだから。
      #
      # ここが赤くなるのは「手元にある id が YouTube の一覧から消えていた」ときだけ。
      # **非公開・削除だと分かったら `python/data/shorts.json` の `_gone` に
      # 理由を添えて足す。** 書いてあるものは一覧に無くても止まらない。
      - name: ショートの棚を取り直せたか
        if: ${{ !cancelled() && env.SHORTS_BAD == '1' }}
        run: |
          {
            echo ""
            echo "### ショートの棚を取り直せませんでした"
            echo ""
            echo "手元にあるショートが、YouTube の一覧に見当たりません。**棚は前のまま**で、"
            echo "焼き込みは1バイトも書き換わっていません。上の「焼く」に消えた id が出ています。"
            echo "非公開・削除だと分かったら \`python/data/shorts.json\` の \`_gone\` に理由を添えて足してください。"
            echo "**この赤は「落ちた」ではありません。** 他の焼き込みは master に入れて、配るところまで済んでいます。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ショートの棚を取り直せませんでした。上の「焼く」を見てください"
          exit 1

      # 届かなかった晩は、赤にしないかわりに**必ず一言残す。**
      # 緑のまま黙って終わると、「今日はショートが出なかった」と見分けがつかない。
      - name: ショートの一覧に届いたか
        if: ${{ !cancelled() && env.SHORTS_UNREACHABLE == '1' }}
        run: |
          {
            echo ""
            echo "### ショートの一覧に届きませんでした"
            echo ""
            echo "YouTube のショートのタブが読めなかったので、**棚は前のまま**です"
            echo "（焼き込みは1バイトも書き換わっていません）。**落ちたわけではありません。**"
            echo "1晩なら向こうの都合です。**何晩も続いたら、取りかたのほうを見てください**"
            echo "（\`python/build_shorts.py\`。ショートは4ヶ月出ない期間が実際にあるので、"
            echo "日数の凍り見張りは付けていません。届いたかどうかだけ、ここで言っています）。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 上の「凍っていないか」で見つけたぶんを、ここで赤にする。
      # **commit と deploy のあと。** 凍っているのは「入れるものが無い」だけで、
      # 焼けたものは入れてよい。順番を逆にすると、1本凍った晩に残りが配られない。
      # **撮り直せなかった晩を、ここで赤にする。**
      # commit と deploy のうしろに置くのは「凍っていたら赤くする」と同じ理由で、
      # 止めても入るものが増えるわけではなく、同じ晩の数字を道連れにするだけだから。
      # **黙って緑にはしない。** #134 が起きたのは、絵が古いことを
      # 誰も見に行かなかったからで、静かに諦めるのは同じ穴をもう一度掘ること。
      - name: 分かち合う絵を撮り直せたか
        if: ${{ !cancelled() && env.OG_BAD == '1' }}
        run: |
          {
            echo ""
            echo "### 分かち合う絵（og.png）を撮り直せませんでした"
            echo ""
            echo "**絵は据え置いてあります。** 古い絵が配られたままなので、"
            echo "旅が進んでいれば、リンクを貼ったときに出る「◯日目 / どこ」は嘘になっています。"
            echo "島の数字のほうは焼いて配ってあります（絵と数字は別の話なので、道連れにしていません）。"
            echo ""
            echo "落ちた理由:"
            echo ""
            echo '```'
            tail -n 30 /tmp/og.log 2>/dev/null || echo "（log が残っていません）"
            echo '```'
            echo ""
            echo "全部は、上の「分かち合う絵を撮り直す」の log に出ています。"
            echo "手元で同じものを回すには:"
            echo ""
            echo '```'
            echo "cd site && NEXT_DIST_DIR=.next-og npx next build"
            echo "DIST=site/.next-og PORT=4519 tools/sprites/ognight.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- 撮り直しが落ちた理由（最後の30行）----"
          tail -n 30 /tmp/og.log 2>/dev/null || echo "（log が残っていません）"
          echo "---------------------------------------------"
          echo "::error::分かち合う絵（og.png）を撮り直せませんでした。絵は据え置きです"
          exit 1

      # **知らなかった配信が見られなくなった晩を、ここで赤にする。**
      # commit と deploy のうしろに置くのは「凍っていたら赤くする」と同じ理由で、
      # 止めても直るわけではなく、同じ晩の数字を道連れにするだけだから。
      #
      # **ここが赤いのは「落ちた」ではない。** 焼き直しは通って、master にも
      # 入って、配り終わっている。増えた1本を**人が見て決める**ための赤。
      #
      # 403 / 401 はあやとが公開に戻せば、**次の晩にひとりでに緑へ戻る**
      # （そのとき要約に「◯本もどりました」と出る）。
      # 404 と「録画が無い」は戻らないので、島から外す先を決める話になる。
      - name: 押しても見られない配信が増えたか
        if: ${{ !cancelled() && env.DEAD_BAD == '1' }}
        run: |
          {
            echo ""
            echo "### 知らなかった配信が、見られなくなりました"
            echo ""
            echo "上の「押しても見られない配信」に、増えたぶんの配信IDと種類が出ています。"
            echo ""
            echo "- \`PRIVATE\`（403）\`LOGIN\`（401） … **あやとが公開に戻せば戻ります。**"
            echo "  戻した翌晩、要約に「もどりました」と出て、この赤はひとりでに消えます。"
            echo "- \`GONE\`（404）\`NO_REC\`（録画が無い） … **戻りません。**"
            echo "  機械で焼く5本は \`python/data/dead_streams.json\` を読んで自動で外れています。"
            echo "  人が書く \`legends.ts\` \`countries.ts\` に出ていたら、差し替えるか外すかを決めてください。"
            echo ""
            echo "**この赤は「落ちた」ではありません。** 焼けたものは master に入れて、配るところまで済んでいます。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::知らなかった配信が見られなくなりました。上の「押しても見られない配信」を見てください"
          exit 1

      - name: 凍っていたら赤くする
        if: ${{ !cancelled() && env.REBAKE_FROZEN == '1' }}
        run: |
          {
            echo ""
            echo "### 凍っています"
            echo ""
            echo "焼き直しても中身が動かない焼き込みがあります。上の表に何日止まっているかが出ています。"
            echo "**この赤は「落ちた」ではありません。** 焼けたものは master に入れて、配るところまで済んでいます。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::焼き直しても中身の動かない焼き込みがあります。上の「凍っていないか」を見てください"
          exit 1

      # **島の住人のセリフが、よく歩く人に届いているかを数える。**
      #
      # 島で話しかけたとき、その人の口調で返すのは `site/content/chatter.ts` の
      # `VOICES` に載っているぶんだけで、載っていない人は共通のセリフに落ちる。
      # 落ちても**何も起きない。** 型は通るし、画面も出るし、run も緑になる。
      #
      # そして**片方だけがここで毎晩動く。** `residents.ts` は上の「焼く」が
      # 焼き直すので `score` も `days` も毎晩変わり、**昨日まであまり島に出て
      # いなかった人が、今夜から常連として歩き出す。** セリフを書くのは人なので、
      # そちらは誰かが書いた日にしか変わらない。**ずれても赤くならない。**
      # 実際、49日来ていて出席4位の常連が、視聴者さんに「台詞が普通すぎる」と
      # 言われるまで共通のセリフのままだった。
      # `docs/island-misses.md` #102（隣がいまどれだけ太いかを書き写す）と同じ形で、
      # **隣が動くのに、こちらは動いたことに気づけない**のが根っこ。
      #
      # ## なぜ「焼く」のすぐ後ではなく、いちばん最後なのか
      #
      # **(1) 焼いたあとの名簿を見るため。** 焼く前に数えても、昨日の名簿を
      # 見ているだけで意味がない。
      # **(2) commit と deploy を止めないため。** ここで止めると、セリフが1人
      # 足りないだけで、同じ晩に焼けた他の数字まで道連れで master に入らない。
      # 上の「凍っていないか」と同じ考え方で、**判定は置くが、止めない。**
      # あちらは commit の前に数える必要があったので判定と赤を2つの step に
      # 分けているが、こちらは最後で構わないので1つで済ませている。
      #
      # `tsc` が要るので「site の依存を入れる」より後。ここはその条件も満たす。
      #
      # 終了コード 2（数えるものが無かった）も赤にする。**「数えられなかった」を
      # 「違反なし」と同じ顔にしない**（`docs/island-standards.md` §15）。
      #
      # ここが赤いと、翌朝 `python/bake_down.py` はこの run を「焼くのが落ちた」に
      # 仕分けて issue を立てる（「凍り」に仕分けるのは step
      # 「凍っていたら赤くする」だけなので）。**本文に落ちた step の名前が出るので
      # 何を見ればいいかは分かる**が、焼き直しが止まったわけではない。
      # 仕分けを増やすなら `bake_down.py` の `why_red()` に足す。
      - name: セリフの届いていない人がいないか
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          set -uo pipefail
          node selftest/chatter_selftest.mjs > /tmp/chatter.txt 2>&1 && code=0 || code=$?
          cat /tmp/chatter.txt
          {
            echo ""
            echo "### 島のセリフが、よく歩く人に届いているか"
            echo ""
            echo '```'
            cat /tmp/chatter.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            {
              echo ""
              echo "**この赤は「落ちた」ではありません。** 焼けたものは master に入れて、配るところまで済んでいます。"
              echo "セリフを書き足すのは \`site/content/chatter.ts\`。上に出ている icon で引きます。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::島でよく歩く人に、その人のセリフが届いていません。上の表を見てください"
          fi
          exit "$code"

      # **人しか新しくできない焼き込みが、置いていかれていないか。**
      #
      # 機械で焼ける6本は上の「凍っていないか」が見ている。こちらが見るのは
      # **人が手を入れないと新しくならない側**で、そこは何ヶ月古くなっても
      # 誰も鳴らさなかった（35本のうち29本が見られていなかった。#129）。
      # 実際にショートが127日・料理が12日・他己紹介が13日止まった（#449）。
      #
      # ## なぜ deploy の後ろか
      #
      # **これで commit も deploy も止めない。** 1本が古いだけで、同じ晩に
      # 焼けた他の数字まで master に入らないのは悪い。「セリフの届いて
      # いない人がいないか」と同じ性質で、赤いが「落ちた」ではない。
      # `python/bake_down.py` の仕分けにも `stale` を足してあるので、
      # ここが赤い朝に「焼くのが落ちた」の issue は立たない
      - name: 焼き込みが古くなっていないか
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          python3 python/stale_content_watch.py > /tmp/stale.txt 2>&1 && code=0 || code=$?
          cat /tmp/stale.txt
          {
            echo ""
            echo "### 人しか新しくできない焼き込みが、古くなっていないか"
            echo ""
            echo '```'
            cat /tmp/stale.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            {
              echo ""
              echo "**この赤は「落ちた」ではありません。** 焼けたものは master に入れて、配るところまで済んでいます。"
              echo "新しくするのは \`/island-fresh\`。料理・他己紹介・歩いた国は配信を見ないと決まりません。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      # **取り込みが詰まっていないかを、焼いたあとに見る。**
      #
      # 2026-09-17 に本番を数えたら、`youtube_chat.videos` の `WAITING` 28本のうち
      # 26本が**1回試したきりで半年止まっていた**（いちばん古いのは 2026-02-06。
      # 91本ぶんのチャットが1行も入っていない）。**そのあいだ、取り込みの
      # ワークフローはずっと緑で終わっている。** 緑が言っているのは
      # 「落ちなかった」だけで、「入るべきものが入った」ではない。
      #
      # ここに置いたのは、**この run が取り込みの後ろに繋がっているから**
      # （`workflow_run` で `Fetch YouTube Chat Data` の完了を受けている）。
      # 取り込みの側に足すには `schedule_fetch_chat.yml` を触ることになるが、
      # あちらは最後の step が `YOUTUBE_COOKIES` を書き換えるので、
      # **見張りを足すためだけに触りたくない。**
      #
      # 見ているものと、しきい値の根拠は `python/ingest_watch.py` にある。
      # 判定は BigQuery ではなく Python 側（`judge()`）に置いてあるので、
      # **仕込みの行で赤くなることを手元で確かめられる**
      # （`python3 python/stuck_waiting_selftest.py`）。
      #
      # 終了コード 2（数えるものが無かった）も赤にする。**「数えられなかった」を
      # 「詰まっていない」と同じ顔にしない**（`docs/island-standards.md` §15）。
      #
      # **この赤は焼き直しを止めない。** commit も deploy も済んだあとに見ている。
      #
      # **見るだけ（dry_run）のときは走らせない。** あそこの約束は
      # 「押し間違えても何も起きない」なので、赤も出さない。
      # 手で見たいときは `BQ_PROJECT_ID=… python3 python/ingest_watch.py` で足りる。
      # **見るだけの回でも走らせる。** `ingest_watch.py` は BigQuery を読むだけで
      # 1バイトも書かない。にもかかわらず `REBAKE_DRY == '0'` で縛っていたので、
      # **「見るだけ」で押した人にいちばん見せたいものが見えず、しかも
      # 見張り自身が一度も走らないまま本番の晩を迎えることになっていた**
      # （`CLAUDE.md`「新しく載せたものは、発火を1回見るまで当てにしない」）。
      #
      # ただし**見るだけの回は赤くしない。** ここで赤くすると、詰まりが
      # 片づくまでのあいだ、別の焼き込みを見に来た人の dry run まで全部赤くなり、
      # その回で本当に見たかった失敗が埋もれる。見るだけの回は警告にとどめる。
      # **`if:` に状態関数を書かないと、GitHub が `success()` を黙って足す。**
      # そのせいで見張りが一直線に繋がり、**手前のどれかが赤い晩は、その先の
      # 見張りが全部 skip** されていた。実測（2026-09-16 の赤い run 3回）で、
      # 「凍っていたら赤くする」も「取り込みが詰まっていないか」も skip している。
      #
      # **詰まっている晩ほど、詰まりの見張りが黙る。** いちばん見たい晩に見えない。
      # `!cancelled()` にして、手前が赤くても見張りは最後まで通す。
      # （止めたときだけは走らせない。人が止めた回に鳴らしても意味がない）
      - name: 取り込みが詰まっていないか
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          python3 python/ingest_watch.py > /tmp/ingest_watch.txt 2>&1 && code=0 || code=$?
          cat /tmp/ingest_watch.txt
          if [ "$code" != "0" ]; then
            {
              echo ""
              echo "**この赤は「落ちた」ではありません。** 焼けたものは master に入れて、配るところまで済んでいます。"
              echo "拾い直す枠は \`python/bq/queries.py\` の \`QUERY_SELECT_TARGET_VIDEOS\`、"
              echo "1晩に拾う本数は \`python/config.py\` の \`LATE_LANE_MAX_VIDEOS\` です。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$REBAKE_DRY" = "1" ]; then
            [ "$code" != "0" ] && echo "::warning::取り込みが詰まっています（見るだけの回なので赤くしません）"
            exit 0
          fi
          exit "$code"

      # **黙って赤くならない。** 毎晩ひとりでに走るものは、落ちたことに誰も
      # 気づかない。せめてどこで落ちたかを要約に残す
      # （要約は run の1枚目に出るので、ログを開かずに読める）
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo ""
            echo "### 落ちました"
            echo ""
            echo "- 回そうとしたもの: \`${REBAKE_SCRIPTS:-（決まる前に落ちた）}\`"
            echo "- 見るだけだったか: \`${REBAKE_DRY:-?}\`（1 なら見るだけ）"
            echo "- **master には入れていません。**"
            echo ""
            echo "赤い step を開きます。よくあるのは3つです。"
            echo ""
            echo "1. **焼く** — BigQuery に届いていない（認証・権限）か、クエリが変わった"
            echo "2. **中の数が縮んでいないか** — 焼いた結果がやせた合図。何が何になったかが表で出ています"
            echo "3. **site のビルドが通るか** — 焼いた TS が壊れている。ここで止めたので本番は無事です"
          } >> "$GITHUB_STEP_SUMMARY"
