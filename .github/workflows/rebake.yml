          def _close(s: str, i: int) -> int:
              """`s[i]` の括弧に対応する閉じ括弧の位置。見つからなければ -1。"""
              depth, q, j = 0, "", i
              while j < len(s):
                  ch = s[j]
                  if q:
                      if ch == "\\":
                          j += 2
                          continue
                      if ch == q:
                          q = ""
                  elif ch == '"':
                      q = ch
                  elif ch in "[{":
                      depth += 1
                  elif ch in "]}":
                      depth -= 1
                      if depth == 0:
                          return j
                  j += 1
              return -1


          def _items(s: str) -> list:
              """括弧の中身を、いちばん外側のカンマで切る（文字列と入れ子は跨がない）。"""
              out, cur, depth, q, i = [], "", 0, "", 0
              while i < len(s):
                  ch = s[i]
                  if q:
                      cur += ch
                      if ch == "\\" and i + 1 < len(s):
                          cur += s[i + 1]
                          i += 2
                          continue
                      if ch == q:
                          q = ""
                  elif ch == '"':
                      q = ch
                      cur += ch
                  elif ch in "[{":
                      depth += 1
                      cur += ch
                  elif ch in "]}":
                      depth -= 1
                      cur += ch
                  elif ch == "," and depth == 0:
                      out.append(cur)
                      cur = ""
                  else:
                      cur += ch
                  i += 1
              out.append(cur)
