name: 島の数字を焼き直す

# `site/content/` に**焼き込んである数字**を、BigQuery から取り直して置き換える。
#
# ## なぜ要るか
#
# 毎晩ひとりでに新しくなるのは **BigQuery と Firestore だけ**だった。
#   - cron を持つのは `schedule_fetch_chat.yml` と `fetch_doneru_donations.yml` の2本。
#     どちらも BQ と Firestore しか触らない
#   - Hosting の `npm run build:web` は expo export → public コピー → next build で、
#     **python を1行も通らない**。だから配り直しても数字は動かない
#   - `run_admin_script.yml` が回せるのは `python/admin/` の中だけ
#
# つまり `site/content/` を焼き直す口が**どこにも無かった**。2026-09-05 で止まっていた。
#
# ## なぜ cron を足したか（2026-09-10）
#
# 押せるようにしただけでは足りなかった。**押す人がいないと止まる。**
# 押せるようにした翌日に見たら `residents.ts` は 9/05、`onThisDay.ts` は 9/04 のままで、
# BigQuery のほうは 9/09 まで 762本入っていた。**旅に出たら、誰も押さない。**
#
# 機械だけで答えの決まるものは、機械に毎晩やらせる。
# **人の判断が要るもの（料理・引用・国・章）はここには入れない。**
# 何が機械で決まり、何が人しか決められないかは `docs/island-fresh.md` に表がある。
#
# cron は **01:00 UTC**（日本時間の朝10時ごろ）。
#
# **取り込みの「20:00 UTC」を信じてはいけない。** `schedule_fetch_chat.yml` の
# cron はそう書いてあるが、**実際に走り出すのは 21:49〜23:32 UTC**（直近12回の実測。
# 中央値 22:10）。GitHub のスケジュールは2時間ほど遅れて動く。
#
# 最初ここを 21:30 UTC に置いていたが、それだと**取り込みより先に焼く晩がある。**
# 焼くほうが遅れなければ 21:30 に走り、取り込みは早くても 21:49。
# **毎晩1日ぶん古い数字を焼いて配り続けることになる。**
#
# 01:00 UTC なら、取り込みがいちばん遅かった晩（23:32）より後ろで、
# こちらも2時間遅れたとしても 03:00 UTC。どちらに転んでも取り込みの後ろに入る。
#
# 嘘の数字は出ない（BigQuery に入っているところまでしか数えない）ので、
# 順番が入れ替わっても壊れはしない。**壊れないが、古いまま止まる。** それを避ける。
#
# **……という組み立てだったが、cron そのものが来なかった。** 2026-09-11 の
# 01:00 指定に対し、03:45 UTC まで待っても発火していない。そこで
# **取り込みの完了に繋いだ**（`workflow_run`）。理由は下の `on:` に書いてある。
# 上の 01:00 は保険として残してある（取り込み自体が発火しなかった晩の受け皿）。
#
# ## 手で押すときの既定は「見るだけ」
#
# `dry_run` の既定を true にしてある。押し間違えても本番は変わらない。
# 何がどれだけ変わるかを読んでから、`dry_run: false` でもう一度押す。
# **押す人のいないとき（cron と、取り込みに繋いで来たぶん）だけは
# `dry_run: false` / `deploy: true` で走る**（読む人がいないので）。
#
# ## 焼いたものが縮んでいたら、commit しない
#
# 毎晩ひとりでに走るので、**焼き損なっても誰も見ていない。**
# 焼いたあと commit の前に「中の数が縮んでいないか」を通し、
# **前の晩より縮んでいたら `exit 1` で止める**（master にも Hosting にも入らない）。
#
# 見るのは縮みだけ。**毎晩ぶん増えるのが正常**なので、増えたほうは止めない。
# 何をどのしきい値で見ているかと、その根拠はあちらにルールごと書いてある。
#
# **件数だけでは足りない。** 2026-09-10 に `read_countries()` が `countries.ts` の
# 注釈で正規表現に外れ、ジョージアがまるごと落ちかけた。あのとき
# `onThisDay.ts` の件数は1件も減らず、**場所の字だけが61%の日から消える**。
# だから「中身が埋まっている割合」も一緒に見ている。
#
# ## 毎晩ひとりでに回すもの（**この5本だけ**）
#
#   build_chapter_stats   chapterStats.ts / chapterStreams.ts
#   build_residents       residents.ts
#   build_stream_peaks    streamPeaks.ts
#   build_on_this_day     onThisDay.ts
#   build_city_streams    cityStreams.ts
#
# 前の4本は**入力が BigQuery だけ**なので、人が何も決めなくても正しい答えが出る。
#
# `build_city_streams` だけは上流に人の書く `countries.ts` がある。それでも
# 毎晩に入れたのは、**街の一覧が止まっても、街ごとの本数は機械だけで動くから**。
# ジョージアの滞在は `to: ""` で開いていて、配信が増えればトビリシもカズベキも増える。
# 「上流が止まっているのに緑が付いて、止まっていることが隠れる」（`docs/island-fresh.md` 1章）は、
# ここには当たらない。**変わらないから緑になるのではなく、実際に変わる。**
#
# ## 手で押したときだけ回せるもの（+2本）
#
#   build_country_stats   countryStats.ts    ※
#   build_kitchen_talk    kitchenTalk.ts     ※
#
# **※ この2本は BigQuery を引かない。** 元は `python/data/*.json` に置いてある
# 取り置きなので、回しても**同じものが焼き直るだけで数字は動かない**
# （`country_stats.json` / `kitchen_video_stats.json` / `kitchen_residents.json` /
# `kitchen_icons.json`）。数字を新しくするには、先にその JSON を取り直す必要がある。
# **毎晩に入れないのはそのため。** 変わらないものを毎晩走らせても、「今日も回った」
# という緑が増えるだけで、上流が止まっていることが隠れる。
# 人が上流（`countries.ts` / `recipes.ts` と取り置きの JSON）を新しくしたあとに手で押す。
# 手順は `/island-fresh` にある。
#
# 順番は入力の並びではなく**下の ALL の並びで回す**。依存があるため。
#   - `build_on_this_day` は `streamPeaks.ts` を読む → 先に `build_stream_peaks`
#   - `build_kitchen_talk` は `residents.ts` を読む   → 先に `build_residents`
#
# ## 🔴 ここから回してはいけないもの（allowlist に入れていない理由）
#
# - **`build_legend_days.py`** — **このスクリプトは BigQuery を引かない。**
#   `bigquery` を import すらしておらず、`python/data/legend_streams.json` と
#   `legend_totals.json`（別の口で流した SQL の結果）を焼き直すだけ。
#   しかも**伝説の期間は8つとも過去で閉じている**（いちばん新しい `kazbegi` が
#   2026-08-23 まで）ので、そもそも日が経っても古くならない。
#   古くなるのは**人が `legends.ts` に新しい伝説を足したとき**だけで、そのときは
#   先に `--sql` の SQL を流して JSON を取り直す必要がある。**機械の仕事ではない。**
# - **`build_nordic.py`** — 元にする JSON が `/tmp/` にあってリポジトリに残っていない。
#   **そもそも回せない**（走らせても落ちる）。
# - **`build_shorts.py`** — 元が手書きの表（`python/data/shorts.json`）。
#   **BigQuery にショートは1本も入っていない。** 回しても手で書いたものを焼き直すだけ。
# - **`build_voices.py`** — どの声を載せるかを**人が選ぶ**もの（`voices_picks.json`）。
#   機械が選び直してよいものではない。
# - **`build_nordic_map.py` / `build_world_route.py`** — 地形データから地図を焼くもの。
#   元が動かないので、毎晩回す理由が無い。
#
# ## 秘密の値
#
# このリポジトリは公開で、Actions のログも誰でも読める。
# **入力もログも、数字とファイル名しか出さない。**
# ここで回す7本は YouTube API を叩かないので、**Doneru の鍵は取り出さない**
# （`run_admin_script.yml` はやっているが、ここでは要らない。要らないものは触らない）。

on:
  schedule:
    # 取り込みの実測（21:49〜23:32 UTC）より後ろ。**日本時間の朝10時ごろ**
    - cron: "0 1 * * *"

  # **cron を当てにしない。取り込みが終わったら、その後ろに繋いで走る。**
  #
  # このリポジトリで定時実行が実際に発火した実績があるのは、
  # `schedule_fetch_chat.yml`（20:00 UTC）と `fetch_doneru_donations.yml`（20:30 UTC）
  # の2本だけで、どちらも**何週間も master に載っている**。こちらの cron は
  # 2026-09-10 に載ったばかりで、**まだ一度も発火していない**
  # （2026-09-11 03:45 UTC 時点。01:00 指定に対して2時間45分待っても来なかった。
  #  上の2本の遅れは1時間49分〜3時間32分なので、範囲内ではあるが、
  #  「範囲内だからそのうち来るはず」で17日間を賭ける理由が無い）。
  #
  # 繋ぎ先を `Fetch YouTube Chat Data` にしたのは、**焼く元がそこで揃うから**。
  # あちらは discover → fetch → island_stats まで通してから終わるので、
  # 完了した時点で BigQuery には今日ぶんが入っている。cron の 01:00 より
  # 3時間ほど早くなるが、順番（取り込み → 焼き直し）は変わらない。
  #
  # **`conclusion` は見ない。** あちらの最後の step は「表に無い どねID が
  # 投げ銭してきた」ときに `exit 1` で終わる（あやとへの呼び出しであって、
  # 取り込みの失敗ではない）。成功のときだけ繋ぐと、その晩は焼かれない。
  # `island_stats` も `if: always()` で走っているので、赤くても数字は入っている。
  #
  # **2本とも走っても壊れない。** cron と両方来た晩は2回走るが、
  # 2回目は焼いた結果が1回目と同じなので commit されず
  # （`steps.commit.outputs.changed` が 0）、Hosting も配らない。
  # `concurrency: rebake` で1本ずつしか走らないので push も競らない。
  # 繋ぎ先を2本にしてあるのは、**片方が消えても止まらないようにする**ため。
  # ワークフローの名前で繋ぐので、あちらの `name:` を書き換えると黙って切れる
  # （エラーにならない。**走らなくなるだけ**で、赤も出ない）。
  # 2本のうち Doneru のほうは `probe: true` で1バイトも書かずに手で押せるので、
  # **繋ぎが生きているかを、本番を汚さずに確かめられる**（そのために足した）。
  workflow_run:
    workflows: ["Fetch YouTube Chat Data", "Fetch Doneru Donations"]
    types: [completed]

  workflow_dispatch:
    inputs:
      scripts:
        description: "回すもの（カンマ区切り。空なら7本ぜんぶ）例: build_residents,build_stream_peaks"
        required: false
        default: ""
        type: string
      dry_run:
        description: "見るだけ（commit も deploy もしない）。まずこのまま押す"
        required: false
        default: true
        type: boolean
      deploy:
        description: "commit のあと Hosting も配る（dry_run が false のときだけ効く）"
        required: false
        default: false
        type: boolean

# 2回押したときに、同じファイルを2本が同時に書いて push が競らないように1本ずつ
concurrency:
  group: rebake
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    permissions:
      # 焼き直した site/content/*.ts を master に押し戻す
      contents: write
      # Hosting のデプロイを、こちらから起動する
      actions: write
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          ref: master
          # **浅いままだと rebase できない。** 既定の `fetch-depth: 1` では
          # 手元の1コミットと、取り直した master の1コミットに共通の祖先が
          # 見えず、下の `git pull --rebase` が「関係のない履歴」で落ちる。
          # 毎晩ひとりでに走るので、押し直してくれる人はいない。
          # 517コミット・96MB なので、全部持ってきても数秒しか変わらない
          fetch-depth: 0

      # cron のときは押す人がいない。入力も空で来る（`inputs.*` が空文字になる）。
      # **ここで「見るだけ／配る」を決めて env に置き、以降は env だけを見る。**
      # `!inputs.dry_run` を直接書くと、cron の空文字が false と読まれて
      # たまたま動く、という当てにならない形になる。
      - name: 今回の押しかたを決める
        env:
          EVENT: ${{ github.event_name }}
          IN_SCRIPTS: ${{ inputs.scripts }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          # 取り込みの後ろに繋いで来たぶん（workflow_run）も、押す人はいない。
          # cron と同じ扱いにする。**片方だけ手当てすると、繋ぎ替えたあと
          # 毎晩「見るだけ」で走って、緑なのに何も配られない状態になる。**
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_run" ]; then
            # 毎晩ぶん。**機械だけで答えの決まる5本**を、配るところまで
            echo "REBAKE_IN=build_chapter_stats,build_residents,build_stream_peaks,build_on_this_day,build_city_streams" >> "$GITHUB_ENV"
            echo "REBAKE_DRY=0" >> "$GITHUB_ENV"
            echo "REBAKE_DEPLOY=1" >> "$GITHUB_ENV"
            echo "毎晩ぶん（$EVENT）: 5本を焼いて、変わっていれば配ります"
          else
            echo "REBAKE_IN=$IN_SCRIPTS" >> "$GITHUB_ENV"
            if [ "$IN_DRY" = "false" ]; then
              echo "REBAKE_DRY=0" >> "$GITHUB_ENV"
            else
              echo "REBAKE_DRY=1" >> "$GITHUB_ENV"
            fi
            if [ "$IN_DEPLOY" = "true" ]; then
              echo "REBAKE_DEPLOY=1" >> "$GITHUB_ENV"
            else
              echo "REBAKE_DEPLOY=0" >> "$GITHUB_ENV"
            fi
            echo "手で押したぶん: dry_run=$IN_DRY deploy=$IN_DEPLOY"
          fi

      # 入力は**シェルに直接埋め込まない**。env 経由で受けて "$..." で読む。
      # `${{ inputs.scripts }}` をそのまま run に書くと、入力の中身が
      # シェルの一部として解釈される。allowlist を通る前に走ってしまう。
      - name: 回すものを決める（allowlist）
        run: |
          set -euo pipefail

          # **回してよいのはこれだけ。並びは依存の順**（上のコメント参照）
          ALL="build_chapter_stats build_residents build_stream_peaks build_on_this_day build_city_streams build_country_stats build_kitchen_talk"

          # カンマ・空白・改行で割る。**大文字・`python/`・`.py` は書かれても通す**
          # （スマホの入力欄は勝手に頭を大文字にする。そこで落とすのは意地悪なだけ）
          raw="$(printf '%s' "${REBAKE_IN:-}" | tr ',' '\n' | tr -d ' \t\r' \
                 | tr 'A-Z' 'a-z' | sed 's|^python/||; s/\.py$//' \
                 | grep -v '^$' | tr '\n' ' ' || true)"

          if [ -z "$raw" ]; then
            sel="$ALL"
            echo "入力が空なので7本ぜんぶ回します"
          else
            for n in $raw; do
              # 文字の種類でまず落とす（パスを抜け出す形をここで止める）
              if ! printf '%s' "$n" | grep -qE '^[a-z0-9_]+$'; then
                echo "::error::スクリプト名に使えるのは英小文字・数字・_ だけです: $n"
                exit 1
              fi
              case " $ALL " in
                *" $n "*) ;;
                *)
                  echo "::error::$n は回してよいものに入っていません。何も走らせずに止めます"
                  echo "::error::回せるのは: $ALL"
                  echo "::error::legendDays / nordic / shorts / voices は、入れていない理由がこのファイルの先頭に書いてあります"
                  exit 1
                  ;;
              esac
            done
            # 入力の並びではなく ALL の並びに直す（依存があるため）
            sel=""
            for a in $ALL; do
              case " $raw " in
                *" $a "*) sel="$sel $a" ;;
              esac
            done
            sel="$(printf '%s' "$sel" | sed 's/^ //')"
          fi

          # そのスクリプトが書き換えるファイル。**commit するのはここに挙げたものだけ**
          # （`git add -A` を使わない。別のものが混ざって master に入らないように）
          paths=""
          for s in $sel; do
            case "$s" in
              build_chapter_stats) p="site/content/chapterStats.ts site/content/chapterStreams.ts" ;;
              build_residents)     p="site/content/residents.ts" ;;
              build_stream_peaks)  p="site/content/streamPeaks.ts" ;;
              build_on_this_day)   p="site/content/onThisDay.ts" ;;
              build_city_streams)  p="site/content/cityStreams.ts" ;;
              build_country_stats) p="site/content/countryStats.ts" ;;
              build_kitchen_talk)  p="site/content/kitchenTalk.ts" ;;
              *) echo "::error::$s に対応するファイルが決まっていません"; exit 1 ;;
            esac
            paths="$paths $p"
          done
          paths="$(printf '%s' "$paths" | sed 's/^ //')"

          echo "回すもの: $sel"
          echo "書き換わりうるファイル: $paths"
          echo "REBAKE_SCRIPTS=$sel" >> "$GITHUB_ENV"
          echo "REBAKE_PATHS=$paths" >> "$GITHUB_ENV"

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # 焼く前の姿を取っておく。あとで「前 → 後」を並べて出すため
      - name: 焼く前を取っておく
        run: |
          set -euo pipefail
          mkdir -p /tmp/rebake-before
          for p in $REBAKE_PATHS; do
            if [ -f "$p" ]; then cp "$p" "/tmp/rebake-before/$(basename "$p")"; fi
          done
          ls -l /tmp/rebake-before

      - name: 焼く
        run: |
          set -euo pipefail
          for s in $REBAKE_SCRIPTS; do
            echo "::group::$s"
            case "$s" in
              # この2本は取り置きの JSON から焼き直すだけ。--build は本人の docstring に合わせた形
              build_country_stats|build_kitchen_talk) python "python/$s.py" --build ;;
              *) python "python/$s.py" ;;
            esac
            echo "::endgroup::"
          done

      - name: 何がどれだけ変わったか
        run: |
          set -euo pipefail
          echo "### 焼き直した結果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- $REBAKE_PATHS; then
            echo "**変わりませんでした。**" >> "$GITHUB_STEP_SUMMARY"
            echo "変わりませんでした"
          fi

          echo "#### ファイル" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat -- $REBAKE_PATHS | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 中身の差分そのもの。**1行を200文字で切る。**
      # onThisDay.ts は1行が100KB近くあるので、切らずに出すとログが読めなくなる
      - name: 変わった行（先頭だけ）
        run: |
          set -euo pipefail
          for p in $REBAKE_PATHS; do
            if git diff --quiet -- "$p"; then continue; fi
            echo "::group::$p"
            git --no-pager diff -U0 -- "$p" \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | cut -c1-200 | head -60 || true
            echo "::endgroup::"
          done

      # **数え方の不具合は、緑のまま master に入る。**
      #
      # 前はここが `residents.ts` の `ACTIVE_FRIENDS` だけを見ていた。
      # 見ていた理由は実際に起きたから（61 → 174。読めなかった日を全員の出席に
      # 足していたので、1回来ただけの人が72人「ここ3ヶ月の常連」に混ざった。
      # `python/build_residents.py` の docstring に実測が残っている）。
      # **あのときは目で見て止めた。毎晩ひとりでに回すなら、その目はいない。**
      #
      # ほかの焼き込みには何も無かった。そして 2026-09-10、
      # `build_on_this_day.py` の `read_countries()` が `countries.ts` の注釈で
      # 正規表現に外れ、**ジョージアをまるごと落とす**ところだった。
      # onThisDay.ts の618件のうち378件がジョージアなので、
      # **61%の日から場所の字が消えたものが、そのまま commit される**ところだった。
      #
      # このとき**件数は1件も減らない**（`place_of()` が `("", "")` を返すだけ）。
      # だから「日めくりの日 365 / 配信 618」は前の晩と同じ数字が並ぶ。
      # **数を数えるだけでは捕まらない。中身が埋まっている割合まで見る。**
      #
      # 何をどのしきい値で見ているかと、その根拠は、下の `RULES` にルールごと
      # 書いてある。**焼くスクリプトの中にも止め金があるが、二重ではない。**
      # スクリプトの中は「入力を読み落とした」を、ここは「出力がやせた」を捕まえる
      # （分担の表は、下の docstring にある）。
      #
      # 前と後の数を並べる表も、ここが出す。**しきい値と判定を同じ表に置く**
      # ほうが、旅先でスマホから読んで手を打てる。
      - name: 中の数が縮んでいないか
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """焼き直したものが**縮んでいないか**を、commit の前に見る。

          ## なぜ要るか

          `.github/workflows/rebake.yml` は毎晩ひとりでに走って、焼いた結果を master に
          押し込む。**読む人はいない。** だから「落ちた」ことに誰も気づけない。

          2026-09-10 に実際に起きかけた。`build_on_this_day.py` の `read_countries()` が
          `countries.ts` の注釈で正規表現に外れ、**ジョージアをまるごと落としていた**
          （読めた国が18ではなく17）。`onThisDay.ts` の618件のうち378件がジョージアなので、
          **61%の日から場所の字が消えたものが、そのまま commit される**ところだった。

          このとき**件数は1件も減らない。** `place_of()` が `("", "")` を返すだけなので、
          「日めくりの日 365 / 配信 618」は前の晩と同じ数字が並ぶ。
          **数を数えるだけでは捕まらない。中身が埋まっている割合まで見る。**

          ## スクリプトの中の止め金との分担（二重ではない。層が違う）

          | どこ | 何を捕まえるか | 例 |
          | --- | --- | --- |
          | スクリプトの中（`read_countries` / `read_stays`） | **読めなかった** | `countries.ts` の滞在が18件あるのに17件しか読めていない → 例外 |
          | ここ（ワークフロー） | **結果が縮んだ** | 読めてはいるが、焼いた結果の場所が61%空になった |

          **上流は「入力を読み落とした瞬間」に落ちる。ここは「出力がやせた」ときに落ちる。**
          入力の読み落としは形が変わるたびに新しい抜け道ができるので、
          **出口でもう一度、数で見る。** 上流が完璧なら、ここは一生鳴らない。それでよい。

          ## しきい値の決めかた

          **「なんとなく 0.9」にしない。** 焼き込みはほぼ全部が**累積**（配信は増えるだけ）
          なので、正常な晩の動きは「増える」か「動かない」しかない。
          縮むのは (1) 動画が非公開になった (2) 取り込み直しで境目の値が動いた、の2つで、
          どちらも**1〜数件**。**塊（国ひとつ・章ひとつ）が落ちると数十%動く。**
          その2つのあいだにしきい値を置く。実測した塊の大きさは各ルールのコメントに書いた。

          窓で切っているもの（`residents.ts` は直近90日）だけは正常でも上下するので、
          そこは既存の `ACTIVE_FRIENDS` の 1.5倍幅にそろえる。

          **増えるのは止めない。** 毎晩ぶん増えるのが正常なので、見るのは縮みだけ。

          ## 手元で確かめる

          **この step はワークフローの中に埋めてある。** 別ファイルにすると、
          上のチェックアウトが `ref: master` なので、**枝から押しても master 側の
          古い止め金が走る**（枝で直しても、その枝では試せない）。

          手元で回すときは、この step の中身を取り出して、ファイルとして走らせる:

            python3 -c "import yaml;print([s for s in yaml.safe_load(
              open('.github/workflows/rebake.yml'))['jobs']['rebake']['steps']
              if s['name']=='中の数が縮んでいないか'][0]['run'])" > /tmp/g.sh
            # <<'PY' から PY までを /tmp/guard.py に切り出して
            REBAKE_PATHS="site/content/onThisDay.ts" python3 /tmp/guard.py --before /tmp/before
          """

          import argparse
          import os
          import pathlib
          import re
          import sys

          # 見かたは4つ。
          #   keep  : 1つでも減ったら止める。**読み落としでしか減らない数**にだけ使う
          #           （章は `chapters.ts`、国は `countries.ts` から来る。人が書いた表は消えない）
          #   floor : 前の値の何倍まで縮んでよいか。累積の数に使う
          #   band  : 上にも下にも幅を持たせる。窓で切っていて正常でも動く数に使う
          #   share : 「埋まっている割合」が何ポイント落ちたら止めるか。
          #           **件数が減らないまま中身だけ空になる壊れかた**は、これでしか捕まらない
          KEEP, FLOOR, BAND, SHARE = "keep", "floor", "band", "share"


          def rule(label, kind, arg, pat=None, mode="count", num=None, den=None, note=""):
              return {
                  "label": label, "kind": kind, "arg": arg,
                  "pat": pat, "mode": mode, "num": num, "den": den, "note": note,
              }


          # 2026-09-10 の本番の値を () に入れてある。しきい値はこの値から決めた
          RULES = {
              "chapterStats.ts": [
                  # 章（4）は chapters.ts から読む。章は閉じても消えないので、減ったら読み落とし
                  rule("章", KEEP, 0, r'^\s{2}"[a-z0-9-]+": \{'),
                  # のべ人数（2,830）。いちばん小さい章（middle-east 177人）が落ちると -6.3%。
                  # 配信が1本消えても数人しか動かないので、そのあいだの 0.95
                  rule("のべ人数", FLOOR, 0.95, r"people: (\d+)", mode="sum"),
                  # 配信（676）。iran-walk は9本（1.3%）しかないので、ここでは捕まらない。
                  # **章まるごとが落ちる形は上の「章」が先に捕まえる**
                  rule("配信", FLOOR, 0.95, r"streams: (\d+)", mode="sum"),
                  # 章にいた住人の行（44）。residents_map.json が読めないと44行ごと消える
                  rule("章にいる住人", FLOOR, 0.9, r"days: (\d+)"),
              ],
              "chapterStreams.ts": [
                  # 章（3）。**いまの島は入らない**ので、章が閉じたときだけ増える
                  rule("章", KEEP, 0, r'^\s{2}"[a-z0-9-]+": \['),
                  # 配信（240）。閉じた章ぶんだけなので、ふだんは1本も動かない
                  rule("配信", FLOOR, 0.95, r'^\s{4}\["'),
                  # 題名（240/240）。BigQuery の列が空で返ると、本数はそのままで字だけ消える
                  rule("題名の入っている配信", SHARE, 5.0,
                       num=r'^\s{4}\["[^"]*", "[^"]*", "[^"]+"', den=r'^\s{4}\["'),
              ],
              "residents.ts": [
                  # 直近90日の常連（61）。**既存の止め金をそのまま持ってきた。**
                  # 一晩で 1.5倍／2/3 に動くのは、人の出入りではなく数え方が変わったときだけ
                  # （61 → 174 になったことがある。`python/build_residents.py` の docstring）
                  rule("直近90日の常連", BAND, 1.5, r"ACTIVE_FRIENDS = (\d+)", mode="sum"),
                  # 島に出ている住人（22）。90日窓なので抜ける人がいる。幅は上と同じ 1/1.5
                  rule("住人", FLOOR, 1 / 1.5, r"days: (\d+)"),
                  # 絵の分かっている住人（22/22）。residents_map.json が読めないと絵だけ消える
                  rule("絵の分かっている住人", SHARE, 5.0, num=r"icon: \"", den=r"days: (\d+)"),
              ],
              "streamPeaks.ts": [
                  # 山の出せる配信（251）。累積。取り込み直しで n が15を割る回があっても数本
                  rule("山の出せる配信", FLOOR, 0.95, r'"k":'),
              ],
              "onThisDay.ts": [
                  # 日めくりの日（365）。1年ぶんなのでほぼ動かない。動画が消えて、その月日が
                  # その1本しか無かったときだけ1つ減る。数日ぶんは許す
                  rule("日めくりの日", FLOOR, 0.98, r'"\d\d-\d\d":'),
                  # 配信（618）
                  rule("配信", FLOOR, 0.95, r'"v":'),
                  # **本丸。** ジョージアが落ちたとき、件数は618のままで場所だけ 617→240 になる。
                  # 割合で見れば 99.8% → 38.8%（-61pt）。国ひとつぶんが落ちれば必ずここに出る
                  # （いちばん小さい国スロバキアの1件だけは -0.2pt で抜けるが、そちらは
                  #  `read_countries()` の中の止め金が「読めなかった」として先に落とす）
                  rule("場所の字が入っている配信", SHARE, 5.0, num=r'"p":"[^"]', den=r'"v":'),
              ],
              "cityStreams.ts": [
                  # 国（18）。countries.ts の国そのもの。減ったら読み落とし。
                  # **いちばん小さい国はオランダの配信1本**なので、本数では捕まらない。ここで捕まえる
                  rule("国", KEEP, 0, r'^\s{2}"[a-z-]+": \{'),
                  # 街（49）。ジョージアの7街が落ちると -14%。1街の増減では止めない
                  rule("街", FLOOR, 0.9, r'^\s{4}"[^"]+": \['),
                  # 配信（322）。ジョージアぶんは51本（-16%）
                  rule("配信", FLOOR, 0.9, r'"videoId":'),
                  rule("題名の入っている配信", SHARE, 5.0, num=r'"title": "[^"]', den=r'"videoId":'),
              ],
              # 下の2本は手で押したときしか回らない（BigQuery を引かず、取り置きの JSON を
              # 焼き直すだけ）。見る人がいる場面だが、**同じ形でそろえておく**
              "countryStats.ts": [
                  rule("国", KEEP, 0, r"lives: (\d+)"),
                  rule("配信", FLOOR, 0.95, r"lives: (\d+)", mode="sum"),
                  rule("コメント", FLOOR, 0.95, r"msgs: (\d+)", mode="sum"),
              ],
              "kitchenTalk.ts": [
                  rule("料理", FLOOR, 0.95, r"people: (\d+)"),
                  rule("引用", FLOOR, 0.9, r"\btext: "),
              ],
          }


          def measure(text, pat, mode):
              """当たった数（count）か、当たった数字の合計（sum）。"""
              hits = re.findall(pat, text, re.M)
              if mode == "sum":
                  return sum(int(h) for h in hits if str(h).isdigit())
              return len(hits)


          def num(v):
              return f"{v:,}"


          def pct(v):
              return f"{v * 100:.1f}%"


          def judge(r, before_text, after_text):
              """1つのルールを見る。(通ったか, 前の表示, 後の表示, 許す下限の表示, 一言) を返す。"""
              if r["kind"] == SHARE:
                  db = measure(before_text, r["den"], "count")
                  da = measure(after_text, r["den"], "count")
                  if db == 0 or da == 0:
                      # 分母が無い = 前が空か、焼いた結果が空。後者は他のルールが落とす
                      return True, "—", "—", "—", "数えるものが無いので飛ばした"
                  sb, sa = measure(before_text, r["num"], "count") / db, measure(after_text, r["num"], "count") / da
                  lo = sb - r["arg"] / 100
                  ok = sa >= lo
                  return ok, pct(sb), pct(sa), f"{pct(lo)} 以上", f"{(sa - sb) * 100:+.1f}pt"

              b = measure(before_text, r["pat"], r["mode"])
              a = measure(after_text, r["pat"], r["mode"])
              if b == 0:
                  return True, num(b), num(a), "—", "前の値が0なので飛ばした"

              if r["kind"] == KEEP:
                  return a >= b, num(b), num(a), f"{num(b)} 以上", f"{a - b:+,}"
              if r["kind"] == BAND:
                  lo, hi = b / r["arg"], b * r["arg"]
                  return lo <= a <= hi, num(b), num(a), f"{lo:,.1f}〜{hi:,.1f}", f"{a - b:+,}"
              lo = b * r["arg"]
              return a >= lo, num(b), num(a), f"{lo:,.1f} 以上", f"{a - b:+,}"


          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("--before", default="/tmp/rebake-before", help="焼く前を取っておいた場所")
              ap.add_argument("--paths", default=os.environ.get("REBAKE_PATHS", ""),
                              help="焼いたファイル（空白区切り）")
              args = ap.parse_args()

              before_dir = pathlib.Path(args.before)
              rows, bad = [], []

              for p in args.paths.split():
                  after_p = pathlib.Path(p)
                  name = after_p.name
                  if not after_p.exists():
                      bad.append((name, "焼かれていない", "—", "—", "—", "ファイルが無い"))
                      continue
                  before_p = before_dir / name
                  if not before_p.exists():
                      rows.append((name, "（前が無い）", "—", "—", "—", "初めて焼いたので比べない"))
                      continue
                  after_text = after_p.read_text(encoding="utf-8")
                  before_text = before_p.read_text(encoding="utf-8")
                  for r in RULES.get(name, []):
                      ok, b, a, limit, note = judge(r, before_text, after_text)
                      rows.append((name, r["label"], b, a, limit, note if ok else f"**{note}**"))
                      if not ok:
                          bad.append((name, r["label"], b, a, limit, note))

              md = [
                  "",
                  "#### 中の数（焼く前 → 焼いた後）",
                  "",
                  "| ファイル | 何を | 前 | 後 | 止めない範囲 | 差 |",
                  "| --- | --- | ---: | ---: | ---: | ---: |",
              ]
              md += ["| " + " | ".join(str(x) for x in row) + " |" for row in rows]
              md.append("")

              if bad:
                  # **何が何になったかを書く。** 旅先でスマホから読んで、そのまま手を
                  # 打てるところまで。「止めました」だけでは、読んでも何もできない
                  md += [
                      "**止めました。commit も deploy もしていません。**",
                      "",
                      "焼いた結果が、焼く前より縮んでいます。**毎晩ぶんは増えるのが正常**なので、",
                      "縮むのは数え方か読み方が変わったときです。",
                      "",
                      "| ファイル | 何を | 前 | 後 | 止めない範囲 |",
                      "| --- | --- | ---: | ---: | ---: |",
                  ]
                  md += [f"| {n} | {l} | {b} | {a} | {lim} |" for n, l, b, a, lim, _ in bad]
                  md += [
                      "",
                      "見るところは3つです。",
                      "",
                      "1. **割合（`%` で出ているもの）が落ちているとき** — 件数はそのままで",
                      "   中身だけ空になっています。焼くときの入力（`countries.ts` /",
                      "   `residents_map.json`）を読み落としている可能性がいちばん高い",
                      "2. **件数が落ちているとき** — BigQuery から返ってきた行が減っています。",
                      "   取り込み（Fetch YouTube Chat Data）が失敗した晩ではないか",
                      "3. **「章」「国」が落ちているとき** — 人が書いた表を読めていません。",
                      "   その表を触った直後なら、書き方が正規表現から外れています",
                      "",
                      "直したら、Actions から `dry_run: false` で押し直します。",
                      "**master には何も入っていないので、急がなくても壊れません。**",
                      "",
                  ]
              else:
                  md += ["縮んでいるものはありませんでした。", ""]

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("\n".join(md) + "\n")
              print("\n".join(md))

              # 注釈（run の頭に赤く出るもの）は要約とは別に、1件ずつ出す
              for name, label, b, a, limit, note in bad:
                  print(f"::error::{name} の「{label}」が {b} → {a}（{note}）。"
                        f"止めない範囲は {limit} です。commit していません")
              return 1 if bad else 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      # **焼いた TS がビルドを通ることを、commit の前に確かめる。**
      # 自動生成なので構文が壊れることは滅多にないが、壊れたときに起きるのは
      # 「master が赤くなる」ではなく「**Hosting のデプロイが落ちて、次に誰かが
      # 配るまで誰も気づかない**」。commit の前に落としたほうがずっと安い。
      #
      # dry_run のときも通す。**dry_run は本番の予行なので、予行で確かめない
      # ものは予行の意味がない。**
      #
      # 中身は Hosting が走らせている `build:island`
      # （`npm --prefix site ci && npm --prefix site run build`）と同じ。
      # **同じものを先にここで通す**から、通れば Hosting も通る。
      - name: Node の用意
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: site の依存を入れる
        working-directory: site
        run: npm ci

      # `NEXT_DIST_DIR` は付けない。既定の `.next` は `site/tsconfig.json` の
      # include にもう入っているので、Next が include を書き足さずに済む
      # （書き足されると tsconfig.json が汚れる。commit は名指しなので混ざりは
      #   しないが、汚れずに終わるほうがよい）
      - name: site のビルドが通るか
        working-directory: site
        run: npx next build

      - name: 見るだけで終わる
        if: env.REBAKE_DRY == '1'
        run: |
          {
            echo ""
            echo "**見るだけ（dry_run）で終わりました。** commit も deploy もしていません。"
            echo ""
            echo "焼いた中身で \`next build\` が通ることまでは確かめてあります。"
            echo "上の数字でよければ、同じ入力のまま **dry_run のチェックを外して**もう一度押します。"
            if [ "$REBAKE_DEPLOY" = "1" ]; then
              echo ""
              echo "> deploy を on にしてありますが、dry_run が優先なので配っていません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: master に入れる
        id: commit
        if: env.REBAKE_DRY == '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- $REBAKE_PATHS; then
            echo "変わっていません。commit しません"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**変わっていないので commit しませんでした。**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $REBAKE_PATHS
          git commit \
            -m "島に焼き込んである数字を取り直す（$REBAKE_SCRIPTS）" \
            -m "焼き込みは配り直しても動かない。取り込みが毎晩進むぶん、置いたままだと画面の数字だけが止まる。"
          # 毎晩ひとりでに走るので、焼いているあいだに誰かが master へ入れていることが
          # ある。**そのまま push すると落ちて、その晩ぶんが黙って消える。**
          # 取り込んでから押す（rebase なので、載せ直すのは自分の1コミットだけ）
          # **`--autostash` を外さない。** この直前で `next build` を通しているので、
          # Next が `tsconfig.json` の include や `next-env.d.ts` を書き足していると
          # 作業ツリーが汚れている。素の `git pull --rebase` は汚れていると
          # 「unstaged changes がある」で止まり、**その晩ぶんが黙って消える。**
          # commit は名指しなので、退避したぶんが混ざることはない
          git pull --rebase --autostash origin master
          git push origin HEAD:master
          echo "changed=1" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**master に入れました。**" >> "$GITHUB_STEP_SUMMARY"

      # 焼き込みは Hosting を配り直して初めて画面に出る。
      # **deploy を on にしたときだけ**（手で押したときの既定は off。cron は on）
      - name: Hosting を配る
        if: env.REBAKE_DRY == '0' && env.REBAKE_DEPLOY == '1' && steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run firebase-hosting-deploy-prod.yml --ref master
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Hosting のデプロイを起動しました。** 10分ほどで画面に出ます。" >> "$GITHUB_STEP_SUMMARY"

      - name: 配っていないときの案内
        if: env.REBAKE_DRY == '0' && env.REBAKE_DEPLOY != '1' && steps.commit.outputs.changed == '1'
        run: |
          {
            echo ""
            echo "**まだ画面には出ていません。** 焼き込みは配り直して初めて入れ替わります。"
            echo "Actions の「Firebase Hosting Deploy」を手で起動するか、deploy を on にしてもう一度押してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      # **黙って赤くならない。** 毎晩ひとりでに走るものは、落ちたことに誰も
      # 気づかない。せめてどこで落ちたかを要約に残す
      # （要約は run の1枚目に出るので、ログを開かずに読める）
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo ""
            echo "### 落ちました"
            echo ""
            echo "- 回そうとしたもの: \`${REBAKE_SCRIPTS:-（決まる前に落ちた）}\`"
            echo "- 見るだけだったか: \`${REBAKE_DRY:-?}\`（1 なら見るだけ）"
            echo "- **master には入れていません。**"
            echo ""
            echo "赤い step を開きます。よくあるのは3つです。"
            echo ""
            echo "1. **焼く** — BigQuery に届いていない（認証・権限）か、クエリが変わった"
            echo "2. **中の数が縮んでいないか** — 焼いた結果がやせた合図。何が何になったかが表で出ています"
            echo "3. **site のビルドが通るか** — 焼いた TS が壊れている。ここで止めたので本番は無事です"
          } >> "$GITHUB_STEP_SUMMARY"
