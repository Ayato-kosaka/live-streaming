              同じ字面になるが、A の中の `"date"` が変われば A 自身が変わるので
              字面も変わる。**「どこに何が入っているか」は潰さない。**
              """
              out, i, q = [], 0, ""
              while i < len(s):
                  ch = s[i]
                  if q:
                      out.append(ch)
                      if ch == "\\" and i + 1 < len(s):
                          out.append(s[i + 1])
                          i += 2
                          continue
                      if ch == q:
