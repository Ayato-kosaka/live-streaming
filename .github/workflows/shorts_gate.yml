name: ショート動画の承認を記録する

# **あやとの `/approve` `/reject` `/revise` を確かめて、github-actions[bot] が記録する。**
#
# ショート動画は、あやとの承認を2回通らないと先へ進めない（企画・完成動画）。
# 後段（本編集・投稿）は `tools/shorts/gate.py require` で、ここが書いた記録を探す。
# 書式・守れること・守れないことは `tools/shorts/gate.md`。
#
# ## 判定はここに持たない
#
# 見分けは `tools/shorts/gate.py` の `judge()` ひとつ。後段が記録を確かめるときも
# **同じ関数**を通す。ここがするのは「受け取りを渡す」だけ。承認者の名前も、
# 札の名前も、この yaml には1文字も書かない（片方を直した日に、もう片方が黙って置いていかれる）。
#
# 同じ理由で、job の `if:` に札（`shorts`）を書いていない。札の無い issue での
# `/approve` には「札が無いので数えない」と返す——黙って何も起きないのが、いちばん悪い。
#
# ## 見分けの肝: 著者の名前では分からない
#
# セッション（AI）は**あやと本人のアカウント**で書く。`user.login` も
# `author_association` も、あやと本人と同じ。違うのは `performed_via_github_app`
# だけで、Claude の App を通ったコメントには `claude` が入る。
# **`null` は「人間の証明」ではない**（個人のトークンで書けば AI でも `null`）。
#
# ## 受け取りの中身では判定しない
#
# `gate.py` はコメントを REST で**読み直して**から判定する。書かれてから
# ここが走るまでのあいだの書き換え・削除を、受け取り（`$GITHUB_EVENT_PATH`）は知らない。
#
# ## 公開のログに本文を出さない
#
# このリポジトリは公開で、Actions のログも誰でも読める。受け取りはファイルから読む——
# `${{ github.event.comment.body }}` を差し込むと、ログに出るうえに、中身が
# そのままシェルの字になる（コメントは誰でも書ける）。要約に出すのは番号と理由の名前だけ。
#
# ## 本番で確かめられるのは master に入ってから
#
# `issue_comment` は**既定の枝（master）のこのファイル**で走る。枝の上で直しても動かない。
#
# ## 過ぎたコメントを読み直す口（手で起動）
#
# 受け口が落ちた・その日の言いかたの表で読めなかった、で記録の出なかった返事を、
# issue 番号とコメント ID を渡して読み直す（#926 の「Aは今出して」がそれだった）。
# 判定は `gate.py reread` が、いつもと同じ `judge()` で行う。App の判定・承認者・
# 書き換え・札・提出との順序も同じに通す。**断りは issue に書かず、この run の要約と赤で返す**
# （押したのは運営の側で、あやとに「書き直して」を出さない）。
# 手で起動できるのは、このリポジトリに書き込み権限のある人だけ（GitHub の決まり）。
# 入力はシェルに差し込まず、環境変数で渡して gate.py が数字として読む。

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('#{0} のコメント {1} を読み直す（ショートの承認）', inputs.issue, inputs.comment_id)
      || format('#{0} へのコメント（ショートの承認）', github.event.issue.number) }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: issue の番号（例 926）
        required: true
        type: string
      comment_id:
        description: 読み直すコメントの ID（URL の issuecomment- のうしろの数字）
        required: true
        type: string

# **`concurrency` を置かない。** 同じ group で待てる run は1本だけで、3本続くと
# 真ん中が黙って取り消される。取り消された承認は記録も返事も出ず、あやとには
# 「書いたのに何も起きない」としか見えない。並べて走らせても、判定はそのコメントより
# **前**しか見ないので食い違わない。企画と動画を数秒のうちに続けて承認したときだけ、
# 動画の側が「企画の承認がまだ」と返ることがある——返事が出るので、書き直せば済む。

permissions:
  contents: read
  # 記録・断りのコメントと、gate1-approved / gate2-approved の札のぶんだけ
  issues: write

jobs:
  gate:
    # PR へのコメントも issue_comment で来る。ショートは issue でしか回さない
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # **判定と承認者の表だけ取る。** 対象外のコメントでも走るので、ここは軽いほどよい
      - name: 判定だけチェックアウト
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/shorts/gate.py
            shorts/config/approvers.json
          sparse-checkout-cone-mode: false

      # 対象外のコメント（命令でも提出でもない）は、GitHub の口を1回も叩かずに終わる
      - name: 承認を確かめて記録する
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/shorts/gate.py record --event "$GITHUB_EVENT_PATH"

      # 記録しなかったとき（断り）は終了コード 1 で赤くなる。理由は要約に1行
      - name: 過ぎたコメントを読み直して記録する
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          COMMENT: ${{ inputs.comment_id }}
        run: python3 tools/shorts/gate.py reread --issue "$ISSUE" --comment "$COMMENT"

      # **黙って赤くならない。** 記録が書けないと、後段は「承認の記録がありません」で止まる。
      # 止まる向きなので危なくはないが、あやとには「承認したのに進まない」としか見えない
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo "### ショートの承認を記録できませんでした"
            echo ""
            echo '**承認は記録されていません。** 後段は止まったままです。'
            echo '読み直し（手で起動）なら、上の step の1行が記録しなかった理由です。'
            echo '同じ命令を、新しいコメントでもう一度書けば記録し直します。'
            echo '判定のほうを疑うときは `python3 tools/shorts/gate_selftest.py` を手元で回す。'
          } >> "$GITHUB_STEP_SUMMARY"
