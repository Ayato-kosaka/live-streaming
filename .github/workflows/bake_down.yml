name: 焼き直しが止まっているを issue に映す

# 毎晩の焼き直し（`島の数字を焼き直す`）が新しくなっていないあいだ、
# **issue を1本だけ開き続ける**（`python/bake_down.py`）。また焼けたら、自分で閉じる。
#
# ## なぜ要るか
#
# 2026-09-16、定時の焼き直しが **TypeError で2秒で落ちた。** 焼き直しは1本目で
# 止まるので、residents も stream_peaks も on_this_day も city_streams も回らず、
# **島の数字が丸ごと1日止まった**（`docs/island-misses.md` #105）。
# 同じ理由でその日のうちにもう1回落ちた。
#
# **そのあいだ issue は1本も立っていない。** 直近30本の run のうち赤はその2本だけで、
# 対応する issue は0件。見つかったのは、こちらがたまたま Actions を見に行ったからで、
# **仕組みではなかった。**
#
# `ingest_down.yml` の頭に、もう答えが書いてある。赤は Actions の一覧の中にしか
# 出ないうえ、**「起きたこと」であって「いま残っていること」ではない。**
# 次の晩に緑が積まれれば下へ流れていく。だから赤を強くするのではなく、
# **いまの状態そのものを、人が毎日見る場所（issue の一覧）に置く。**
# 取り込み（Doneru）にはその見張りが在るのに、**焼き直しには無かった。**
#
# ## 2通りの赤を、1本の issue で扱う
#
# `島の数字を焼き直す` は2通りで赤くなる。**焼くのが落ちた**（途中で止まった）と、
# **凍っていた**（焼けたが中身が何日も動いていない）。視聴者さんから見れば
# どちらも「島の数字が古い」の1つなので、**issue は同じ1本。**
# 直し方が違うので、**本文で書き分ける**（`python/bake_down.py` の `body()`）。
#
# **数えるのは無人で走ったぶんだけ**（cron と `workflow_run`）。手で押した run は
# 押した人がその場で見ているし、手押しの既定は `dry_run: true` で**通っても master には
# 1バイトも入らない。** そこを緑として読むと、止まっているのに issue を閉じる。
# **ただし赤いあとで手で押して通っていたら、その朝は判断を保留する**（開きも閉じもしない）。
# 手押しでも焼くところは同じように通るので、そこが緑なら焼くのはもう直っている。
# 直した直後に「止まっています」と言わないため
# （2026-09-16 の本番がこの形。05:34 と 08:33 が赤、08:37 に手で押して緑）。
#
# **凍っているかどうかは、こちらでは判定しない。** 何が正常かは
# `docs/island-fresh.md` と、あちらの step「凍っていないか」が既に決めている。
# ここがもう一度書くと、しきい値が2か所になって、片方を直し忘れた日に食い違う。
# 見るのは**「凍っていたら赤くする」という step が落ちたかどうか**だけ。
#
# ## 繋ぎ先（`workflow_run`）
#
# 読む元は `rebake.yml` の run そのものなので、**その完了の後ろに繋ぐ。**
#
# **cron を当てにしない。** このリポジトリで定時実行が実際に発火した実績が
# あるのは `Fetch YouTube Chat Data`（20:00 UTC）と `Fetch Doneru Donations`
# （20:30 UTC）の古参2本だけで、しかも1時間49分〜3時間32分遅れて走る。
# 2026-09-10 に載せた `rebake.yml` の cron（01:00 UTC）は、翌朝 03:45 まで
# 待っても発火しなかった。下の cron は**保険**として置いてある。
#
# 繋ぎ先を2本にしてあるのは、**片方が消えても止まらないようにする**ため。
# `Fetch YouTube Chat Data` のほうは**発火の実績がある**ので、`島の数字を焼き直す`
# 側の繋ぎが切れた朝でも、こちらは起きる。ただしそのときに読むのは
# **前の日の run** なので、その1回は状態が1日古い。次の1回で追いつく。
#
# **2本とも走った日は2回回るが、2回目は何も書かない**（同じ run を読むので
# 本文も同じ。`bake_down.py` の `decide()`）。
#
# **`conclusion` は見ない。** 繋ぎ先が赤い日こそ、こちらが動かないといけない。
# そもそも `島の数字を焼き直す` が赤いことを映すのがこの仕事なので、
# 成功したときだけ繋ぐと**いちばん要る朝だけ黙る。**
#
# **繋ぎはワークフローの `name:` で解決される。** あちらの名前を変えると
# 黙って切れる。**赤くならない。走らなくなるだけ。**
# 名前が実在するかは `python/bake_down_selftest.py` が毎回突き合わせている
# （`.github/workflows/*.yml` を読んで、ここに書いた名前と照合する）。
#
# ## 手で押すときの既定は「見るだけ」
#
# `apply` の既定は false。押し間違えても issue は動かない。
# **押す人のいないとき（cron と、焼き直しに繋いで来たぶん）だけ apply で走る。**
#
# ## 止まっていても赤くしない
#
# 焼き直しが止まっている朝でも、この job は緑で終わる。
# **赤で知らせるのをやめるために作ったもの**が自分で赤を積んだら元に戻る。
# 赤くなるのは「判断のところが壊れている」「GitHub に届かない」
# ＝**この仕組みそのものが動いていない**ときだけ。

on:
  workflow_run:
    # 読む元は前者の run。後者は前者の繋ぎが切れたときの受け皿（発火の実績あり）
    workflows: ["島の数字を焼き直す", "Fetch YouTube Chat Data"]
    types: [completed]

  schedule:
    # 保険。焼き直しの cron（01:00 UTC）より後ろ。日本時間の昼過ぎ
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      apply:
        description: "issue を実際に開く／書き換える／閉じる（off なら見るだけ）"
        required: false
        default: false
        type: boolean

# 焼き直しと取り込みが続けて終わった日に2本同時に走ると、
# 同じ issue を2本立てにいく。1本ずつ通す
concurrency:
  group: bake-down
  cancel-in-progress: false

permissions:
  contents: read
  # `rebake.yml` の run と、その step の結果を読む
  actions: read
  # issue を開く・書き換える・閉じる
  issues: write

jobs:
  bake_down:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # **本番の1回は、pip を1つも通らない。** ここが読むのは GitHub の口だけで、
      # BigQuery も Firestore も1行も触らない。「止まっていること」を知らせる係が、
      # **関係のない依存が1つ壊れただけで止まる**形にしたくない。
      # 資格も `GITHUB_TOKEN` だけで足りる（Google の鍵を取り出さない）。
      #
      # PyYAML を入れるのは**確かめ（selftest）のためだけ。**
      # あれがワークフローの YAML を読んで、繋ぎ先の名前と、乗っている step の
      # 名前が実在するかを突き合わせる
      - name: 確かめが YAML を読むぶんだけ入れる
        run: |
          pip install pyyaml
          # 素性の見張り（下の step）が `island_channels` などを読み込むので、
          # BigQuery の口も要る。**入れないと見張りが ImportError で落ちる。**
          # ここを削るなら、見張りのほうも一緒に外すことになる（#500）
          pip install -r python/requirements.txt

      # 偽の GitHub で回すだけ。外へは1バイトも出ない。
      # **本番を触る前に、判断のところ（`assess` と `decide`）が生きているかを見る。**
      # ここが壊れたまま apply で走ると、空振りの issue が毎朝開くか、
      # 本当に止まった朝に黙るかのどちらかになる
      # **公開のログに素性が出ないこと**を、口を開く前に見る（#500）。
      # このリポジトリは公開で、Actions のログも誰でも読める。実際に3回出ている
      # （#180 Doneru の鍵 / #217 Anthropic の鍵 / #379 名簿 1,065 実行ぶん）。
      # **消すのは出たあと。出る前に止めたいので、口より手前に置く。**
      #
      # **同じ job に置くことが要る。** job が違えばランナーが別なので、
      # 隣の job で通っていてもこちらの出力は1文字も守られていない。
      # 認証もクエリも要らず 0.5 秒で終わる。落ちたら下は1行も走らない。
      # 置き忘れは `python/logsafe_wiring_selftest.py` が見ている
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      - name: 判断のところを、偽物で先に回す
        run: python python/bake_down_selftest.py

      # **またいだ呼び出し（`crosscall_selftest.py`）は、ここでは回さない。**
      # この係が借りているのは `donor_calls.find_issue` 1つだけで、
      # **上の確かめが毎回それを本物の引数で呼んでいる**（`run()` ごしに13通り）。
      # 署名が変わった日は、あれが先に落ちる。同じものを2回回さない。
      # 焼き直しの側（`rebake.yml`）は BigQuery を引く前に回している

      - name: いまの焼き直しを見て、issue を合わせる
        env:
          # 手で押したときだけ既定が「見るだけ」。
          # cron と、焼き直しに繋いで来たぶんは**読む人がいない**ので apply
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name != 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python python/bake_down.py --apply
          else
            python python/bake_down.py
          fi

      # **黙って赤くならない。** 毎晩ひとりでに走るものは、落ちたことに
      # 誰も気づかない。せめてどこで落ちたかを要約に残す
      # （要約は run の1枚目に出るので、ログを開かずに読める）
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo "### 焼き直しの様子を映せませんでした"
            echo ""
            echo '**焼き直しが止まっているという意味ではありません。**'
            echo 'この仕組みのほう（判断・GitHub の口のどちらか）が動いていません。'
            echo 'issue が**いまの状態と食い違ったまま**になっています。'
            echo ""
            echo '`python python/bake_down_selftest.py` と'
            echo '`python python/bake_down.py` を手元で回すと、どちらかが分かります。'
            echo '（後者は `GITHUB_REPOSITORY` と `GITHUB_TOKEN` が要ります）'
          } >> "$GITHUB_STEP_SUMMARY"
