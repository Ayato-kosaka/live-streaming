name: あやと島の「いま」を更新

# 手動実行専用。島の数字（配信の本数・コメント数ほか）を BigQuery から取り直す。
#
# **「いまどこ」「ひとこと」「今週やること」「島の景色」の欄は外した**（#1278）。
# 島だより（`/now`）を面ごと畳み、画面は Firestore の `island/state.current` を1つも
# 読まなくなった（`docs/adr/0006-fold-next-and-now.md`）。居場所は滞在の表
# （`site/content/stays.ts`）が持つので、国を移った日はそこを直す（`/island-daily` の4）。
# 書く口（`POST /island-api/current`）を縮めるのは Functions の側（#1281）。
#
# 名前は据え置く——`workflow_run` で名前から繋いでいる道があれば、変えると黙って切れる。
on:
  workflow_dispatch:
    inputs:
      refresh_stats:
        description: "数字を BigQuery から取り直す"
        required: false
        default: true
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: 数字を取り直す
        if: inputs.refresh_stats
        run: python python/island_daily_stats.py
