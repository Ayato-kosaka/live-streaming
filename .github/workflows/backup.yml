name: 退避（失ったら戻らないものを取る）

# 何を取って何を取らないかは python/backup/plan.py に理由つきで書いてある。
# 置き場は BigQuery の `island_backup`（asia-northeast1）。**本番は US。**
# 戻しかたは docs/island-backup.md。
#
# ## なぜ 02:00 UTC なのか
#
# **取り込みより後ろに置く。** `schedule_fetch_chat.yml` の cron は 20:00 UTC と
# 書いてあるが、実際に走り出すのは 21:49〜23:32 UTC（rebake.yml の実測）。
# 焼き直し（rebake）が 01:00 UTC なので、そのさらに後ろ。
# GitHub の定時実行は2時間ほど遅れるが、02:00 が 04:00 になっても
# 取り込みの後ろのまま。**1日ぶん古いものを退避し続ける形にしない。**
#
# ## 落ちたら分かる
#
# **`continue-on-error` をどこにも使っていない。** 落ちたら赤くなる。
# そのうえで、Actions を開けない旅の途中でも分かるように、1回ぶんの記録を
# `island_backup.runs` に残している（`run_admin_script.yml` → `backup_status`）。
#
# ## 取るだけでは足りないので、毎晩「戻せるか」も試す
#
# 退避が壊れていても、取っているあいだは緑のまま気づけない。
# `drill` の job で、毎晩 Firestore エミュレータへ1コレクション戻して、
# **件数と中身の指紋が合うか**まで確かめる。**本番には1バイトも書かない。**
#
# 旅の写真も同じで、**取れているだけでは退避ではない。** `drill` の最後で
# 置き場から1枚取り出して、記録してある大きさと指紋に**バイト列が一致するか**を
# 見る（`restore.py --photo`）。これも置き場を読むだけ。
#
# ## 写真は1回の実行に上限がある
#
# 実体は 340MB あって、1回に 128MB までで区切ってある（理由は
# `python/backup/photos.py` の頭）。**上限に当たっても赤くしない。**
# 残り枚数を `::notice::` に出して、次の回が続きから拾う。
# 溜まったぶんを早く流し込みたいときは `photo_budget_mb` を押し上げる。

on:
  schedule:
    - cron: "0 2 * * *"

  # **cron だけを当てにしない。取り込みの後ろに繋いでも走る。**
  #
  # 上に「2時間遅れても取り込みの後ろ」と書いたが、それは cron が発火する
  # 前提の話だった。このリポジトリで定時実行が実際に発火した実績があるのは
  # `schedule_fetch_chat.yml` と `fetch_doneru_donations.yml` の2本だけで、
  # どちらも何週間も master に載っている。こちらは 2026-09-11 に載ったばかりで、
  # **発火をまだ一度も見ていない。**
  #
  # 退避は「取り損ねても緑のまま気づけない」ものの筆頭で、
  # しかも**気づくのは戻したくなった日**になる。17日間、誰も Actions を
  # 開けない。cron 1本に賭けない。
  #
  # `conclusion` は見ない（あちらは「表に無い どねID」で意図的に赤くなる）。
  # 2本とも来た晩に2回走っても、栞（置き場の最新 ingested_at）から差分で
  # 積むので同じ行は二度入らない。`concurrency: backup` で1本ずつ。
  # 繋ぎ先を2本にしてあるのは、**片方が消えても止まらないようにする**ため。
  # ワークフローの名前で繋ぐので、あちらの `name:` を書き換えると黙って切れる
  # （エラーにならない。**走らなくなるだけ**で、赤も出ない）。
  # 2本のうち Doneru のほうは `probe: true` で1バイトも書かずに手で押せるので、
  # **繋ぎが生きているかを、本番を汚さずに確かめられる**（そのために足した）。
  workflow_run:
    workflows: ["Fetch YouTube Chat Data", "Fetch Doneru Donations"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "何をどれだけ取るかだけ出す（1バイトも書かない）"
        required: false
        default: false
        type: boolean
      drill_collection:
        description: "戻す試しに使うコレクション"
        required: false
        default: islandNotes
        type: string
      photo_budget_mb:
        description: "旅の写真を1回で取る上限（MB）。空なら 128"
        required: false
        default: ""
        type: string

# 同時に走らせない。栞（置き場に入っている最新の ingested_at）を
# 取り合うと、同じ行を二度積む
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  take:
    name: 取る
    runs-on: ubuntu-latest
    outputs:
      # **押しかたは、ここで1回だけ決める。** 下の `drill` もこれを見る
      dry: ${{ steps.mode.outputs.dry }}
      drill: ${{ steps.mode.outputs.drill }}
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # 空なら photos.py の既定（128MB）。手で押したときだけ押し上げられる
      PHOTO_BUDGET_MB: ${{ inputs.photo_budget_mb }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # cron と workflow_run のときは押す人がいない。入力も空で来る
      # （`inputs.*` が空文字になる）。**ここで決めて env と outputs に置き、
      # 以降は env と outputs だけを見る。**
      #
      # `${{ inputs.dry_run && … }}` や `if: ${{ !inputs.dry_run }}` を直に
      # 書くと、cron の空文字が false と読まれて**たまたま動く**形になる。
      # `rebake.yml` の step「今回の押しかたを決める」に、同じことが書いてある。
      # 実際 `drill` は 29 run 中28回、その偶然の上で走っていた。
      - name: 今回の押しかたを決める
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # 押す人のいない回（定時・取り込みの後ろ）は、必ず取る。
          # **片方だけ手当てすると、繋ぎ替えたあと毎晩「見るだけ」で走って、
          # 緑なのに1バイトも退避されない状態になる。**
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_run" ]; then
            dry=0
          elif [ "$IN_DRY" = "true" ]; then
            dry=1
          else
            dry=0
          fi
          # 戻せるか試すのは、実際に取った回だけ。**下見の回に「戻せた」を
          # 出すと、その晩の退避を見ていないのに緑になる**
          drill=$((1 - dry))
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "drill=$drill" >> "$GITHUB_OUTPUT"
          echo "BACKUP_DRY=$dry" >> "$GITHUB_ENV"
          if [ "$dry" = "1" ]; then
            echo "$EVENT: 下見です（1バイトも書きません。戻す試しもしません）"
          else
            echo "$EVENT: 取ります。取ったあと、戻せるかを試します"
          fi

      # ここに continue-on-error を付けない。**落ちたら赤くする。**
      - name: 退避する
        run: |
          set -euo pipefail
          if [ "$BACKUP_DRY" = "1" ]; then
            python python/backup/run.py --dry-run
          else
            python python/backup/run.py
          fi

  drill:
    name: 戻せるか試す
    runs-on: ubuntu-latest
    # 取ったものを戻すので、取るのが先。**取るのが落ちたらここも走らせない**
    # （古い世代で緑を出すと「戻せる」が嘘になる）
    needs: take
    # **`!inputs.dry_run` を直に書かない。** 上の step で決めたものだけを見る
    if: ${{ needs.take.outputs.drill == '1' }}
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # **24。** Node 20 は 2026-04 に寿命が切れていて、いま緑なのは
      # ランナーが node20 の action を勝手に 24 へ載せ替えているからでしかない。
      # ここの node が動かすのは `npx firebase-tools@13`（演習のエミュレータ）
      # だけ。あの版の `engines` は 22 までしか書いていないので、**24 で本当に
      # 立ち上がるかは押して見るしかない。** そして `dry_run` では見られない
      # ——下見の回はこの job ごと飛ぶ（`if: needs.take.outputs.drill == '1'`）。
      # run 35426831380（dry_run を外した回）で、エミュレータが立って
      # islandNotes の突き合わせまで通るのを見ている。
      # リポジトリの他の node もぜんぶ 24（`functions/` だけ別。あそこの
      # `engines` は Cloud Functions のランタイムそのもので、こちらでは決められない）
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # エミュレータは Java で動く
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # **対照が先。本番の置き場を1行も引く前に、演習が落ちられるかを見る。**
      #
      # 19 run 走って一度も捕まえていないのが「退避が健全」なのか
      # 「演習が何も見ていない」のかは、走った回数からは決められない。
      # 偽の置き場に**壊した写し**（1バイト違う・欠けた・空っぽ・絵ではない・
      # 0枚）と、**戻したのに中身が違うコレクション**を仕込んで、そこで
      # 落ちることをその場で見せる。**壊していない写しが先に通ること**も
      # 一緒に見る（片側だけだと、何にでも赤を出す演習も通る。
      # `docs/island-misses.md` #125）。
      #
      # 置き場にも本番にも1行も問い合わせない（BigQuery も Firestore も
      # 偽物）。ここが落ちたら、**本番の数字を1つも出さずに**赤くなる
      # **公開のログに素性が出ないこと**を、口を開く前に見る（#500）。
      # このリポジトリは公開で、Actions のログも誰でも読める。実際に3回出ている
      # （#180 Doneru の鍵 / #217 Anthropic の鍵 / #379 名簿 1,065 実行ぶん）。
      # **消すのは出たあと。出る前に止めたいので、口より手前に置く。**
      #
      # **同じ job に置くことが要る。** job が違えばランナーが別なので、
      # 隣の job で通っていてもこちらの出力は1文字も守られていない。
      # 認証もクエリも要らず 0.5 秒で終わる。落ちたら下は1行も走らない。
      # 置き忘れは `python/logsafe_wiring_selftest.py` が見ている
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      - name: 演習が落ちられるかを、偽物で先に見る
        run: python3 python/backup_drill_selftest.py

      # 写真を取るほうの振る舞い（続きから・落ちた枚数・ログに名前を出さない）。
      # こちらも偽の置き場だけで回る。**書いてあったのに、どこからも走って
      # いなかった**（2026-09-17 の棚卸し。`docs/island-misses.md` #125）
      - name: 写真を取るほうも、偽物で回す
        run: python3 python/backup/photos_selftest.py

      # **本番には書かない。** エミュレータを立てて、そこへ戻して突き合わせる
      - name: エミュレータへ戻して突き合わせる
        working-directory: python/admin
        env:
          ARGS: '{"collection": "${{ inputs.drill_collection || ''islandNotes'' }}"}'
        run: python backup_restore_test.py

      # **写真も「戻せるか」まで見る。** 置き場から何枚か取り出して、記録して
      # ある大きさと指紋にバイト列が一致するかを見るだけ（**読むだけ**）。
      # ここも `continue-on-error` を付けない。**戻せない退避は退避ではない。**
      #
      # **0枚の晩は赤くする**（終了コード 2）。2026-09-17 まで、ここは
      # 1枚も無い晩を `::warning::` で緑のまま通していた。「戻せた」ではなく
      # 「何も戻していない」ので、いちばん見張ってほしい晩に黙る形だった。
      #
      # 引くのは**晩ごとに違う組み合わせ**。いちばん新しい1枚だけを見ていると、
      # 584 枚のうち同じ側を毎晩なぞって、古いところが腐っても当たらない
      - name: 写真を戻してバイト列を突き合わせる
        run: python python/backup/restore.py --photo
