# **ショート動画の道具の見張りを、ショートを触った PR だけで回す。**
#
# 品質チェック（`tools/shorts/qa/check.py`。19項目）の見張り2本は、本物の `render.py` で
# 書き出した1本を14通りに壊し、**壊したところを見る検査だけが落ちる**ことを当てる
# （元素材のカクつきと使い回しは、時間割と素材だけを差し替えた足11本で当てる）。
# 書き出しと顔・透かしの検出で、2本あわせて7〜9分かかり、ffmpeg と OpenCV 4 が要る。
# カットの長さ・似た見た目の連続・止め絵（2026-10-21）の足13本は、書き出しを通さない3本目
# （`cuts_selftest.py`、1分ほど）に分けた。上の2本は1本 5分の上限の手前にいて、足を足す余地が無い。
#
# ## なぜ Selftests（`selftest.yml`）に入れないか
#
# あちらは全部の PR で走る。PR の多くは島（`site/`）の直しで、ショートには触らない。
# そこに毎回7〜9分と ffmpeg の取り付けを足すと、ショートと関係ない PR まで遅くなる。
# だから回し役（`python/selftest_runner.py`）の `SKIP` に理由つきで載せて
# あちらでは外し、**ここで名指しで回す**。名指しにしてあるのは、見張りの棚卸し
# （`python/watch_census_selftest.py`）が「どこからも走っていない見張り」を
# ワークフローの `run:` の名前で数えるから——`find` で拾うと、数えられずに孤児になる。
#
# BGM の物差しの見張り（`tools/shorts/style/bgm_gap_selftest.py`、2026-10-16）も同じ形で
# あちらから外し、ここで名指しで回す。こちらは数秒で遅くないが、Selftests に無い numpy が要る。
#
# ## いつ走るか
#
# `tools/shorts/` の下・ショートの手引き（`.claude/skills/viral-shorts-creator/`）・このファイルを変えた
# PR と、master と**作業枝（`claude/**`）への push**。
# 品質チェックの線は `render.py`・`style.json`（どちらも `tools/shorts/render/`）に
# ぶら下がるので、書き出しを直した PR でも走る。手で回すときは workflow_dispatch。
#
# 作業枝の push で回すのは 2026-11-27 から。ショートの道具は1週間ずっと作業枝で直していて PR を出しておらず、
# そのあいだ `brief_selftest.py` が赤のままだった（本編集の1枚が2万字を越え、対照70本も全部外れていた）。
# 見張りが走らない枝では、赤は誰にも見えない。帳面（`ayato_feedback.md`）は手引きの下にあり、
# 帳面の形の検査（`ledger.py --check`）が名指しを引くので、手引きだけを直した push でも回す。
#
# ## job は2つ（2026-11-27）
#
# 1本の job で 23分（2026-11-26）になり、上限 30分の手前にいた。書き出しの重い見張り（`render`）と、
# Python だけで回る原稿・帳面・取り込みの見張り（`tools`）に分けて並べる。`tools` の最後の step は
# `tools/shorts` の下の `*_selftest.py` のうち、上で名指ししなかったものを**全部** `find` で拾う
# （名指しの除外に書いたのに名指しの step が無い見張りは、`check` の step が落とす）。
name: ショートの道具の見張り

on:
  pull_request:
    paths:
      - "tools/shorts/**"
      - ".claude/skills/viral-shorts-creator/**"
      - ".github/workflows/shorts_selftest.yml"
  push:
    branches: [master, "claude/**"]
    paths:
      - "tools/shorts/**"
      - ".claude/skills/viral-shorts-creator/**"
      - ".github/workflows/shorts_selftest.yml"
  workflow_dispatch:

# Selftests と同じ。PR と作業枝は枝ごとに前の run を止めてよい（何人もが同じ作業枝に続けて push する）。
# master は sha ごとに別の group にして、順番待ちの run が黙って差し替えられないようにする（`selftest.yml` の頭に経緯）
concurrency:
  group: shorts-selftest-${{ github.ref != 'refs/heads/master' && github.event_name != 'workflow_dispatch' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  render:
    name: 書き出し・品質チェックの見張り
    runs-on: ubuntu-24.04
    # 2本で7〜9分（4コアの箱で、ほかの書き出しと並んで 232秒と 252秒。2026-10-19）。
    # 道具を入れるのに1分ほど。倍以上の余裕を見る
    # 2026-11-02: 見張りが増え、job 全体で 15〜19.5分（2026-10-31〜11-01 の8回。上限 20分の手前）になっていたところへ、
    # 元の声（1分ほど）と YouTube ライブの札の2本（あわせて3分ほど）を足すので、上限を 30分にした
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg はランナーに入っていない。書体は M PLUS（書き出しの本物）を落とさず、
      # DejaVu を見張りが同じ名前で置き直して使う（検査は字の形を見ない。和文は豆腐になる）。
      # OpenCV は **5 未満**に止める。顔の検出に使う Haar の型が OpenCV 5 で削られた
      # （5.0.0 の wheel に `cv2.data.haarcascades` の中身も `CascadeClassifier` も無い）。
      # budoux は**要る**（書き出しが行を割り、字の改行の検査 line_breaks が割ってよい所を決める。無いと書き出しが止まる）。
      # 版は 0.9.3 に止める。割ってよい所の線（仮名どうしの点）をこの版で測った。版が変わると文節の切れ目が変わり
      # （0.10.0 は「あり？なし？」「手間すぎるやろ」を 0.9.3 と違う所で切った）、書き出しの Actions（shorts_render.yml）と
      # 作業箱の版とも食い違う（tools/shorts/qa/linebreak.py の BUDOUX_PIN）。
      # PyYAML は取り込みの判定の見張り（`ingest/gate_selftest.py`）が自分のワークフローを
      # 読むのに要る。Selftests は入れているので、あちらでは落ちずにここだけ落ちていた
      # 2026-10-23 に、ここの apt が止まって job の上限20分まで動かず、見張りが1本も回らなかった（#1015）。
      # 取り込み・書き出しと同じく、コマンドごとに上限を置いて1回だけ取り直し（retry.sh）、ffmpeg は
      # ffmpeg.sh（入っていれば apt に触らない・man-db の索引を止める・詰まったら静的ビルド）で入れる
      - name: 道具を入れる（ffmpeg・OpenCV 4）
        timeout-minutes: 12
        run: |
          R="bash tools/shorts/ingest/retry.sh"
          bash tools/shorts/ingest/ffmpeg.sh fonts-dejavu-core
          ffmpeg -version > /dev/null
          $R 180 python -m pip install --upgrade pip
          $R 300 pip install 'opencv-python-headless==4.12.0.88' numpy Pillow 'budoux==0.9.3' PyYAML

      # 落ちた1本で止めない（`!cancelled()`）。全部回してから、まとめて落ちる
      - name: 品質チェックの見張り（音・字・形式）
        run: python3 tools/shorts/qa/qa_selftest.py

      - name: 品質チェックの見張り（絵・長さ）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/qa/qa_video_selftest.py

      # 同じカットの長さ・似た見た目の連続・止め絵（あやと 2026-10-21、#959）。場面の絵と時間割だけで当てる
      - name: 品質チェックの見張り（カットの選び方）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/qa/cuts_selftest.py

      # 参考の BGM の大きさを測る物差し（`tools/shorts/style/bgm_gap.py`）。作った声と BGM を
      # 既知の差で混ぜて ±1.5dB に入るかを見る。numpy だけで数秒。Selftests は numpy を
      # 入れないので、回し役の SKIP に理由つきで載せ、ここで名指しで回す
      - name: BGM の物差しの見張り（声と BGM の差）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/style/bgm_gap_selftest.py

      # 題の札の国旗（`tools/shorts/render/textlook.py` が `flags/` の絵を字の中に置く）。本物の書き出しの
      # 道具で題の札を描き、国旗の色の画素が1行目の頭に出るかを数え、守りを1つずつ外して落ちるかを見る。
      # numpy と OpenCV が要るので、BGM の物差しと同じく回し役の SKIP に載せ、ここで名指しで回す
      - name: 題の札の国旗の見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/flag_selftest.py

      # 続けて書いた「……」「——」「ーー」を1つの塊として組む（ヨーグルトの回 ygt-p1-v2 の「苦手やってん……」が
      # 「… …」に見えた、2026-11-18）。様式3つの見た目ぜんぶで1コマずつ描き、継ぎ目の空きを測り、守りを1つずつ外して
      # 落ちるかを見る。隙間は書体の字形で出るので、本物の書体を見張りが一時の置き場に落として使う（fetch_fonts.sh の写し）。
      # numpy と OpenCV が要るので、国旗と同じく回し役の SKIP に載せ、ここで名指しで回す
      - name: 続けて書く字（……・——・ーー）の見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/join_selftest.py

      # BGM の頭の無音を飛ばす・最後の画に注の札（CTA）を出す（あやと F-041・F-042、2026-10-21）。
      # 合成の素材で書き出しの音の束と時間割を見て、本物の書き出し（下書き）を1回通す。守り8つを1つずつ外して1分ほど
      - name: BGM の頭と最後の札の見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/bgm_cta_selftest.py

      # 元の声の行（帳面 F-051）の大きさ（あやと #1086「配信の声の音量が前回小さくて聞こえづらかった」、2026-11-02）。
      # 合成の配信の声を本物の書き出しの音の束と品質チェックに通し、AI の声と同じか少し上に揃うか・品質チェックが
      # 小さい元の声を落とすかを見る。守り17個を1つずつ外して1分ほど。numpy が要るので回し役の SKIP に載せ、ここで名指しで回す
      - name: 元の声の大きさの見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/orig_voice_selftest.py

      # YouTube ライブの札（帳面 F-064・#1097、2026-11-02）。出さない回（既定）は書き出しが何も変えず、出す回は上・左寄せに
      # 全編出して題の札・左上の注を札の下へ空けるか（書き出しの側）と、品質チェックが札の見えないコマ・ぶつかりを落とすか（検査の側）。
      # 守り10個・9個を1つずつ外して、それぞれ2分ほど。ffmpeg と numpy が要るので回し役の SKIP に載せ、ここで名指しで回す
      - name: YouTube ライブの札の見張り（書き出し）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/live_badge_selftest.py

      - name: YouTube ライブの札の見張り（品質チェック）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/qa/badge_selftest.py

      # 対談系の切り抜き（帳面 F-065・#1104、2026-11-06）。使わない回（既定）は書き出し・build_edit・品質チェックが何も変えず、
      # 使う回は話し手ごとの字幕の色・全編の題の札とその1語の色・終わりの1秒の札・帯と寄りの切り出し・行の間なしで組み、
      # 品質チェックが3秒のカットと BGM の無い回の声と BGM の差だけを対象外にするか。守り23個を1つずつ外して3分ほど。
      # ffmpeg と numpy が要るので回し役の SKIP に載せ、ここで名指しで回す
      - name: 対談系の切り抜きの見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/talk_selftest.py

      # 編集の磨き（#1284、2026-11-18）。札で重ねる画像・効果音・色の整え・上下の札の切り落としを、書かない回は何も変えず、
      # 書いた回は思ったとおりに効くか（札の形・効果音の大きさと混ぜ・彩度の幅・帯で切る行・品質チェックの束の当てはめ）。
      # 守り20個を1つずつ外して1分ほど。ffmpeg と numpy が要るので回し役の SKIP に載せ、ここで名指しで回す
      - name: 編集の磨きの見張り（札・効果音・色・上下の帯）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/render/polish_selftest.py

      # 撮影の素材（#1441・帳面 F-094「動画の音声はミュートにすること」、2026-11-25）。作業用に音の流れが残らない・
      # 書き出しが撮影の素材の音を混ぜない（audio_db と音の流れを断る）・台帳に位置や Google の ID を書かない・
      # 書き出しの依頼で撮影の素材を作業箱から上げない、を見る。守り10個を1つずつ外して数分。ffmpeg と numpy が要るので
      # 回し役の SKIP に載せ、ここで名指しで回す
      - name: 撮影の素材の見張り（音を混ぜない・私有の置き場の外に出さない）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/footage/footage_selftest.py

  tools:
    name: 原稿・帳面・取り込みの見張り
    runs-on: ubuntu-24.04
    # 帳面の3本は数秒、頼む1枚（brief_selftest）は数分、残りを find で拾う step が 6〜7分（2026-11-26）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg はランナーに入っていない。書体は M PLUS（書き出しの本物）を落とさず、
      # DejaVu を見張りが同じ名前で置き直して使う（検査は字の形を見ない。和文は豆腐になる）。
      # OpenCV は **5 未満**に止める。顔の検出に使う Haar の型が OpenCV 5 で削られた
      # （5.0.0 の wheel に `cv2.data.haarcascades` の中身も `CascadeClassifier` も無い）。
      # budoux は**要る**（書き出しが行を割り、字の改行の検査 line_breaks が割ってよい所を決める。無いと書き出しが止まる）。
      # 版は 0.9.3 に止める。割ってよい所の線（仮名どうしの点）をこの版で測った。版が変わると文節の切れ目が変わり
      # （0.10.0 は「あり？なし？」「手間すぎるやろ」を 0.9.3 と違う所で切った）、書き出しの Actions（shorts_render.yml）と
      # 作業箱の版とも食い違う（tools/shorts/qa/linebreak.py の BUDOUX_PIN）。
      # PyYAML は取り込みの判定の見張り（`ingest/gate_selftest.py`）が自分のワークフローを
      # 読むのに要る。Selftests は入れているので、あちらでは落ちずにここだけ落ちていた
      # 2026-10-23 に、ここの apt が止まって job の上限20分まで動かず、見張りが1本も回らなかった（#1015）。
      # 取り込み・書き出しと同じく、コマンドごとに上限を置いて1回だけ取り直し（retry.sh）、ffmpeg は
      # ffmpeg.sh（入っていれば apt に触らない・man-db の索引を止める・詰まったら静的ビルド）で入れる
      - name: 道具を入れる（ffmpeg・OpenCV 4）
        timeout-minutes: 12
        run: |
          R="bash tools/shorts/ingest/retry.sh"
          bash tools/shorts/ingest/ffmpeg.sh fonts-dejavu-core
          ffmpeg -version > /dev/null
          $R 180 python -m pip install --upgrade pip
          $R 300 pip install 'opencv-python-headless==4.12.0.88' numpy Pillow 'budoux==0.9.3' PyYAML

      # あやとの指摘の帳面（2026-10-21）。原稿の機械の検査（`tools/shorts/script/lint.py`）・帳面の形と名指し・
      # 取りこぼしの見張り（`tools/shorts/feedback/watch.py`）の3本。Python だけで数秒。Selftests でも回し役が拾う
      # （帳面を書き崩した PR は、ショートを触っていなくても止まる）が、ショートの道具が全部緑かをここで1つに読めるように名指しする
      - name: 原稿の機械の検査の見張り（帳面の規則）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/script/lint_selftest.py

      - name: あやとの指摘の帳面の見張り（形・名指し）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/feedback/ledger_selftest.py

      - name: 帳面の取りこぼしの見張りの見張り
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/feedback/watch_selftest.py

      # 2回以上言われた指摘・絶対の決まりが、当てる場所にコードに在る機械の名前を持つか（2026-11-27）。
      # いまの違反は控え（tools/shorts/feedback/unguarded.txt）にあり、減ることしか許さない
      - name: あやとの指摘の帳面の検査（形・機械の関所・控え）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/feedback/ledger.py --check

      # 作文者・本編集・批評役・視聴者役・事実の確かめ役の1枚（`brief.py`）。上限を越えた1枚を渡さないか・
      # 本物の回の本編集の1枚が2万字以下か。対照 80本ほどを子で並べて回す（数分）
      - name: 頼む1枚の見張り（上限・帳面・字幕の伏せ字）
        if: ${{ !cancelled() }}
        run: python3 tools/shorts/script/brief_selftest.py

      # 名指しで回すつもりで find から外した見張りに、名指しの step があるか（外しただけで、どこからも走らない、を作らない）
      - name: 名指しで外した見張りが、どれかの job で走っているか
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wf=.github/workflows/shorts_selftest.yml
          bad=0
          for p in $(grep -o "! -path 'tools/[a-z_/]*[.]py'" "$wf" | sed "s/! -path '//;s/'$//"); do
            if ! grep -qE "^ +run: python3 $p\$" "$wf"; then echo "::error::$p は find から外してあるのに、名指しの step が無い"; bad=1; fi
            if [ ! -f "$p" ]; then echo "::error::$p が無い（名前が変わったなら、ここを直す）"; bad=1; fi
          done
          n=$(find tools/shorts -name '*_selftest.py' | wc -l)
          echo "tools/shorts の見張り ${n}本（名指し $(grep -o "! -path 'tools/[a-z_/]*[.]py'" "$wf" | wc -l)本・残りは下の find で全部）"
          exit "$bad"

      # 取り込みの見張りは Selftests でも走るが、ショートを触った PR では
      # ここにも並べておく（ショートの道具が全部緑か、を1つの run で読めるように）。
      # 上で名指しで済ませたものは除く。1本も拾えなければ 2 で落とす（0本で緑にしない）
      - name: ほかのショートの見張り（取り込み）
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mapfile -d '' found < <(find tools/shorts -name '*_selftest.py' \
            ! -path 'tools/shorts/qa/qa_selftest.py' ! -path 'tools/shorts/qa/qa_video_selftest.py' \
            ! -path 'tools/shorts/qa/cuts_selftest.py' ! -path 'tools/shorts/style/bgm_gap_selftest.py' \
            ! -path 'tools/shorts/render/flag_selftest.py' ! -path 'tools/shorts/render/bgm_cta_selftest.py' \
            ! -path 'tools/shorts/render/join_selftest.py' \
            ! -path 'tools/shorts/render/orig_voice_selftest.py' \
            ! -path 'tools/shorts/render/live_badge_selftest.py' ! -path 'tools/shorts/qa/badge_selftest.py' \
            ! -path 'tools/shorts/render/talk_selftest.py' ! -path 'tools/shorts/render/polish_selftest.py' \
            ! -path 'tools/shorts/script/lint_selftest.py' ! -path 'tools/shorts/feedback/ledger_selftest.py' \
            ! -path 'tools/shorts/feedback/watch_selftest.py' ! -path 'tools/shorts/footage/footage_selftest.py' \
            ! -path 'tools/shorts/script/brief_selftest.py' \
            -print0 | sort -z)
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::tools/shorts の見張りを1本も拾えなかった"
            exit 2
          fi
          python3 python/selftest_runner.py "${found[@]}"
