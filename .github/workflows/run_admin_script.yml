name: 管理スクリプトを実行

# Claude Code から Firebase(Firestore) を管理者として操作するための汎用ワークフロー。
# GitHub Secrets の FIREBASE_SERVICE_ACCOUNT で動くので、
# アプリ側に別途キーを持たせる必要がない。
#
# 使えるスクリプトは python/admin/ の中にある。
#   firestore_read   … 読む   {"collection":"islandIdeas","limit":20}
#                      どこに何があるか  {"list":true}
#                      入れ物ぜんぶの欄をまとめて {"collection":"...","keys_only":true}
#                      **ここから回すかぎり、どの入れ物でも値も書類IDも出ない。**
#                      出るのは件数・欄の名前・欄の型と長さ・指紋だけ（ログは公開）。
#                      値そのものが要るなら手元で回すか、出すものを自分で
#                      決めた専用スクリプトを書く（doneru_audit が手本）
#   firestore_write  … 書く   {"collection":"islandIdeas","doc":"ID","data":{"hidden":true}}
#   firestore_delete … 書類を1つ消す。**既定では1バイトも消さない**（#291 の 4-b）
#                      {"collection":"islandRate","doc":"ID"}              … 下見
#                      {"collection":"islandRate","doc":"ID","apply":true} … 消す
#                      **消せるのは firestore_delete.py の DELETABLE に載って
#                      いる4本だけ**（その日限り／その場限りのもの）。視聴者さんの
#                      字も、お金の台帳も、apply を付けても消せない。表に無い名前は
#                      **引きもせずに**弾く。引っ込めたいだけなら firestore_write で
#                      hidden を立てる。**書類IDも中身もログに出さない**（ログは公開）
#   firestore_delete_selftest
#                    … 上の縛りを偽の Firestore で動かす。
#                      **本番にも資格情報にも触らない**（手元でも走る）
#
# 北欧旅のぶん（docs/nordic-depart.md）。ふだんは画面から入れるもので、
# ここはそれが使えないときの逃げ道。
#   nordic_supporter … その日いた人を手で足す {"day":"2026-09-12","channel":"UC…"}
#   nordic_arrived   … 着いた／取り消す       {"date":"2026-09-19"}
#
# カードを北欧旅から切り離して企画に寄せるぶん（#202）。
# **どちらも既定では1行も書かない。** 書くには {"apply": true} を付ける。
# 流す順は下から上ではなく、この順。
#   streamevents_import … islandNextPlans → islandStreamEvent へ写して、
#                         企画の種（Git 側の企画と北欧◯日目）を入れる
#   plans_relink        … 掲示板に出ている提案を、Git 側に立った企画ページへ
#                         結び付ける。二重になっている空の行はしまう
#   images_migrate      … nordicPhotos → islandStreamEventImage へ移す。
#                         **書類IDは変えない**（カードのIDがそこから決まる）
#
# 豚の貯金箱（docs/nordic-fund.md 9章）。**どれも既定では1行も書かない。**
# 額の話なので、先に何がいくら動くかを出す。
#   fund_check    … 移行の下見。**Firestore を1行も触らない。**
#                   411件を2回流して増えないこと、BigQuery を重ねても増えない
#                   こと、本番の /island-api/fund と1円まで合うことを見る
#   fund_migrate  … GAS の SuperChats → islandFundSuperChats（411件）と、
#                   支出7件・目標1件。{"apply": true} で書く。
#                   **移行前と1円でも違ったら書かずに 1 で落ちる**
#   fund_sync     … 掃除を手で流す {"apply": true}。毎晩のぶんは
#                   schedule_fetch_chat.yml から走る。
#                   {"days":400,"apply":true,"sweep":true} は遡り。
#                   **貯金箱の額が動く。** sweep が無いと31日より前は書かない
#   fund_add      … 手で1件足す／消す（スパチャ・支出・目標）。
#                   {"kind":"spend","day":"2026-09-11","title":"宿代","yen":4000}
# キャラクターの絵をドライブから Firebase Storage へ移すぶん（#284 の C 群）。
# **既定では1バイトも書かない。** 書くには {"apply": true} を付ける。
#   characters_migrate … Viewers 表とドライブのフォルダ2つを突き合わせて、
#                        絵を Storage に置き、islandCharacter に名前と
#                        絵文字と呼び名を入れる。{"limit":3} で試せる
#   characters_gap     … **投げ銭してくれたのに、まだキャラクターが無い人**を
#                        数える。**読むだけ。1バイトも書かない。**
#                        BigQuery のスパチャ／Doneru に、BigQuery がまだ
#                        持っていない当日ぶん（Firestore streamChatMessages）を
#                        足して、islandCharacter の名簿と突き合わせる。
#                        **名簿は Firestore から1回だけ全件読む**（前は1人ずつ
#                        /characters/lookup を叩いていた）。突き合わせは
#                        **channelId が先、名前は後**。名前でしか当たらなかった
#                        人数を分けて出すのは、**そこが相手の改名で外れる側**
#                        だから。図鑑そのものの健康状態（channelId が空・
#                        絵文字が空・plain / scene が無い）も一緒に数える。
#                        {} で直近30日、{"days":60} で日数を変える。
#                        **ログに出るのは人数と、測った時刻だけ**（名前も
#                        書類IDもチャンネルIDも1つも出ない）
#   characters_link    … 上で数えた**空いている channelId を、確実に分かるぶん
#                        だけ埋める**。名前は変わるが channelId は変わらない
#                        ので、名前頼みの人は相手の改名で消える。出どころは
#                        islandDonors（あやとが手で結んだハンドル）が先、
#                        BigQuery の chat_messages（表示名→チャンネルID。
#                        **1人に決まる名前だけ**）が後。引く鍵は名簿に保存
#                        されている channelKeys / lookupKeys をそのまま使う。
#                        **2つ以上引けたら書かない。すでに入っている書類にも
#                        すでに誰かに付いている channelId にも触らない。**
#                        触るのは channelId の欄1つだけ（emoji も鍵も絵も
#                        読むだけ）。{} で下見（**1バイトも書かない**）、
#                        {"apply": true} で入れて、**同じ実行の中で数え直す**。
#                        {"apply": true, "limit": 5} で先に少しだけ。
#                        名前も書類IDもチャンネルIDも1つも出ない（ログは公開）
#   characters_probe   … **絵を1枚置いて、読んで、消す**（入力なし）。
#                        Actions は置き場に書けないまま（#283）でも、
#                        Functions に頼めば置けることを本番で1回通す。
#                        本番に何も残さない
#   characters_add     … 預かった絵から**新しい人を足す**。表にもドライブにも
#                        いない人（今日はじめてコメントした人）はこちら。
#                        絵と名前は `python/admin/_incoming/` に置くが、
#                        **公開リポジトリに残さない。** 流すときだけ枝に載せて
#                        この枝を指して起動し、済んだら枝ごと落とす。
#                        {"apply": true} で書く（既定は下見）
#   tip_alias          … **名乗りにタイポがあって、カードに絵が乗らない人**を
#                        その日の台帳（islandTips）から拾って、名乗りを
#                        呼び名（aliases）として足す。カードの絵は
#                        displayNameSnapshot → lookupKeys で毎回引き直して
#                        いるので、足すと**過去のカードにも遡って絵が乗る。**
#                        **名前の似ている度合いでは当てない。** 当てるのは
#                        islandDonors 由来の channelId だけで、
#                        islandCharacter.channelId がちょうど1人か、
#                        islandChannels の名前が lookupKeys でちょうど1人に
#                        当たるときだけ足す。**2人以上でも0人でも飛ばす。**
#                        鍵（lookupKeys）は Python で作らず、口
#                        （POST /characters/{id}）に作らせる。触るのは
#                        aliases の欄だけで、islandTips も islandCards も
#                        読むだけ。足すだけで、1つも消さない。
#                        {"day":"2026-09-16"} で下見（**1バイトも書かない**）、
#                        {"day":"2026-09-16","apply":true} で足す。
#                        **ARGS にも名前を取らない**（ARGS はログに出る）。
#                        出るのは件数と書類IDの指紋と絵文字だけ
#   tip_alias_selftest … 上の決め方を偽の Firestore と偽の口で動かす。
#                        **本番にも資格情報にも触らない**（手元でも走る）
#   tail_alias         … **ハンドルに付いた YouTube のしっぽ**（`-r9z`
#                        `1234`）を落とした形を、その人の呼び名として足す。
#                        図鑑の引き当ては**完全一致**なので、人が打つ
#                        「名前の人の部分」では当たらない（#135）。
#                        落とす形は当てずっぽうではなく、BigQuery の
#                        ハンドル 2,335通りを数えて決めてある
#                        （規則は `python/name_tail.py`）。
#                        **足すのは aliases だけで、channelKeys には
#                        触らない。** 鍵（lookupKeys）は Python で作らず、
#                        口（POST /characters/{id}）に作らせる。
#                        **その字を他の人がもう持っていたら足さない。
#                        2人が同じ字になってもどちらにも足さない。**
#                        {} で下見（**1バイトも書かない**）、
#                        {"apply": true} で足す。{"limit": 5} で先に少しだけ。
#                        出るのは件数と書類IDの指紋と絵文字だけ
#   tail_alias_selftest … 上の決め方を偽の Firestore と偽の口で動かす。
#                        **本番にも資格情報にも触らない**（手元でも走る）。
#                        しっぽを落とした字で**本当に当たるようになるか**は
#                        `python3 python/name_tail_selftest.py` が本物の OBS
#                        （app/alertbox/matching.utils.ts）まで動かして見る
#   channel_alias      … **YouTube のチャンネル名（表示名）そのもの**を呼び名
#                        （aliases）として足す。ドネルは投げ銭の名乗りに
#                        チャンネル名を初期値で入れてくるが、図鑑の引き当ては
#                        完全一致（lookupKeys の array-contains）で、normKey は
#                        **空白を残す。** 空白を無視するのは OBS の Collator
#                        だけで、ドネルが通る道には無い。だから「似た字」では
#                        なく**その字そのもの**を入れる。tail_alias（#509）が
#                        足したのはハンドルからしっぽを落とした形で、こことは別。
#                        名前は鍵を使わずに引く（feed 668バイト → 駄目なら
#                        頁 807KB）。**足すのは aliases だけで channelKeys には
#                        触らない。** 鍵は Python で作らず口に作らせる。
#                        **他の人がもう持っている字・2人が同じ字になる字は
#                        どちらにも足さない。** 取れなかった人は「名前が無い」と
#                        混ぜず別に数える（{"budget_min": n} で引く時間の上限。
#                        既定25分。打ち切ったぶんは「取れなかった」に積む）。
#                        {} で下見（**1バイトも書かない**）、
#                        {"apply": true} で足す。{"limit": 5} で先に少しだけ。
#                        出るのは件数と指紋と絵文字だけ
#   channel_alias_selftest … 上の決め方を偽の Firestore・偽の口・偽の引きで
#                        動かす。**本番にも資格情報にも触らない**（手元でも走る）。
#                        対照4つ（足せる／ぶつかったら足さない／取れなかったを
#                        混ぜない／下見が書かない）は**本番でも毎回、本物に
#                        1行も書く前に**回り、1つでも外れたら数字を出さずに 2 で止まる
#   name_clash         … 図鑑の名前が、**配信に映る側（OBS）の目で同じ字に
#                        なっていないか**を数える。**読むだけ。1バイトも
#                        書かない。** 引く道は3本あって、字のそろえかたが
#                        違う——口とカードは `normKey` の完全一致（空白も
#                        記号も残す）、OBS は外れると `Intl.Collator`
#                        （`sensitivity:"base"` + `ignorePunctuation`）に
#                        落ちて、**空白・記号・ひらがなとカタカナ・濁点**まで
#                        潰す。しかも当たるのは**先に並んでいた人**なので、
#                        2人が同じ字になっていると配信に別人の絵が出る。
#                        **当てるのは本物**（`app/alertbox/matching.utils.ts`
#                        を node で読み込む。写しは作らない）。
#                        **同じ人の中（無害）と違う人どうし（事故）を分けて**
#                        数え、今日ぶん（チャンネル名そのものの呼び名）を
#                        抜いたら消える組も出す。
#                        終了コード 0＝ぶつかり無し / 1＝見つかった /
#                        2＝数えられていない。対照7つは**図鑑を1人も読む前に**
#                        回り、1つでも外れたら数字を出さずに 2。
#                        {} で数える。{"attribute": false} で今日ぶんの
#                        切り分けをしない（YouTube を引かない）。
#                        {"budget_min": n} で引く時間の上限（既定25分）。
#                        出るのは件数と指紋と絵文字と「何が潰れたか」だけ
#   name_clash_selftest … 上の数え方を偽の図鑑と偽の引きで動かす。
#                        **本番にも資格情報にも触らない**（手元でも走る）。
#                        `node` と本物の `matching.utils.ts` は要る——
#                        動かせなければ「通った」と言わずに 2
#   character_days_probe … 図鑑の何人に「いっしょにいた日数」が出せるかを
#                        数える。**読むだけ。1バイトも書かない。** `{}` で走る。
#                        焼き込み（`residents.ts`）と同じチャンネルを指すかを
#                        対照に使い、食い違えば数字を出さずに落ちる。
#                        出るのは件数だけ（名前もチャンネルIDも出さない）
#
# 公開バケットの片づけ（#289）。**投げ銭してくれた113人の名前と金額が、
# ログイン無しで誰でも読める置き場に残っている。** 読む画面はもう無い。
#   public_purge     … Functions に頼んで片づける。{} で下見（いま何が
#                      できるかと一覧。**1バイトも書かない**）。
#                      下見は**旅の写真の置き場（544件）も数える**（#296）。
#                      フォルダごとの件数と合計バイト数まで。
#                      **ファイル名は1つも出ない**（ログも公開なので）。
#                      {"names":[...],"apply":true} で、私用の置き場へ
#                      写してから消す（**写せていなければ消さない**）。
#                      消せるのは口の側の決め打ちの表の2つだけで、
#                      viewer-video/ の mp4（視聴者さんのもの）は弾かれる
#
# 旅の写真の実体だけ、退避に1本も入っていない（#296）。**測るところまで。**
# Firestore も BigQuery も毎晩取れているのに、いちばん取り返しのつかない
# ものが守られていない。止まっていた理由は「Actions のサービスアカウントに
# Storage の権限が1つも無い」こと。**Functions なら届くかもしれない**ので、
# まず測る。上の public_purge の下見（{}）が、そのまま2つ目の置き場
# （live-streaming-d3cac.firebasestorage.app）の結果も出す。
#   public_purge {} … 旅の写真の置き場で list / get / create / delete /
#                     update / buckets.get のどれができるか。list が立てば
#                     **件数と合計バイト数まで**。ファイル名は1つも出ない。
#                     **消す道はこちらの置き場には開いていない**（片づけは
#                     公開バケット決め打ち。置き場の名前を渡しても弾かれる）
#
# 測った結果（2026-09-12）: **list は立ったが get が立たない。** 544件・340MB を
# 数えられるだけで、中身は1バイトも読めない。かわりに Firestore に入っている
# 合言葉つきの URL なら、**Storage の IAM を1つも通らずに**実体が取れる
# （本番で1枚 200・993,115バイト・正しい JPEG）。それで退避する。
#   backup_photos … 旅の写真を退避へ。**既定では1バイトも書かない。**
#     {}                                   … 下見（何枚あって、何枚取ってあるか）
#     {"apply": true}                      … 取る（1回 128MB で区切る）
#     {"apply": true, "budget_mb": 400}    … 溜まったぶんを一度に
#     {"verify": true}                     … 1枚戻して**バイト列が一致するか**
#     {"selftest": true}                   … 本番に触らず振る舞いだけ再現
#     合言葉つきの URL は**ログに出さない**（このリポジトリは公開）
#
# あやと島カードに絵が乗らない件。**読むだけ。1バイトも書かない。**
#   cards_icon_probe … カードの channelId から、キャラクターの書類IDを
#                      引ける道が在るかを測る（入力なし）。出すのは
#                      人数・枚数と当たったかどうかだけ
#
# 投げ銭の札の日付（#92）。**既定では1行も書かない。**
#   donors_first_seen … islandDonors.firstSeenAt を「その人が初めて投げ銭した
#                       時刻」に直す。前は now（ジョブが走った時刻）が入って
#                       いて、毎晩 22:41 UTC＝翌朝 07:41 JST に走るぶん、
#                       札がいつも1日ずれていた。{} で空回し（何件ずれて
#                       いるか・ずれの日数の内訳だけ出す）、
#                       {"apply": true} で直す。**doneru_donations に1行も
#                       無い どねID は触らない**（引けない相手に「たぶん
#                       この日」を入れない）。どねID も名前も出さない
#
# 視聴者さんの IP の片づけ（#293）。**既定では1バイトも書かない。**
#   ip_purge          … 付箋（islandNotes）と企画（islandStreamEvent）に
#                       溜まった `ip` の欄を落とす。**書類そのものは消さない。**
#                       読む仕組みが1つも無いまま、消す期限も決めずに
#                       溜めていた。取るのは Functions 側でやめてある。
#                       {} で空回し（入れ物ごとに「全部で何件 / `ip` が
#                       入っているのが何件」だけ出す）、{"apply": true} で
#                       まとめ書きで落として、**同じ実行の中で数え直して
#                       0 を確かめる**。IP の値も書類IDも1文字も出さない
#   ip_purge_selftest … 上の振る舞いを偽の Firestore で動かす。
#                       **本番にも資格情報にも触らない**（手元でも走る）
#
# BigQuery を見るもの。**ログは公開なので、出すのは数字だけにしてある。**
#   doneru_audit     … 寄付の件数・合計・重なりを点検する（入力なし）
#   fix_stale_retry  … WAITING で止まった配信の next_retry_at を、いまの決まり
#                      （first_seen_at + 21時間）に揃える。#249 より前に書かれた
#                      行は「きっかり24時間後」なので、定時実行のぶれで拾われない。
#                      **既定は1行も書かない。** 書くには {"apply": true}
#   failed_terminate … `FAILED` のうち**二度と試す先が無い26本**を `SKIPPED`
#                      （終端）へ落とす。**非公開の37本は触らない**（あやとが
#                      公開に戻せるので、終端にすると戻した日に隠し続ける）。
#                      **既定は下見。** 書くには {"apply": true}
#   failed_reentry   … その**非公開の側**の受け口（#532）。非公開で取れなかった
#                      配信（`FAILED` / `SKIPPED`）が**公開に戻っていないか**を
#                      1本ずつ測って、戻っていたら `WAITING` に返す。返せば
#                      既存の「窓の外の枠」が翌晩に拾う（**枠は1行も変えない**）。
#                      測るのは `dead_stream_watch` の目そのもの（判定器を
#                      増やさない）。戻す本数は**今夜の枠の空きぶん、かつ1回5本
#                      まで**——古い配信は枠の先頭に並ぶので、一度に戻すと本物の
#                      取りこぼしを何晩も後ろへ押し出す（`island-misses.md` #149）。
#                      {} で下見（**1バイトも書かない**。前後の数え直しつき）、
#                      {"apply": true} で戻す。{"apply": true, "limit": 2} で
#                      先に少しだけ。終了コードは下見なら
#                      0=戻せるものは無い / 1=見つかった / **2=測れていない**
#                      （「0本」と「測れなかった」を混ぜない）。2〜3分かかる
#   failed_reentry_selftest
#                    … 上の決め方を偽の BigQuery と偽の測りで動かす。
#                      **本番にも資格情報にも触らない。ネットにも出ない**
#
# 切り抜き（#153）。どちらも読むだけ。
#   clip_cuts        … ショートにする区間の候補を出す {"video":"...","top":5}
#                      省くと、いちばん新しい配信を見る。当日は Firestore
#                      (streamChatMessages)、翌日以降は BigQuery を自動で選ぶ
#   functions_log    … 勝手に動く Functions のログを読む {"name":"collectLiveChat"}
#                      「溜まっていない」の原因（鍵・トークン・配信なし）を
#                      区別するのに要る。Firestore を数えるだけでは分からない
#   live_probe       … その Cloud Logging が読めないとき（#236 の IAM 待ち）に、
#                      collectLiveChat と同じ順で鍵→トークン→配信→コメントを
#                      自分でなぞって、どこで止まるかを見る。**読むだけ**
on:
  workflow_dispatch:
    inputs:
      script:
        description: "python/admin/ の中のスクリプト名（.py は不要）"
        required: true
        default: firestore_read
        type: string
      args:
        description: 'スクリプトへの入力（JSON）例: {"collection":"islandIdeas","limit":20}'
        required: false
        default: "{}"
        type: string

# 同時に走らせると読み書きが交錯するので1本ずつ
concurrency:
  group: admin-script
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: スクリプト名の検査
        run: |
          set -euo pipefail
          name='${{ inputs.script }}'
          # ディレクトリを抜け出せないように、英数字とアンダースコアだけ許可する
          if ! printf '%s' "$name" | grep -qE '^[a-z0-9_]+$'; then
            echo "::error::スクリプト名に使えるのは英小文字・数字・_ だけです: $name"
            exit 1
          fi
          if [ ! -f "python/admin/${name}.py" ]; then
            echo "::error::python/admin/${name}.py がありません。あるのは:"
            ls python/admin/*.py | sed 's|python/admin/||;s|\.py$||'
            exit 1
          fi

      # ARGS は「実行」ステップの env としてログに出る。入力にチャンネルIDや
      # 表示名を混ぜて回すと、スクリプトが何も出さなくてもそこで平文になる
      # （実際に ARGS: {"collection":"streamChatMessages",…} が出ていた）。
      # **入力は env: に置かず、出来事の中身から読む。** env: に置くと
      # ランナーがこのステップの env を伏せる前に印字してしまう。
      #
      # 拾い方は2つ要る。**形で分かるものと、形では分からないもの。**
      #
      #   (1) `UC…` と `@…` は、どの欄に入っていても形で分かる
      #   (2) **`@` を付けずに打った名前は、形では `islandIdeas` と
      #       見分けが付かない。** あやとが名前を打つときは `@` を
      #       付けないので（`{"name": "でこぼこ v"}`）、いちばん使う形が
      #       ここを素通りしていた。だから**欄の名前**で拾う
      #
      # 値の形で全部伏せに行くと `{"day": "2026-09-16"}` や
      # `{"collection": "islandRate"}` まで消えて、**ログが読めなくなる。**
      # 消えてよいのは「人を指す欄に入っていた字」だけ。
      - name: 入力の中の、個人を指しそうな値を伏せる
        shell: bash
        run: |
          set -uo pipefail
          # **読めなかったときに、素通ししない。** ここは名前が公開ログへ
          # 出る前の最後の関所なので、`|| true` で空にして先へ進むと
          # 「伏せるものが無かった」と同じ顔で名前が通る。読めないなら止める
          if ! raw="$(jq -r '.inputs.args // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)"; then
            echo "::error::入力が読めませんでした（jq が落ちた）。何も走らせません"
            exit 1
          fi
          # (1) 形で分かるもの。チャンネルID（UC + 20文字以上）と `@…`。
          #     JSON の区切り（" , } 空白）で止める
          shape="$(printf '%s' "$raw" \
            | grep -oE 'UC[A-Za-z0-9_-]{20,}|@[^"[:space:],}]+' \
            | sort -u || true)"
          # (2) **人を指す欄に入っていた字。** 入れ子と配列の中まで見て、
          #     いちばん近い欄の名前で決める。
          #     日付・数字・1文字は伏せない（伏せると、そこら中の数字が
          #     `***` になってログが読めなくなる。GitHub も短い伏せ字を嫌う）
          #     **抜き出す側が壊れたら、黙って 0件 にせず job ごと止める。**
          #     ここは「出る前に止める」ための step なので、素通しと
          #     「何も無かった」が同じ顔をしてはいけない
          if printf '%s' "$raw" | jq -e . >/dev/null 2>&1; then
            named="$(printf '%s' "$raw" | jq -r '
              paths(scalars) as $p
              | ($p | map(select(type == "string")) | last) as $k
              | getpath($p) as $v
              | select($k != null and ($v | type) == "string")
              | select($k | ascii_downcase | test("^(name|names|nickname|nick|alias|aliases|channel|channelname|channelid|handle|donor|donorid|doneru|doneruid|uid|user|username|viewer|author|who|by|doc|docs)$"))
              | $v
              | select(length >= 2)
              | select(test("^[0-9]+$") | not)
              | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)
            ' | sort -u)" || {
              echo "::error::伏せ字の抜き出しが落ちました。何も走らせません"
              exit 1
            }
          elif [ -z "$raw" ]; then
            # 入力そのものを渡していない。伏せるものは無い（既定は "{}"）
            named=""
          else
            # **JSON として読めないなら、ここで止める。**
            # 形で分かるぶんだけ伏せて先へ進んでいたが、`@` を付けない
            # 名前（`{"name": "…",}` のように打ち間違えたとき）は形では
            # 拾えないので、そのまま公開ログへ出ていた。**打ち間違えた
            # ときこそ名前が出る。** どのみち `_fs.args()` が先で止めるので、
            # 止める場所を「何かが印字される前」へ動かすだけ
            echo "::error::入力が JSON として読めません。何も走らせません"
            exit 1
          fi
          n=0
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            echo "::add-mask::$v"
            n=$((n + 1))
          done <<< "$(printf '%s\n%s\n' "$shape" "$named" | sort -u)"
          # 伏せた値そのものは出さない。件数だけ
          echo "入力の中の、個人を指しそうな値を $n 件伏せました"

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # YouTube の口は Doneru が出したトークンで叩く（枠を食わないため）。
      # そのトークンを取るのに鍵が要る。**discover_videos と同じ抽出**。
      #
      # ここに無くて落ちた。写真の取り込みを island_stats に足したとき、
      # 鍵は discover_videos の job にしか無いことを見落としていた。
      # job をまたいで環境変数は渡らない。
      - name: Doneru key を抽出
        shell: bash
        run: |
          set -euo pipefail
          url='${{ secrets.EXPO_PUBLIC_DONERU_WSS_URL }}'
          key="$(printf '%s' "$url" | sed -n 's/.*[?&]key=\([^&]*\).*/\1/p')"
          if [ -z "$key" ]; then
            echo "ERROR: EXPO_PUBLIC_DONERU_WSS_URL から key=... を抽出できませんでした" >&2
            exit 1
          fi
          # ログに平文で出力されないようマスクする
          echo "::add-mask::$key"
          echo "DONERU_ALERTBOX_KEY=$key" >> "$GITHUB_ENV"

      # **明細を出すスクリプトを回す前に、伏せる側が効いているかを見る。**
      #
      # ここから回るのは `python/admin/` の中で、`doneru_viewers` /
      # `donors_import` / `characters_link` / `characters_gap` / `firestore_read` は
      # どれも**1人ずつ並べる**口を持っている。伏せているのは
      # `python/logsafe.py` ひとつだけで、そこが素通しになっても
      # **run は緑のまま終わる**（出るものが増えるだけだから）。
      # しかも押した回のログは、そのまま誰でも読める場所に残る。
      #
      # 過去に3回出ている——#180 / #217 / #379（公開の Actions ログの名簿を
      # 過去 1,065 実行ぶん消した）。**消すのは出たあと。出る前に止める。**
      #
      # 毎晩ぶんの同じ step は `tips_after_doneru.yml` に置いてある。
      # あちらは繋ぎで毎晩発火する側、こちらは**人が押した目の前で止まる側**。
      # 出る口が2つあるので、見張りも2つ要る（`docs/island-misses.md` #125 の
      # 「兄弟が3本あったら、3本とも見る」）。
      #
      # 認証もクエリも要らず 0.5 秒で終わる。落ちたら、スクリプトは1行も走らない。
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      - name: 実行
        working-directory: python/admin
        env:
          ARGS: ${{ inputs.args }}
          # キャラクターの移行（characters_migrate）が、名前と絵文字の
          # 出どころであるスプレッドシートを**読む**のに要る。
          # 読むだけで、1行も書かない。移行が終わったら、この2行ごと消す。
          EXPO_PUBLIC_GAS_API_URL: ${{ secrets.EXPO_PUBLIC_GAS_API_URL }}
        run: python "${{ inputs.script }}.py"
