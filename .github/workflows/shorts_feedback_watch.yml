name: ショートへのあやとの指摘を帳面と突き合わせる

# 札 `shorts` の issue にある**あやと本人のコメント**のうち、指摘の帳面
# （`.claude/skills/viral-shorts-creator/references/ayato_feedback.md`）のどちらの節にも
# URL が無いものを数える（`tools/shorts/feedback/watch.py`）。
#
# ## なぜ要るか（2026-10-21）
#
# あやと:「私の毎回の指摘は以後繰り返さないようナレッジ溜まる仕組みは用意してね。」
# 指摘は帳面に集め、原稿を書く段・批評役の (h)・lint（`tools/shorts/script/lint.py`）で当てる。
# **帳面に入れ忘れた指摘は、どの段にも届かない。** 入れるのはセッションで、セッションは忘れる。
# 同じ日に、朝に直された題の型が1時間40分後の原稿に届かなかった（`docs/island-misses.md` #297）。
#
# ## 落ちかた
#
# **入っていないコメントがあれば赤くする**（終了コード 1）。そのうえで issue
# 「【見張り】ショートへのあやとの指摘が帳面に入っていない」を `待ち-システム` で1本だけ開く
# （あれば書き換え、無くなったら閉じる。`python/run_watch.py` の作法）。
# 数えられなかった（GitHub に届かない・帳面が読めない・issue かあやとのコメントが0）も赤（2）で、
# このときは issue を開きも閉じもしない——読めていないのを「取りこぼし無し」と言わない。
#
# ## 帳面は、どの枝のものでも数える（`--branches`）
#
# ショートの作業は作業枝で進み、master に入るのは何日かあと。帳面に足したのが作業枝だけのあいだも
# 入れたことは入れたことなので、全部の枝の帳面を API で読んで合わせる（git の履歴は取らない）。
# 書いてから3時間のコメントはまだ数えない（足す前の数分に走って issue が立つ、を繰り返さない）。
#
# ## いつ走るか
#
# 1日1回。あやとの返事は日本の昼に来るので、その日の分が入ったかを夜（JST 23時台）に見る。
# cron はこのリポジトリでは何時間も遅れて走る（`python3 python/cron_lag.py`）。遅れても1日1回見られれば足りる。
#
# ## 手で押すときの既定は「見るだけ」
#
# `apply` の既定は false（数えて赤くするだけで、issue には書かない）。cron のぶんは読む人がいないので apply。

on:
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "issue を実際に開く／書き換える／閉じる（off なら数えるだけ）"
        required: false
        default: false
        type: boolean

concurrency:
  group: shorts-feedback-watch
  cancel-in-progress: false

permissions:
  contents: read
  # 見張りの issue を開く・書き換える・閉じる（読むのは札 shorts の issue とコメントと、各枝の帳面）
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # **依存を入れるのは、素性の見張りのためだけ。** 見張りの本体（watch.py）は標準ライブラリだけで動くが、
      # issue を合わせる土台（`python/run_watch.py`。写さずに借りる）が `donor_calls` 経由で `logsafe` を取り込むので、
      # 素性を出しうる口に数えられる。口の手前の同じ job で、伏せる側が効いていることを見る
      # （`python/logsafe_wiring_selftest.py`。同じ土台に乗る `fx_tips_watch.yml` と同じ形）。
      # 素性の見張りは `island_channels` などを取り込むので、BigQuery の口まで要る
      - name: 素性の見張りの依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # 認証もクエリも要らず数秒で終わる。落ちたら下は1行も走らない
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      # **本番を数える前に、判断のところが生きているかを見る。** 偽の GitHub と偽の帳面で回すだけ（外へは出ない）。
      # 帳面そのものの形と、帳面が lint・check.py・手順から名指されているかも、ここで見る
      - name: 判断のところと帳面の形を、先に確かめる
        run: |
          python3 tools/shorts/feedback/watch_selftest.py
          python3 tools/shorts/feedback/ledger_selftest.py

      - name: あやとのコメントを帳面と突き合わせる
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name != 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          if [ "$APPLY" = "true" ]; then
            python3 tools/shorts/feedback/watch.py --branches --apply || rc=$?
          else
            python3 tools/shorts/feedback/watch.py --branches || rc=$?
          fi
          echo "終了コード: $rc（0=全部入っている / 1=帳面に入っていないコメントがある / 2=数えられなかった）"
          if [ "$rc" = "1" ]; then
            {
              echo "### ショートへのあやとの指摘が、帳面に入っていません"
              echo ""
              echo '`.claude/skills/viral-shorts-creator/references/ayato_feedback.md` の「指摘」か「指摘ではないコメント」に URL を足して push する（どの枝でもよい）。'
              echo '一覧は、上の step のログと、見張りの issue（`shorts-feedback` の札）にあります。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" = "2" ]; then
            {
              echo "### 数えられませんでした"
              echo ""
              echo '取りこぼしが無かった、という意味ではありません。issue は開きも閉じもしていません。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
