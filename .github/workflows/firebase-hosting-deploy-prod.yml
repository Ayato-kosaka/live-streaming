name: Firebase Hosting Deploy
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 🏗️ `.env` ファイルの作成
        run: |
          # EXPO_PUBLIC_DONERU_WSS_URL はここに書かない（#180）。
          # EXPO_PUBLIC_ で始まるものは Expo が書き出しへ焼くので、
          # 焼いた先が公開されている以上、Secret に入れても意味がない。
          # 実際に本番の entry-….js から鍵がそのまま読めた。
          # Doneru の鍵は作り直せないので、二度と外へ出さない形にした。
          # いまは OBS の URL の ?k=… （こちらが出した合言葉）だけを渡し、
          # 鍵を使うのは Functions の中だけ。Secret は消していない
          # （python の取り込みが Actions の中で使っている）。
          echo "EXPO_PUBLIC_GAS_API_URL=${{ secrets.EXPO_PUBLIC_GAS_API_URL }}" >> .env
          echo "EXPO_PUBLIC_GAS_LOG_API_URL=${{ secrets.EXPO_PUBLIC_GAS_LOG_API_URL }}" >> .env
          echo "EXPO_PUBLIC_YOUTUBE_CHANNEL=${{ secrets.EXPO_PUBLIC_YOUTUBE_CHANNEL }}" >> .env
          echo "EXPO_PUBLIC_YOUTUBE_API_KEY=${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}" >> .env
          # EXPO_PUBLIC_CLAUDE_API_KEY もここに書かない（#217）。
          # 本番の entry-….js に sk-ant-… がそのまま入っていた。
          # あれは読まれるだけでなく、**そのまま課金される鍵**。
          # 出すたびに焼き直すことになるので、先に外す。
          # /chat-display のボット返信は、鍵が無ければ
          # 「コメント、ありがとう！」に落ちる（utils.ts の受け皿）。
          # サーバー側へ移すのは #217 の2番目。
          echo "EXPO_PUBLIC_GIT_COMMIT=${{ github.sha }}" >> .env
      - run: "npm ci && npm run build:web"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 30d
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live # 本番環境へデプロイ

      # サービスアカウントに Firebase Rules の権限が無いと 403 になるが、
      # サイトはルールに依存しない(書き込みは全部 Functions 経由)ので
      # ここで止めない。権限を付けたら自動で反映されるようになる。
      # **continue-on-error は付けない。** 以前ここと Storage に付いていて、
      # Storage のルールが403で落ちていたのに job が success を返し、
      # 数日ぶん誰も気づかなかった（#132）。配れなかったなら、赤く落ちてほしい。
      - name: 🔐 Firestore ルールのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # storage.rules を誰も配っていなかった(北欧の写真を入れたときに増えた)。
      # 中身は deny-all で、写真はダウンロードの合言葉つき URL で配るから
      # ルールの外を通る。**配らなくても写真は見えるが、配らないと
      # 「置き場を直接のぞけない」ことが誰にも保証されない。**
      # Firestore とは別の step にする。Storage の失敗はワークフローにも
      # 反映し、成功表示のままルール未反映になることを防ぐ（#132）。
      - name: 🔐 Storage ルールのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only storage \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # **いちばん最後に置く。** ここは #168（サービスアカウントに索引を作る
      # 権限が無い）が片付くまで必ず赤くなる。前に置いていたら、落ちた時点で
      # 後ろの Storage ルールが skip された（実際に2回そうなった）。
      # **配れるものを全部配ってから、配れないものだけで落ちる**、の順にする。
      #
      # continue-on-error は付けない。落ちても画面は動く（付箋は索引に頼らず
      # 引いている）が、赤いままにしておくのは #168 が片付いていないことを
      # デプロイのたびに思い出すため。権限が付けば、黙って緑に戻る。
      - name: 🔎 Firestore インデックスのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
