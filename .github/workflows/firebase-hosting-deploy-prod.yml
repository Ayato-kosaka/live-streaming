name: Firebase Hosting Deploy
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 🏗️ `.env` ファイルの作成
        run: |
          # EXPO_PUBLIC_DONERU_WSS_URL はここに書かない（#180）。
          # EXPO_PUBLIC_ で始まるものは Expo が書き出しへ焼くので、
          # 焼いた先が公開されている以上、Secret に入れても意味がない。
          # 実際に本番の entry-….js から鍵がそのまま読めた。
          # Doneru の鍵は作り直せないので、二度と外へ出さない形にした。
          # いまは OBS の URL の ?k=… （こちらが出した合言葉）だけを渡し、
          # 鍵を使うのは Functions の中だけ。Secret は消していない
          # （python の取り込みが Actions の中で使っている）。
          # EXPO_PUBLIC_GAS_API_URL も渡さない（#305）。**参照がもう1つも無い。**
          # スプレッドシートを読み書きしていた3つ（getTable / getById / insert）を
          # 落として、名簿もスパチャも貯金箱もあやと島の口へ移した。
          # 焼いたままにすると、次に「表から取ればいい」と書いた人のぶんから
          # 消えた表を読みに行くことになるし、**URL を知っていれば誰でも
          # 全件読める**表への入口が、書き出しに残り続ける。
          # Secret は消していない（python/admin の移行ものが Actions の中で使う）。
          echo "EXPO_PUBLIC_GAS_LOG_API_URL=${{ secrets.EXPO_PUBLIC_GAS_LOG_API_URL }}" >> .env
          echo "EXPO_PUBLIC_YOUTUBE_CHANNEL=${{ secrets.EXPO_PUBLIC_YOUTUBE_CHANNEL }}" >> .env
          # EXPO_PUBLIC_YOUTUBE_API_KEY は渡さない。**参照がもう1つも無い。**
          # 書き出しを対照つきで調べた（2026-09-17）。わざと鍵の形を仕込んだ
          # 写しでは 1件ずつ拾えて、本番の entry-….js は 0件。ブラウザから
          # YouTube を叩いているところ（liveBroadcasts / liveChat / videos）は
          # どれも本人の OAuth トークンで、鍵は要らない。
          # `DEPLOYMENT_GUIDE.md` にも「no longer needed」と書いてある。
          # **渡し続けるのが罠になる。** `.env` に載っているかぎり、次に
          # `process.env.EXPO_PUBLIC_YOUTUBE_API_KEY` と書いた人のぶんから、
          # 誰にも気づかれずに公開の JS へ焼かれる。下の鍵（#217）は同じ形で
          # 止めてコメントを残したのに、こちらだけ残っていた。
          # GitHub Secret のほうは消していない（消すのはあやとの操作。
          # 他で使っているかもしれない）。
          # EXPO_PUBLIC_CLAUDE_API_KEY はもう要らない（#217）。
          # 本番の entry-….js に sk-ant-… がそのまま入っていた。
          # あれは読まれるだけでなく、**そのまま課金される鍵**。
          # あやとの言葉（2026-09-09）「クロード呼び出し系は全部消して良いです。
          # 使ってない」で、lib/claude.ts ごと落とした。**もう参照が無い。**
          # GitHub Secret のほうは消していない（消すのはあやとの操作）。
          echo "EXPO_PUBLIC_GIT_COMMIT=${{ github.sha }}" >> .env
      - run: "npm ci && npm run build:web"

      # **配る前に、配るものを数える。**
      #
      # `firebase.json` の受け皿（`"**" → /index.html`）を外したので、
      # **書き出しに無い面は、そのまま 404 になる。** 受け皿が在ったころは
      # 書き出しに失敗した面も表紙が出ていて、**落ちていることが見えなかった。**
      # 静かに拾ってくれる手が無くなったぶん、ここで数える。
      #
      # ネットに出ない（`dist/` を見るだけ）。sitemap に載っている面と、
      # 載せていない面（`/me` `/roulette` ほか）の両方を、Firebase の
      # 配りかた（`cleanUrls`）に合わせて探す。
      #
      # **2（数えられなかった）では止めない。** 測れないことと、
      # 面が落ちていることは別（`docs/island-standards.md` §15）。
      - name: 配るものが、ぜんぶ書き出せているか
        run: |
          set -uo pipefail
          node tools/sprites/notfound.mjs --dist && code=0 || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::書き出しを数えられませんでした（配るのは止めません）"
            exit 0
          fi
          exit "$code"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 30d
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live # 本番環境へデプロイ

      # **continue-on-error は付けない。** 以前ここと Storage に付いていて、
      # Storage のルールが403で落ちていたのに job が success を返し、
      # 数日ぶん誰も気づかなかった（#132）。配れなかったなら、赤く落ちてほしい。
      #
      # **ここが赤いのは、いまはもう「想定どおり」ではない。**
      # 権限が無くて 403 で落ちていた時期があったが（#168）、2026-09-08 に
      # 権限が付いて、いまは緑で通っている。赤くなったら本物の異常なので、
      # 「昔からそういうもの」で流さないこと。
      - name: 🔐 Firestore ルールのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # storage.rules を誰も配っていなかった(北欧の写真を入れたときに増えた)。
      # 中身は deny-all で、写真はダウンロードの合言葉つき URL で配るから
      # ルールの外を通る。**配らなくても写真は見えるが、配らないと
      # 「置き場を直接のぞけない」ことが誰にも保証されない。**
      # Firestore とは別の step にする。Storage の失敗はワークフローにも
      # 反映し、成功表示のままルール未反映になることを防ぐ（#132）。
      - name: 🔐 Storage ルールのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only storage \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # **いちばん最後に置く。** ここは #168（サービスアカウントに索引を作る
      # 権限が無い）のあいだ必ず赤くなっていて、前に置いていたら落ちた時点で
      # 後ろの Storage ルールが skip された（実際に2回そうなった）。
      # **配れるものを全部配ってから、配れないものだけで落ちる**、の順は
      # そのまま残す。順番の理由は権限とは別で、これからも効く。
      #
      # **#168 は 2026-09-08 に権限が付いて閉じた。ここはいま緑で通る。**
      # 「#168 があるから赤くて当たり前」はもう成り立たない。赤くなったら
      # 本物の異常として読むこと。**「想定どおりの赤」を放置する癖が
      # #132 を数日見逃した原因**なので、赤い理由を書き置きに頼らない。
      #
      # continue-on-error は付けない。落ちても画面は動く（付箋は索引に頼らず
      # 引いている）が、配れていないことは赤で知りたい。
      - name: 🔎 Firestore インデックスのデプロイ
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # **いちばん最後。配れるものを全部配ってから確かめる**（上の #168 の
      # 順番の決めごとと同じ理由）。
      #
      # 見るのは「無い道が、本当に 404 で返っているか」。2026-09-18 まで
      # `firebase.json` の受け皿が**存在しない URL を全部 表紙に落として
      # 200 で返していて**、島が作ってある 404 の面に誰も辿り着けなかった。
      # 重いのは副作用のほうで、**本番では死んだ内部リンクも 200 で返る**ので、
      # リンク切れの見張りが本番では鳴らなかった（`docs/island-misses.md` #140）。
      #
      # ここを繋ぐのは、**受け皿は「戻したほうが楽」に見える形で戻るから**。
      # 戻した瞬間に、この step が赤くなる。
      #
      # 道具は自分で対照を持っていて、測れなければ数字を1つも出さずに 2 で
      # 止まる。**2 では落とさない**——配れてはいるので。
      - name: 無い道が、ちゃんと 404 で返っているか
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          node tools/sprites/notfound.mjs && code=0 || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::本番を測れませんでした（配るのは済んでいます）"
            exit 0
          fi
          exit "$code"

      # **配ったあと、本番の面を一周する。**
      #
      # ここまでの見張りは、**出したものを見ていなかった。**
      # `crawl.mjs` は手元の書き出し（`localhost`）しか見ないし、
      # `prod.mjs` を直に起こすと `/me` の看板と顔の2面だけ。1つ上の
      # `notfound.mjs` が見るのは**無い道**が 404 で返るかで、
      # **在る130面が在る面として配られているか**は誰も見ていなかった。
      # Hosting のリダイレクト・配信ヘッダ・実際に配られたバイト列の層は、
      # **手元のビルドでは絶対に出ない。** 配ったあとにしか見られない。
      #
      # 面の一覧は手で並べない。出どころは3つ——本番の `sitemap.xml`（123面）、
      # リポジトリの `site/app/**/page.tsx` の静的な道（サイトマップに無い7面。
      # `/roulette` のように配信に映るものが入っている）、本番の `/all` に
      # 並んでいる行き先（121面）。**動く段（`[chapter]`）の面は3つめからしか
      # 出ない**——`/island/<章>/streams` の4面が、2つだけ見ていたあいだ
      # 見張りの外に居た（`docs/island-misses.md` #174）。
      #
      # **3つが食い違っていること自体も違反として数える。** 在る面が sitemap に
      # 無ければ検索から見つからないし、`/all` に無ければ「ここからどこへでも
      # 1回で行ける」が嘘になる。揃えないと決めたものは `ABSENCES` に理由を1行。
      #
      # ネットに出るのは本番だけ。130面で数秒（2026-09-19 の実測）。
      #
      # **落ちても配りは取り消さない**（もう出ている）。赤くして残す形。
      # **continue-on-error は付けない**（隠れた赤は誰も見ない。#132）。
      #
      # **2（測れなかった）では止めない。** 1つ上の `notfound.mjs` と同じで、
      # 測れないことと面が落ちていることは別（`docs/island-standards.md` §15）。
      # 測れなかった理由は警告として残る。
      - name: 配った面が、面として配られているか
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          node tools/sprites/prodsweep.mjs && code=0 || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::本番を一周できませんでした（配るのは済んでいます）"
            exit 0
          fi
          exit "$code"

      # **配ったあと、図鑑の「もらったカード」から、その人のカードぜんぶへ
      # 行けるかを数える**（`docs/island-misses.md` #177 の見張り）。
      #
      # ここに置く理由は、上の `prodsweep.mjs` と同じ。**本番を読む見張りの
      # 居場所は、本番に配ったあと。** 毎 PR に載せると、本番の Hosting と
      # `/island-api` が返らない日に**関係のない PR が赤くなる**——偽の赤は、
      # 人に CI を無視する癖を付ける。配りの後ろなら、同じ赤が
      # **本当に見たい赤**になる。
      #
      # `prodsweep.mjs` との違いは**ブラウザが要る**こと。欄は押して開く形
      # （`Longer`）なので、配られたバイト列を読むだけでは「3枚目から先へ
      # 行けるか」が分からない。枚数のもとは本番の口（`GET /cards`）から取る
      # ——差し込みのカードは1人3枚までで、**43枚の人が居ない**まま
      # 「溜まったときに壊れるもの」を測ることになる。
      #
      # **`PORT=` は渡さない。** 渡すと手元の書き出しを見にいく。配ったあとに
      # 見るべきは本番の面なので、既定（本番）のまま走らせる。
      - name: 確かめる道具とブラウザを入れる（下の step 用）
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -uo pipefail
          # **ここでは何も決めない。** 入らなかったのは「測れていない」であって
          # 「本番が壊れている」ではないので、赤くしない（配りはもう済んでいる）。
          # 入ったかどうかは下の step の道具が自分で見る（`tools/sprites/chrome.mjs` が
          # 在りかを探して、無ければ 2 を返す）。ここは落とさない
          sudo mkdir -p /opt/pw-browsers || true
          sudo chown "$(id -u):$(id -g)" /opt/pw-browsers || true
          (cd tools/sprites && npm ci --no-audit --no-fund) || true
          node tools/sprites/node_modules/playwright-core/cli.js install --with-deps chromium || true
          # **どの番号で置かれたかを、毎回ログに残す。** 番号が変わったことに
          # 気づけるのはここだけ（下の step は番号を知らない作りにしてある）
          ls -la /opt/pw-browsers || true

      # **落ちても配りは取り消さない**（もう出ている）。赤くして残す形。
      # **continue-on-error は付けない**（隠れた赤は誰も見ない。#132）。
      #
      # **2（測れなかった）では止めない。** 上の2本と同じで、測れないことと
      # 行けないことは別（`docs/island-standards.md` §15）。道具は本番の口が
      # 引けない・図鑑が出ない・外に出られなかった先がある・対照が外れた、の
      # どれでも 2 を返して**数字を1つも出さない。**
      # **ブラウザの版を、ここで名指ししない。** 最初はここに
      # `[ -x /opt/pw-browsers/chromium-1194/… ]` と書いていた。番号は
      # `playwright-core` の版で変わるので、上げた日から**この if が永遠に真になり、
      # 毎回「警告」で抜けたまま緑に見えて1行も数えない。** 歯止めだけを glob に
      # しても、今度は道具のほうが古い番号を掴んで**本番は無事なのに赤くなる。**
      # 在りかは `tools/sprites/chrome.mjs` が1か所で決め、無ければ道具が 2 を返す。
      # **ここは 2 を警告に倒すだけ**（`prodsweep` と同じ形）。
      - name: 配ったカードの欄から、その人のカードぜんぶへ行けるか
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          node tools/sprites/cardgo.mjs && code=0 || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::本番のカードを数えられませんでした（配るのは済んでいます）"
            exit 0
          fi
          exit "$code"
