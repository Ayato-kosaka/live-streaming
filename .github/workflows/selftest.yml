# **見張り（selftest）を、マージする前に回す。**
#
# 2026-09-18 まで、このリポジトリには `pull_request` で走るワークフローが
# 1本も無かった。見張りは全部、毎晩の焼き直し（`rebake.yml`）や退避
# （`backup.yml`）の**中でしか**走っていない——つまり
# **master にマージして、本番に配ったあと。**
#
# その日に実害が2つ出た。
#
#   1. `python/dead_stream_watch_selftest.py` が **master で赤いまま2日**
#      残った（#520 が対照の前提を壊した）。どこからも走っていないので誰も
#      気づかない
#   2. **その赤い見張りを抱えたまま #520 をマージして、本番に配った**
#
# そのうえ棚卸ししたら、**どこからも走っていない見張りが12本**あった。
# うち3本（`python/admin/` の `donors_import` / `firestore_delete` /
# `ip_purge`）は**消す道具を守っている見張り**で、いちばん走っていて
# ほしいものが走っていなかった。
#
# ## ここは「落ちるときに落ちる」ことが本体
#
# いつも緑の CI は、何も守っていないのに守っている気にさせる。
# だから回し役（`python/selftest_runner.py`）は、**本物の見張りを1本も
# 回す前に、自分が落ちられることを毎回実測する**——偽の見張りを3本
# こしらえて 0 / 1 / 2 が出るのを見てから先へ進む。外れたら、本物の
# 数字を1つも出さずに 2 で落ちる（`docs/island-standards.md` §15）。
#
# ## `rebake.yml` からは外していない
#
# あちらは**焼いたあとの `site/content/*.ts`** を見る見張りを含んでいて、
# PR の時点とは見ているものが違う。**両方で走ってよい**（どれも数秒）。
# `site/selftest/*.mjs` の4本もあちらに残してある——**出る口が2つあるなら
# 見張りも2つ**（`docs/island-misses.md` #126 の決めごと2）。
#
# ## 重い2本は、ここに居ない（2026-10-16。#273）
#
# あやとの言葉:「CIがめっちゃ時間使っててマージがなかなかできない…
# 正直CIって最低限でよいよ」。直近300回を job ごとに数えたら、本当だった:
#
# | job | 回数 | 赤 | 打切 | 所要の中央 | 最長 |
# | --- | ---: | ---: | ---: | ---: | ---: |
# | `selftest` | 295 | **49** | 21 | 9.7分 | 10.5分 |
# | `browserwatch` | 295 | 9 | 37 | **18.4分** | 19.0分 |
# | `reachkeys` | 60 | 2 | 7 | 5.5分 | 10.1分 |
# | `reachwatch` | 124 | **0** | 25 | 4.7分 | **31.2分** |
#
# **順番待ちは中央 0.1分**（ランナーの取り合いではない）。job は並列なので、
# **PR が緑になるまでの壁時計は `browserwatch` の 18.4分がそのまま**だった。
#
# だから `browserwatch` と `reachwatch` を `heavy_watch.yml`（`重い見張り`）へ
# 移した。**消していない。通り道を変えただけ**で、あちらは `push: master` と
# 毎晩の繋ぎで回る。**外したぶん、落ちたときに気づける道を1本足してある**
# （あちらの `watch_down` job が `watch-down` の issue を開き続ける）。
#
# ここに残したのは2本。`selftest` は**295回で49回捕まえている**ので外せない。
# `reachkeys` は 5.5分で、`selftest` の 9.7分に隠れる（並列なので壁時計が
# 伸びない）。**狙いは 18.7分 → 10分。**
name: Selftests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 同じ枝に続けて push したら、前の run は止めてよい。
# master は止めない——「master が緑だったか」は1回ずつ残したい。
#
# **`cancel-in-progress: false` だけでは足りなかった。** GitHub は
# 「走っている run」を止めないだけで、**同じ group で順番待ちしている run は
# 無条件に差し替える。** master に続けて push した日は、待っていたほうが
# `cancelled` のまま消える——**緑でも赤でもない、何も言っていない run** になる。
#
# 実測（2026-10-13）: master への push 40回のうち **4回（10%）がそれで消えていた。**
# この見張りを作った理由そのもの（`docs/island-misses.md` #126 の「赤い master が
# 2日残った」）が、別の道でまた起きる形だった。
#
# だから **master は sha ごとに別の group にする。** 順番待ちが起きないので
# 差し替えられない。PR は今までどおり枝ごとで、続けて push したら前のが止まる。
concurrency:
  group: selftest-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # **繋ぎ（`workflow_run`）が実際に走っているかを数えるのに要る。**
  # 名前が合っていても、繋ぎ先が止まれば黙って動かなくなる——そこは
  # YAML を読むだけでは分からず、run の実績を引くしかない
  # （`python/chain_alive_watch.py`）。**読むだけ。1バイトも書かない**
  actions: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    # 15分では足りなくなった（2026-10-24）。見張りを全部回す step が 14分14秒で、その後ろの
    # 繋ぎの見張りの途中で上限に当たって取り消された。EC2 の札の見張り（ec2_queue_selftest.py。
    # 守りを1つずつ外す対照が26通り）が128秒増やした。対照を削って縮めるより、上限を上げる
    #
    # 上げた同じ日に、上げるのをやめて中身を速くした。1本ずつ回していて、4コアのうち1つしか
    # 使っていなかった（PR #1031 の run で全部回す step が17分）。いまは回し役が CPU の数だけ並べる
    # （`python/selftest_runner.py` の「並べて回す」）。上限はそのまま置いておく——止まった見張りを
    # 早く切るのは、回し役の1本ごとの上限（300秒）の仕事
    timeout-minutes: 20

    steps:
      # **何がこの run を起こしたかを、run そのものに残す。**
      #
      # run の一覧からは見分けがつかない——PR を開いた回も、枝に追い足した
      # push も、開き直した回も、`event` は全部 `pull_request` で出る。
      # 「PR に追い足したコミットは見張りを通るのか」を、あとから誰かが
      # もう一度調べ直さずに済むように、`action` をここに書き出す
      # （追い足しなら `synchronize`）。
      - name: 何がこの run を起こしたか
        env:
          EV: ${{ github.event_name }}
          ACT: ${{ github.event.action }}
          SHA: ${{ github.sha }}
        run: |
          line="起こしたもの: ${EV} / ${ACT:-（action なし）} / ${SHA}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      # 見張りは口を全部偽物に差し替えて回るが、**読み込むだけで本物の
      # パッケージが要る**ものがある（`google.cloud` / `yaml` / `requests`）。
      # 入れないと「No module named …」で赤くなり、**中身を1つも見ないまま
      # 落ちた run** が「見張りが落ちた」に見える
      - name: Python のパッケージを入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install PyYAML

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # `python/name_tail_selftest.py` だけは、**本物の OBS の突き合わせ**
      # （`app/alertbox/matching.utils.ts`）を node で動かして見る。
      # `typescript` が引けないと、あの見張りは「当たらなかった」ではなく
      # **2（確かめられなかった）**で落ちる。
      #
      # **これは「1本だけ」ではない。** 直下の `package.json` は Expo の側なので、
      # この1行で **1,452 パッケージ**入る（CI で20秒。2026-09-18 実測）。
      #
      # それでも**そのままにしてある。** name_tail が求めているのは typescript
      # **5系**で、それを決めているのが直下の `package.json`（`^5.3.3`）だから。
      # 空の置き場に `npm install typescript` をすると2秒で済むが、入るのは
      # **7系**（別物の API。`ts.transpileModule` が無い）で、name_tail が
      # 2 で落ちる——**当てて確かめた。** 版を手で書いて逃がすと、
      # `package.json` と2か所に版が散って、上げた日に黙ってずれる
      - name: typescript を置く（name_tail が本物の OBS を動かすため）
        run: npm install --no-save --no-audit --no-fund typescript

      # **`site/selftest/*.mjs` の4本を回すのに要る。**
      #
      # この4本は 2026-09-18 まで `rebake.yml` の中でしか走っていなかった
      # ——つまりマージして配ったあと。外していた理由は「`npm ci`（site）は
      # Expo の丸ごとで重い」だったが、**そこが違っていた。**
      #
      #   site の `npm ci`      … **14秒 / 114 パッケージ**（Expo は1つも入らない。
      #                            `site/package.json` は next・react・firebase と型だけ）
      #   直下の `npm install`  … 19〜34秒 / 1,452 パッケージ（**こちらが Expo の丸ごと**）
      #
      # **軽いほうを外して、重いほうを毎回入れていた。**
      #
      # `typescript` と `@types/node` だけを置く道もある（実測で、その2つで
      # 4本とも通る）。取らないのは、置いたものが `site/package.json` と
      # ずれる形だから。`npm ci` なら lock のとおりに入る
      - name: site の依存を入れる（mjs の見張り4本が tsc を使う）
        working-directory: site
        run: npm ci --no-audit --no-fund

      # **`functions/selftest/` の6本は、どこからも走っていなかった。**
      #
      # 2026-09-18 に `python/watch_census_selftest.py`（どの見張りがどこから
      # 走るかを数える道具）を書いて、はじめて名指しで出た。`rebake.yml` にも
      # `backup.yml` にも無く、回し役の拾う先（`python/` と `site/selftest/`）
      # の外に居たので、**2つある数え方のどちらからも見えていなかった。**
      #
      # 守っているのは公開の口から素性を落とすところ——`GET /cards` の応答に
      # チャンネルIDが残らないこと（`docs/island-incident-2026-09-14-cards.md`）。
      # #126 の決めごと1「素性・鍵・お金が動くものは、繋ぐ理由を探すほうに倒す」。
      #
      # 値段（2026-09-18。**CI の実測**。run 35308779198）: ここが **8秒**、
      # 6本を回すのに **65秒**（1本 10.8秒。**中身ではなく、1本ずつ自分で
      # `tsc` を通すぶん**）。run ぜんぶで **52〜73秒 → 144秒**。
      # 手元の箱では `npm ci` 10秒 / 663 パッケージ、1本 15秒だった
      - name: functions の依存を入れる（cards の見張り6本が tsc と firebase-admin を使う）
        working-directory: functions
        run: npm ci --no-audit --no-fund

      # 回し役は `--only-drill` を渡さなくても対照を先に回す。
      # ここで**別の step として**もう一度回しておくのは、対照が外れた回に
      # 「どこで落ちたか」がログの先頭で分かるようにするため
      # （2回目の値段は2秒ほど。並べかたの対照を足したぶん、0.5秒から増えた）
      - name: 回し役が落ちられるかを、先に見る
        run: python3 python/selftest_runner.py --only-drill

      # 落ちた1本で止めない。**全部回してから、まとめて落ちる。**
      # 最初の1本で止まると、2本目以降が見えない
      #
      # **CPU の数だけ並べて回す**（ランナーは4コア）。同じものに書く見張りは
      # 回し役の `LANES` で1本ずつにしてある（見張りの環境は1本ずつ回していたときと同じ）。
      # 行は終わった順に出る。最後に「遅かった順（上位10本）」が出るので、
      # 次に伸びてきたら、そこから縮める
      - name: 見張りを全部回す
        run: python3 python/selftest_runner.py

      # **名前が `_selftest` でない判定器**は、回し役が拾わない。
      # 拾わないものを名指しで数えるのが `python/watch_census_selftest.py` で、
      # あれ自身は上の回し役が拾って走る。ここに並べてあるのは、
      # **棚卸しが「断っていない」と言い切っている側**——つまり
      # 中身で判定器と分かって、CI で回すと決めたもの。
      #
      # 値段は測った（2026-09-19。手元の箱）。どちらも書き出しもブラウザも要らない。
      - name: 道具にリポジトリの場所が直書きされていないか（0.18秒）
        run: node tools/sprites/rootcheck.mjs

      - name: 共有画像が、ちゃんと島に見えるか（6.0秒）
        run: python3 tools/sprites/ogcheck.py

      # **毎晩のログを数える道具の、探し方そのものを見る。**
      # 回し役は `*_selftest.py` を拾うので、名前の違うこれは拾われない
      # ——つまり 2026-09-21 まで**どこからも走っていなかった。**
      # `docs/island-misses.md` #79 の「探し方が壊れていても 0 と出る」を
      # 止めるための道具なので、走っていないなら在っても同じ。
      #
      # **環境変数は渡さない。** オーナーのぶんを除く足は、自分で差して
      # 外してから数える（周りに何が置いてあっても同じ数が出るように）
      - name: ログを数える道具の探し方が効いているか（0.1秒）
        run: python3 tools/logident.py --selftest

      # **繋ぎ（`workflow_run`）が生きているかを、本物の run で当てる。**
      #
      # `python/workflow_link_selftest.py`（上の回し役が拾う）が見ているのは
      # **名前だけ**で、繋ぎ先が実在する `name:` を指しているかで止まる。
      # 名前が合っていても死ぬ道が3つある——繋ぎ先が走らなくなった／こちらが
      # 一度も繋ぎで起きていない／`conclusion` で絞って赤い晩だけ落ちる。
      # そこは GitHub の run を引かないと分からないので、**ここだけ外に出る。**
      #
      # だから回し役からは外してある（あちらは「ネットにも鍵にも触らない」を
      # 守っている場所）。落ちられるかは `chain_alive_watch_selftest.py` が
      # 作り物の表で毎回確かめていて、そちらは回し役が拾う。
      #
      # 境目の3日は実測から決めた（2026-10-14。繋ぎ先5本の連続する run の
      # 間隔はいちばん空いて **1.22日**、繋ぎで起きた回の間隔は **1.10日**。
      # 定時そのものの遅れは最長 8.0時間）。**3日はその 2.5倍。**
      #
      # **前の step が落ちても回す。** 繋ぎの図は「他のどこかが赤い日」にこそ
      # 読みたい——名前を変えた PR は上の回し役（`workflow_link_selftest.py`）で
      # 先に落ちるので、`always` が無いとこの報告が**いちばん要る日に出ない。**
      # 落ちたらこの step も赤くなるので、見逃しにはならない
      - name: 繋ぎ（workflow_run）が生きているか（API を読む。この箱で12秒）
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 python/chain_alive_watch.py --days 3

  # **キーボードだけで島を一周できるか／読み上げで意味が通るか**を、
  # 書き出した面ぜんぶで数える（`tools/sprites/reachkeys.mjs`）。
  #
  # ## なぜ別の job なのか
  #
  # 面を1枚ずつ開いて、**実際に Tab を押して一周する**（147面で Tab 7,137回）。
  # 手元の4コアの箱で**308秒**（2026-10-15 実測）。`browserwatch` は書き出しを2枚焼いたうえで
  # 5本の道具を回していて40分の枠をほぼ使い切るので、相乗りさせると
  # **先に時間で切られる。** `reachwatch` を別に立てたのと同じ理由。
  # （その2本は 2026-10-16 に `heavy_watch.yml` へ移した。下の「重い2本は
  # ここに居ない」。**ここに残っているのは、安いほう1本だけ**）
  #
  # ## なぜいま繋げたか（2026-10-15 / #883）
  #
  # 道具は 2026-10-14 に出来ていたが、**島のほうが緑でなかった**ので
  # 繋いでいなかった。初日から赤い見張りは「いつもの赤」に化けて、
  # 本当に新しく壊れた日に見分けがつかなくなる
  # （`docs/island-standards.md` §13。`dead_stream_watch` と同じ形）。
  #
  # 残っていたのは「同じ字のリンクが別の先を指している」17件（9面）と、
  # **道具の側の嘘7件**（React が開いた姿と閉じた姿で同じ節点を使い回すのを
  # 「Esc で閉じない」と読んでいた）。両方を片づけて 0件 にしてから繋いだ。
  #
  # ## 読みかた
  #
  # 終了コードで読む（0=通った / 1=見つかった / 2=数えるものが無い）。
  # **`| tail` を挟まない。** 挟むと終了コードが消える（#124）。
  # 「違反0件」は、**見た面・押せるもの・Tab で止まれたところ・絵・見出し・
  # リンク・React の手当て**の分母と一緒に読む（§15）。どれかが 0 なら、
  # 道具は数字を出さずに 2 で落ちる。対照（台16枚）が1枚でも外れても 2。
  reachkeys:
    runs-on: ubuntu-latest
    # 道具そのものが手元で 308秒。書き出しと支度に3分。CI の2コアで倍に
    # 伸びても収まる枠にしてある
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: site の依存を入れる
        working-directory: site
        run: npm ci --no-audit --no-fund

      # **開発サーバーでは測らない。** 先読みも束ね方も本番と違う（`CLAUDE.md`）
      - name: 書き出す
        working-directory: site
        env:
          NEXT_DIST_DIR: .next-ci
        run: npx next build

      - name: 確認用の道具の依存を入れる（playwright-core）
        working-directory: tools/sprites
        run: npm ci --no-audit --no-fund

      # 置き場をこの箱と同じにする。道具は
      # `/opt/pw-browsers/chromium-1194/chrome-linux/chrome` を名指ししている
      - name: ブラウザを入れる
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$(id -u):$(id -g)" /opt/pw-browsers
          node tools/sprites/node_modules/playwright-core/cli.js install --with-deps chromium
          chrome=/opt/pw-browsers/chromium-1194/chrome-linux/chrome
          if [ ! -x "$chrome" ]; then
            echo "::error::$chrome が無い。道具が名指ししている場所と違う"
            exit 2
          fi

      - name: キーボードで一周できるか・読み上げで意味が通るか
        run: |
          set -uo pipefail
          python3 -m http.server 4213 --directory site/.next-ci >/tmp/serve-rk.log 2>&1 &
          sv=$!
          trap 'kill "$sv" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4213/index.html" && break
            sleep 1
          done
          rc=0
          DIST=site/.next-ci SPORT=4213 node tools/sprites/reachkeys.mjs || rc=$?
          echo "── reachkeys 終了コード ${rc}"
          exit "$rc"
