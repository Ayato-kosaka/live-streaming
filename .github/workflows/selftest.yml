# **見張り（selftest）を、マージする前に回す。**
#
# 2026-09-18 まで、このリポジトリには `pull_request` で走るワークフローが
# 1本も無かった。見張りは全部、毎晩の焼き直し（`rebake.yml`）や退避
# （`backup.yml`）の**中でしか**走っていない——つまり
# **master にマージして、本番に配ったあと。**
#
# その日に実害が2つ出た。
#
#   1. `python/dead_stream_watch_selftest.py` が **master で赤いまま2日**
#      残った（#520 が対照の前提を壊した）。どこからも走っていないので誰も
#      気づかない
#   2. **その赤い見張りを抱えたまま #520 をマージして、本番に配った**
#
# そのうえ棚卸ししたら、**どこからも走っていない見張りが12本**あった。
# うち3本（`python/admin/` の `donors_import` / `firestore_delete` /
# `ip_purge`）は**消す道具を守っている見張り**で、いちばん走っていて
# ほしいものが走っていなかった。
#
# ## ここは「落ちるときに落ちる」ことが本体
#
# いつも緑の CI は、何も守っていないのに守っている気にさせる。
# だから回し役（`python/selftest_runner.py`）は、**本物の見張りを1本も
# 回す前に、自分が落ちられることを毎回実測する**——偽の見張りを3本
# こしらえて 0 / 1 / 2 が出るのを見てから先へ進む。外れたら、本物の
# 数字を1つも出さずに 2 で落ちる（`docs/island-standards.md` §15）。
#
# ## `rebake.yml` からは外していない
#
# あちらは**焼いたあとの `site/content/*.ts`** を見る見張りを含んでいて、
# PR の時点とは見ているものが違う。**両方で走ってよい**（どれも数秒）。
# `site/selftest/*.mjs` の4本もあちらに残してある——**出る口が2つあるなら
# 見張りも2つ**（`docs/island-misses.md` #126 の決めごと2）。
name: Selftests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 同じ枝に続けて push したら、前の run は止めてよい。
# master は止めない——「master が緑だったか」は1回ずつ残したい
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # **何がこの run を起こしたかを、run そのものに残す。**
      #
      # run の一覧からは見分けがつかない——PR を開いた回も、枝に追い足した
      # push も、開き直した回も、`event` は全部 `pull_request` で出る。
      # 「PR に追い足したコミットは見張りを通るのか」を、あとから誰かが
      # もう一度調べ直さずに済むように、`action` をここに書き出す
      # （追い足しなら `synchronize`）。
      - name: 何がこの run を起こしたか
        env:
          EV: ${{ github.event_name }}
          ACT: ${{ github.event.action }}
          SHA: ${{ github.sha }}
        run: |
          line="起こしたもの: ${EV} / ${ACT:-（action なし）} / ${SHA}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      # 見張りは口を全部偽物に差し替えて回るが、**読み込むだけで本物の
      # パッケージが要る**ものがある（`google.cloud` / `yaml` / `requests`）。
      # 入れないと「No module named …」で赤くなり、**中身を1つも見ないまま
      # 落ちた run** が「見張りが落ちた」に見える
      - name: Python のパッケージを入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install PyYAML

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # `python/name_tail_selftest.py` だけは、**本物の OBS の突き合わせ**
      # （`app/alertbox/matching.utils.ts`）を node で動かして見る。
      # `typescript` が引けないと、あの見張りは「当たらなかった」ではなく
      # **2（確かめられなかった）**で落ちる。
      #
      # **これは「1本だけ」ではない。** 直下の `package.json` は Expo の側なので、
      # この1行で **1,452 パッケージ**入る（CI で20秒。2026-09-18 実測）。
      #
      # それでも**そのままにしてある。** name_tail が求めているのは typescript
      # **5系**で、それを決めているのが直下の `package.json`（`^5.3.3`）だから。
      # 空の置き場に `npm install typescript` をすると2秒で済むが、入るのは
      # **7系**（別物の API。`ts.transpileModule` が無い）で、name_tail が
      # 2 で落ちる——**当てて確かめた。** 版を手で書いて逃がすと、
      # `package.json` と2か所に版が散って、上げた日に黙ってずれる
      - name: typescript を置く（name_tail が本物の OBS を動かすため）
        run: npm install --no-save --no-audit --no-fund typescript

      # **`site/selftest/*.mjs` の4本を回すのに要る。**
      #
      # この4本は 2026-09-18 まで `rebake.yml` の中でしか走っていなかった
      # ——つまりマージして配ったあと。外していた理由は「`npm ci`（site）は
      # Expo の丸ごとで重い」だったが、**そこが違っていた。**
      #
      #   site の `npm ci`      … **14秒 / 114 パッケージ**（Expo は1つも入らない。
      #                            `site/package.json` は next・react・firebase と型だけ）
      #   直下の `npm install`  … 19〜34秒 / 1,452 パッケージ（**こちらが Expo の丸ごと**）
      #
      # **軽いほうを外して、重いほうを毎回入れていた。**
      #
      # `typescript` と `@types/node` だけを置く道もある（実測で、その2つで
      # 4本とも通る）。取らないのは、置いたものが `site/package.json` と
      # ずれる形だから。`npm ci` なら lock のとおりに入る
      - name: site の依存を入れる（mjs の見張り4本が tsc を使う）
        working-directory: site
        run: npm ci --no-audit --no-fund

      # **`functions/selftest/` の6本は、どこからも走っていなかった。**
      #
      # 2026-09-18 に `python/watch_census_selftest.py`（どの見張りがどこから
      # 走るかを数える道具）を書いて、はじめて名指しで出た。`rebake.yml` にも
      # `backup.yml` にも無く、回し役の拾う先（`python/` と `site/selftest/`）
      # の外に居たので、**2つある数え方のどちらからも見えていなかった。**
      #
      # 守っているのは公開の口から素性を落とすところ——`GET /cards` の応答に
      # チャンネルIDが残らないこと（`docs/island-incident-2026-09-14-cards.md`）。
      # #126 の決めごと1「素性・鍵・お金が動くものは、繋ぐ理由を探すほうに倒す」。
      #
      # 値段（2026-09-18。**CI の実測**。run 35308779198）: ここが **8秒**、
      # 6本を回すのに **65秒**（1本 10.8秒。**中身ではなく、1本ずつ自分で
      # `tsc` を通すぶん**）。run ぜんぶで **52〜73秒 → 144秒**。
      # 手元の箱では `npm ci` 10秒 / 663 パッケージ、1本 15秒だった
      - name: functions の依存を入れる（cards の見張り6本が tsc と firebase-admin を使う）
        working-directory: functions
        run: npm ci --no-audit --no-fund

      # 回し役は `--only-drill` を渡さなくても対照を先に回す。
      # ここで**別の step として**もう一度回しておくのは、対照が外れた回に
      # 「どこで落ちたか」がログの先頭で分かるようにするため
      - name: 回し役が落ちられるかを、先に見る
        run: python3 python/selftest_runner.py --only-drill

      # 落ちた1本で止めない。**全部回してから、まとめて落ちる。**
      # 最初の1本で止まると、2本目以降が見えない
      - name: 見張りを全部回す
        run: python3 python/selftest_runner.py

      # **名前が `_selftest` でない判定器**は、回し役が拾わない。
      # 拾わないものを名指しで数えるのが `python/watch_census_selftest.py` で、
      # あれ自身は上の回し役が拾って走る。ここに並べてあるのは、
      # **棚卸しが「断っていない」と言い切っている側**——つまり
      # 中身で判定器と分かって、CI で回すと決めたもの。
      #
      # 値段は測った（2026-09-19。手元の箱）。どちらも書き出しもブラウザも要らない。
      - name: 道具にリポジトリの場所が直書きされていないか（0.18秒）
        run: node tools/sprites/rootcheck.mjs

      - name: 共有画像が、ちゃんと島に見えるか（6.0秒）
        run: python3 tools/sprites/ogcheck.py

      # **毎晩のログを数える道具の、探し方そのものを見る。**
      # 回し役は `*_selftest.py` を拾うので、名前の違うこれは拾われない
      # ——つまり 2026-09-21 まで**どこからも走っていなかった。**
      # `docs/island-misses.md` #79 の「探し方が壊れていても 0 と出る」を
      # 止めるための道具なので、走っていないなら在っても同じ。
      #
      # **環境変数は渡さない。** オーナーのぶんを除く足は、自分で差して
      # 外してから数える（周りに何が置いてあっても同じ数が出るように）
      - name: ログを数える道具の探し方が効いているか（0.1秒）
        run: python3 tools/logident.py --selftest

  # **書き出しとブラウザが要る判定器を、ここで回す。**
  #
  # 2026-09-19 まで、`tools/sprites/*.mjs` は1本も CI に乗っていなかった。
  # 名前が `_selftest` でないので棚卸しからも見えず、**「どこからも走らない
  # 見張り 0本」が33本を隠していた**（`docs/island-misses.md` #171）。
  #
  # ここに載せたのは2本だけ。どちらも「面ごとに数がそろっているか」
  # 「絵が器から落ちていないか」を数える道具で、**人が目で見つけた穴を
  # 機械で止めるために作ったもの**。回っていないなら作った意味がない。
  #
  #   walkedcount … 表紙・`/now`・`/map` の「◯カ国」が食い違わないか。
  #                 2026-09-19 の本番で 23 と 22 が同じ面に出ていた（#165）
  #   dexfit      … 図鑑の絵が自分のマスからはみ出していないか（#167）
  #
  # 台所の `kdfit.mjs` は**当ててみて、外した**。ここへ足したら 2 で落ちた
  # （run 35422246754）。あれは住人・視聴者・ショートの絵も要って、
  # `chars.py` が落とすキャラの絵だけでは**対照に使う平たい絵が1枚も揃わない**。
  # 絵の無いまま数字を出さずに落ちるのは、あの道具が正しい。
  # 断りは `python/watch_excuses.py` に、測った日つきで置いた
  #
  # 残りは `python/watch_excuses.py` に**理由つきで**断ってある。
  # 土台（書き出し＋ブラウザ＋住人の絵）はここに在るので、次に載せるならここへ足す。
  #
  # 別の job にしてあるのは、上の見張り（196秒）を待たせないため。並んで走る。
  #
  # **CI の実測**（2026-09-19）:
  #   絵を落とし直す回（run 35418964922）… **588秒**
  #     site の npm ci 13秒 / 書き出し 42秒 / ブラウザ 19秒 /
  #     絵を落とす 345秒 / walkedcount ＋ dexfit で 163秒
  #   置いてある絵に当たる回（run 35421444959）… **247秒**
  #     絵を落とすところが 1秒未満になる
  browserwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: site の依存を入れる
        working-directory: site
        run: npm ci --no-audit --no-fund

      # 手元の箱で1分10秒、**CI で 42秒**（2026-09-19 実測。run 35418964922）。
      # **開発サーバーでは測らない**——先読みも束ね方も本番と違う（`CLAUDE.md`）
      - name: 書き出す
        working-directory: site
        env:
          NEXT_DIST_DIR: .next-ci
        run: npx next build

      - name: 確認用の道具の依存を入れる（playwright-core）
        working-directory: tools/sprites
        run: npm ci --no-audit --no-fund

      # **置き場をこの箱と同じにする。** 道具は
      # `/opt/pw-browsers/chromium-1194/chrome-linux/chrome` を名指ししている。
      # 版を上げると番号が変わって外れるので、`playwright-core` は 1.56.0 で
      # 止めてある（`CLAUDE.md`）。入った先が違ったら、数字を出す前に落とす
      - name: ブラウザを入れる
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$(id -u):$(id -g)" /opt/pw-browsers
          node tools/sprites/node_modules/playwright-core/cli.js install --with-deps chromium
          chrome=/opt/pw-browsers/chromium-1194/chrome-linux/chrome
          if [ ! -x "$chrome" ]; then
            echo "::error::$chrome が無い。道具が名指ししている場所と違う"
            ls -la /opt/pw-browsers || true
            exit 2
          fi

      - name: 住人の名簿を取る（絵の置き場が書いてある）
        run: |
          set -euo pipefail
          mkdir -p .cikey
          curl -sS --max-time 60 \
            https://live-streaming-d3cac.web.app/island-api/characters \
            > .cikey/characters.json
          cp .cikey/characters.json /tmp/ch.json

      # **落とし直しに 345秒**かかっていた（2026-09-19 の CI 実測。392枚）。
      # 当たると1秒未満で、この job が 588秒 → 247秒になる（run 35421444959）。
      # 毎 PR で同じ絵を落とすので、置きっぱなしにする。
      #
      # 鍵は名簿の JSON の指紋でよい。絵の URL に Firebase の `token=` が
      # 入っていて、**絵を差し替えると token が変わる**ので、差し替えた日だけ
      # 鍵が外れて落とし直す。日付を鍵にすると「その日のうちに差し替えた絵」を
      # 丸一日見のがす——そちらは取らない。
      # 外れても下の step がそのまま落とすので、**当たらない日でも結果は同じ**。
      #
      # **置き場は PR ごとに別**（GitHub は `pull_request` の回を
      # `refs/pull/<番号>/merge` に閉じ込める）。手で押した回からは
      # PR の回が置いたものが見えない——2026-09-19 に、当たるはずの回が
      # 253秒かけて落とし直したのがそれ。**同じ PR に積み直した回で当たる。**
      # master に入ったあとは、master の置き場が全部の PR から読める
      - name: 落とした絵を使いまわす
        uses: actions/cache@v4
        with:
          path: /tmp/chars
          key: island-chars-${{ hashFiles('.cikey/characters.json') }}

      # **絵を落とさないと、dexfit は103人ぜんぶを同じ1枚で測る。**
      # それでも最後まで走って「はみ出し 0件」と言う——いちばん悪い嘘。
      # だから枚数を数えて、落ちていなければここで止める。
      # `chars.py` は既に在るぶんを飛ばすので、当たった回は0枚落として帰る
      - name: 住人の絵を落とす（落ちていなければ止める）
        run: |
          set -euo pipefail
          python3 tools/sprites/chars.py
          n="$(ls /tmp/chars | wc -l)"
          echo "手元にある絵 ${n} 枚"
          if [ "$n" -lt 50 ]; then
            echo "::error::絵が落ちていない。dexfit は全員おなじ顔で「はみ出し 0件」と言う"
            exit 2
          fi

      # 落ちた1本で止めない。**2本とも回してから、まとめて落ちる。**
      # 配るのは書き出したもの（開発サーバーは使わない）。4190 は使わない
      # ——Chrome も node も「危ない口」として塞いでいる（`dexfit.mjs`）
      - name: 歩いた国の数と、図鑑の絵を数える
        run: |
          set -uo pipefail
          python3 -m http.server 4211 --directory site/.next-ci >/tmp/serve.log 2>&1 &
          sv=$!
          trap 'kill "$sv" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4211/index.html" && break
            sleep 1
          done
          rc1=0
          SPORT=4211 DIST=site/.next-ci node tools/sprites/walkedcount.mjs || rc1=$?
          echo "── walkedcount 終了コード ${rc1}"
          rc2=0
          SPORT=4211 node tools/sprites/dexfit.mjs || rc2=$?
          echo "── dexfit 終了コード ${rc2}"
          [ "$rc1" = 0 ] && [ "$rc2" = 0 ]

      # 振り返り資料（`public/nordic/review.html`）は**配信で一発目に出す1枚**で、
      # 47区画ある。誰かが1行触っただけで字が溢れても、出すまで誰も気づかない。
      # ここで歩かせる。書き出し（site/.next-ci）は要らない——資料は public/ に
      # 在る静的な1枚なので、**本番と同じ並び**（public/ に site/public/fonts を
      # 重ねたもの）で配れば足りる。`deckserve.sh` がその並びを作る。
      #
      # **2本とも回してから、まとめて落ちる。**
      #   deckwalk … 全区画・全ステップの はみ出し / 絵文字 / JSエラー
      #   deckctrl … 進行の画面（?role=ctrl）にクイズの答えが出ていないか
      #              （あやとが視聴者さんと一緒に答えるので、手元にだけは出さない）
      - name: 振り返り資料を歩く
        run: |
          set -uo pipefail
          tools/sprites/deckserve.sh 4733 >/tmp/deckserve.log 2>&1 &
          sv=$!
          trap 'kill "$sv" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4733/nordic/review.html" && break
            sleep 1
          done
          rc1=0
          SHOTS=/tmp/deckshots URL=http://127.0.0.1:4733/nordic/review.html \
            node tools/sprites/deckwalk.mjs || rc1=$?
          echo "── deckwalk 終了コード ${rc1}"
          rc2=0
          node tools/sprites/deckctrl.mjs || rc2=$?
          echo "── deckctrl 終了コード ${rc2}"
          [ "$rc1" = 0 ] && [ "$rc2" = 0 ]
