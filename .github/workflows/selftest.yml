# **見張り（selftest）を、マージする前に回す。**
#
# 2026-09-18 まで、このリポジトリには `pull_request` で走るワークフローが
# 1本も無かった。見張りは全部、毎晩の焼き直し（`rebake.yml`）や退避
# （`backup.yml`）の**中でしか**走っていない——つまり
# **master にマージして、本番に配ったあと。**
#
# その日に実害が2つ出た。
#
#   1. `python/dead_stream_watch_selftest.py` が **master で赤いまま2日**
#      残った（#520 が対照の前提を壊した）。どこからも走っていないので誰も
#      気づかない
#   2. **その赤い見張りを抱えたまま #520 をマージして、本番に配った**
#
# そのうえ棚卸ししたら、**どこからも走っていない見張りが12本**あった。
# うち3本（`python/admin/` の `donors_import` / `firestore_delete` /
# `ip_purge`）は**消す道具を守っている見張り**で、いちばん走っていて
# ほしいものが走っていなかった。
#
# ## ここは「落ちるときに落ちる」ことが本体
#
# いつも緑の CI は、何も守っていないのに守っている気にさせる。
# だから回し役（`python/selftest_runner.py`）は、**本物の見張りを1本も
# 回す前に、自分が落ちられることを毎回実測する**——偽の見張りを3本
# こしらえて 0 / 1 / 2 が出るのを見てから先へ進む。外れたら、本物の
# 数字を1つも出さずに 2 で落ちる（`docs/island-standards.md` §15）。
#
# ## `rebake.yml` からは外していない
#
# あちらは**焼いたあとの `site/content/*.ts`** を見る見張りを含んでいて、
# PR の時点とは見ているものが違う。**両方で走ってよい**（どれも数秒）。
# `site/selftest/*.mjs` の4本もあちらに残してある——**出る口が2つあるなら
# 見張りも2つ**（`docs/island-misses.md` #126 の決めごと2）。
name: Selftests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 同じ枝に続けて push したら、前の run は止めてよい。
# master は止めない——「master が緑だったか」は1回ずつ残したい
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # **何がこの run を起こしたかを、run そのものに残す。**
      #
      # run の一覧からは見分けがつかない——PR を開いた回も、枝に追い足した
      # push も、開き直した回も、`event` は全部 `pull_request` で出る。
      # 「PR に追い足したコミットは見張りを通るのか」を、あとから誰かが
      # もう一度調べ直さずに済むように、`action` をここに書き出す
      # （追い足しなら `synchronize`）。
      - name: 何がこの run を起こしたか
        env:
          EV: ${{ github.event_name }}
          ACT: ${{ github.event.action }}
          SHA: ${{ github.sha }}
        run: |
          line="起こしたもの: ${EV} / ${ACT:-（action なし）} / ${SHA}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      # 見張りは口を全部偽物に差し替えて回るが、**読み込むだけで本物の
      # パッケージが要る**ものがある（`google.cloud` / `yaml` / `requests`）。
      # 入れないと「No module named …」で赤くなり、**中身を1つも見ないまま
      # 落ちた run** が「見張りが落ちた」に見える
      - name: Python のパッケージを入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install PyYAML

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # `python/name_tail_selftest.py` だけは、**本物の OBS の突き合わせ**
      # （`app/alertbox/matching.utils.ts`）を node で動かして見る。
      # `typescript` が引けないと、あの見張りは「当たらなかった」ではなく
      # **2（確かめられなかった）**で落ちる。
      #
      # **これは「1本だけ」ではない。** 直下の `package.json` は Expo の側なので、
      # この1行で **1,452 パッケージ**入る（CI で20秒。2026-09-18 実測）。
      #
      # それでも**そのままにしてある。** name_tail が求めているのは typescript
      # **5系**で、それを決めているのが直下の `package.json`（`^5.3.3`）だから。
      # 空の置き場に `npm install typescript` をすると2秒で済むが、入るのは
      # **7系**（別物の API。`ts.transpileModule` が無い）で、name_tail が
      # 2 で落ちる——**当てて確かめた。** 版を手で書いて逃がすと、
      # `package.json` と2か所に版が散って、上げた日に黙ってずれる
      - name: typescript を置く（name_tail が本物の OBS を動かすため）
        run: npm install --no-save --no-audit --no-fund typescript

      # **`site/selftest/*.mjs` の4本を回すのに要る。**
      #
      # この4本は 2026-09-18 まで `rebake.yml` の中でしか走っていなかった
      # ——つまりマージして配ったあと。外していた理由は「`npm ci`（site）は
      # Expo の丸ごとで重い」だったが、**そこが違っていた。**
      #
      #   site の `npm ci`      … **14秒 / 114 パッケージ**（Expo は1つも入らない。
      #                            `site/package.json` は next・react・firebase と型だけ）
      #   直下の `npm install`  … 19〜34秒 / 1,452 パッケージ（**こちらが Expo の丸ごと**）
      #
      # **軽いほうを外して、重いほうを毎回入れていた。**
      #
      # `typescript` と `@types/node` だけを置く道もある（実測で、その2つで
      # 4本とも通る）。取らないのは、置いたものが `site/package.json` と
      # ずれる形だから。`npm ci` なら lock のとおりに入る
      - name: site の依存を入れる（mjs の見張り4本が tsc を使う）
        working-directory: site
        run: npm ci --no-audit --no-fund

      # **`functions/selftest/` の6本は、どこからも走っていなかった。**
      #
      # 2026-09-18 に `python/watch_census_selftest.py`（どの見張りがどこから
      # 走るかを数える道具）を書いて、はじめて名指しで出た。`rebake.yml` にも
      # `backup.yml` にも無く、回し役の拾う先（`python/` と `site/selftest/`）
      # の外に居たので、**2つある数え方のどちらからも見えていなかった。**
      #
      # 守っているのは公開の口から素性を落とすところ——`GET /cards` の応答に
      # チャンネルIDが残らないこと（`docs/island-incident-2026-09-14-cards.md`）。
      # #126 の決めごと1「素性・鍵・お金が動くものは、繋ぐ理由を探すほうに倒す」。
      #
      # 値段（2026-09-18。**CI の実測**。run 35308779198）: ここが **8秒**、
      # 6本を回すのに **65秒**（1本 10.8秒。**中身ではなく、1本ずつ自分で
      # `tsc` を通すぶん**）。run ぜんぶで **52〜73秒 → 144秒**。
      # 手元の箱では `npm ci` 10秒 / 663 パッケージ、1本 15秒だった
      - name: functions の依存を入れる（cards の見張り6本が tsc と firebase-admin を使う）
        working-directory: functions
        run: npm ci --no-audit --no-fund

      # 回し役は `--only-drill` を渡さなくても対照を先に回す。
      # ここで**別の step として**もう一度回しておくのは、対照が外れた回に
      # 「どこで落ちたか」がログの先頭で分かるようにするため
      - name: 回し役が落ちられるかを、先に見る
        run: python3 python/selftest_runner.py --only-drill

      # 落ちた1本で止めない。**全部回してから、まとめて落ちる。**
      # 最初の1本で止まると、2本目以降が見えない
      - name: 見張りを全部回す
        run: python3 python/selftest_runner.py
