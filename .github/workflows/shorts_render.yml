name: ショートを並べて書き出す

# 作業箱（4コア）で3本を順に回すと、1本 書き出し4分＋双子4分＋検査5分で1周 約42分かかった。
# ランナーを 本数 × (本体・双子) 台並べて、1周を「いちばん遅い1本の 書き出し＋検査」にする
# （あやと 2026-10-16「GitHub actions に汎用並列マシン作っても良いよ」）。
# 使い方と流れは `tools/shorts/render/remote.py` の頭と `tools/shorts/render/README.md` の「Actions で並べる」。
#
# **受け渡しは GCS の非公開バケットだけ**（live-streaming-d3cac-shorts-preview。#938 で付与）。
# 素材は作業箱が署名付き URL で直に上げ、出来たものはランナーが置いて、見る URL（7日）を
# 依頼の公開鍵で包んで作業枝に返す。毎周 数百MB を git に積まない。
#
# **担当は「指示書を置く → 要約（summary.json）と絵を読む」だけ**（#1011）。本体の job が書き出し・
# 品質チェック20項目・1秒ごとのコマ一覧・字の切り抜き・顔の切り抜き・頭の BGM と終わりの札の数（proof.py）まで作り、
# report が下見（Hosting のプレビューチャンネル。7日）を置く。前は担当が手元の4コアで順に回し、1本 約2時間だった。
# **artifact にはしない**（公開リポジトリの artifact は誰でも落とせる）。
#
# 道具の版は作業箱にそろえる（ubuntu-24.04 の apt の ffmpeg 6.1.1、Python 3.13、下の pip の版）。
# 同じ指示書から作業箱と同じバイト列が出るかは、双子と sha256 で見る。

on:
  push:
    branches: ["claude/**"]
    paths: ["shorts/render/*.json"]

permissions:
  contents: read

concurrency:
  group: shorts-render-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 作業箱が素材を上げ終わるのを最長25分待つ（remote.py の UPLOAD_WAIT）
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # JSON の matrix は渡せない（鍵の「{」「}」の行が伏せ字なので捨てられる。remote.py の prepare）
      ids: ${{ steps.prep.outputs.ids }}
      roles: ${{ steps.prep.outputs.roles }}
      prefix: ${{ steps.prep.outputs.prefix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 道具を入れる
        run: python3 -m pip install --quiet "google-cloud-storage==3.17.1" requests
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 無い素材の上げる URL を渡し、上がるのを待つ
        id: prep
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/shorts/render/remote.py prepare
      - name: 資格情報の写しを消す
        if: always()
        run: rm -f "$GITHUB_WORKSPACE"/gha-creds-*.json

  render:
    needs: prepare
    name: ${{ matrix.id }}-${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.prepare.outputs.ids) }}
        role: ${{ fromJSON(needs.prepare.outputs.roles) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # budoux は 0.9.3 から動かさない。行を割ってよい所の線（仮名どうしの点）をこの版で測り、品質チェックの
      # line_breaks も同じ版で割れ目を決める（tools/shorts/qa/linebreak.py の BUDOUX_PIN。自己テストの CI も同じ版）
      - name: 道具を入れる（作業箱と同じ版）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          python3 -m pip install --quiet "numpy==2.5.3" "pillow==12.3.0" \
            "opencv-python-headless==5.0.0.93" "budoux==0.9.3" "google-cloud-storage==3.17.1" requests
          bash tools/shorts/render/fetch_fonts.sh > /dev/null
          grep -m1 "model name" /proc/cpuinfo
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 書き出す（本体は検査・帯の絵まで）
        env:
          PYTHONUNBUFFERED: "1"
          # x264 は CPU（AMD EPYC と Intel Xeon）で別のバイト列を出す。どのランナーに当たっても
          # 同じものが出るように cpu-independent を付ける（render.py の X264_PARAMS）
          SHORTS_X264_CPU_INDEPENDENT: "1"
          ITEM_ID: ${{ matrix.id }}
          ROLE: ${{ matrix.role }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: python3 tools/shorts/render/remote.py job
      - name: 資格情報の写しを消す
        if: always()
        run: rm -f "$GITHUB_WORKSPACE"/gha-creds-*.json

  report:
    needs: [prepare, render]
    # 1本落ちても、出来たぶんと落ちた理由を返す
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    # 下見（Hosting のプレビューチャンネル）を置いて確かめるぶん、firebase-tools を入れて配って再生まで 2〜3分
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 下見を配る firebase-tools と、スマホ幅の再生を見る playwright-core（remote.py の preview。
      # 入れるのは tools/shorts/preview/host.py の prewarm。ブラウザはランナーの Google Chrome）
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: 道具を入れる
        run: python3 -m pip install --quiet "google-cloud-storage==3.17.1" requests
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # 本番の段は、本体の mp4 を GCS から読んで Hosting のプレビューチャンネル（7日）に並べる。
      # 担当が受け取るのは要約（summary.json）と目で見る絵だけ（#1011）
      - name: 結果を集め、下見を置き、要約と見る URL を暗号化して作業枝へ返す
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: python3 tools/shorts/render/remote.py report
      - name: 資格情報の写しを消す
        if: always()
        run: rm -f "$GITHUB_WORKSPACE"/gha-creds-*.json
