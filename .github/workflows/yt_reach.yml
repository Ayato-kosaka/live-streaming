name: YouTube に届くか（使い捨ての下見）

# **使い捨て。** 確かめたら消す。
#
#  1. GitHub の走者から YouTube のショートのタブが読めるか
#  2. 読めるなら、公開日の取れていないものを埋めて python/data/shorts.json を押し戻す
#
# この箱（開発用のサンドボックス）は出口の IP を他と共有していて、視聴ページを
# 数十回開くと 429（reCAPTCHA の頁）が返る。走者は別の出口だが、**そちらでも
# 返る回がある**（1回目 200 / 3分後の2回目が空）。何回か間を置いて回す。
# 秘密の値は使わない。出すのは本数と id と日付だけ。

on:
  push:
    branches: [claude/shorts-refresh]

jobs:
  reach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shorts-refresh
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: 公開日を埋める（間を置いて何回か）
        run: |
          set -uo pipefail
          left() { python3 -c "import json;print(sum(1 for v in json.load(open('python/data/shorts.json'))['shorts'] if not v.get('date')))"; }
          echo "はじめ: $(left)本"
          for i in 1 2 3 4 5 6; do
            python3 python/build_shorts.py --dates --gap 6 || true
            n="$(left)"
            echo "== $i 回目のあと: 残り $n 本"
            [ "$n" = "0" ] && break
            sleep 90
          done
          echo "おわり: $(left)本"
      - name: 抜き取りで、公開日が合っているか
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, re, sys, time
          sys.path.insert(0, "python")
          from build_shorts import curl
          baked = {v["id"]: v for v in json.load(open("python/data/shorts.json"))["shorts"]}
          for vid in ["3LFOVakss68", "k6cMHwqAfdQ", "W4grVjo_65k"]:
              code, html = curl([f"https://www.youtube.com/watch?v={vid}"])
              d = re.search(r'"publishDate":\{"simpleText":"([^"]+)"', html)
              t = re.search(r'<meta name="title" content="([^"]*)"', html)
              print(f"{vid} HTTP{code} 視聴ページ: {d.group(1) if d else '取れず'} / {t.group(1)[:40] if t else '-'}")
              print(f"{' ' * len(vid)} 焼いた値  : {baked[vid]['date']} / {baked[vid]['title'][:40]}")
              time.sleep(6)
          PY

      - name: 取れたぶんを押し戻す
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- python/data/shorts.json; then
            echo "変わりませんでした"
            exit 0
          fi
          git add python/data/shorts.json
          git commit -m "ショートの公開日を走者から埋める [skip ci]"
          git push origin HEAD:claude/shorts-refresh
