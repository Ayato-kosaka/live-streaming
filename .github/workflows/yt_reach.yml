name: YouTube に届くか（使い捨ての下見）

# **使い捨て。** 確かめたら消す。
#
#  1. GitHub の走者から YouTube のショートのタブが読めるか
#  2. 読めるなら、公開日の取れていないものを埋めて python/data/shorts.json を押し戻す
#
# この箱（開発用のサンドボックス）は出口の IP を他と共有していて、視聴ページを
# 数十回開くと 429（reCAPTCHA の頁）が返る。走者は別の出口なので、そちらで埋める。
# 秘密の値は使わない。出すのは本数と id と日付だけ。

on:
  push:
    branches: [claude/shorts-refresh]

jobs:
  reach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shorts-refresh
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: ショートの一覧と公開日が取れるか
        run: python3 python/build_shorts.py --fetch --gap 5
      - name: 取れたぶんを押し戻す
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- python/data/shorts.json; then
            echo "変わりませんでした"
            exit 0
          fi
          git add python/data/shorts.json
          git commit -m "ショートの公開日を走者から埋める [skip ci]"
          git push origin HEAD:claude/shorts-refresh
