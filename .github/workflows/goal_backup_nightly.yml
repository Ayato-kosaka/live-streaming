name: 豚の貯金箱の控えを写す

# GAS の `Goals` 1行を、Firestore の控え（`islandGoal/2025-10-24`）へ写す。
# 中身は `python/admin/goal_migrate.py` ——**書く／書かないの判断は
# 1バイトも変えていない。** ここがやるのは「押しかたを決めること」と
# 「合わなかった回に赤くしすぎないこと」だけ（`python/admin/goal_backup.py`）。
#
# ## **毎晩ぶんは畳んだ**（2026-09-23。#305。ファイル名だけ `nightly` のまま）
#
# `workflow_run`（`Fetch Doneru Donations` の後ろ）と cron（03:30 UTC）を外して、
# **手で押すときだけ**動くようにした。**役目が終わったから**であって、
# 壊れたからではない。
#
# #614 でこれを毎晩に繋いだ目的は1つ——**控えが古いまま踏まれると、
# 豚の貯金箱に9日前の額が出る**（実際に 2026-09-12 に写したきりだった）。
# 「踏まれる」のは、本番（`goalRecord()`）が GAS を読めずに控えへ落ちたとき。
#
# **その落ち先に、もう額が入っていない。**（#305 の手順D）
# `GET /fund` はいま `island/state.fund.box`（台帳の焼き直し）から額を読む。
# `islandGoal` から取るのは **Doneru の鍵とバーの高さ**だけで、
# **どちらも増えない値。** 古くなりようがないものを毎晩写しても、
# 新しくなるものが1つも無い。
#
# **繋いだままにすると、逆に害が出る。** `goal_migrate.py` の止め金は
# 「GAS と本番の `/fund` が1円まで一致すること」で、これは正しい止め金だが、
# **手順C が出た瞬間に GAS の `superChatAmount` は凍る**（スパチャの書き先が
# 台帳へ移るので）。次の投げ銭で必ず食い違い、**3晩で赤になる。**
# そこから先は毎晩赤い。
#
# **毎晩赤い見張りは、誰にも読まれなくなる。** #614 でいちばん気をつけたのが
# そこ（下の「毎晩赤くしない」）なので、自分でそれを壊さない。
#
# ### 消さずに残した理由
#
# **GAS の表はまだ在る。** あやとが消すまでのあいだ、控えを取り直したく
# なることがある（鍵を作り直した・バーの高さを変えた）。そのとき押す道が要る。
# 消すと `goal_backup.py` を押す入口が「管理スクリプトを実行」だけになって、
# **`dry_run` の既定（下見）も、回す前の見張りも、赤の出しかたも一緒に消える。**
#
# **表が消えたあとは、このファイルごと畳んでよい。** そのときは
# `islandGoal` を人が直す側に回す（鍵も高さも年に何度も変わらない）。
#
# ## 毎晩赤くしない（#521）
#
# `goal_migrate.py` は**本番の額と1円まで一致しないと、1行も書かずに落ちる。**
# 正しい止め金なので、そのまま残してある。ただし本番は5分ぶん寝かせた値を
# 返す（`FUND_TTL_MS` と CDN）ので、**投げ銭の直後に押した回は必ず合わない。**
#
# だから `goal_backup.py` が: 合わなければ6分おいてもう1回 →
# それでも合わなければ **1行も書かずに緑**（控えは前のまま）→
# **3回続けて書けなかったときだけ赤。** 何回続いているかは Firestore の札
# （`islandGoalHealth/last`）が覚える。理由は向こうの頭に書いてある。
#
# **毎晩ではなくなったので、この「3回」は「3晩」ではなくなった。**
# 押した回で数える。手で3回続けて外せば赤くなる。
#
# ## ログ
#
# このリポジトリは公開で、Actions のログも誰でも読める。
# **鍵（`doneruGoalKey`）は1文字も出ない**（長さと形だけ）。額は合計と目標額
# ——本番の `/island-api/fund` が誰にでも返している値——だけが出る。
# 個人の名前も個人の額も、この表はそもそも持っていない。
# ARGS に取るのは `{}` か `{"apply": true}` だけ。

on:
  # **手で押すときだけ。** `workflow_run` と cron は外した（上の「毎晩ぶんは畳んだ」）。
  # 外れていることは `python/goal_backup_nightly_selftest.py` が毎 PR で見ている
  # ——**書き戻したら赤くなる。**
  workflow_dispatch:
    inputs:
      dry_run:
        description: "見るだけ（控えに1バイトも書かない）。押すときはまずこのまま"
        required: false
        default: true
        type: boolean

# 同じ書類を2本が同時に書き換えないように1本ずつ。
# 手で押す側（`run_admin_script.yml` から `goal_migrate`）は別の群れなので、
# **そちらと同時に押さない**（書く中身は同じだが、こちらの「合わなかった回」の
# 数えかたに、向こうが書いた直後の値が混ざる）
concurrency:
  group: goal-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # ふつうは1分で終わる（GAS・本番・Doneru を1回ずつ読んで、書類を1つ書く）。
    # 合わなかった回は**6分の待ちが1回**入るので、そのぶんを見込む
    timeout-minutes: 20
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Firestore（控えと札）を読み書きするのに要る。
      # **GAS の鍵も Doneru の鍵も要らない**——読むのはどちらも公開の口で、
      # `doneruGoalKey` は GAS の表から実行時に引く（Secret に置いていない）
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # `PyYAML` は `python/requirements.txt` に入っていない（あちらは本番の
      # スクリプトが要るものだけ）。下の「毎晩に繋がっていないか」がワークフローを
      # YAML として読むのに要るので、ここで別に入れる。
      # **入れ忘れると `No module named yaml` で赤くなり、中身を1つも見ないまま
      # 落ちた run が「繋ぎが戻っている」に見える**
      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install PyYAML

      # **公開のログに素性が出ないこと**を、口を開く前に見る（#500）。
      # このリポジトリは公開で、Actions のログも誰でも読める。実際に3回出ている
      # （#180 Doneru の鍵 / #217 Anthropic の鍵 / #379 名簿 1,065 実行ぶん）。
      # **消すのは出たあと。出る前に止めたいので、口より手前に置く。**
      # **同じ job に置くことが要る**（job が違えばランナーが別で、隣の job で
      # 通っていてもこちらの出力は1文字も守られていない）。0.5 秒で終わる
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      # **すぐ下で回すものの決めを、回す前に見る。** 偽の GAS・偽の本番・
      # 偽の Firestore で最後まで動かして、「1円まで合わないと1行も書かない」
      # 「合わなければ数分おいて1回だけ試し直す」「それでも合わなければ書かずに緑」
      # 「3回続けて書けなければ赤」「書けた回に連続を 0 に戻す」を実測する。
      # ネットにも本番にも出ない。**ここが落ちたら、控えに触らずに止まる。**
      - name: 写しかたが変わっていないか
        run: python3 python/admin/goal_backup_selftest.py

      # **毎晩に繋がっていないことを、押した回にも見る。**（#305）
      # `workflow_run` と cron を書き戻すと、ここで落ちる。
      # 下の「押しかたを決める」step は、その `run:` を実際に bash で回して
      # 確かめる（#144 の「空回しの緑」を、字を眺めずに見る）
      - name: 毎晩に繋がっていないか
        run: python3 python/goal_backup_nightly_selftest.py

      # **入力を渡さずに押すと空文字で来る。** `!inputs.dry_run` を直接書くと
      # 空文字が false と読まれて、**「見るだけ」のつもりの回が控えに書く。**
      # ここで決めて env に置き、以降は env だけを見る
      # （`rebake.yml` / `failed_reentry_nightly.yml` と同じ手当て）
      - name: 今回の押しかたを決める
        env:
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$IN_DRY" = "false" ]; then
            echo "GOAL_DRY=0" >> "$GITHUB_ENV"
          else
            echo "GOAL_DRY=1" >> "$GITHUB_ENV"
          fi
          echo "手で押したぶん: dry_run=$IN_DRY"

      # ARGS は env としてログに出るが、ここに入るのは `{}` か `{"apply": true}` だけ。
      #
      # **`continue-on-error` を付けない。`|| true` も書かない。**
      # 押した人が見ているとはかぎらない（#132 / #144）。
      # ただし**合わなかった回は、そもそも緑で返る**（3回続いたときだけ 1）。
      # ここで隠すと、その3回目まで隠れる
      - name: 控えを写す
        id: backup
        working-directory: python/admin
        run: |
          set -euo pipefail
          if [ "$GOAL_DRY" = "1" ]; then
            ARGS='{}' python goal_backup.py
          else
            ARGS='{"apply": true}' python goal_backup.py
          fi

      # **黙って赤くならない。** 押した人がログを開くとはかぎらないので、
      # 何が起きたのかを要約に残す（run の1枚目に出る）
      - name: 落ちたときに、何が起きたのかを残す
        if: failure()
        run: |
          {
            echo "### 豚の貯金箱の控えを写せませんでした"
            echo ""
            echo '**控えが壊れたという意味ではありません。** 本番と1円まで'
            echo '一致しない回は1行も書かないので、落ちた回の控えは'
            echo '**前に写したときのまま**です。本番の額（`/island-api/fund`）も'
            echo '動いていません——`islandGoal` から読むのは Doneru の鍵と'
            echo 'バーの高さだけで、額は台帳（`island/state.fund.box`）から来ます。'
            echo ""
            echo 'ここが赤いときに起きていることは、2つのどちらかです:'
            echo ""
            echo '- **3回続けて書けなかった** … いちばんありそうなのは'
            echo '  **GAS の表が凍っていること**です。#305 でスパチャの書き先を'
            echo '  台帳へ移したので、表の `superChatAmount` はもう伸びません。'
            echo '  本番の額は伸びるので、投げ銭が1件でも入れば一致しなくなります。'
            echo '  **そうなったら、この控えは人が直す側に回してください**'
            echo '  （鍵もバーの高さも、年に何度も変わりません）'
            echo '- **合わなかったのとは別の落ちかた** … 表が読めない／'
            echo '  `doneruGoalKey` の形が違う／書いたあとの読み直しがずれた'
            echo ""
            echo '何回続けて書けていないかは、Firestore の `islandGoalHealth/last`'
            echo 'にあります（`missStreak` と `missSince`）。'
            echo ""
            echo 'いま合うかだけ見るなら、`dry_run: true` で押してください'
            echo '（1バイトも書かずに、合うかどうかだけ出ます）。'
          } >> "$GITHUB_STEP_SUMMARY"
