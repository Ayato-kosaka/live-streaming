name: 人の手入れ待ちを常設の札に映す

# いま**人が欄を埋めないと消えない**ものだけを数えて、常設の issue（#664）の
# 中の区画を書き換える（`python/upkeep_watch.py`）。埋まったら、その行は消える。
#
# ## なぜ要るか
#
# 2026-09-29 からの12晩、毎晩の焼き直しが続けて赤かった。原因は4つで、
# **性質が2種類に分かれていた**——3本は仕組みの不具合（正しい状態でも緑に
# ならない形）、1本は整備の漏れ（`albania.from` が空）。
#
# 4本は `bake_down` の issue 1本にまとまって出ていて、そこから
# 「どれが人待ちか」は読めない。しかもその1本は16日間ずっと開いていたので、
# 一覧の中で背景になっていた。**知らせる仕組みは正しく鳴っていた。**
# 鳴り方が1本に混ざっていたほうが問題だった。
#
# だから **人の手入れ待ちだけ**を、別の札へ分けて出す。
# 仕組みの不具合（機械が焼く本の赤）は、いままでどおり `bake_down` の側。
#
# ## 札は1本。新しく立てない
#
# `#664`（`整備` の札）の本文に `<!-- upkeep:begin -->` の区画を切って、
# **その中だけ**を書き換える。**人が手で書いた経緯は1文字も触らない。**
# 毎晩 issue を立てる作りにすると、一覧がこの係の札で埋まって、
# いま直そうとしている「背景になる」をこちらが起こすことになる。
#
# ## 繋ぎ先（`workflow_run`）
#
# **cron を当てにしない。** 定時実行は、このリポジトリでは**何時間も遅れて**走る。
# `Fetch YouTube Chat Data`（20:00 UTC）と `Fetch Doneru Donations`（20:30 UTC）は
# 数十分〜数時間、01:00〜04:30 UTC に置いた保険は**一度の例外もなく4時間以上**
# （2026-10-13 の実測。**数はここに書かない**——`python3 python/cron_lag.py` が出す）。
# 下の cron は**保険**として置いてある。
#
# **「発火しない cron がある」は、もう当たらない。** 前はここに
# 「実績があるのは古参2本だけ」と書いてあったが、2026-10-13 に
# `event=schedule` の run を数えたら、**cron を持つ14本ぜんぶに実績があった**
# （`rebake.yml` の 01:00 UTC も33回）。**遅れるのは本当。発火しないのは嘘。**
#
# 読む元は `site/content/*.ts`（＝毎晩の焼き直しが書き換える先）なので、
# **焼き直しの完了のうしろ**に繋ぐ。繋ぎ先を2本にしてあるのは、片方が消えても
# 止まらないようにするため。`Fetch YouTube Chat Data` のほうは発火の実績がある。
#
# **`conclusion` は見ない。** 繋ぎ先が赤い日こそ、こちらが動かないといけない。
# 焼き直しが赤いまま何晩も続いたときに「人待ちはどれか」を出すのがこの仕事なので、
# 成功したときだけ繋ぐと**いちばん要る朝だけ黙る。**
#
# **繋ぎはワークフローの `name:` で解決される。** あちらの名前を変えると
# 黙って切れる。**赤くならない。走らなくなるだけ。** 名前が実在するかは
# `python/upkeep_watch_selftest.py` が毎回突き合わせている。
#
# ## 手で押すときの既定は「見るだけ」
#
# `apply` の既定は false。押し間違えても issue は動かない。
# **押す人のいないとき（cron と、繋いで来たぶん）だけ apply で走る。**
#
# ## 赤くしない
#
# **あやと待ち**が何件溜まっていても、この job は緑で終わる。
# **赤で知らせるのをやめるために作ったもの**が自分で赤を積んだら元に戻る。
# 赤くなるのは「数えられない」「GitHub に届かない」＝**この仕組みそのものが
# 動いていない**ときだけ。
#
# ## **こちらが埋め損ねたものは、札に出さず赤くする**（2026-10-13 / #808）
#
# あやと:「これ、わたし打つの面倒なので仕組みを見直してください。
# 最低でもあなたは知ってるはずだし、**過去のものが出るのはシステムとして
# おかしい**」
#
# 島の便りの「もう過ぎた日の行」は、機械が知っている。だから
# `GET /island-api/state` が落としてから返す（`functions/src/islandApi.ts`）。
# **それでもここが過ぎた行を拾ったら、落とすほうが動いていない**
# ——Functions の配り忘れか、日付の読み方を片側だけ直したか。
#
# どちらも**あやとには直せない**ので、#664 の区画には1行も出さず、
# この job を**赤くして**こちらに鳴らす（`upkeep_watch.py` の `Count.ours`）。
# これは上の「赤くしない」と矛盾しない——**この仕組みが動いていない**側。

on:
  workflow_run:
    # 読む元は焼き直しが書き換える `site/content/*.ts`。
    # 後者は前者の繋ぎが切れたときの受け皿（発火の実績あり）
    workflows: ["島の数字を焼き直す", "Fetch YouTube Chat Data"]
    types: [completed]

  schedule:
    # 保険。焼き直しの cron（01:00 UTC）より後ろ、`bake_down` の隣
    - cron: "17 4 * * *"

  workflow_dispatch:
    inputs:
      apply:
        description: "issue #664 の区画を実際に書き換える（off なら見るだけ）"
        required: false
        default: false
        type: boolean

# 焼き直しと取り込みが続けて終わった日に2本同時に走ると、同じ本文を
# 2本で奪い合う。1本ずつ通す
concurrency:
  group: upkeep-watch
  cancel-in-progress: false

permissions:
  contents: read
  # #664 の本文を読んで、区画だけ書き換える
  issues: write

jobs:
  upkeep_watch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5
        with:
          # **履歴が要る。** 引き金「島の直したところ」が、`site/app` /
          # `site/components` の動いた**いちばん新しい日**を git から読む
          # （`upkeep_watch.last_shown_change`）。既定の1コミットだと、
          # 見える履歴に面の変更が1つも無くて、**毎晩黙って通る。**
          # 300 あれば足りる（master は1日 10〜20 本進む）。全部（0）に
          # しないのは、この箱で毎晩1回走るものに全履歴を引かせないため
          fetch-depth: 300

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # **本番の1回は、pip を1つも通らない。** ここが読むのは
      # `site/content/*.ts` と GitHub の口だけで、BigQuery も Firestore も
      # 1行も触らない。「人の手入れが溜まっている」を知らせる係が、
      # **関係のない依存が1つ壊れただけで止まる**形にしたくない。
      #
      # PyYAML を入れるのは**確かめ（selftest）のためだけ。**
      # あれがワークフローの YAML を読んで、繋ぎ先の名前が実在するかを見る
      - name: 確かめが YAML を読むぶんだけ入れる
        run: |
          pip install pyyaml
          # 素性の見張り（下の step）が `island_channels` などを読み込むので、
          # BigQuery の口も要る。**入れないと見張りが ImportError で落ちる**（#500）。
          # `bake_down.yml` が同じ理由で同じものを入れている。2026-10-03 に
          # ここを省いて、初回の空回しが step 5 で落ちた
          pip install -r python/requirements.txt

      # **公開のログに素性が出ないこと**を、口を開く前に見る（#500）。
      # このリポジトリは公開で、Actions のログも誰でも読める。実際に3回出ている。
      # **消すのは出たあと。出る前に止めたいので、口より手前に置く。**
      # **同じ job に置くことが要る**（job が違えばランナーが別）
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      # 偽の GitHub で回すだけ。外へは1バイトも出ない。
      # **本番を触る前に、振り分け（人／機械）が生きているかを見る。**
      # ここが壊れたまま apply で走ると、機械の赤が札に混ざって
      # 「読んでも自分の出番が無い一覧」に戻る
      - name: 振り分けのところを、偽物で先に回す
        run: python3 python/upkeep_watch_selftest.py

      - name: いま手入れを待っている欄を数えて、札の区画を合わせる
        env:
          # 手で押したときだけ既定が「見るだけ」。
          # cron と、繋いで来たぶんは**読む人がいない**ので apply
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name != 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python3 python/upkeep_watch.py --apply
          else
            python3 python/upkeep_watch.py
          fi

      # **作ったのに図鑑に入っていない料理**を数える。
      # ここに置くのは、`cityStreams.ts` が「島の数字を焼き直す」で
      # たったいま焼き直されたばかりだから（題名ごと入っている）。
      #
      # **落としても、この job は赤くしない。** 料理が1品遅れているのは
      # 手入れの遅れであって、仕掛けの故障ではない。上の `upkeep_watch.py` が
      # 落ちたのと同じ赤にすると、「どちらで落ちたのか」が読めなくなる。
      # 鳴らしかたは要約に1行（終了コード 2＝数えられない、のときだけ赤）。
      - name: 図鑑に入っていない料理を数える
        run: |
          set -uo pipefail
          rc=0
          python3 python/recipe_lag_watch.py > /tmp/lag.txt 2>&1 || rc=$?
          cat /tmp/lag.txt
          if [ "$rc" = "1" ]; then
            {
              echo "### 図鑑に入っていない料理があります"
              echo ""
              echo '```'
              cat /tmp/lag.txt
              echo '```'
              echo ""
              echo '`/island-fresh` の2章で足してください。'
              echo '**あやとに名前を聞く前に、上の候補を見る**'
              echo '（題名に書いてあることが多い。#808）。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # 2（数えられない）だけは赤くする。0件と言えないので
          [ "$rc" = "2" ] && exit 2 || exit 0

      # **黙って赤くならない。** 毎晩ひとりでに走るものは、落ちたことに
      # 誰も気づかない。せめてどこで落ちたかを要約に残す
      - name: 落ちたときに、どこで落ちたかを残す
        if: failure()
        run: |
          {
            echo "### 手入れ待ちを札に映せませんでした"
            echo ""
            echo '**あやとの手入れが溜まっているという意味ではありません。**'
            echo 'どれかが起きています。**3つとも、こちらで直すもの。**'
            echo ""
            echo '1. **こちらが埋め損ねている**（ログの `こちらが埋め損ねています`）。'
            echo '   機械が落とすはずの「過ぎた日の行」が、口からまだ返っています。'
            echo '   `functions/` を直したのに `firebase-functions-deploy.yml` を'
            echo '   回していないことが多い（`docs/island-db.md` 3.5）'
            echo '2. 数えられない（ログの `数えられません`）'
            echo '3. GitHub の口に届かない'
            echo ""
            echo 'issue #664 の区画が**いまの状態と食い違ったまま**になっています。'
            echo ""
            echo '`python3 python/upkeep_watch_selftest.py` と'
            echo '`python3 python/upkeep_watch.py --no-github` を手元で回すと、'
            echo 'どれかが分かります。'
          } >> "$GITHUB_STEP_SUMMARY"
