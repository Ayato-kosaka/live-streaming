# **開いたままの issue を、週に1回ひとりでに表へ出す。**
#
# あやとの言葉（2026-09-19）:
#
# > 何度も言ってるが、チケットは終わったらクローズしろよ。
# > **そろそろ永続化するとか対策打てよ。**
#
# 手順書には**もう**「出したら、その場で閉じる」と書いてある。それでも
# 閉じ忘れが続いている。**手順に書くのは対策ではない**
# （`docs/island-standards.md`）。人が居なくても回るものだけが答え。
#
# 中身は `python/ticket_stock.py`。開いている issue を数えて、
# **同じ1本のまとめ**（ラベル `ticket-stock`）の本文を書き換える。
# 毎週 issue を立てる形にはしない——それこそ溜まる。
#
# ## cron を当てにしない
#
# **cron を当てにしない。** 定時実行は、このリポジトリでは**何時間も遅れて**走る。
# `Fetch YouTube Chat Data`（20:00 UTC）と `Fetch Doneru Donations`（20:30 UTC）は
# 数十分〜数時間、01:00〜04:30 UTC に置いた保険は**一度の例外もなく4時間以上**
# （2026-10-13 の実測。**数はここに書かない**——`python3 python/cron_lag.py` が出す）。
# 下の cron は**保険**として置いてある。
#
# **「発火しない cron がある」は、もう当たらない。** 前はここに
# 「実績があるのは古参2本だけ」と書いてあったが、2026-10-13 に
# `event=schedule` の run を数えたら、**cron を持つ14本ぜんぶに実績があった**
# （`rebake.yml` の 01:00 UTC も33回）。**遅れるのは本当。発火しないのは嘘。**
#
# だから**実績のあるものの完了に繋ぐ**（`workflow_run`）。cron は保険。
# 繋ぎかたと落とし穴は `rebake.yml` の 190〜210行に全部書いてある。
#
#   - **`conclusion` は見ない。** `schedule_fetch_chat.yml` は「表に無い
#     どねID が投げ銭してきた」晩に最後の step が `exit 1` で終わる。
#     あれは失敗ではなく呼び出しで、成功のときだけ繋ぐとその晩は走らない
#   - **繋ぎはワークフローの `name:` で解決される。** あちらの名前を変えると
#     黙って切れる。**赤くならない。走らなくなるだけ**
#   - 繋ぎが生きているかは `Fetch Doneru Donations` を `probe: true` で
#     押して確かめられる（1バイトも書かずに40秒で終わる）
#
# ## 毎晩は多すぎるので、週1に間引く——ただし**曜日では間引かない**
#
# 繋ぎ先は毎晩終わるので、そのままだと毎晩まとめを書き換えることになる。
#
# **前はここで曜日を見ていた**（`date -u +%u` が 1 か）。それをやめた。
# 繋ぎ先が終わるのは 23:00〜02:00 UTC で揺れるので、**月曜に着くかどうかが
# 運**になる。直近の run を数えた（2026-10-15）:
#
# | 起こしたもの | 回数 | 関所を通った |
# | --- | ---: | ---: |
# | `workflow_run`（ここが「**本命**」と書いていたほう） | **57** | **2** |
# | `schedule`（ここが「**当てにしない**」と書いていたほう） | 4 | 4 |
#
# **57回中55回が落ちていて、直近3週はゼロ。** 着地の曜日は
# 月2 / 火13 / 水8 / 木7 / 金9 / 土10 / 日8 でほぼ一様——**1/7 の賭け**だった。
# 結果として、**自分で「当てにするな」と書いた cron が週1を1本で背負って
# いた。** 月曜の cron が1回こけたら、棚卸しは静かに何週間も止まる。
# **どこも赤くならない**（#865 とまったく同じ形）。
#
# いまは間引きを**こちらではなく `python/ticket_stock.py` が持つ。**
# 見るのは「今日は月曜か」ではなく「**前に書いてから7日たったか**」
# （`STOCK_EVERY_DAYS`）。前に書いた日は、まとめの本文の見えない印が持っている。
#
# **そして走るたびに、前に書いたのがいつかを言う。** 言わないと、
# 関所で落ち続けている回と正常に書いた回が、run の一覧で同じ顔になる。
# 10日あいたら **1 で落ちる**（`STOCK_OVERDUE_DAYS`）。
#
# 同じ日に2回走ることはある（繋ぎ先が2本あるので）。2回目は関所で
# 「もう書いてある」と言って1バイトも書かない。
#
# ## PR でも1回走る（書かずに）
#
# 「書いたから走るはず」で終わらせないため。この仕組みに触る PR では、
# **本物の GitHub を読んで本文を組み立てるところまで**走って、
# 出来上がりを run の要約に出す。**`--apply` は付けないので1バイトも書かない。**
name: Ticket Stock

on:
  # 保険。**月曜の朝（日本時間で正午ごろ）。** 実績が無いので当てにしない
  schedule:
    - cron: "0 3 * * 1"

  # **本命はこちら。** 実績のある2本の完了に繋ぐ。
  # 2本あるのは、片方が消えても止まらないようにするため
  workflow_run:
    workflows: ["Fetch YouTube Chat Data", "Fetch Doneru Donations"]
    types: [completed]

  # この仕組みそのものを触ったときだけ、PR でも1回通す（書かない）
  pull_request:
    paths:
      - ".github/workflows/ticket_stock.yml"
      - "python/ticket_stock.py"
      - "python/ticket_labels.py"

  workflow_dispatch:
    inputs:
      apply:
        description: "まとめの issue に書く（外すと数えるだけ）"
        required: false
        default: false
        type: boolean

# 1本ずつ。同じ週に2本走って、同じ issue を取り合わないように
concurrency:
  group: ticket-stock
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # **何がこの run を起こしたかを、run そのものに残す。**
      # 一覧からは見分けが付かない（繋ぎも cron も手押しも同じ顔で並ぶ）
      - name: 何がこの run を起こしたか
        env:
          EV: ${{ github.event_name }}
          UP: ${{ github.event.workflow_run.name }}
          CONC: ${{ github.event.workflow_run.conclusion }}
        run: |
          line="起こしたもの: ${EV} / ${UP:-（繋ぎではない）} / ${CONC:-—}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # **曜日の関所はここに置かない**（上の「毎晩は多すぎる」）。
      # 間引きは `python/ticket_stock.py` が、前に書いた日を見て決める。
      # ここに置いていたあいだ、繋ぎで来た 57回のうち 55回が落ちていた
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # **PR の回は `--apply` を付けない。** 1バイトも書かずに、
      # 本物の GitHub を読んで本文を組み立てるところまで通す。
      # 書けているかどうかは、下で run の要約に出したものを見る。
      #
      # **手で押した回は `--force`。** 押した人は「いま見たい」ので、
      # 7日あいていなくても書く（押さないかぎり通らない道なので、
      # 間引きの意味は変わらない）
      - name: 開いている issue を棚卸しして、まとめに書く
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY: ${{ (github.event_name == 'pull_request' || github.event.inputs.apply == 'false') && '0' || '1' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--out /tmp/stock.md)
          if [ "$APPLY" = "1" ]; then args+=(--apply); fi
          if [ "$FORCE" = "1" ]; then args+=(--force); fi
          python3 python/ticket_stock.py "${args[@]}"

      # **出来上がりを run に残す。** 「走った」だけでは、中身が空でも同じ顔
      - name: 書き上がったまとめを、この run にも出す
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### 書き上がったまとめ"
            echo ""
            cat /tmp/stock.md
          } >> "$GITHUB_STEP_SUMMARY"
