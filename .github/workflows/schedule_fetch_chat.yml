name: Fetch YouTube Chat Data

on:
  schedule:
    - cron: "0 20 * * *" # UTC 8:00 PM (日本時間 5:00)
  workflow_dispatch: # 手動実行も可能
    inputs:
      lookback_days:
        description: "Discovery lookback days（何日前まで検索するか）"
        required: false
        default: "10"
        type: string

# 同時実行を防止（単一実行前提）
concurrency:
  group: fetch-chat-${{ github.ref }}
  cancel-in-progress: false # 実行中を殺さず、次の起動を待たせる

jobs:
  discover_videos:
    runs-on: ubuntu-latest
    env:
      # BigQuery 設定
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      # Discovery 設定
      DISCOVERY_LOOKBACK_DAYS: ${{ inputs.lookback_days || '10' }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Doneru key を抽出
        shell: bash
        run: |
          set -euo pipefail
          url='${{ secrets.EXPO_PUBLIC_DONERU_WSS_URL }}'
          key="$(printf '%s' "$url" | sed -n 's/.*[?&]key=\([^&]*\).*/\1/p')"
          if [ -z "$key" ]; then
            echo "ERROR: EXPO_PUBLIC_DONERU_WSS_URL から key=... を抽出できませんでした" >&2
            exit 1
          fi
          # ログに平文で出力されないようマスクする
          echo "::add-mask::$key"
          echo "DONERU_ALERTBOX_KEY=$key" >> "$GITHUB_ENV"

      - name: Discovery 実行
        run: python python/discover_videos.py

  fetch_chat_data:
    runs-on: ubuntu-latest
    needs: discover_videos # Discovery が成功した場合のみ実行
    env:
      # BigQuery 設定
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
      # 旧環境変数（後方互換性のため保持、将来削除予定）
      PYTHON_GAS_API_URL: ${{ secrets.PYTHON_GAS_API_URL }}
      PYTHON_GAS_API_PW: ${{ secrets.PYTHON_GAS_API_PW }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Setup yt-dlp YouTube cookies
        uses: AnimMouse/setup-yt-dlp/cookies@v3
        with:
          cookies: ${{ secrets.YOUTUBE_COOKIES }} # https://github.com/marketplace/actions/setup-yt-dlp#youtube-cookies

      - name: チャットデータ取得スクリプトの実行
        run: python python/fetch_chat_data.py

      - name: Update yt-dlp YouTube cookies
        uses: AnimMouse/setup-yt-dlp/cookies/update@v3
        with:
          cookies_secret_name: YOUTUBE_COOKIES
          token: ${{ secrets.GH_PAT }}

  island_stats:
    runs-on: ubuntu-latest
    # チャット取り込みの後に集計する。取り込みが失敗しても、
    # 既にある分の数字は更新したいので always() で走らせる。
    needs: fetch_chat_data
    if: ${{ always() }}
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: あやと島の数字を更新
        run: python python/island_daily_stats.py

      # YouTube のプロフィール写真（#202）。**カードの絵とは別もの。**
      # カードに乗るキャラクターはあやとのスプレッドシートが正で、
      # YouTube を更新しても変わらないのが正しい。ここが入れるのは
      # マイページのアイコンだけ。
      #
      # YouTube API を叩くので、Discovery と同じ鍵の取り出しが要る。
      # **毎日ぜんぶは引かない**（理由は python/island_channel_photos.py）。
      - name: Doneru key を抽出
        shell: bash
        run: |
          set -euo pipefail
          url='${{ secrets.EXPO_PUBLIC_DONERU_WSS_URL }}'
          key="$(printf '%s' "$url" | sed -n 's/.*[?&]key=\([^&]*\).*/\1/p')"
          if [ -z "$key" ]; then
            echo "ERROR: EXPO_PUBLIC_DONERU_WSS_URL から key=... を抽出できませんでした" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          echo "DONERU_ALERTBOX_KEY=$key" >> "$GITHUB_ENV"

      # **落ちても後ろを止めない。** 写真が古いままなだけで、
      # カードも名簿もこれとは関係がない。
      - name: YouTube のプロフィール写真を入れ直す
        continue-on-error: true
        run: python python/island_channel_photos.py

      # チャンネルIDと、その人がいま名乗っている名前の辞書（#190）。
      # **名簿より前に置く。** あやとが /me で名前を打って紐付けるとき、
      # ここが引き先になる。辞書が古いと、名前を変えたばかりの人が
      # 引けずに YouTube API まで落ちる（1日ぶんの差でしかないが、
      # 順番を入れ替えて得することが何も無い）。
      #
      # 名前が変わった人だけ書くので、ふだんは数件しか書かない。
      - name: チャンネルIDと名前の辞書を更新
        run: python python/island_channels.py

      # 投げ銭の台帳（#202）。YouTube のスパチャと Doneru を1本にする。
      # **カードの元がここに移った。** 名簿（nordicDays）は日付が鍵で、
      # 配信日の境目が日本時間の18時だった（#201）。旅で時差が9回変わる
      # たびに1日が2つに割れるので、境目を日本時間の0時に固定した台帳へ移す。
      #
      # **辞書のあとに置く。** Doneru のぶんは islandDonors を通して
      # チャンネルIDに直すので、紐付けが新しいほうが取りこぼさない。
      #
      # 7日ぶんを引き直す。sourceEventId で一意なので、流し直しても増えない。
      - name: 投げ銭の台帳を更新
        run: python python/island_tips.py

      # あやと島カード（#202）。台帳 × 企画のカード画像。
      # **台帳のあとに置く。** 先に置くと、その日ぶんの投げ銭がまだ
      # 台帳に無い状態でカードを作ることになって、1日遅れる。
      #
      # 画像を貼った時点でも Functions 側が作る（streamEvents.ts の
      # mintForImage）。**両側から埋めて、どちらが先でも同じ結果にする。**
      - name: カードを作る
        run: python python/island_cards.py

      # その日スパチャしてくれた人の名簿。**ここに置く理由は、真上の集計と
      # 同じで「チャットが入ったあとに BigQuery から Firestore へ写す」もの
      # だから。** 別のワークフローにすると、また繋ぎ忘れる。
      #
      # 実際に繋ぎ忘れていた。nordic_supporters.py は書いてあったのに
      # どこからも呼ばれておらず、nordicDays.people がずっと空だった。
      # 名簿が空だと、写真にキャラクターを入れる画面（PhotoStudio）に
      # 選べる人が1人も出ない。**写真を貼っても何も起きない状態**が
      # 続いていた（2026-09-06 に気づいた）。
      #
      # 直近3日ぶんを引き直す。1日だけだと、取り込みがこけた翌日に
      # その日が永久に空のまま残る。手で足した Doneru のぶんは
      # merge() を通すので消えない。
      - name: その日いた人の名簿を更新
        run: python python/nordic_supporters.py --days 3

      # **いちばん最後に置く。** ここは「表に無い どねID が投げ銭してきた」
      # ときに終了コード 1 で終わる。前に置くと、落ちた時点で後ろが skip
      # されて、配れるものが配れなくなる（#132 で2回踏んだ）。
      #
      # 落ちるのは異常ではなく、**あやとへの呼び出し**。Doneru は YouTube の
      # チャンネルIDを持っていないので、新しい人にカードを渡すには
      # python/donors_seed.json に1行足してもらう必要がある。黙って
      # 落とすと、投げ銭してくれたのに何ももらえない人が静かに増える。
      #
      # 直したら（donors_import を apply で流したら）翌日に緑へ戻る。
      - name: Doneru の投げ銭を名簿に足す（新規がいたら赤くする）
        run: python python/doneru_supporters.py --days 3
