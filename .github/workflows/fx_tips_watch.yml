name: 外貨の投げ銭を issue に映す

# 円に直せなかった投げ銭が台帳（`islandTips`）に残っているあいだ、
# **issue を1本だけ開いておく**（`python/fx_tips_watch.py`）。
#
# ## なぜ要るか（#951）
#
# 円以外の投げ銭は、**その日のレートで円に直してから足す**ようになった
# （`python/fx_rate.py`。直すのは取り込みのとき1回きり）。
# **直せないことがある**——台湾ドル（TWD）はレートの口が持っていないし、
# 口が落ちている晩もある。換算を入れる前に入った古い行も直っていない。
#
# **直せなかったぶんは足さない。0 にもしない。** つまり、その人の貢献額は
# そのぶん足りないまま、島の順位にも月ごとのふりかえりにも出る。
# `build_residents.py` は「N件は円に直せていない」とログに1行出す。
# **そのログは誰も見に行かないし、画面にも出ない。**
#
# 2026-10-18 まで、外貨そのものを2年近く黙って落としていたのが同じ形
# （`docs/island-misses.md` #290）。直しかたは `python/admin/fx_backfill.py`。
#
# **窓を置かない。** 直せていない行は、その月のふりかえりから永久に抜け
# 続けるので、直近90日で切ると古い取りこぼしを誰も知らないままになる。
#
# ## 繋ぎ先（`workflow_run`）
#
# 数える元は Firestore の `islandTips`。そこへ書くのは
# `python/island_tips.py` で、**それを回す口は2つしかない。**
# その2つの後ろに繋ぐ。
#
# | 回す口 | ワークフロー名 |
# | --- | --- |
# | 毎晩の取り込みの中（`island_stats`） | `Fetch YouTube Chat Data` |
# | Doneru の取り込みが終わったあと | `投げ銭の台帳を入れ直す` |
#
# **`conclusion` は見ない。** `Fetch YouTube Chat Data` は「表に無い どねID が
# 投げ銭してきた」晩に最後の step が `exit 1` で終わる。あれは失敗ではなく
# **呼び出し**で、台帳にはもう入っている。成功のときだけ繋ぐと、
# **呼び出しの出た晩だけ外貨に気づかない。**
#
# **繋ぎはワークフローの `name:` で解決される。** あちらの名前を変えると
# 黙って切れる（**赤くならない。走らなくなるだけ**）。名前がまだ実在するかは
# `python/fx_tips_watch_selftest.py` の [9] が毎 PR で見ている。
#
# **cron は保険。** 定時実行はこのリポジトリでは何時間も遅れて走る
# （数は `python3 python/cron_lag.py` が出す。**ここに書かない**）。
# 保険の列のいちばん後ろに置く——03:10 台帳 → 03:20 図鑑 → 03:30 退避 →
# 03:35 紐付け → 03:40 SUZURI → 03:45 公開に戻った → 03:50 取り込みが
# 落ちている → **03:55 ここ**。台帳が入ったあとでなければ数える意味がない。
#
# ## 手で押すときの既定は「見るだけ」
#
# `apply` の既定は false。押し間違えても issue は動かない
# （`--apply` を付けないと GitHub に1バイトも書かない。読みには行く）。

on:
  workflow_run:
    # **`island_tips.py` を回したワークフローだけ。**
    # `Fetch Doneru Donations` は BigQuery に材料を入れるだけで、
    # `islandTips` を1行も書かない
    workflows: ["Fetch YouTube Chat Data", "投げ銭の台帳を入れ直す"]
    types: [completed]

  schedule:
    - cron: "55 3 * * *"

  workflow_dispatch:
    inputs:
      apply:
        description: "issue を実際に開く／書き換える／閉じる（off なら数えるだけ）"
        required: false
        default: false
        type: boolean

# 取り込みと台帳が続けて終わった晩に2本同時に走ると、同じ issue を
# 2本立てにいく。1本ずつ通す
concurrency:
  group: fx-tips-watch
  cancel-in-progress: false

permissions:
  contents: read
  # issue を開く・書き換える・閉じる
  issues: write

jobs:
  fx_tips_watch:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # **`requirements.txt` を丸ごと入れない。** ここが読むのは Firestore だけで、
      # BigQuery も YouTube API も Pillow も1行も通らない。年に1〜2回しか
      # 本番の出番が無い係なので、**関係のない依存が1つ壊れただけで止まる**
      # 形にしたくない。GitHub を叩くほうは標準ライブラリ（urllib）だけ。
      # PyYAML は**確かめ（下の selftest）のためだけ**に入れる
      - name: Firestore のクライアントと PyYAML を入れる
        run: |
          python -m pip install --upgrade pip
          pip install "google-cloud-firestore>=2.16.0" PyYAML
          # 下の素性の見張りが `island_channels` などを取り込むので、
          # BigQuery の口も要る。**入れないと見張りが ImportError で落ちる**
          # （`python/logsafe_wiring_selftest.py` の [7]。
          # 2026-10-03 に `upkeep_watch.yml` が同じ落とし方をしている）
          pip install -r python/requirements.txt

      # **口より手前に置く。** この道具は島（`build_residents.py`）ごしに
      # `logsafe` を読み込む＝素性を出しうる口なので、同じ job の手前で
      # 伏せる側が効いていることを見る（`python/logsafe_wiring_selftest.py`）。
      # 認証もクエリも要らず 0.5 秒で終わる。落ちたら下は1行も走らない
      - name: 公開のログに素性が出ない側が効いているか
        run: python3 python/logsafe_selftest.py

      # **本番を触る前に、判断のところが生きているかを見る。**
      # 直せないことが起きるのは年に1〜2回しか無いので、**踏まれない道が
      # 腐っても誰も気づかない。** 偽の台帳と偽の GitHub で回すだけ
      # （外へは出ない）。レートの口を叩く側（`python/fx_rate.py`）も
      # ここで一緒に当てる——**あちらが黙って 0円 を返し始めたら、
      # この issue は「取りこぼし 0件」と言って閉じる**
      - name: 判断のところを、偽物で先に回す
        run: |
          python3 python/fx_rate_selftest.py
          python3 python/fx_tips_watch_selftest.py

      - name: 外貨を数えて、issue を合わせる
        env:
          # 手で押したときだけ既定が「見るだけ」。
          # cron と、台帳に繋いで来たぶんは**読む人がいない**ので apply
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name != 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          if [ "$APPLY" = "true" ]; then
            python python/fx_tips_watch.py --apply || rc=$?
          else
            python python/fx_tips_watch.py || rc=$?
          fi
          echo "FX_RC=$rc" >> "$GITHUB_ENV"
          echo "終了コード: $rc（0=数えた / 1=GitHub に届かない / 2=台帳が読めない）"

      # **外貨が在るだけでは赤くしない**（それは issue のほうに出る）。
      # 落とすのは「この仕組みが動いていない」2つだけ
      - name: 数えられなかったら赤くする
        run: |
          set -euo pipefail
          if [ "${FX_RC:-0}" = "2" ]; then
            {
              echo "### 台帳を読めませんでした"
              echo ""
              echo '`islandTips` が読めていません。**外貨が無かった、という意味ではありません。**'
              echo '数えていないので、issue は開きも閉じもしていません。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${FX_RC:-0}" = "1" ]; then
            {
              echo "### issue を読み書きできませんでした"
              echo ""
              echo '資格・権限（issues: write）を見てください。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
