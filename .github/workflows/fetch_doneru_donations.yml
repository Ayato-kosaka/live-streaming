name: Fetch Doneru Donations

# Doneru の寄付履歴を BigQuery に入れる。
#
# 認証はブラウザの cookie（`_dt`）だけ。Doneru に公開 API は無く、ログインは
# Google OAuth なので、**切れたら自動では戻せない**。あやとが入れ直すしかない。
#
# 気づく道は Actions の失敗通知メールに任せる。認証切れは終了コード 2 で落として、
# ログに ::error:: で理由を出すので、メールから飛べば他の失敗と区別が付く。
# セッションを取り直す手順は docs/island-db.md に書いてある。

on:
  schedule:
    - cron: "30 20 * * *" # UTC 20:30（日本時間 5:30）。チャット取り込みの30分後
  workflow_dispatch:
    inputs:
      year:
        description: "取り込む年（空なら去年の元日から今日まで）"
        required: false
        type: string
      since:
        description: "この年の元日から今日までまとめて取り込む（過去ぶんの取り込み用。year より優先）"
        required: false
        type: string
      probe:
        description: "形だけ見る（BigQuery に書かない）"
        required: false
        default: false
        type: boolean
      recreate:
        description: "取り込む前に doneru_donations を DROP する（古い行を全部捨てる）"
        required: false
        default: false
        type: boolean

concurrency:
  group: fetch-doneru-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch_donations:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
      DONERU_COOKIE: ${{ secrets.DONERU_COOKIE }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Python 環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: DONERU_COOKIE が入っているか確認
        run: |
          if [ -z "${DONERU_COOKIE}" ]; then
            echo "ERROR: secrets.DONERU_COOKIE が未設定です。" >&2
            echo "設定の手順は docs/island-db.md の「Doneru のセッションを入れ直す」を見てください。" >&2
            exit 1
          fi

      - name: 寄付履歴の取得
        shell: bash
        run: |
          # 終了コード 2 は認証切れ。Actions の失敗通知メールで区別が付くよう、
          # ログに理由を出してからそのコードで落とす（issue は立てない）
          args=()
          if [ -n "${{ inputs.since }}" ]; then
            args+=(--since "${{ inputs.since }}")
          elif [ -n "${{ inputs.year }}" ]; then
            args+=(--year "${{ inputs.year }}")
          fi
          if [ "${{ inputs.probe }}" = "true" ]; then args+=(--probe); fi
          if [ "${{ inputs.recreate }}" = "true" ]; then args+=(--recreate); fi

          set +e
          python python/fetch_doneru_donations.py "${args[@]}"
          code=$?
          set -e

          if [ "$code" = "2" ]; then
            echo "::error::Doneru のセッションが切れました。DONERU_COOKIE を入れ直してください（手順は docs/island-db.md）"
          fi
          exit $code

      # 島に「Doneru のぶんが、いつまで入っているか」を1枚写す（#294）。
      #
      # **取り込みが落ちた回こそ要る**ので `always()`。上の step が exit 2 で
      # 落ちた回でも走って、「最後に入ったのはいつか」を写し直す
      # （写すのは BigQuery の記録なので、落ちた回は日付が古いまま残る）。
      #
      # **continue-on-error を付ける。** ここは本題ではない。写せなかったことで
      # 取り込みの成否が変わってはいけないし、写せなかった晩は前の札がそのまま
      # 残るので、島は古いほうへ倒れる（嘘にはならない）。
      - name: Doneru のぶんが、いつまで入っているかを写す
        if: ${{ always() }}
        continue-on-error: true
        run: python python/doneru_health.py

      # Doneru の投げ銭を**1件ずつ**島の置き場へ写す（2026-09-25）。
      #
      # Doneru の API から取れるのは**ウィジェットの累計1つだけ**で、
      # 「誰が・いつ・いくら・何と書いて」は BigQuery にしか無い。
      # Functions からは BigQuery を引けないので、ここで写す。
      #
      # **上の札より後ろに置く。** 「いつまで入っているか」を
      # `islandDoneruHealth/last.okDay` から読むので、先に新しくなっている
      # 必要がある。
      #
      # **continue-on-error は付けない。** 写せなかった晩は画面が内訳を
      # 出さなくなる（0 を作らないため）ので、黙って落ちてはいけない。
      # 額そのものは1円も動かない（豚は向こうの累計を読んでいる）。
      - name: Doneru の投げ銭を1件ずつ写す
        if: ${{ always() }}
        run: python python/doneru_ledger.py

      # スパチャの本文を、あとから台帳へ足す（2026-09-25）。
      #
      # 本文を残しはじめたのは配信の OBS が叩く口だけで、**それより前の
      # ぶんと、OBS を起動し忘れた晩のぶん**には入らない。BigQuery には
      # 在るので、既にある書類へ足す（**新しくは作らない**）。
      #
      # ここに置くのは、上と同じ「BigQuery から島へ写す」仕事だから。
      # チャットの取り込み（20:00 UTC）はこの回（20:30 UTC）より前に走る。
      - name: スパチャの本文を台帳へ足す
        if: ${{ always() }}
        run: python python/superchat_text.py
