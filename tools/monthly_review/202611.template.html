<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2a63" />
    <title>11月のふりかえり授賞式</title>
    <!--
      **このファイルは書き出したもの。手で直さない。**
      元は tools/monthly_review/202611.template.html（見た目と仕掛け）と
      tools/monthly_review/2026-11.*.json（中身・出席・投げ銭）。
        node tools/monthly_review/build_202611.mjs     # 書き出す
        node tools/monthly_review/check.mjs            # 測る（docs/spec/monthly-review.md 6章）
    -->
    <style>
      /*@@FONT_FACE@@*/
      /* =========================================
         202611 月末配信「1ヶ月ふりかえり授賞式」
         テーマ: あやと島の紙の札 ＋ 11月の投げ銭アラート（ブラン城の小さな城主ピポ、#1078）
         決まりは docs/spec/monthly-review.md（MR-1〜）。ここはその形にしたもの。

         - **1080×1080 の正方形**（MR-6）。縦長の配信に載せ、残りに顔を映す。
           窓が正方形でないときは、枠を真ん中に置いて外を夜空の地で埋める（透明にしない）
         - 寸法は px で決める（vw で決めない。#308）
         - クリック / Enter / → で進行、← / Backspace で戻る
         - 外部依存なし（オフラインOK。例外は Firestore 同期の gstatic SDK）。字も絵も写真も焼き込み

         一覧の面は「大写し」（MR-22）:
           1押し目までは一覧を小さく見せる → 1押しごとに1件が真ん中に大きく出る（下は暗く沈む）→
           次の1押しでそれが一覧の元の位置へ縮んで戻り、次の1件が上に重なって大きく出る →
           最後の1押しで全部が一覧に戻る。`prefers-reduced-motion` では動かさず出し替えるだけ

         受け入れの線（MR-22〜27。tools/monthly_review/check.mjs が全面・全ステップで測る）:
         - 大写しの本文 40px 以上・名前 48px 以上
         - 一覧の1行 56px 以上・1面 12 行まで。超えたら面を割る（列を増やして詰めない）
         - 「…」で切らない。名前が入らないときは字を少しだけ縮める（.fit）
         - 色は島（site/app/css/tokens.css の紙・墨）と、城のアラート（app/alertbox/themes.ts の castle）から借りる
         - 絵はアラートの絵をそのまま使う（public/alert/themes/castle/）。新しく描かない
         - UI の印に絵文字を使わない（MR-8）。視聴者さんの字と配信の題の中はそのまま
         ========================================= */
      :root {
        /* 冬の夜。黒にしない。上は紺、地平に向かって暖かい紫 */
        --night-1: #1d2a63;
        --night-2: #2f3477;
        --night-3: #4e3a7a;
        --night-4: #7a4a73;
        /* 島の紙（tokens.css の --paper / --paper-2 と墨） */
        --paper: #fffae4;
        --paper-2: #fdf1cf;
        --paper-3: #f7e4b5;
        --paper-edge: #dcb879; /* 紙の厚み（ぼかさず真下） */
        --slip-edge: #e9d29c;
        --ink: #5b3f15;
        --ink-2: #72521b;
        --ink-3: #957128;
        /* 城のアラートの字の色 */
        --cream: #fff4dc;
        --lamp: #ffd54a;
        --cocoa: #2a1206;
        /* リボンの赤（ribbon.png の地） */
        --ribbon: #8a2433;
        --ribbon-deep: #5e1421;
        --gold: #ffcf4d;
        --gold-deep: #d79a17;
        --berry-ink: #a81139; /* 紙の上の赤い字（tokens.css --accent-ink） */
        --mint: #c4f2d9;
        --mint-ink: #1d5b3e;
        /* 付箋（島のホワイトボードの黄色い付箋） */
        --note: #fff3a6;
        --note-2: #ffe97a;
        --note-edge: #e3c94f;
        --font: "Maru Review", "Hiragino Maru Gothic ProN", ui-rounded, "Hiragino Sans", "Noto Sans JP",
          "Yu Gothic", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        font-weight: 700;
        color: var(--ink);
        overflow: hidden;
        /* 正方形の外も島の夜空（OBS の枠が縦長でも、透明にしない） */
        background: radial-gradient(70% 50% at 50% 100%, rgba(255, 196, 92, 0.18), rgba(255, 196, 92, 0) 70%),
          linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 42%, var(--night-3) 78%, var(--night-4) 100%);
        background-color: var(--night-1);
        user-select: none;
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
      }

      /* 1080x1080 の舞台。窓がそれ以外の大きさのときは、真ん中に置いて収まるまで縮める */
      #world {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 1080px;
        height: 1080px;
        transform: translate(-50%, -50%) scale(var(--k, 1));
        transform-origin: 50% 50%;
        overflow: hidden;
        background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 42%, var(--night-3) 78%, var(--night-4) 100%);
      }

      /* ============ 夜空・雪・灯りの紐 ============
         動かすのは小さな雪の粒だけ（transform のみ）。画面いっぱいの形は動かさない */
      #sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      #sky .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(56% 36% at 84% 92%, rgba(255, 196, 92, 0.32), rgba(255, 196, 92, 0) 70%),
          radial-gradient(50% 30% at 10% 96%, rgba(255, 170, 110, 0.2), rgba(255, 170, 110, 0) 70%);
      }
      #sky .stars {
        position: absolute;
        inset: 0 0 40% 0;
        background-image:
          radial-gradient(2.4px 2.4px at 6% 18%, #fff8e0 60%, transparent 100%),
          radial-gradient(2px 2px at 14% 52%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.6px 2.6px at 23% 30%, #fff 60%, transparent 100%),
          radial-gradient(1.8px 1.8px at 31% 64%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.2px 2.2px at 42% 22%, #fff 60%, transparent 100%),
          radial-gradient(2px 2px at 55% 58%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.6px 2.6px at 63% 28%, #fff 60%, transparent 100%),
          radial-gradient(1.8px 1.8px at 71% 70%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.4px 2.4px at 79% 40%, #fff 60%, transparent 100%),
          radial-gradient(2px 2px at 88% 16%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.2px 2.2px at 95% 56%, #fff 60%, transparent 100%);
        opacity: 0.75;
      }
      #sky .snow i {
        position: absolute;
        top: -20px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffffff, #e4ecff);
        opacity: 0.75;
        will-change: transform;
        animation: snow linear infinite;
      }
      @keyframes snow {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-30px, 1120px, 0); }
      }
      /* クリスマスマーケットの灯りの紐（上の端） */
      #garland { position: absolute; left: 0; top: 0; width: 1080px; height: 60px; z-index: 0; pointer-events: none; }
      #garland .bulb { animation: twinkle 3.2s ease-in-out infinite; }
      #garland .bulb:nth-child(3n) { animation-delay: -1.1s; }
      #garland .bulb:nth-child(3n + 1) { animation-delay: -2.2s; }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      /* 足もとの雪。進行のドットはこの上 */
      #ground { position: absolute; left: 0; bottom: 0; width: 1080px; height: 64px; z-index: 0; pointer-events: none; }

      /* ============ 舞台の骨組み ============ */
      #stage {
        position: absolute;
        inset: 0;
        padding: 14px 40px 52px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.3s ease;
        /* 紙吹雪（z-index: 2）より前。札の地は不透明なので、紙吹雪は札のうしろ＝夜空にだけ降る */
        z-index: 3;
      }
      #stage.fading { opacity: 0; }

      /* コーナーの頭: 小さな札（CORNER n）を上に、その下にリボン */
      .head { flex: none; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
      .tag {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--cream);
        background: rgba(42, 18, 6, 0.5);
        padding: 1px 18px;
        border-radius: 999px;
        line-height: 1.35;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .ribbon {
        min-width: 440px;
        max-width: 1000px;
        height: 96px;
        border-style: solid;
        border-width: 0 56px;
        border-image-source: var(--ribbon-img);
        border-image-slice: 0 70 0 70 fill;
        border-image-width: 0 56px;
        border-image-repeat: round;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px 10px;
      }
      .ribbon .title {
        margin: 0;
        font-size: 46px;
        font-weight: 900;
        line-height: 1.1;
        color: var(--cream);
        white-space: nowrap;
        text-shadow: 0 3px 0 var(--ribbon-deep), 0 0 3px var(--ribbon-deep);
        letter-spacing: 0.03em;
      }
      .ribbon.big { height: 124px; border-width: 0 68px; border-image-width: 0 68px; padding-bottom: 14px; }
      .ribbon.big .title { font-size: 60px; }

      .body { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

      /* 島の紙の札。輪郭線なし。厚みは真下にぼかさず、落ち影は右下へ */
      .panel {
        position: relative;
        width: 100%;
        max-width: 1000px;
        background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
        border-radius: 28px;
        box-shadow: 0 8px 0 var(--paper-edge), 6px 22px 30px rgba(8, 6, 30, 0.42);
        padding: 26px 30px;
        color: var(--ink);
      }
      /* 札のうしろから顔を出すピポ（札の上の辺が、絵の下の辺を隠す） */
      .pipo-on { position: absolute; right: 40px; bottom: calc(100% - 26px); height: 116px; z-index: -1; pointer-events: none; }
      .pipo-on.peek { bottom: calc(100% - 4px); height: 100px; }
      .pipo-on.left { right: auto; left: 40px; }

      /* ステップ表示 */
      [data-step] { opacity: 0; transform: translateY(12px); transition: opacity 0.45s ease, transform 0.45s ease; }
      [data-step].on { opacity: 1; transform: none; }
      /* そのステップまで場所も取らない（出るときに下を押し下げる） */
      [data-step][data-hold]:not(.on) { display: none; }
      .hide { display: none !important; }

      .lead { font-size: 32px; font-weight: 900; color: var(--ink); text-align: center; line-height: 1.45; margin: 0 0 18px; }
      .lead.on-sky { color: var(--cream); text-shadow: 0 2px 0 rgba(42, 18, 6, 0.6); }
      .foot { font-size: 26px; color: var(--ink-2); line-height: 1.55; margin-top: 16px; text-align: center; }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 2px 14px;
        font-size: 24px;
        font-weight: 900;
        line-height: 1.35;
        white-space: nowrap;
        background: var(--paper-3);
        color: var(--ink-2);
      }
      .pill.red { background: var(--ribbon); color: var(--cream); }
      .pill.gold { background: linear-gradient(180deg, #ffe58a, var(--gold)); color: var(--cocoa); }
      .pill.mint { background: var(--mint); color: var(--mint-ink); }
      .heart { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .heart svg { width: 0.9em; height: 0.9em; flex: none; }

      /* ============ 顔（YouTube のアイコン）と、島のキャラクターの絵 ============ */
      .av {
        flex: none;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        overflow: hidden;
        display: inline-grid;
        place-items: center;
        background: linear-gradient(180deg, #ffe7a3, #f3c35e);
        color: var(--cocoa);
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 3px 0 rgba(91, 63, 21, 0.25);
      }
      .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .av-sm { width: 44px; height: 44px; font-size: 24px; }
      .av-md { width: 120px; height: 120px; font-size: 44px; box-shadow: 0 5px 0 rgba(91, 63, 21, 0.25); }
      .av-lg { width: 132px; height: 132px; font-size: 48px; box-shadow: 0 5px 0 rgba(91, 63, 21, 0.25); }
      .av-xl { width: 220px; height: 220px; font-size: 80px; box-shadow: 0 6px 0 rgba(91, 63, 21, 0.25); }
      /* 島のキャラクターは全身の絵。**丸く切らない**（10月版と同じ） */
      .ch { flex: none; width: 56px; height: 56px; display: inline-grid; place-items: center; }
      .ch img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(2px 4px 2px rgba(46, 60, 30, 0.3)); }
      .ch-none {
        border-radius: 16px;
        background: linear-gradient(180deg, #ffe7a3, #f3c35e);
        color: var(--cocoa);
        font-size: 24px;
        font-weight: 900;
      }
      .ch-lg { width: 168px; height: 168px; }
      .ch-lg.ch-none { font-size: 60px; border-radius: 40px; }
      .ch-end { width: 140px; height: 140px; }
      .ch-end.ch-none { font-size: 52px; border-radius: 34px; }
      .ch-xl { width: 250px; height: 250px; }
      .ch-xl.ch-none { font-size: 88px; border-radius: 56px; }
      .ch-big { width: 330px; height: 330px; }
      .ch-big.ch-none { font-size: 120px; border-radius: 70px; }

      /* ============ 一覧（出席・投げ銭の4位以下） ============
         1行 72px。**1列**で、1面 12 行まで（MR-24）。名前を縮めずに読めるように */
      .list { display: flex; flex-direction: column; gap: 10px; }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 66px;
        padding: 5px 28px 5px 8px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fffdf4 0%, var(--paper-3) 100%);
        box-shadow: 0 4px 0 var(--slip-edge);
      }
      .row .nm { flex: 1 1 auto; min-width: 0; font-size: 36px; font-weight: 900; color: var(--ink); white-space: nowrap; line-height: 1.2; }
      .row .st { flex: none; font-size: 34px; font-weight: 900; color: var(--ink-2); white-space: nowrap; }
      .row .st small { font-size: 26px; color: var(--ink-3); margin-left: 2px; }
      .row .rk {
        flex: none;
        min-width: 92px;
        text-align: center;
        font-size: 28px;
        font-weight: 900;
        color: var(--cocoa);
        background: linear-gradient(180deg, #ffe58a, var(--gold));
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .row .yen { flex: none; font-size: 36px; font-weight: 900; color: var(--berry-ink); white-space: nowrap; }

      /* ============ 小さな札（一覧の1件） ============ */
      .g1 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 18px; align-items: stretch; }
      .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
      .sc {
        position: relative;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 22px;
        box-shadow: 0 5px 0 var(--slip-edge);
        padding: 14px 20px 16px;
        min-width: 0;
        height: 100%;
      }
      .sc .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .sc .nm { font-size: 28px; font-weight: 900; color: var(--ink); line-height: 1.25; min-width: 0; }
      .sc .msg { font-size: 28px; font-weight: 900; color: var(--ink); line-height: 1.45; margin-top: 8px; }
      .sc .badge { position: absolute; right: 14px; top: -14px; }
      /* 大写し中の1件（元の場所は空けておく。戻ってきたときに同じ所に収まる） */
      .spot-item { min-width: 0; }
      .spot-item.lifted { visibility: hidden; }
      .spot-item.seen > * { box-shadow: 0 5px 0 var(--gold-deep); }

      /* ============ 大写し（MR-22・23） ============ */
      .spot-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
      .spot-dim { position: absolute; inset: 0; background: rgba(16, 14, 44, 0.68); opacity: 0; transition: opacity 0.35s ease; }
      .spot-layer.on .spot-dim { opacity: 1; }
      .spot-layer .big-card { position: absolute; inset: 34px 36px 50px; margin: auto; height: fit-content; }
      .big-card {
        --bs: 1;
        width: 960px;
        max-height: 996px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
        border-radius: 32px;
        box-shadow: 0 10px 0 var(--paper-edge), 8px 26px 40px rgba(8, 6, 30, 0.55);
        padding: 34px 44px 38px;
        color: var(--ink);
        transform-origin: 50% 50%;
      }
      .big-card > * { flex: none; }
      .big-card .pill { font-size: 34px; padding: 3px 20px; }
      .b-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .b-no {
        flex: none;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ribbon);
        color: var(--cream);
        font-size: 40px;
        font-weight: 900;
      }
      .b-who { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
      .b-title { font-size: calc(56px * var(--bs)); font-weight: 900; line-height: 1.3; color: var(--ink); margin-top: 14px; }
      .b-name { font-size: calc(58px * var(--bs)); font-weight: 900; line-height: 1.25; color: var(--ink); min-width: 0; }
      .b-body { font-size: calc(48px * var(--bs)); font-weight: 900; line-height: 1.5; color: var(--ink); margin-top: 16px; }
      .b-body.sub { font-size: calc(46px * var(--bs)); font-weight: 700; color: var(--ink-2); margin-top: 12px; }
      .b-word { font-size: calc(120px * var(--bs)); font-weight: 900; line-height: 1.15; color: var(--berry-ink); text-align: center; margin: 6px 0 4px; }
      .b-photos { flex: 0 1 620px; min-height: 200px; display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 18px; overflow: hidden; }
      .b-photos img { height: 100%; min-width: 0; object-fit: contain; border-radius: 20px; display: block; box-shadow: 0 5px 0 rgba(91, 63, 21, 0.2); }
      .b-photos.n2 img { max-width: calc(50% - 8px); }
      .b-photos.n3 img { max-width: calc(33.3% - 11px); }
      .b-cap { font-size: 32px; color: var(--ink-2); text-align: center; line-height: 1.45; margin-top: 10px; }
      /* 2段の大写し: 1段目は写真を大きく、2段目で本文が出て写真は小さくなる */
      .big-card .b-p1 { display: none; }
      .big-card.p1 .b-p1 { display: block; }
      .big-card.p1 .b-p0 { display: none; }
      .big-card.p1 .b-photos { flex-basis: 300px; }
      .big-card.center { text-align: center; }
      /* 付箋の大賞は、紙吹雪が透けて見えるように沈めかたを浅く */
      .gp-layer .spot-dim { background: rgba(16, 14, 44, 0.4); }
      .big-card.center .b-top, .big-card.center .b-who { justify-content: center; }

      /* ============ オープニング ============ */
      .op { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 30px; }
      .op-period { font-size: 30px; font-weight: 900; color: var(--cream); background: rgba(42, 18, 6, 0.45); border-radius: 999px; padding: 4px 24px; }
      .op-sub { font-size: 34px; font-weight: 900; color: var(--cream); line-height: 1.5; margin: 0; text-shadow: 0 2px 0 rgba(42, 18, 6, 0.6); text-align: center; max-width: 960px; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 100%; }
      .stat {
        background: linear-gradient(180deg, var(--paper), var(--paper-2));
        border-radius: 24px;
        box-shadow: 0 6px 0 var(--paper-edge), 4px 14px 20px rgba(8, 6, 30, 0.35);
        padding: 14px 6px 12px;
        text-align: center;
      }
      .stat .n { font-size: 66px; font-weight: 900; color: var(--ink); line-height: 1.05; }
      .stat .n small { font-size: 30px; margin-left: 2px; }
      .stat .l { font-size: 24px; color: var(--ink-2); margin-top: 6px; line-height: 1.35; }
      .op-bottom { flex: 1; width: 100%; display: flex; align-items: flex-end; gap: 22px; }
      .program {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 10px;
        background: rgba(255, 250, 228, 0.12);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .program span { font-size: 28px; font-weight: 900; color: var(--ink); background: var(--paper-2); border-radius: 999px; padding: 3px 16px; white-space: nowrap; }

      /* ============ 城（アラートの絵そのもの）。下の階から窓に灯りがともる ============ */
      .castle { position: relative; flex: none; }
      .castle > img { position: absolute; left: 0; top: 0; height: auto; display: block; }
      .castle .c-lit { transition: clip-path 1.6s ease; }
      .castle .c-glow {
        position: absolute;
        inset: -14% 0 -6%;
        background: radial-gradient(closest-side, rgba(255, 213, 74, 0.5), rgba(255, 170, 60, 0.2) 55%, rgba(255, 170, 60, 0) 100%);
        opacity: 0;
        transition: opacity 1.6s ease;
      }
      .castle .c-flag { position: absolute; transition: transform 1.6s ease; }
      .castle .c-flag img { height: 100%; width: auto; display: block; transform-origin: 0% 50%; animation: wave 2.4s ease-in-out infinite; }
      @keyframes wave { 0%, 100% { transform: skewY(0deg); } 50% { transform: skewY(-4deg) scaleX(0.96); } }
      .castle .c-pipo { position: absolute; display: block; }

      /* ============ ふりかえり（6分割） ============ */
      .rc { display: flex; flex-direction: column; gap: 10px; }
      .rc .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .no {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ribbon);
        color: var(--cream);
        font-size: 28px;
        font-weight: 900;
        flex: none;
      }
      .rc .thumb { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: var(--paper-3); }
      .rc .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .rc h3 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.3; color: var(--ink); }
      .rc.nophoto h3 { font-size: 36px; margin-top: 10px; }

      /* ============ 皆勤賞 ============ */
      .kk-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
      .kc {
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 28px;
        box-shadow: 0 6px 0 var(--slip-edge);
        padding: 20px 22px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        height: 100%;
      }
      .kc .nm { font-size: 40px; font-weight: 900; color: var(--ink); line-height: 1.25; max-width: 100%; white-space: nowrap; overflow-wrap: anywhere; }
      .kc .d { font-size: 28px; font-weight: 900; color: var(--ink-2); }
      .kc .w { font-size: 28px; line-height: 1.55; color: var(--ink-2); text-align: left; }
      .kc .pill { font-size: 28px; }
      .kk-cards { width: 100%; }

      /* ============ はじめまして ============ */
      .count { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 14px; margin-bottom: 18px; }
      .count .n { font-size: 108px; font-weight: 900; color: var(--berry-ink); line-height: 1; }
      .count .l { font-size: 36px; font-weight: 900; color: var(--ink); }

      /* ============ 引用の札を1枚だけ大きく（件数が少ない面） ============ */
      .qbig .who { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .qbig .nm { font-size: 44px; font-weight: 900; color: var(--ink); }
      .qbig .msg { font-size: 42px; font-weight: 900; color: var(--ink); line-height: 1.5; margin-top: 14px; }
      .qbig .note { font-size: 32px; color: var(--ink-2); line-height: 1.55; margin-top: 10px; }

      /* ============ クイズ ============ */
      .quiz-q { display: flex; align-items: flex-start; gap: 20px; }
      .quiz-q .qn {
        flex: none;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ribbon);
        color: var(--cream);
        font-size: 38px;
        font-weight: 900;
      }
      .quiz-q .qt { font-size: 44px; font-weight: 900; line-height: 1.4; color: var(--ink); }
      .quiz-q .hint2 { font-size: 26px; color: var(--ink-3); margin-top: 4px; }
      .qphoto { display: flex; justify-content: center; margin-top: 18px; height: 520px; transition: height 0.45s ease, opacity 0.35s ease, margin 0.45s ease; }
      .qphoto img { height: 100%; max-width: 100%; object-fit: contain; border-radius: 20px; box-shadow: 0 5px 0 rgba(91, 63, 21, 0.2); }
      .quiz.after .qphoto { height: 0; opacity: 0; margin-top: 0; }
      .choices { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
      .choice {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 80px;
        padding: 8px 26px 8px 12px;
        border-radius: 40px;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        box-shadow: 0 5px 0 var(--slip-edge);
        font-size: 36px;
        font-weight: 900;
        line-height: 1.3;
        transition: background 0.4s ease, opacity 0.4s ease;
      }
      .choice .abc {
        flex: none;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--paper-edge);
        color: var(--cream);
        font-size: 32px;
      }
      .choice .tx { flex: 1 1 auto; min-width: 0; }
      .choice .ok { flex: none; visibility: hidden; }
      .choices.done .choice { opacity: 0.45; }
      .choices.done .choice.right { opacity: 1; background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 5px 0 var(--gold-deep); }
      .choices.done .choice.right .abc { background: var(--ribbon); }
      .choices.done .choice.right .ok { visibility: visible; }
      .answer { margin-top: 20px; font-size: 32px; line-height: 1.55; color: var(--ink-2); text-align: left; }
      .answer b { font-size: 36px; color: var(--ink); }

      /* ============ 流行語 ============ */
      .bw .word { font-size: 46px; font-weight: 900; color: var(--berry-ink); line-height: 1.2; width: 100%; }
      .bw .who { margin-top: 6px; }

      /* ============ 発表（ドラムロール → 大賞） ============ */
      .drum { font-size: 64px; font-weight: 900; color: var(--ink); text-align: center; letter-spacing: 0.06em; margin: 20px 0; }
      .drum.on-sky { color: var(--cream); text-shadow: 0 3px 0 rgba(42, 18, 6, 0.7); }
      .win { text-align: center; position: relative; }
      .win .prize { display: inline-block; font-size: 32px; }
      .win .big { font-weight: 900; color: var(--berry-ink); line-height: 1.15; margin: 16px 0 12px; }
      /* 長い引用・説明は、面に入るまで少しずつ縮める（--sh。下限は引用 42px・説明 32px） */
      .win .msg { font-size: calc(52px * var(--sh, 1)); font-weight: 900; color: var(--ink); line-height: 1.5; margin: 20px 0 16px; }
      .win .note { font-size: calc(40px * var(--sh, 1)); color: var(--ink-2); line-height: 1.55; text-align: left; }
      .win .big { font-size: calc(128px * var(--sh, 1)); }
      .win .who { display: inline-flex; align-items: center; gap: 18px; font-size: 48px; font-weight: 900; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

      /* ============ 付箋 ============ */
      .fs {
        position: relative;
        background: linear-gradient(180deg, var(--note) 0%, var(--note-2) 100%);
        border-radius: 6px 6px 18px 6px;
        box-shadow: 0 5px 0 var(--note-edge), 4px 12px 16px rgba(8, 6, 30, 0.25);
        padding: 22px 20px 16px;
        height: 100%;
        transform: rotate(-0.8deg);
      }
      .g2 > .spot-item:nth-child(2n) .fs { transform: rotate(0.9deg); }
      .fs::before, .big-card.fusen::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -12px;
        width: 120px;
        height: 28px;
        transform: translateX(-50%) rotate(-2deg);
        background: rgba(255, 250, 228, 0.72);
        box-shadow: 0 1px 2px rgba(91, 63, 21, 0.18);
      }
      .fs .flabel { font-size: 30px; }
      .fs .fby { font-size: 28px; font-weight: 900; color: var(--ink); margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding-right: 4px; }
      .fs .fby .pill { font-size: 24px; }
      .fs .fthumb { float: right; width: 120px; height: 90px; object-fit: cover; border-radius: 10px; margin: 0 0 6px 12px; box-shadow: 0 3px 0 rgba(91, 63, 21, 0.2); }
      .big-card.fusen { background: linear-gradient(180deg, var(--note) 0%, var(--note-2) 100%); border-radius: 10px 10px 34px 10px; box-shadow: 0 10px 0 var(--note-edge), 8px 26px 40px rgba(8, 6, 30, 0.55); }
      .big-card.fusen::before { width: 200px; height: 40px; top: -18px; }
      .big-card.fusen.gp { box-shadow: 0 10px 0 var(--gold-deep), 0 0 0 8px rgba(255, 213, 74, 0.55), 8px 26px 40px rgba(8, 6, 30, 0.55); }
      .b-after { border-top: 3px dashed rgba(149, 113, 40, 0.45); padding-top: 14px; }
      .b-after .pill { margin-bottom: 4px; }

      /* ============ おまけ ============ */
      .oc { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
      .oc .stamp { height: 120px; }
      .oc h3 { margin: 0; font-size: 32px; font-weight: 900; color: var(--ink); line-height: 1.35; }
      .oc p { margin: 0; font-size: 30px; line-height: 1.6; color: var(--ink-2); text-align: left; }
      .b-stamp { height: 170px; align-self: center; }

      /* ============ 投げ銭 ============ */
      .tp { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }
      .tier {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 22px;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 28px;
        box-shadow: 0 6px 0 var(--slip-edge), 4px 16px 24px rgba(8, 6, 30, 0.35);
        padding: 16px 32px 16px 22px;
        min-width: 0;
      }
      .tier .who { flex: 1 1 auto; min-width: 0; }
      .tier .rkn { font-size: 32px; font-weight: 900; color: var(--ink-2); }
      .tier .nm { font-size: 54px; font-weight: 900; color: var(--ink); line-height: 1.25; white-space: nowrap; }
      .tier .yen { font-size: 60px; font-weight: 900; color: var(--berry-ink); white-space: nowrap; line-height: 1.2; }
      .medal {
        flex: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 42px;
        font-weight: 900;
        color: var(--cocoa);
        box-shadow: 0 4px 0 rgba(91, 63, 21, 0.25);
      }
      .medal.m1 { background: radial-gradient(circle at 35% 30%, #fff3b8, #ffd54a 55%, #e0a91b); }
      .medal.m2 { background: radial-gradient(circle at 35% 30%, #ffffff, #dfe4ec 55%, #aab4c3); }
      .medal.m3 { background: radial-gradient(circle at 35% 30%, #ffe0c4, #eaa874 55%, #c27a44); }
      .tier.t1 { padding: 22px 34px 22px 22px; box-shadow: 0 6px 0 var(--gold-deep), 0 0 0 6px rgba(255, 213, 74, 0.5), 4px 16px 24px rgba(8, 6, 30, 0.35); }
      .tier.t1 .nm { font-size: 70px; }
      .tier.t1 .yen { font-size: 92px; }
      .tier.t1 .medal { width: 100px; height: 100px; font-size: 54px; }
      .total { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 46px; font-weight: 900; color: var(--cream); text-shadow: 0 3px 0 rgba(42, 18, 6, 0.7); flex-wrap: wrap; }
      .total img { height: 70px; }
      .total .th { font-size: 36px; }
      .b-tip { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
      .b-tip .b-yen { font-size: calc(84px * var(--bs)); font-weight: 900; color: var(--berry-ink); line-height: 1.2; }

      /* ============ 手紙 ============ */
      .letter {
        background:
          repeating-linear-gradient(180deg, rgba(91, 63, 21, 0) 0 68px, rgba(201, 160, 90, 0.22) 68px 69px),
          linear-gradient(180deg, var(--paper), var(--paper-2));
        padding: 32px 48px 36px;
      }
      .letter p { margin: 0 0 16px; font-size: 42px; line-height: 1.65; color: var(--ink); text-indent: 1em; }
      .letter.dense p { font-size: 38px; }
      .letter .sig { text-align: right; font-size: 38px; font-weight: 900; color: var(--ink); margin-top: 8px; }

      /* ============ エンディング ============ */
      .end { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 30px; }
      .end .sub { font-size: 32px; font-weight: 900; color: var(--cream); text-shadow: 0 2px 0 rgba(42, 18, 6, 0.6); text-align: center; margin: 0; line-height: 1.5; }
      .end .panel { text-align: center; }
      .faces { display: flex; justify-content: center; align-items: flex-end; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
      .end .thanks { font-size: 36px; line-height: 1.55; color: var(--ink); }
      .tap {
        display: inline-flex;
        align-items: baseline;
        gap: 16px;
        margin-top: 14px;
        padding: 8px 30px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fff3b8, var(--gold));
        box-shadow: 0 5px 0 var(--gold-deep);
      }
      .tap .l { font-size: 28px; font-weight: 900; color: var(--cocoa); }
      .tap .n { font-size: 48px; font-weight: 900; color: var(--cocoa); }
      .end .ps { font-size: 30px; color: var(--ink-2); margin-top: 12px; line-height: 1.5; }
      .end .foot-castle { flex: 1; display: flex; align-items: flex-end; justify-content: center; width: 100%; }

      /* ============ 進行（雪の上のドット）と、合図 ============ */
      #progress { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 30; }
      #progress .dot { width: 13px; height: 13px; border-radius: 999px; background: rgba(114, 82, 27, 0.32); transition: all 0.3s ease; }
      #progress .dot.act { width: 36px; background: var(--ribbon); }
      #hint { position: absolute; right: 22px; bottom: 14px; color: var(--ink-2); font-size: 20px; font-weight: 900; z-index: 30; transition: opacity 1s ease; }
      #hint.gone { opacity: 0; }

      /* ============ 紙吹雪 ============ */
      #confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
      .confetti { position: absolute; top: -40px; width: 14px; height: 22px; border-radius: 4px; opacity: 0.95; animation: fall linear forwards; }
      @keyframes fall {
        0% { transform: translateY(-60px) rotate(0deg); }
        100% { transform: translateY(1200px) rotate(720deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #sky .snow i, #garland .bulb, .castle .c-flag img { animation: none; }
        [data-step], .castle .c-lit, .castle .c-flag, .castle .c-glow, .spot-dim, .qphoto, #stage { transition: none; }
      }

      /* ============ コントローラ（?role=ctrl。あやとの手元のスマホ） ============ */
      body.ctrl { cursor: default; overflow: hidden; background: linear-gradient(180deg, var(--night-1), var(--night-3)); }
      body.ctrl #world { display: none; }
      #ctrl-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        color: var(--cream);
      }
      body.ctrl #ctrl-ui { display: flex; }
      #ctrl-ui .c-head { display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 14px; }
      #ctrl-ui .c-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      #ctrl-ui .c-dot { width: 10px; height: 10px; border-radius: 999px; background: #8a7a68; }
      #ctrl-ui .c-dot.ok { background: #52d3ab; }
      #ctrl-ui .c-dot.ng { background: #f08aa0; }
      #ctrl-ui .c-now { background: var(--paper); color: var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--paper-edge); padding: 14px 18px; text-align: center; }
      #ctrl-ui .c-corner { font-weight: 900; font-size: clamp(20px, 6vw, 30px); }
      #ctrl-ui .c-step { color: var(--ink-2); font-weight: 700; font-size: 14px; margin-top: 2px; }
      #ctrl-ui .c-main { display: flex; gap: 12px; flex: none; }
      #ctrl-ui button {
        font-family: inherit;
        border: 0;
        border-radius: 22px;
        font-weight: 900;
        cursor: pointer;
        color: var(--ink);
        background: var(--paper-2);
        box-shadow: 0 5px 0 var(--paper-edge);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* ダブルタップズーム由来の余計な発火を防ぐ */
        user-select: none;
      }
      #ctrl-ui button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-edge); }
      #ctrl-ui .c-back { flex: 1; height: 26vh; font-size: clamp(18px, 5vw, 26px); color: var(--ink-2); }
      #ctrl-ui .c-next { flex: 2.4; height: 26vh; font-size: clamp(26px, 8vw, 40px); color: var(--cream); background: var(--ribbon); box-shadow: 0 6px 0 var(--ribbon-deep); }
      #ctrl-ui .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; padding-bottom: 6px; }
      #ctrl-ui .c-grid button { padding: 12px 10px; font-size: clamp(13px, 3.6vw, 17px); text-align: left; }
      #ctrl-ui .c-grid button.act { background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 5px 0 var(--gold-deep); }
      #ctrl-ui .c-extra { display: flex; gap: 8px; }
      #ctrl-ui .c-extra button { flex: 1; padding: 12px; font-size: 15px; }
      #ctrl-ui .c-banner { background: var(--paper); color: var(--ink); border-radius: 14px; font-size: 13px; font-weight: 700; line-height: 1.6; padding: 10px 14px; display: none; }
      #ctrl-ui .c-banner.show { display: block; }
    </style>
  </head>
  <body>
    <div id="world">
      <div id="sky" aria-hidden="true">
        <div class="glow"></div>
        <div class="stars"></div>
        <div class="snow" id="snow"></div>
      </div>
      <svg id="garland" viewBox="0 0 1080 60" aria-hidden="true"></svg>
      <svg id="ground" viewBox="0 0 1080 64" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7f9ff" />
            <stop offset="1" stop-color="#d6def4" />
          </linearGradient>
          <linearGradient id="snowg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e3e9fb" />
            <stop offset="1" stop-color="#c3cdea" />
          </linearGradient>
        </defs>
        <path d="M0 28 C 130 4, 260 22, 400 18 C 540 14, 660 2, 800 16 C 910 26, 1010 10, 1080 16 L1080 64 L0 64 Z" fill="url(#snowg2)" />
        <path d="M0 40 C 150 20, 290 36, 460 30 C 620 24, 740 38, 900 30 C 990 25, 1050 33, 1080 32 L1080 64 L0 64 Z" fill="url(#snowg)" />
      </svg>
      <main id="stage" role="main" aria-live="polite"></main>
      <div id="progress" aria-hidden="true"></div>
      <div id="hint">Enter で進む ・ ← で戻る</div>
      <div id="confetti-layer" aria-hidden="true"></div>
    </div>

    <div id="ctrl-ui">
      <div class="c-head">
        <span>ふりかえり授賞式 コントローラ</span>
        <span class="c-status"><span class="c-dot" id="c-dot"></span><span id="c-status-text">接続中…</span></span>
