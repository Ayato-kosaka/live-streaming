        <button id="c-top">最初から</button>
      </div>
      <div class="c-grid" id="c-grid"></div>
    </div>

    <script>
      "use strict";

      /* =========================================================
         11月のふりかえり授賞式
         中身は書き出しの道具が下の5つに差し込む（手で書かない）:
           REVIEW_DATA … 2026-11.content.json ＋ 2026-11.kinkin.json ＋ 2026-11.tips.json
           AVATARS     … YouTube のチャンネルの og:image（=s176-c-rj）。取れない人はイニシャルの丸
           CHARS       … 投げ銭の絵（図鑑のキャラクター。tips の icon が鍵）
           IMAGES      … あやと島カードの写真・付箋の絵（中身の `img` の字がそのまま鍵。無い写真は出さない）
           ART         … 11月の投げ銭アラートの絵（public/alert/themes/castle/）と castle.json

         決めごと:
         ・引用は原文のまま。`escapeHtml` を必ず通す
         ・**個人別のコメント数は1つも出さない**（欄も作らない。MR-5）
         ・投げ銭は貢献額をそのまま出す。**画面で式を説明しない**（MR-10）
         ・見せる名前は「あやと島案内鳥」（MR-9）
         ========================================================= */
      const REVIEW_DATA = /*@@REVIEW_DATA@@*/ null;
      const AVATARS = /*@@AVATARS@@*/ {};
      const CHARS = /*@@CHARS@@*/ {};
      const IMAGES = /*@@IMAGES@@*/ {};
      const ART = /*@@ART@@*/ {};
      const AVATAR_ALIAS = {};

      /* ============================ 基盤 ============================ */
      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      const e = escapeHtml;
      const clamp01 = (v) => Math.max(0, Math.min(1, Number(v) || 0));
      const yen = (n) => Number(n).toLocaleString("ja-JP");
      const W = 1080; // 舞台の一辺

      function initials(name) {
        const s = String(name).trim().replace(/^@/, "").replace(/ さん$/, "");
        return Array.from(s).slice(0, 1).join("") || "？";
      }
      function avatarKey(name) {
        const n = String(name).replace(/^@/, "").replace(/ さん$/, "").trim();
        return AVATAR_ALIAS[n] || n;
      }
      function avatarHtml(name, size) {
        const key = avatarKey(name);
        const src = AVATARS[key];
        const cls = `av ${size || ""}`;
        if (src) return `<span class="${cls}"><img src="${src}" alt="" decoding="async" /></span>`;
        return `<span class="${cls}">${e(initials(dispName(name)))}</span>`;
      }

      /* 画面に出す呼び名。**YouTube の生ハンドルを出さない。**（10月版と同じ決め）
         `-k1n` `-z3i` は YouTube が重複を避けるために勝手に付けた記号で、本人の名前ではない。
         `@` と、その記号と、末尾の数字を落として「さん」を付ける。
         **`AVATARS` を引く鍵は生のままにする**（辞書の鍵が生ハンドル）。 */
      const DISP_KEEP = new Set(["user"]);
      function dispName(raw) {
        let s = String(raw || "").replace(/^@/, "");
        const cut = s.replace(/-[A-Za-z0-9]{2,6}$/, "");
        if (cut !== s && cut.length >= 2 && !DISP_KEEP.has(cut.toLowerCase())) s = cut;
        const d = s.replace(/(\D)\d{3,}$/, "$1");
        if (d.length >= 2) s = d;
        return /(さん|ちゃん|くん)$/.test(s) ? s : s + " さん";
      }

      /* 投げ銭の絵は島のキャラクター。**丸く切らない。** 絵が無い人は頭文字の枠 */
      function charHtml(row, size) {
        const src = row.icon ? CHARS[row.icon] : null;
        if (src) return `<span class="ch ${size || ""}"><img src="${src}" alt="" decoding="async" /></span>`;
        return `<span class="ch ch-none ${size || ""}">${e(initials(dispName(row.display)))}</span>`;
      }
      /* 写真（あやと島カード・付箋の絵）。焼き込めなかったものは出さない */
      const imgOf = (p) => (p && IMAGES[p]) || null;
      const photosOf = (list) => (list || []).filter((c) => c && imgOf(c.img)).slice(0, 3);
      /* ハートは字の絵文字にしない（端末で色の絵に化ける）。線の絵で描く */
      const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#d2335a" d="M12 21s-7.6-4.6-9.6-9.3C1 8.3 3 5 6.3 5c2.1 0 3.4 1.2 4.2 2.4h3C14.3 6.2 15.6 5 17.7 5 21 5 23 8.3 21.6 11.7 19.6 16.4 12 21 12 21z"/></svg>`;
      const heartHtml = (n) => (n != null && n !== "" ? `<span class="heart">${HEART}<span>${e(n)}</span></span>` : "");

      /* ---------- ピポ（アラートの絵そのまま） ---------- */
      function pipoOn(pose, opts) {
        const o = opts || {};
        const src = ART.pipo && ART.pipo[pose];
        if (!src) return "";
        const peek = pose === "peek" || pose === "peekWave";
        return `<img class="pipo-on${peek ? " peek" : ""}${o.left ? " left" : ""}" src="${src}" alt="" />`;
      }

      /* ---------- 城。灯りは下の階から（アラートの lightY / flagY と同じ式） ----------
         `steps` は [ステップ, 灯り0〜1, 旗0〜1] の並び。そのステップまで来たら、その値へ動く */
      function lightClip(lv) {
        const d = ART.def;
        const y = d.light.bottom + (d.light.top - d.light.bottom) * clamp01(lv);
        return `inset(${((y / d.size[1]) * 100).toFixed(2)}% 0 0 0)`;
      }
      function flagShift(lv, s) {
        const d = ART.def;
        return `translateY(${((d.pole.top - d.pole.bottom) * clamp01(lv) * s).toFixed(1)}px)`;
      }
      function castleHtml(w, opts) {
        const o = opts || {};
        const d = ART.def;
        if (!d || !ART.castleBase) return "";
        const s = w / d.size[0];
        const h = Math.round(d.size[1] * s);
        const lv = o.lv ?? 1;
        const fl = o.flag ?? lv;
        const flagH = d.flag.h * s;
        /* ピポは門の前（顔の幅をアラートと同じ割合にそろえる）。`from`/`until` のステップで入れ替える */
        const pipos = (o.pipos || []).map((p) => {
          const sp = d.pipo.poses[p.pose];
          if (!sp || !ART.pipo[p.pose]) return "";
          const k = (d.pipo.face * d.size[0]) / (sp.face[2] - sp.face[0]);
          const pw = sp.size[0] * k * s;
          const ph = sp.size[1] * k * s;
          const at = p.at === "left" ? d.pipo.ledges[0] : p.at === "right" ? d.pipo.ledges[1] : d.pipo.gate;
          const left = at.x * s - pw * sp.foot[0];
          const top = at.y * s - ph * sp.foot[1];
          const fromTo = `${p.from != null ? ` data-from="${p.from}"` : ""}${p.until != null ? ` data-until="${p.until}"` : ""}`;
          return `<img class="c-pipo" src="${ART.pipo[p.pose]}" alt=""${fromTo} style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px;width:${pw.toFixed(1)}px;height:${ph.toFixed(1)}px" />`;
        });
        // 旗は竿の右に出る（絵の幅の外）。そのぶん箱を広げて、隣の札にはみ出さない
        const flagW = flagH * (91 / 72);
        const extra = Math.max(0, Math.ceil(d.pole.x * s + flagW - w) + 6);
        return `
          <div class="castle deco" style="width:${w + extra}px;height:${h}px" data-s="${s}" data-lv0="${lv}" data-flag0="${fl}" data-levels='${JSON.stringify(o.steps || [])}'>
            <div class="c-glow" style="opacity:${clamp01(lv)}"></div>
            <img class="c-base" src="${ART.castleBase}" alt="" style="width:${w}px" />
            <img class="c-lit" src="${ART.castleFill}" alt="" style="width:${w}px;clip-path:${lightClip(lv)}" />
            <div class="c-flag" style="left:${(d.pole.x * s).toFixed(1)}px;top:${(d.pole.bottom * s).toFixed(1)}px;height:${flagH.toFixed(1)}px;transform:${flagShift(fl, s)}"><img src="${ART.flag}" alt="" /></div>
            ${pipos.join("")}
          </div>`;
      }

      /* ---------- 面の割りかた ----------
         **1画面の行は 12 まで**（MR-24）。超えたら面を割る。列を増やして詰めない */
      const PER_SCREEN = 12;
      function split(rows, per) {
        const n = Math.max(1, Math.ceil(rows.length / per));
        const size = Math.ceil(rows.length / n);
        return Array.from({ length: n }, (_, i) => rows.slice(i * size, (i + 1) * size));
      }
      /* 字の量から、札が何 px になるかの見積もり（面を割るときだけ使う。描く寸法は CSS） */
      function linesOf(text, fontPx, widthPx) {
        const per = Math.max(1, Math.floor(widthPx / fontPx));
        return String(text || "")
          .split("\n")
          .reduce((n, part) => n + Math.max(1, Math.ceil(Array.from(part).length / per)), 0);
      }
      /* 札を、1面の高さ `budget` に入るぶんずつ前から詰める。1面 `maxPer` 枚まで */
      function pack(items, cost, budget, maxPer) {
        const out = [];
        let cur = [];
        let used = 0;
        for (const it of items) {
          const c = cost(it);
          if (cur.length && (used + c > budget || cur.length >= maxPer)) {
            out.push(cur);
            cur = [];
            used = 0;
          }
          cur.push(it);
          used += c;
        }
        if (cur.length || !out.length) out.push(cur);
        return out;
      }
      /* 2列の札を、行ごとの高い方で数えて詰める */
      function pack2(items, cost, budget, maxPer, gap) {
        const out = [];
        let cur = [];
        const height = (list) => {
          let h = 0;
          for (let k = 0; k < list.length; k += 2) h += Math.max(cost(list[k]), list[k + 1] ? cost(list[k + 1]) : 0) + (k ? gap : 0);
          return h;
        };
        for (const it of items) {
          if (cur.length && (cur.length >= maxPer || height([...cur, it]) > budget)) {
            out.push(cur);
            cur = [];
          }
          cur.push(it);
        }
        if (cur.length || !out.length) out.push(cur);
        return out;
      }
      /* 頭（札＋リボン）と進行のドットを除いた、紙の中に置ける高さの目安（1080 四方で） */
      const PANEL_H = 800;
      const COL2 = 420; // 2列の札1枚の、字の入る幅

      function head(tag, title, big) {
        return `
          <header class="head">
            ${tag ? `<div class="tag">${e(tag)}</div>` : ""}
            <div class="ribbon${big ? " big" : ""}"><h2 class="title">${e(title)}</h2></div>
          </header>`;
      }

      /* ======================== コーナー ========================
         並びは MR-11。番号は**中身にあるコーナーから数える**（付箋が無い月は詰まる）。手で振らない */
      const D = REVIEW_DATA;
      const YEAR = 2026;
      const PERIOD_FROM = String(D.period).split("〜")[0].trim();
      const HAS_FUSEN = !!(D.fusen && ((D.fusen.categories || []).length || D.fusen.grandPrix));
      const CORNERS = [
        { key: "open", label: "オープニング" },
        { key: "recap", label: "今月の6分割ふりかえり", short: "6分割ふりかえり" },
        { key: "attend", label: "今月の出席日数", short: "出席日数" },
        { key: "kinkin", label: "皆勤賞" },
        { key: "new", label: "はじめまして" },
        { key: "quiz", label: "どの配信でしょうクイズ", short: "クイズ" },
        { key: "buzz", label: "流行語大賞" },
        { key: "meigen", label: "名言・いい話アワード", short: "名言" },
        { key: "funny", label: "おもしろコメント大賞", short: "おもしろ" },
        HAS_FUSEN ? { key: "fusen", label: "付箋大賞" } : null,
        { key: "guides", label: "調べもの大賞", short: "調べもの" },
        D.omake && D.omake.length ? { key: "omake", label: `${D.month}のおまけ`, short: "おまけ" } : null,
        { key: "tips", label: "投げ銭ありがとう", short: "投げ銭" },
        { key: "letter", label: "あやと島案内鳥 からの手紙", short: "手紙" },
        { key: "end", label: "エンディング" },
      ].filter(Boolean);
      const NO = Object.fromEntries(CORNERS.map((c, i) => [c.key, i]));
      const DOT_LABELS = CORNERS.map((c) => c.label);
      const tagOf = (key, i, len, extra) => `CORNER ${NO[key]}${len > 1 ? `　${i + 1} / ${len}` : ""}${extra ? `　${extra}` : ""}`;

      /* ======================== 大写し（MR-22） ========================
         一覧の面を作る。`items` を一覧に小さく並べ、1押しごとに1件ずつ `big` を真ん中に出す。
         `phases(it)` が 2 の札は、同じ1件で2押しぶん（2押し目で続きの字が出る）。
         ステップ: 0〜from-1 … 一覧（と、その面の前置き）/ from〜 … 1件ずつ大写し / 最後 … 全部が一覧に戻る */
      function spotScene(o) {
        const from = o.from ?? 1;
        // 大写しにする順（一覧の並びとは別に決められる）。既定は一覧の上から
        const order = o.order || o.items.map((_, j) => j);
        const phases = order.map((j) => (o.phases ? o.phases(o.items[j]) : 1));
        const starts = [];
        let s = from;
        for (const n of phases) {
          starts.push(s);
          s += n;
        }
        const total = s; // 最後の1押しで全部が一覧に戻る
        return {
          total,
          spotFrom: from,
          spotCount: o.items.length,
          confettiAt: o.confettiAt,
          confettiBig: o.confettiBig,
          spotAt(step) {
            for (let k = 0; k < starts.length; k++) if (step >= starts[k] && step < starts[k] + phases[k]) return { j: order[k], phase: step - starts[k] };
            return null;
          },
          isSeen(step, j) {
            const k = order.indexOf(j);
            return k >= 0 && step >= starts[k] + phases[k];
          },
          render() {
            const smalls = o.items.map((it, j) => `<div class="spot-item" data-spot="${j}">${o.small(it, j)}</div>`);
            const tpls = o.items.map((it, j) => `<template data-tpl="${j}">${o.big(it, j)}</template>`).join("");
            return o.wrap(smalls.join("")) + tpls + `<div class="spot-layer" aria-hidden="true"><div class="spot-dim"></div></div>`;
          },
        };
      }

      /* ======================== 各シーン描画 ======================== */

      /* ⓪ オープニング。城の窓に、ステップごとに下から灯りがともる */
      function renderOpening() {
        return `
          <div class="op">
            <div class="op-period" data-step="0">${e(YEAR)} ・ ${e(D.period)}</div>
            <div class="ribbon big" data-step="0"><h1 class="title">${e(D.opening.title)}</h1></div>
            <p class="op-sub" data-step="0">${e(D.opening.sub)}</p>
            <div class="stats" data-step="1">
              ${D.opening.stats
                .map(
                  (s) => `
                <div class="stat">
                  <div class="n">${e(s.n)}<small>${e(s.unit)}</small></div>
                  <div class="l">${e(s.label)}</div>
                </div>`
                )
                .join("")}
            </div>
            <div class="op-bottom">
              ${castleHtml(460, { lv: 0.2, flag: 0, steps: [[1, 0.6, 0.4], [2, 1, 1]], pipos: [{ pose: "wait" }] })}
              <div class="program" data-step="2">
                ${CORNERS.slice(1, -1).map((c) => `<span>${e(c.short || c.label)}</span>`).join("")}
              </div>
            </div>
          </div>`;
      }

      /* ① 6分割ふりかえり: 3列×2段の一覧 → 1コマずつ大写し。
         写真（あやと島カード）のあるコマは2押し: 1押し目は写真を大きく、2押し目で本文 */
      const RECAP_PAGES = split(D.recap, 6);
      function recapScene(i) {
        const rows = RECAP_PAGES[i];
        const base = RECAP_PAGES.slice(0, i).reduce((n, p) => n + p.length, 0);
        return spotScene({
          items: rows,
          phases: (r) => (photosOf(r.cards).length ? 2 : 1),
          small: (r, j) => {
            const ph = photosOf(r.cards);
            return `
              <div class="sc rc${ph.length ? "" : " nophoto"}">
                <div class="top"><span class="no">${base + j + 1}</span><span class="pill">${e(r.when)}</span></div>
                ${ph.length ? `<div class="thumb"><img src="${imgOf(ph[0].img)}" alt="" decoding="async" /></div>` : ""}
                <h3>${e(r.title)}</h3>
              </div>`;
          },
          big: (r, j) => {
            const ph = photosOf(r.cards);
            const caps = ph.map((c) => c.caption).filter(Boolean);
            return `
              <div class="big-card">
                <div class="b-top"><span class="b-no">${base + j + 1}</span><span class="pill">${e(r.when)}</span></div>
                <div class="b-title">${e(r.title)}</div>
                ${ph.length ? `<div class="b-photos n${ph.length}">${ph.map((c) => `<img src="${imgOf(c.img)}" alt="" decoding="async" />`).join("")}</div>` : ""}
                ${caps.length ? `<div class="b-cap b-p0">${e(caps.join("　／　"))}</div>` : ""}
                <div class="b-body${ph.length ? " b-p1" : ""}">${e(r.body)}</div>
              </div>`;
          },
          wrap: (items) => `
            ${head(tagOf("recap", i, RECAP_PAGES.length), "今月の6分割ふりかえり")}
            <div class="body"><div class="panel">
              ${pipoOn("walk0")}
              <div class="g3" data-step="0">${items}</div>
            </div></div>`,
        });
      }

      /* ② 出席日数。**皆勤賞より先**（MR-11）。皆勤から −1・−2・−3 日の人だけ。
         1列・1面 12 行まで。件数が少ないので大写しにしない */
      const ATTEND = D.kinkin.others;
      const ATTEND_PAGES = split(ATTEND, PER_SCREEN);
      function renderAttend(i) {
        const K = D.kinkin;
        const rows = ATTEND_PAGES[i];
        return `
          ${head(tagOf("attend", i, ATTEND_PAGES.length), "今月の出席日数")}
          <div class="body"><div class="panel">
            ${pipoOn("sit")}
            <p class="lead" data-step="0">あと少しで皆勤だった人</p>
            <div class="list" data-step="0">
              ${rows
                .map(
                  (p) => `
                <div class="row" data-row>
                  ${avatarHtml(p.name)}
                  <span class="nm fit">${e(dispName(p.name))}</span>
                  <span class="pill">あと${K.denom - p.d}日</span>
                  <span class="st">${p.d}<small>/${K.denom}日</small></span>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }

      /* ③ 皆勤賞: 城に灯りがともって、札が並ぶ → 1人ずつ大写し。「N ヶ月連続」を必ず出す。
         **1ヶ月目は「1ヶ月連続」と書かない**——別の言葉と別の色 */
      function streakHtml(n) {
        const v = Number(n || 0);
        if (v >= 2) return `<span class="pill gold">${v}ヶ月連続</span>`;
        if (v === 1) return `<span class="pill mint">はじめての皆勤賞</span>`;
        return "";
      }
      function kinkinScene() {
        const K = D.kinkin;
        const ws = K.winners;
        const cols = ws.length >= 3 ? "g3" : ws.length === 2 ? "g2" : "g1";
        return spotScene({
          items: ws,
          from: 2,
          confettiAt: 1,
          small: (p) => `
            <div class="kc">
              <span class="pill red">皆勤賞</span>
              ${avatarHtml(p.name, ws.length >= 3 ? "av-md" : "av-lg")}
              <div class="nm fit" data-min="30">${e(dispName(p.name))}</div>
              <div class="d">出席 ${K.denom}/${K.denom}日</div>
              ${streakHtml(p.streak)}
            </div>`,
          big: (p) => `
            <div class="big-card center">
              <div class="b-top"><span class="pill red">皆勤賞</span>${streakHtml(p.streak)}</div>
              <div class="b-who" style="flex-direction:column;gap:12px">${avatarHtml(p.name, "av-xl")}<span class="b-name fit" data-min="48">${e(dispName(p.name))}</span></div>
              <div class="b-body" style="text-align:center;margin-top:6px">出席 ${K.denom}/${K.denom}日</div>
              ${p.word ? `<div class="b-body sub" style="text-align:left">${e(p.word)}</div>` : ""}
            </div>`,
          wrap: (items) => `
            ${head(tagOf("kinkin", 0, 1), "皆勤賞")}
            <div class="body">
              <div class="kk-wrap">
                <p class="lead on-sky" data-step="0">${e(PERIOD_FROM)}からの${K.denom}日間、ぜんぶの日に来てくれた${ws.length}人</p>
                <div class="kk-cards ${cols}" data-step="1">${items}</div>
                ${ws.length <= 3 ? castleHtml(360, { lv: 0, flag: 0, steps: [[1, 1, 1]], pipos: [{ pose: "wait", until: 0 }, { pose: "cheer", from: 1 }] }) : ""}
              </div>
            </div>`,
        });
      }

      /* 引用の札（はじめまして・名言・おもしろ）。小さい札と、大写しの札 */
      function quoteSmall(o, x) {
        const opt = x || {};
        return `
          <div class="sc">
            <div class="who">
              ${opt.label ? `<span class="pill red">${e(opt.label)}</span>` : ""}
              ${avatarHtml(o.name, "av-sm")}
              <span class="nm">${e(dispName(o.name))}</span>
              ${o.date ? `<span class="pill">${e(o.date)}</span>` : ""}
            </div>
            <div class="msg">「${e(o.msg)}」</div>
          </div>`;
      }
      function quoteBig(o, x) {
        const opt = x || {};
        return `
          <div class="big-card">
            ${opt.label || opt.extra ? `<div class="b-top">${opt.label ? `<span class="pill red">${e(opt.label)}</span>` : ""}${opt.extra ? `<span class="pill gold">${e(opt.extra)}</span>` : ""}</div>` : ""}
            <div class="b-who">
              ${avatarHtml(o.name, "av-md")}
              <span class="b-name">${e(dispName(o.name))}</span>
              ${o.date ? `<span class="pill">${e(o.date)}</span>` : ""}
            </div>
            <div class="b-body">「${e(o.msg)}」</div>
            ${o.note ? `<div class="b-body sub">${e(o.note)}</div>` : ""}
          </div>`;
      }
      /* 2列の小さい札の高さの見積もり（字の入る幅 420px・28px）。名前の行は、札・顔・名前・日付が1行に入らなければ折り返す */
      const whoRows = (o, label) => {
        const w = (label ? Array.from(label).length * 24 + 38 : 0) + 54 + Array.from(dispName(o.name)).length * 28 + (o.date ? 100 : 0);
        return Math.max(1, Math.ceil(w / COL2));
      };
      const quoteSmallCost = (o, label) => 32 + whoRows(o, label) * 50 + 8 + linesOf(`「${o.msg}」`, 28, COL2) * 41;
      /* 件数の少ない面（大写しにしない）の1枚の札 */
      function quoteWide(o, step, x) {
        const opt = x || {};
        return `
          <div class="sc qbig" data-step="${step}">
            <div class="who">
              ${opt.label ? `<span class="pill red">${e(opt.label)}</span>` : ""}
              ${avatarHtml(o.name, "av-md")}
              <span class="nm">${e(dispName(o.name))}</span>
              ${o.date ? `<span class="pill">${e(o.date)}</span>` : ""}
              ${opt.extra ? `<span class="pill gold">${e(opt.extra)}</span>` : ""}
            </div>
            <div class="msg">「${e(o.msg)}」</div>
            ${o.note ? `<div class="note">${e(o.note)}</div>` : ""}
          </div>`;
      }

      /* 一覧の面を、3件以上なら大写しに、2件までなら大きな札を順に出す形にする（MR-22 は3件以上） */
      const SPOT_MIN = 3;
      /* 大きな札（quoteWide）の高さの見積もり（字の入る幅 880px）。2件までの面を割るときに使う */
      const wideCost = (o) => 56 + 132 + linesOf(`「${o.msg}」`, 42, 880) * 63 + (o.note ? 10 + linesOf(o.note, 32, 880) * 50 : 0) + 16;

      /* ④ はじめまして: 総数は出す。札にするのは厳選した人だけ */
      const NEW_FEAT = D.newcomers.featured || [];
      const NEW_PAGES = NEW_FEAT.length >= SPOT_MIN ? pack2(NEW_FEAT, (o) => quoteSmallCost(o), PANEL_H - 200, 6, 16) : pack(NEW_FEAT, wideCost, PANEL_H - 200, 2);
      function newcomersScene(i) {
        const N = D.newcomers;
        const rows = NEW_PAGES[i];
        const countHtml = (st) =>
          i === 0 ? `<div class="count" data-step="${st}"><span class="l">${e(D.month)}、はじめてコメントしてくれたのは</span><span class="n">${e(N.count)}</span><span class="l">人</span></div>` : "";
        const top = (inner) => `
          ${head(tagOf("new", i, NEW_PAGES.length), "はじめまして")}
          <div class="body"><div class="panel">
            ${pipoOn("peekWave")}
            ${inner}
          </div></div>`;
        if (NEW_FEAT.length < SPOT_MIN) {
          const at = i === 0 ? 1 : 0;
          return {
            total: rows.length - 1 + at,
            render: () => top(`${countHtml(0)}<div class="g1">${rows.map((o, j) => quoteWide(o, j + at, { extra: "初コメント" })).join("")}</div>`),
          };
        }
        return spotScene({
          items: rows,
          small: (o) => quoteSmall(o),
          big: (o) => quoteBig(o, { extra: "初コメント" }),
          wrap: (items) => top(`${countHtml(0)}<div class="g2" data-step="0">${items}</div>`),
        });
      }

      /* ⑤ どの配信でしょうクイズ: 1問1面。step0 問題（カードの写真があれば大きく）/ step1 選択肢 / step2 正解 */
      function renderQuiz(qi) {
        const q = D.quiz[qi];
        const abc = ["A", "B", "C", "D"];
        const photo = q.card && imgOf(q.card.img);
        return `
          ${head(tagOf("quiz", 0, 1, `Q${qi + 1} / ${D.quiz.length}`), "どの配信でしょうクイズ")}
          <div class="body"><div class="panel quiz" ${photo ? `data-at="1:after"` : ""}>
            ${pipoOn("peek")}
            <div class="quiz-q" data-step="0">
              <span class="qn">Q${qi + 1}</span>
              <div><div class="qt">${e(q.q)}</div><div class="hint2">チャットで答えてね</div></div>
            </div>
            ${photo ? `<div class="qphoto" data-step="0"><img src="${photo}" alt="" decoding="async" /></div>` : ""}
            <div class="choices" data-step="1" data-done-at="2"${photo ? " data-hold" : ""}>
              ${q.choices
                .map(
                  (c, i) => `
                <div class="choice${i === q.answer ? " right" : ""}">
                  <span class="abc">${abc[i]}</span><span class="tx">${e(c)}</span>
                  <span class="ok pill red">正解</span>
                </div>`
                )
                .join("")}
            </div>
            <div class="answer" data-step="2"${photo ? " data-hold" : ""}><b>正解は ${abc[q.answer]}</b>${q.date ? `　<span class="pill">${e(q.date)}</span>` : ""}　${e(q.note)}</div>
          </div></div>`;
      }

      /* ⑥ 流行語大賞: ノミネート（2列・6つまで）を1つずつ大写し → 発表。
         `first` は道具の「初出の日」。**期間より前から在る語は null** で、そのときは
         「◯◯から」を出さずに今月の件数だけ出す（件数は個人別ではないので出してよい。MR-18） */
      function buzzWhen(n) {
        const parts = [];
        if (n.first) parts.push(`<span class="pill">${e(n.first)} から</span>`);
        if (n.count != null) parts.push(`<span class="pill gold">今月 ${e(n.count)}件</span>`);
        return parts.join("");
      }
      const BUZZ_PAGES = split(D.buzzwords.nominees, 6);
      function buzzScene(i) {
        return spotScene({
          items: BUZZ_PAGES[i],
          small: (n) => `
            <div class="sc bw">
              <div class="word">${e(n.word)}</div>
              <div class="who">${buzzWhen(n)}</div>
            </div>`,
          big: (n) => `
            <div class="big-card">
              <div class="b-top" style="justify-content:center"><span class="pill red">ノミネート</span>${buzzWhen(n)}</div>
              <div class="b-word">${e(n.word)}</div>
              <div class="b-body sub">${e(n.note)}</div>
            </div>`,
          wrap: (items) => `
            ${head(tagOf("buzz", i, BUZZ_PAGES.length), "今月の流行語大賞")}
            <div class="body"><div class="panel">
              ${pipoOn("sit")}
              <p class="lead" data-step="0">ノミネート</p>
              <div class="g2" data-step="0">${items}</div>
            </div></div>`,
        });
      }
      function renderBuzzWinner() {
        const B = D.buzzwords;
        return `
          ${head(tagOf("buzz", 0, 1, "大賞"), "今月の流行語大賞")}
          <div class="body"><div class="panel">
            ${pipoOn("cheer")}
            <div class="drum" data-step="0" data-until="0">大賞は・・・・・・</div>
            <div class="win" data-step="1" data-hold>
              <span class="pill red prize">${YEAR}年${e(D.month)} 流行語大賞</span>
              <div class="big">${e(B.grandPrix.word)}</div>
              <div class="who" style="display:flex;margin:0 0 14px">${buzzWhen(B.grandPrix)}</div>
              <div class="note">${e(B.grandPrix.note)}</div>
            </div>
          </div></div>`;
      }

      /* ⑦ 名言・いい話 / ⑧ おもしろ部門賞: 2列の一覧（高さで面を割る）→ 1枚ずつ大写し */
      function quoteListScenes(key, title, list, pipo, labelOf) {
        if (list.length < SPOT_MIN) {
          const wide = pack(list, wideCost, PANEL_H, 2);
          return wide.map((rows, i) => ({
            total: rows.length - 1,
            render: () => `
              ${head(tagOf(key, i, wide.length), title)}
              <div class="body"><div class="panel">
                ${pipoOn(pipo)}
                <div class="g1">${rows.map((o, j) => quoteWide(o, j, { label: labelOf(o) })).join("")}</div>
              </div></div>`,
          }));
        }
        const pages = pack2(list, (o) => quoteSmallCost(o, labelOf(o)), PANEL_H - 20, 6, 16);
        return pages.map((rows, i) =>
          spotScene({
            items: rows,
            small: (o) => quoteSmall(o, { label: labelOf(o) }),
            big: (o) => quoteBig(o, { label: labelOf(o) }),
            wrap: (items) => `
              ${head(tagOf(key, i, pages.length), title)}
              <div class="body"><div class="panel">
                ${pipoOn(pipo)}
                <div class="g2" data-step="0">${items}</div>
              </div></div>`,
          })
        );
      }
      function renderFunnyGP() {
        const gp = D.funny.grandPrix;
        return `
          ${head(tagOf("funny", 0, 1, "グランプリ"), "おもしろコメント大賞")}
          <div class="body"><div class="panel">
            ${pipoOn("cheer")}
            <div class="drum" data-step="0" data-until="0">グランプリは・・・・・・</div>
            <div class="win" data-step="1" data-hold>
              <span class="pill red prize">${YEAR}年${e(D.month)} おもしろコメント大賞</span>
              <div class="msg">「${e(gp.winner.msg)}」</div>
              <div class="who">${avatarHtml(gp.winner.name, "av-lg")}<span class="fit" data-min="48">${e(dispName(gp.winner.name))}</span>${gp.winner.date ? `<span class="pill">${e(gp.winner.date)}</span>` : ""}</div>
              ${gp.note ? `<div class="note" style="margin-top:16px">${e(gp.note)}</div>` : ""}
            </div>
          </div></div>`;
      }

      /* ⑨ 付箋大賞（MR-19）: 部門賞を1枚ずつ大写し → 大賞（紙吹雪）。
         1件ごとに 付箋の本文（原文）・貼った人・ハート・そのあと。「そのあと」は2押し目 */
      const FUSEN = D.fusen || { categories: [] };
      const FUSEN_CATS = FUSEN.categories || [];
      function fusenBy(f) {
        return `${e(f.by || "名乗らずに貼ってくれた人")}`;
      }
      /* 一覧の付箋は「どの部門を・誰が」だけ。本文（長い）は大写しで読む。5部門を1面で見渡せるように */
      function fusenSmall(f) {
        const photo = imgOf(f.img);
        return `
          <div class="fs">
            ${photo ? `<img class="fthumb" src="${photo}" alt="" decoding="async" />` : ""}
            <span class="pill red flabel">${e(f.label)}</span>
            <div class="fby"><span>${fusenBy(f)}</span>${heartHtml(f.hearts)}</div>
            ${f.date ? `<div class="fby"><span class="pill">${e(f.date)}</span></div>` : ""}
          </div>`;
      }
      function fusenBig(f, gp) {
        const photo = imgOf(f.img);
        return `
          <div class="big-card fusen${gp ? " gp" : ""}">
            <div class="b-top">${gp ? `<span class="pill gold">${YEAR}年${e(D.month)} 付箋大賞</span>` : ""}<span class="pill red">${e(f.label)}</span>${f.date ? `<span class="pill">${e(f.date)}</span>` : ""}</div>
            <div class="b-body">${e(f.text)}</div>
            <div class="b-who" style="margin-top:12px"><span class="b-name">${fusenBy(f)}</span><span class="b-name heart">${HEART}<span>${e(f.hearts ?? 0)}</span></span></div>
            ${photo ? `<div class="b-photos n1 b-p0"><img src="${photo}" alt="" decoding="async" /></div>` : ""}
            ${f.after ? `<div class="b-after b-p1" style="margin-top:18px"><span class="pill gold">そのあと</span><div class="b-body sub" style="margin-top:6px">${e(f.after)}</div></div>` : ""}
          </div>`;
      }
      const fusenCost = (f) => 38 + 44 + 10 + Math.ceil(((f.by || "名乗らずに貼ってくれた人").length * 28 + 60) / (COL2 - 120)) * 40 + 46;
      const FUSEN_PAGES = FUSEN_CATS.length ? pack2(FUSEN_CATS, fusenCost, PANEL_H - 60, 6, 16) : [];
      function fusenScene(i) {
        return spotScene({
          items: FUSEN_PAGES[i],
          phases: (f) => (f.after ? 2 : 1),
          small: (f) => fusenSmall(f),
          big: (f) => fusenBig(f, false),
          wrap: (items) => `
            ${head(tagOf("fusen", i, FUSEN_PAGES.length, "部門賞"), "付箋大賞")}
            <div class="body"><div class="panel">
              ${pipoOn("flag")}
              ${i === 0 && FUSEN.lead ? `<p class="lead" data-step="0">${e(FUSEN.lead)}</p>` : ""}
              <div class="g2" data-step="0">${items}</div>
            </div></div>`,
        });
      }
      function renderFusenGP() {
        const gp = FUSEN.grandPrix;
        /* 大賞は大写しと同じ枠（頭の上まで使う）に1枚だけ。そのあとは2押し目 */
        return `
          ${head(tagOf("fusen", 0, 1, "大賞"), "付箋大賞")}
          <div class="body">
            <div class="drum on-sky" data-step="0" data-until="0">大賞は・・・・・・</div>
          </div>
          <div class="spot-layer on gp-layer" data-step="1" data-hold data-at="2:p1-host"><div class="spot-dim"></div>${fusenBig(gp, true)}</div>`;
      }

      /* ⑩ 調べもの大賞: **1面に収める**（MR-20）。2列の一覧 → 1枚ずつ大写し */
      function guidesScene() {
        const G = D.guides;
        return spotScene({
          items: G.rows,
          small: (r) => `
            <div class="sc">
              ${r.hero ? `<span class="pill gold badge">大賞</span>` : ""}
              <div class="who">${avatarHtml(r.name, "av-sm")}<span class="nm">${e(dispName(r.name))}</span>${r.date ? `<span class="pill">${e(r.date)}</span>` : ""}</div>
              <div class="msg">「${e(r.msg)}」</div>
            </div>`,
          big: (r) => `
            <div class="big-card">
              ${r.hero ? `<div class="b-top"><span class="pill gold">調べもの大賞</span></div>` : ""}
              <div class="b-who">${avatarHtml(r.name, "av-md")}<span class="b-name">${e(dispName(r.name))}</span>${r.date ? `<span class="pill">${e(r.date)}</span>` : ""}</div>
              <div class="b-body">「${e(r.msg)}」</div>
              ${r.what ? `<div class="b-body sub">${e(r.what)}</div>` : ""}
            </div>`,
          wrap: (items) => `
            ${head(tagOf("guides", 0, 1), "調べもの大賞")}
            <div class="body"><div class="panel">
              ${pipoOn("catch")}
              ${G.lead ? `<p class="lead" data-step="0">${e(G.lead)}</p>` : ""}
              <div class="g2" data-step="0">${items}</div>
            </div></div>`,
        });
      }

      /* ⑪ その月のおまけ。`emoji` 欄は画面に出さない（MR-8）。印はピポの絵 */
      const OMAKE_STAMPS = ["flag", "catch", "yawn"];
      const stampOf = (i) => (ART.pipo && ART.pipo[OMAKE_STAMPS[i % 3]]) || "";
      function omakeScene() {
        const list = D.omake;
        const title = `${D.month}のおまけ`;
        if (list.length < 2) {
          return {
            total: list.length,
            render: () => `
              ${head(tagOf("omake", 0, 1), title)}
              <div class="body"><div class="panel">
                <div class="g1">
                  ${list
                    .map(
                      (o, i) => `
                    <div class="sc oc" data-step="${i + 1}" style="flex-direction:row;align-items:flex-start;text-align:left;gap:18px">
                      ${stampOf(i) ? `<img class="stamp" src="${stampOf(i)}" alt="" style="height:110px" />` : ""}
                      <div><h3>${e(o.title)}</h3><p style="margin-top:8px">${e(o.body)}</p></div>
                    </div>`
                    )
                    .join("")}
                </div>
              </div></div>`,
          };
        }
        return spotScene({
          items: list,
          small: (o, i) => `
            <div class="sc oc">
              ${stampOf(i) ? `<img class="stamp" src="${stampOf(i)}" alt="" />` : ""}
              <h3>${e(o.title)}</h3>
            </div>`,
          big: (o, i) => `
            <div class="big-card">
              ${stampOf(i) ? `<img class="b-stamp" src="${stampOf(i)}" alt="" />` : ""}
              <div class="b-title" style="text-align:center">${e(o.title)}</div>
              <div class="b-body sub">${e(o.body)}</div>
            </div>`,
          wrap: (items) => `
            ${head(tagOf("omake", 0, 1), title)}
            <div class="body"><div class="panel">
              <div class="${list.length === 3 ? "g3" : list.length === 1 ? "g1" : "g2"}" data-step="0">${items}</div>
            </div></div>`,
        });
      }

      /* ⑫ 投げ銭: 4位以下の一覧（1列・1面 12 行まで。1人ずつ大写し）→ 3位・2位 → ドラムロール → 1位＋紙吹雪 → 合計。
         城の灯りは、順位が上がるほど上の階までともる（アラートと同じ見せかた） */
      const TIPS_ROWS = D.tips.rows.slice().sort((a, b) => a.rank - b.rank || b.yen - a.yen);
      const TIPS_LOW = TIPS_ROWS.filter((p) => p.rank >= 4);
      const TIPS_PAGES = TIPS_LOW.length ? split(TIPS_LOW, PER_SCREEN) : [];
      const tipsAt = (r) => TIPS_ROWS.filter((p) => p.rank === r);
      function tipsListScene(i) {
        const rows = TIPS_PAGES[i];
        return spotScene({
          items: rows,
          // 一覧は 4位から並べ、大写しは下の順位から上がっていく（あやと 2026-11-27「昇順にフォーカス」）。3位→2位→1位へつながる
          order: rows.map((_, j) => rows.length - 1 - j),
          small: (p) => `
            <div class="row" data-row>
              <span class="rk">${p.rank}位</span>
              ${charHtml(p)}
              <span class="nm fit">${e(dispName(p.display))}</span>
              <span class="yen">${yen(p.yen)}円</span>
            </div>`,
          big: (p) => `
            <div class="big-card b-tip">
              <span class="pill gold">第${p.rank}位</span>
              ${charHtml(p, "ch-big")}
              <span class="b-name fit" data-min="48">${e(dispName(p.display))}</span>
              <span class="b-yen">${yen(p.yen)}円</span>
            </div>`,
          wrap: (items) => `
            ${head(tagOf("tips", i, TIPS_PAGES.length), "投げ銭ありがとう")}
            <div class="body"><div class="panel">
              ${pipoOn("catch")}
              <p class="lead" data-step="0">応援してくれたみなさん（第${rows[0].rank}位〜）</p>
              <div class="list" data-step="0">${items}</div>
            </div></div>`,
        });
      }
      function tierCard(p, rank, step, cls) {
        return `
          <div class="tier ${cls || ""}" ${step != null ? `data-step="${step}"` : ""}>
            <span class="medal m${rank}">${rank}</span>
            ${charHtml(p, rank === 1 ? "ch-xl" : "ch-lg")}
            <div class="who"><div class="rkn">第${rank}位</div><div class="nm fit" data-min="44">${e(dispName(p.display))}</div><div class="yen">${yen(p.yen)}円</div></div>
          </div>`;
      }
      function renderTipsTop23() {
        const r3 = tipsAt(3);
        const r2 = tipsAt(2);
        return `
          ${head(tagOf("tips", 0, 1, "第3位・第2位"), "投げ銭ありがとう")}
          <div class="body">
            <div class="tp">
              ${r3.map((p) => tierCard(p, 3, 1)).join("")}
              ${r2.map((p) => tierCard(p, 2, 2)).join("")}
              ${castleHtml(360, { lv: 0.3, flag: 0.2, steps: [[1, 0.55, 0.45], [2, 0.8, 0.7]], pipos: [{ pose: "catch" }] })}
            </div>
          </div>`;
      }
      function renderTipsTop1() {
        const r1 = tipsAt(1);
        return `
          ${head(tagOf("tips", 0, 1, "第1位"), "投げ銭ありがとう")}
          <div class="body">
            <div class="tp">
              <div class="drum on-sky" data-step="0" data-until="0">第1位は・・・・・・</div>
              ${r1.map((p) => tierCard(p, 1, 1, "t1").replace('class="tier t1"', 'class="tier t1" data-hold')).join("")}
              <div class="total" data-step="2" data-hold>
                ${ART.coin ? `<img src="${ART.coin}" alt="" />` : ""}
                <span>合計 ${yen(D.tips.total)}円</span><span class="th">ありがとうございました</span>
              </div>
              ${castleHtml(r1.length > 1 ? 300 : 380, { lv: 0.8, flag: 0.7, steps: [[1, 1, 1]], pipos: [{ pose: "wait", until: 0 }, { pose: "cheer", from: 1 }] })}
            </div>
          </div>`;
      }

      /* ⑬ 手紙: 段落の字数で面を割る（1面 10 行ぶんまで。1行 21 字の見積もり。読み上げるので字は大きく） */
      const LETTER_LINES = 10;
      const LETTER_W = 900;
      const LETTER_PAGES = pack(D.letter.paragraphs, (p) => linesOf(p, 42, LETTER_W), LETTER_LINES, 3);
      function renderLetter(i) {
        const rows = LETTER_PAGES[i];
        const last = i === LETTER_PAGES.length - 1;
        const dense = rows.reduce((n, p) => n + linesOf(p, 42, LETTER_W), 0) > LETTER_LINES;
        return `
          ${head(tagOf("letter", i, LETTER_PAGES.length), "あやと島案内鳥 からの手紙")}
          <div class="body"><div class="panel letter${dense ? " dense" : ""}">
            ${pipoOn("sit")}
            ${rows.map((x, j) => `<p data-step="${j + 1}">${e(x)}</p>`).join("")}
            ${last ? `<div class="sig" data-step="${rows.length + 1}">${e(D.letter.sign)}</div>` : ""}
          </div></div>`;
      }

      /* ⑭ エンディング。**投げ銭してくれた人が主役**（MR-11）。皆勤の人を象徴にしない。
         並べる顔は投げ銭の順（島のキャラクターの絵）。城はぜんぶ灯って、ピポは門の前で眠る */
      const END_FACES = 6;
      function renderEnding() {
        const top = TIPS_ROWS.slice(0, END_FACES);
        const talkers = (D.opening.stats || []).find((s) => /しゃべ|コメントしてくれた|話してくれた/.test(s.label || ""));
        return `
          <div class="end">
            <div class="ribbon big" data-step="0"><h1 class="title">${e(D.ending.title)}</h1></div>
            <p class="sub" data-step="0">${e(D.ending.sub)}</p>
            <div class="panel" data-step="1">
              ${top.length ? `<div class="faces">${top.map((p) => charHtml(p, "ch-end")).join("")}</div>` : ""}
              <div class="thanks">${TIPS_ROWS.length ? `投げ銭で島を支えてくれた${TIPS_ROWS.length}人と、` : ""}${talkers ? `しゃべってくれた${e(talkers.n)}人に。` : "コメントしてくれたみなさんに。"}ありがとうございました。</div>
              ${D.ending.tapGoal ? `<div class="tap"><span class="l">タップタップ 今月の目標</span><span class="n">${yen(D.ending.tapGoal)}</span></div>` : ""}
              ${D.ending.ps ? `<div class="ps">${e(D.ending.ps)}</div>` : ""}
            </div>
            <div class="foot-castle">${castleHtml(360, { lv: 0.6, flag: 0.6, steps: [[1, 1, 1]], pipos: [{ pose: "sleep" }] })}</div>
          </div>`;
      }

      /* ======================== シーン定義 ========================
         何面に割るかは**行数と字数から数える**。手で「2面」と書くと、人数が変わって黙って溢れる */
      const SCENES = [];
      const CORNER_OF = []; // シーンごとの「どのコーナーか」（ドットの番号）。手で数えない
      const push = (key, scene) => {
        SCENES.push(scene);
        CORNER_OF.push(NO[key]);
      };

      push("open", { total: 2, render: renderOpening });
      RECAP_PAGES.forEach((_, i) => push("recap", recapScene(i)));
      ATTEND_PAGES.forEach((rows, i) => rows.length && push("attend", { total: 0, render: () => renderAttend(i) }));
      push("kinkin", kinkinScene());
      NEW_PAGES.forEach((_, i) => push("new", newcomersScene(i)));
      D.quiz.forEach((_, i) => push("quiz", { total: 2, render: () => renderQuiz(i) }));
      BUZZ_PAGES.forEach((_, i) => push("buzz", buzzScene(i)));
      push("buzz", { total: 1, render: renderBuzzWinner, confettiAt: 1 });
      quoteListScenes("meigen", "名言・いい話アワード", D.meigen, "wait", () => null).forEach((s) => push("meigen", s));
      quoteListScenes("funny", "おもしろコメント大賞　部門賞", D.funny.categories, "jump", (o) => o.label).forEach((s) => push("funny", s));
      push("funny", { total: 1, render: renderFunnyGP, confettiAt: 1, confettiBig: true });
      if (HAS_FUSEN) {
        FUSEN_PAGES.forEach((_, i) => push("fusen", fusenScene(i)));
        if (FUSEN.grandPrix) push("fusen", { total: FUSEN.grandPrix.after ? 2 : 1, render: renderFusenGP, confettiAt: 1, confettiBig: true });
      }
      push("guides", guidesScene());
      if (NO.omake != null) push("omake", omakeScene());
      // 面が2枚以上になっても、下の順位の面から出す（昇順。3位→2位→1位へつながる）
      TIPS_PAGES.map((_, i) => i).reverse().forEach((i) => push("tips", tipsListScene(i)));
      if (tipsAt(3).length + tipsAt(2).length) push("tips", { total: 2, render: renderTipsTop23 });
      push("tips", { total: 2, render: renderTipsTop1, confettiAt: 1, confettiBig: true });
      LETTER_PAGES.forEach((rows, i) => push("letter", { total: rows.length + (i === LETTER_PAGES.length - 1 ? 1 : 0), render: () => renderLetter(i) }));
      push("end", { total: 1, render: renderEnding, confettiAt: 1, confettiBig: true });

      const DOT_OF_SCENE = CORNER_OF;
      const DOT_COUNT = DOT_LABELS.length;
      if (Math.max(...CORNER_OF) !== DOT_LABELS.length - 1) {
        // ドットの札とコーナー番号がずれると、進行ドットが別の名前を指す。黙って外れる
        console.error("DOT_LABELS とコーナー番号が合わない", Math.max(...CORNER_OF), DOT_LABELS.length);
      }

      /* ======================== ステート機械 ======================== */
      const world = document.getElementById("world");
      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const hint = document.getElementById("hint");
      let sceneIdx = 0;
      let stepIdx = 0;
      let interacted = false;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* 1080x1080 でない窓では、真ん中に置いて収まるまで縮める（外は body の夜空）。OBS の 1080 幅では 1 倍 */
      function fitWorld() {
        const k = Math.min(window.innerWidth / W, window.innerHeight / W);
        world.style.setProperty("--k", String(k));
      }
      window.addEventListener("resize", fitWorld);
      fitWorld();
      if (ART.ribbon) document.documentElement.style.setProperty("--ribbon-img", `url("${ART.ribbon}")`);

      /* 雪と灯りの紐。数は少なく、動かすのは雪の粒の transform だけ */
      (function buildSky() {
        const snow = document.getElementById("snow");
        let h = "";
        for (let i = 0; i < 18; i++) {
          const x = (i * 73.7) % 100;
          const size = 6 + ((i * 7) % 6);
          const dur = 16 + ((i * 5) % 11);
          const delay = -((i * 3.7) % dur);
          h += `<i style="left:${x.toFixed(1)}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay.toFixed(1)}s"></i>`;
        }
        snow.innerHTML = h;
        const g = document.getElementById("garland");
        const colors = ["#ffd54a", "#ff9a6b", "#fff4dc", "#ffcf4d", "#ff7f8f"];
        let svg = "";
        let bulbs = "";
        [[0, 540], [540, 1080]].forEach(([a, b]) => {
          const mid = (a + b) / 2;
          svg += `<path d="M${a} 4 Q ${mid} 54 ${b} 4" fill="none" stroke="rgba(42,18,6,.55)" stroke-width="2" />`;
          for (let x = a + 34; x < b - 16; x += 56) {
            const t = (x - a) / (b - a);
            const y = 4 + 2 * t * (1 - t) * 50;
            const c = colors[Math.round(x / 56) % colors.length];
            bulbs += `<circle class="bulb" cx="${x}" cy="${(y + 8).toFixed(1)}" r="7" fill="${c}" />`;
          }
        });
        g.innerHTML = svg + `<g>${bulbs}</g>`;
      })();

      function buildDots() {
        progress.innerHTML = Array.from({ length: DOT_COUNT }, () => '<span class="dot"></span>').join("");
      }
      function updateDots() {
        const cur = DOT_OF_SCENE[sceneIdx];
        [...progress.children].forEach((d, i) => d.classList.toggle("act", i === cur));
      }

      /* 名前が札に入らないときは、字を少しだけ縮める（「…」で切らない。#308）。下限は data-min（既定 24px） */
      function fitTexts(root) {
        (root || stage).querySelectorAll(".fit").forEach((el) => {
          el.style.fontSize = "";
          const min = Number(el.dataset.min) || 24;
          let fs = parseFloat(getComputedStyle(el).fontSize);
          let guard = 0;
          el.style.whiteSpace = "";
          while (el.scrollWidth - el.clientWidth > 1 && fs > min && guard++ < 60) {
            fs -= 1;
            el.style.fontSize = fs + "px";
          }
          // 下限まで縮めても入らない名前は、切らずに折り返す
          if (el.scrollWidth - el.clientWidth > 1) el.style.whiteSpace = "normal";
        });
      }

      /* 発表の札（.win）が面に入らないときは、字を少しずつ縮める（下限 0.8 倍） */
      function shrinkToFit() {
        stage.querySelectorAll(".win").forEach((win) => {
          const body = win.closest(".body");
          const panel = win.closest(".panel");
          if (!body || !panel) return;
          let sh = 1;
          win.style.setProperty("--sh", "1");
          let guard = 0;
          while (panel.getBoundingClientRect().height > body.getBoundingClientRect().height + 1 && sh > 0.8 && guard++ < 12) {
            sh = Math.max(0.8, sh - 0.04);
            win.style.setProperty("--sh", sh.toFixed(2));
          }
        });
      }

      /* ---------- 大写し ---------- */
      const canAnimate = (el) => !reduceMotion && ROLE !== "ctrl" && typeof el.animate === "function";
      /* 札が枠に入らないときは、本文と名前を少しずつ縮める。下限は本文 40px・名前 48px（MR-23） */
      const BS_MIN = 40 / 46;
      function fitBig(card) {
        let bs = 1;
        card.style.setProperty("--bs", "1");
        fitTexts(card);
        let guard = 0;
        while (card.scrollHeight - card.clientHeight > 1 && bs > BS_MIN && guard++ < 30) {
          bs = Math.max(BS_MIN, bs - 0.02);
          card.style.setProperty("--bs", bs.toFixed(3));
        }
        fitTexts(card);
      }
      function setPhase(card, phase) {
        card.classList.toggle("p1", phase >= 1);
        fitBig(card);
      }
      /* 舞台の中の座標（#world の 1080 四方。縮めて見ている窓でも同じ数になる） */
      function worldRect(el) {
        const w = world.getBoundingClientRect();
        const k = w.width / W || 1;
        const r = el.getBoundingClientRect();
        return { x: (r.left - w.left) / k, y: (r.top - w.top) / k, w: r.width / k, h: r.height / k };
      }
      function flipTo(card, item) {
        const a = worldRect(item);
        const b = worldRect(card);
        const s = Math.max(0.04, Math.min(a.w / b.w, a.h / b.h));
        return `translate(${(a.x + a.w / 2 - (b.x + b.w / 2)).toFixed(1)}px, ${(a.y + a.h / 2 - (b.y + b.h / 2)).toFixed(1)}px) scale(${s.toFixed(3)})`;
      }
      const itemOf = (j) => stage.querySelector(`.spot-item[data-spot="${j}"]`);
      function spotEnter(layer, cur, animate) {
        const tpl = stage.querySelector(`template[data-tpl="${cur.j}"]`);
        if (!tpl) return;
        const card = tpl.content.firstElementChild.cloneNode(true);
        card.dataset.j = String(cur.j);
        layer.appendChild(card);
        setPhase(card, cur.phase);
        const item = itemOf(cur.j);
        if (item) item.classList.add("lifted");
        if (animate && item && canAnimate(card)) {
          card.animate(
            [
              { transform: flipTo(card, item), opacity: 0.35 },
              { opacity: 1, offset: 0.3 },
              { transform: "none", opacity: 1 },
            ],
            { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" }
          );
        }
      }
      function spotLeave(card, animate) {
        card.classList.add("leaving");
        card.getAnimations().forEach((a) => a.cancel());
        const item = itemOf(card.dataset.j);
        // 元の場所はすぐ空ける（縮んで戻ってきた札と重なって消える）
        if (item) item.classList.remove("lifted");
        if (animate && item && canAnimate(card)) {
          const a = card.animate(
            [
              { transform: "none", opacity: 1 },
              { opacity: 1, offset: 0.6 },
              { transform: flipTo(card, item), opacity: 0 },
            ],
            { duration: 440, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }
          );
          const done = () => card.remove();
          a.onfinish = done;
          a.oncancel = done;
        } else card.remove();
      }
      function applySpot(animate) {
        const s = SCENES[sceneIdx];
        const layer = stage.querySelector(".spot-layer");
        if (!layer || !s.spotAt) return;
        const cur = s.spotAt(stepIdx);
        layer.classList.toggle("on", !!cur);
        // 大写しが済んだ札には、縁に金の印（どこまで読んだかが一覧で分かる）
        stage.querySelectorAll(".spot-item").forEach((el) => el.classList.toggle("seen", s.isSeen(stepIdx, Number(el.dataset.spot)) && !(cur && Number(el.dataset.spot) === cur.j)));
        const live = layer.querySelector(".big-card:not(.leaving)");
        if (live && cur && Number(live.dataset.j) === cur.j) {
          setPhase(live, cur.phase);
          return;
        }
        if (live) spotLeave(live, animate);
        if (cur) spotEnter(layer, cur, animate);
      }

      function applySteps(animate) {
        stage.querySelectorAll("[data-step]").forEach((el) => {
          el.classList.toggle("on", Number(el.dataset.step) <= stepIdx);
        });
        stage.querySelectorAll("[data-from],[data-until]").forEach((el) => {
          const from = el.dataset.from != null ? Number(el.dataset.from) : -Infinity;
          const until = el.dataset.until != null ? Number(el.dataset.until) : Infinity;
          el.classList.toggle("hide", !(stepIdx >= from && stepIdx <= until));
        });
        stage.querySelectorAll("[data-done-at]").forEach((el) => {
          el.classList.toggle("done", Number(el.dataset.doneAt) <= stepIdx);
        });
        /* `data-at="1:after"` … そのステップから、その class を付ける */
        stage.querySelectorAll("[data-at]").forEach((el) => {
          for (const part of el.dataset.at.split(/\s+/)) {
            const [st, cls] = part.split(":");
            el.classList.toggle(cls, Number(st) <= stepIdx);
          }
        });
        /* 付箋の大賞は札1枚の2段（大写しの札と同じ形）。2段目で「そのあと」 */
        stage.querySelectorAll(".p1-host, [data-at*='p1-host']").forEach((host) => {
          const card = host.querySelector(".big-card");
          if (card) setPhase(card, host.classList.contains("p1-host") ? 1 : 0);
        });
        stage.querySelectorAll(".castle").forEach((c) => {
          let lv = Number(c.dataset.lv0);
          let fl = Number(c.dataset.flag0);
          for (const [st, l, f] of JSON.parse(c.dataset.levels || "[]")) {
            if (st <= stepIdx) {
              lv = l;
              fl = f;
            }
          }
          c.querySelector(".c-lit").style.clipPath = lightClip(lv);
          c.querySelector(".c-flag").style.transform = flagShift(fl, Number(c.dataset.s));
          c.querySelector(".c-glow").style.opacity = String(clamp01(lv));
        });
        fitTexts();
        shrinkToFit();
        applySpot(animate !== false);
        const s = SCENES[sceneIdx];
        if (s.confettiAt != null && stepIdx === s.confettiAt && animate !== false) {
          spawnConfetti(s.confettiBig ? 160 : 90);
        }
      }

      function renderScene() {
        stage.innerHTML = SCENES[sceneIdx].render();
        updateDots();
        fitTexts();
        // 入った面のステップを、動かさずに出す（大写しも、その場に出す）
        requestAnimationFrame(() => requestAnimationFrame(() => applySteps(false)));
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitTexts());

      function gotoScene(i, step) {
        sceneIdx = Math.max(0, Math.min(SCENES.length - 1, i));
        stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, step ?? 0));
        stage.classList.add("fading");
        setTimeout(() => {
          renderScene();
          stage.classList.remove("fading");
        }, reduceMotion ? 0 : 280);
        onStateChanged();
      }

      function advance() {
        dismissHint();
        if (stepIdx < SCENES[sceneIdx].total) {
          stepIdx++;
          applySteps();
          onStateChanged();
        } else if (sceneIdx < SCENES.length - 1) {
          gotoScene(sceneIdx + 1, 0);
        }
      }
      function back() {
        dismissHint();
        if (stepIdx > 0) {
          stepIdx--;
          applySteps();
          onStateChanged();
        } else if (sceneIdx > 0) {
          const prev = sceneIdx - 1;
          gotoScene(prev, SCENES[prev].total);
        }
      }
      function dismissHint() {
        if (!interacted) {
          interacted = true;
          setTimeout(() => hint.classList.add("gone"), 4000);
        }
      }

      /* ======================== 紙吹雪（城の色） ======================== */
      const COLORS = ["#ffd54a", "#fff4dc", "#8a2433", "#1565c0", "#ffcf4d", "#ff9a6b", "#c4f2d9"];
      function spawnConfetti(count) {
        if (reduceMotion || ROLE === "ctrl") return;
        const layer = document.getElementById("confetti-layer");
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * W + "px";
          c.style.background = COLORS[(Math.random() * COLORS.length) | 0];
          c.style.width = 10 + Math.random() * 10 + "px";
          c.style.height = 16 + Math.random() * 12 + "px";
          c.style.animationDuration = 3.6 + Math.random() * 2.6 + "s";
          c.style.animationDelay = Math.random() * 0.9 + "s";
          layer.appendChild(c);
          setTimeout(() => c.remove(), 7500);
        }
      }

      /* ======================== 入力 ======================== */
      // 注意: ctrl モードではグローバル入力を登録しない。
      // (登録するとボタンの click と pointerdown が二重発火し、1タップで2つ以上進むバグになる)
      const IS_CTRL = new URLSearchParams(location.search).get("role") === "ctrl";
      if (!IS_CTRL) {
        window.addEventListener("pointerdown", (ev) => {
          if (ev.button === 2) return;
          advance();
        });
        window.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          back();
        });
      }
      window.addEventListener("keydown", (ev) => {
        const k = ev.key;
        if (k === "Enter" || k === " " || k === "ArrowRight" || k === "ArrowDown") {
          ev.preventDefault();
          advance();
        } else if (k === "Backspace" || k === "ArrowLeft" || k === "ArrowUp") {
          ev.preventDefault();
          back();
        } else if (/^[0-9]$/.test(k)) {
          // 数字キー: コーナー頭出し(リハーサル用)
          const dot = Number(k);
          const target = DOT_OF_SCENE.indexOf(dot);
          if (target >= 0) gotoScene(target, 0);
        }
      });

      // 検証・リハーサル用フック（tools/monthly_review/check.mjs が使う）
      window.__jump = (i, step) => gotoScene(i, step ?? 0);
      window.__sceneCount = SCENES.length;
      window.__state = () => ({ scene: sceneIdx, step: stepIdx, total: SCENES[sceneIdx].total, corner: CORNER_OF[sceneIdx] });
      window.__totals = SCENES.map((s) => s.total);
      window.__cornerOf = CORNER_OF.slice();
      window.__cornerKeys = CORNER_OF.map((n) => CORNERS[n].key);
      window.__spotInfo = SCENES.map((s) => (s.spotAt ? { from: s.spotFrom, count: s.spotCount, steps: Array.from({ length: s.total + 1 }, (_, t) => s.spotAt(t)) } : null));

      /* =========================================================
         リモート同期(Firestore)
         - 無指定: 従来どおりローカル操作のみ(SDKは読み込まない)
         - ?role=view : Firestoreの状態に追従(スマホOBSオーバーレイ用)
         - ?role=ctrl : スマホ用コントローラ(進行操作を配信画面へ送る)
         - ?auto=秒数 : 自動進行(同期なしのフォールバック)

         ▼▼ 書けるのはあやとだけ ▼▼
         `firestore.rules` の monthlyReview は
           読む   … 誰でも(OBS はログインできないので、ここは開けてある)
           書く   … `islandUsers/{uid}.admin` が立っている人だけ
         になっている。だから **ctrl はログインしてからでないと進行を送れない。**

         同じ端末で島(`/`)にログインしてあれば、ここは何も押さずに繋がる
         (下の SDK の版と apiKey を島に合わせてあるのはそのため)。
         繋がらないときだけ、コントローラーに「Google でログイン」が出る。
         ========================================================= */
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDts2gpO2fepPYOdiMyiz5ydTIQHNtY5kM",
        authDomain: "live-streaming-d3cac.firebaseapp.com",
        projectId: "live-streaming-d3cac",
        storageBucket: "live-streaming-d3cac.firebasestorage.app",
        messagingSenderId: "291182823114",
        appId: "1:291182823114:web:84e7d7c52c8d3ca7d39633",
      };
      const SYNC_COLLECTION = "monthlyReview";
      const SYNC_DOC = "202611-14e963"; // 月ごとに新しく発行する。簡易ガード用トークン入り

      const params = new URLSearchParams(location.search);
      const ROLE = params.get("role"); // "ctrl" | "view" | null
      const AUTO_SEC = Math.max(0, Number(params.get("auto")) || 0);

      /* Firebase の SDK。**版を島(`site/package.json` の firebase ^12)に揃えてある。**
         ログインは localStorage に `firebase:authUser:<apiKey>:[DEFAULT]` の形で
         残るので、同じ apiKey・同じ既定アプリ名・同じ大版なら、島でログイン済みの
         端末はここでも押さずにログイン済みになる。配信の当日に押させない。 */
      const SDK = "https://www.gstatic.com/firebasejs/12.18.0";

      let publishFn = null; // ctrl時のみセット。**ログインするまで null**
      let signInFn = null; // ctrl時のみセット。「Google でログイン」の中身

      /* コントローラーの札。**「いま押せば OBS が動く」ときだけ緑にする。**
         Firestore に繋がっただけでも、ログインしただけでも足りない。
         別々の場所から `setCtrlStatus` を呼んでいると、あとから来たほうが
         上書きして「同期中と出ているのに押しても動かない」が起きる
         （実際に起きた。配信の最中にこれをやられると原因が分からない）。 */
      let linkOk = false; // Firestore からスナップショットが来ている
      let authOk = false; // ログインしている
      let sendErr = ""; // 直前の送信が落ちた理由。空なら落ちていない
      function refreshCtrlStatus() {
        if (ROLE !== "ctrl") return;
        if (!linkOk) setCtrlStatus(false, "つながっていません");
        else if (!authOk) setCtrlStatus(false, "ログインが要ります");
        else if (sendErr) setCtrlStatus(false, sendErr);
        else setCtrlStatus(true, "同期中");
      }
      let applyingRemote = false;
      let lastConfetti = 0;
      let lastSeenTs = 0; // これより古いスナップショットは無視(連打時の巻き戻り防止)
      let seenFirstSnap = false; // 1枚目のスナップショットを受けたか(紙吹雪の空撃ち防止)

      function onStateChanged() {
        updateCtrlLabels();
        if (publishFn && !applyingRemote) {
          const ts = Date.now();
          lastSeenTs = Math.max(lastSeenTs, ts);
          /* **落ちた理由を出す。** 「送信失敗」だけだと、配信の最中に
             ログインの問題なのか電波なのかが分からない。 */
          publishFn({ scene: sceneIdx, step: stepIdx, ts, confetti: lastConfetti })
            .then(() => {
              if (!sendErr) return;
              sendErr = "";
              cEls.banner.classList.remove("show");
              refreshCtrlStatus();
            })
            .catch((e) => {
              const denied = e && (e.code === "permission-denied" || /permission/i.test(String(e)));
              sendErr = denied ? "このアカウントでは操作できません" : "送信失敗";
              refreshCtrlStatus();
              if (denied) showSignIn("進行を動かせるのは、島の管理者のアカウントだけです。入り直してください。");
            });
        }
      }

      /** Firebase のアプリ。ログインと Firestore で**同じものを使う**(そうしないと別のログインになる)。 */
      async function firebaseApp() {
        const { initializeApp, getApps } = await import(`${SDK}/firebase-app.js`);
        return getApps()[0] ?? initializeApp(FIREBASE_CONFIG);
      }

      async function initSync(onRemote) {
        if (!FIREBASE_CONFIG) throw new Error("FIREBASE_CONFIG未設定");
        const fsm = await import(`${SDK}/firebase-firestore.js`);
        const db = fsm.getFirestore(await firebaseApp());
        const ref = fsm.doc(db, SYNC_COLLECTION, SYNC_DOC);
        fsm.onSnapshot(
          ref,
          (snap) => {
            if (snap.exists()) onRemote(snap.data(), snap.metadata.hasPendingWrites);
            /* ここは「繋がった」だけを伝える。**緑にするかは
               `refreshCtrlStatus` が決める**（ログインと送信の成否も見る）。 */
            linkOk = true;
            refreshCtrlStatus();
          },
          () => {
            linkOk = false;
            refreshCtrlStatus();
          }
        );
        return (data) => fsm.setDoc(ref, data);
      }

      /* ---------- ログイン(ctrl だけ) ----------
         進行を書けるのはあやとだけ(`firestore.rules` の monthlyReview)。
         OBS(view)は読むだけなので、**そちらでは firebase-auth を落とさない。**
         配信に映っている側に、押せもしないログインの札を出さないため。 */
      async function initAuth(onUser) {
        const am = await import(`${SDK}/firebase-auth.js`);
        const auth = am.getAuth(await firebaseApp());
        /* 島でログイン済みの端末なら、ここが最初から user 付きで呼ばれる。
           そのときは何も押さずに「同期中」まで行く。 */
        am.onAuthStateChanged(auth, onUser);
        return () => am.signInWithPopup(auth, new am.GoogleAuthProvider());
      }

      /** コントローラーに「Google でログイン」を出す。押せる札にする(文だけ出さない)。 */
      function showSignIn(msg) {
        if (ROLE !== "ctrl") return;
        cEls.banner.textContent = "";
        const p = document.createElement("div");
        p.textContent = msg;
        const b = document.createElement("button");
        b.textContent = "Google でログイン";
        b.style.cssText = "margin-top:8px;padding:10px 14px;font-size:15px;touch-action:manipulation";
        b.addEventListener("click", async () => {
          b.disabled = true;
          try {
            if (signInFn) await signInFn();
          } catch (e) {
            /* 落ちた符丁（`auth/popup-blocked` など）は画面に出さない。
               読むのはあやとで、できることは「もう一度押す」だけ。
               符丁は console にだけ残す。 */
            console.error("ふりかえり授賞式: ログインできなかった —", e);
            p.textContent = "ログインできませんでした。もう一度押してください。";
          } finally {
            b.disabled = false;
          }
        });
        cEls.banner.append(p, b);
        cEls.banner.classList.add("show");
      }

      /* ---------- コントローラUI ---------- */
      const cEls = {
        dot: document.getElementById("c-dot"),
        statusText: document.getElementById("c-status-text"),
        banner: document.getElementById("c-banner"),
        corner: document.getElementById("c-corner"),
        step: document.getElementById("c-step"),
        next: document.getElementById("c-next"),
        back: document.getElementById("c-back"),
        grid: document.getElementById("c-grid"),
        confetti: document.getElementById("c-confetti"),
        top: document.getElementById("c-top"),
      };
      function setCtrlStatus(ok, text) {
        if (ROLE !== "ctrl") return;
        cEls.dot.className = "c-dot " + (ok ? "ok" : "ng");
        cEls.statusText.textContent = text || (ok ? "同期中" : "未接続");
      }
      function updateCtrlLabels() {
        if (ROLE !== "ctrl") return;
        const dot = DOT_OF_SCENE[sceneIdx];
        cEls.corner.textContent = DOT_LABELS[dot];
        const local = SCENES.map((s, i) => (DOT_OF_SCENE[i] === dot ? i : null)).filter((v) => v != null);
        const pagePos = local.indexOf(sceneIdx) + 1;
        cEls.step.textContent = `画面 ${pagePos}/${local.length} ・ ステップ ${stepIdx}/${SCENES[sceneIdx].total} ・ 全体 ${sceneIdx + 1}/${SCENES.length}`;
        [...cEls.grid.children].forEach((b, i) => b.classList.toggle("act", i === dot));
      }
      function initCtrlUi() {
        document.body.classList.add("ctrl");
        cEls.next.addEventListener("click", advance);
        cEls.back.addEventListener("click", back);
        cEls.top.addEventListener("click", () => gotoScene(0, 0));
        cEls.confetti.addEventListener("click", () => {
          lastConfetti = Date.now();
          onStateChanged();
        });
        DOT_LABELS.forEach((label, dot) => {
          const b = document.createElement("button");
          b.textContent = `${dot}. ${label}`;
          b.addEventListener("click", () => gotoScene(DOT_OF_SCENE.indexOf(dot), 0));
          cEls.grid.appendChild(b);
        });
        updateCtrlLabels();
      }

      /* ---------- 起動 ---------- */
      buildDots();
      renderScene();

      if (ROLE === "ctrl") {
        initCtrlUi();
        initSync((data, isLocalEcho) => {
          // 自分の書き込みエコーと古いスナップショットは無視(多重進行・巻き戻り防止)
          if (isLocalEcho) return;
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          // 他の操作元(PC等)の状態も反映してコントローラ表示を同期
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          sceneIdx = Math.max(0, Math.min(SCENES.length - 1, data.scene ?? 0));
          stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
          lastConfetti = data.confetti || lastConfetti;
          updateCtrlLabels();
          applyingRemote = false;
        })
          .then(async (pub) => {
            setCtrlStatus(false, "ログインを確かめています…");
            /* **ログインが確かめられるまで publishFn を入れない。**
               入れてしまうと、押した瞬間に静かに 403 で落ちる。
               配信の最中にそれが起きると、何が悪いのか分からない。 */
            signInFn = await initAuth((user) => {
              authOk = !!user;
              sendErr = "";
              publishFn = user ? pub : null;
              if (user) {
                cEls.banner.classList.remove("show");
                refreshCtrlStatus();
                onStateChanged();
              } else {
                refreshCtrlStatus();
                showSignIn("進行を動かすにはログインが要ります。島と同じアカウントで入ってください。");
              }
            });
          })
          .catch((e) => {
            linkOk = false;
            setCtrlStatus(false, "つながりません");
            /* ここはコントローラ（あやとの手元）なので字を出してよいが、
               書いてよいのは**これから何をするか**だけ。
               前は `Firestore につながりませんでした(<符丁>)` と、置き場の
               名前と落ちた符丁をそのまま出していた。手元でそれを読んでも
               打つ手は変わらないし、コントローラを画面共有した日には
               置き場の名前ごと映る。詳しいことは console にだけ残す。 */
            console.error("ふりかえり授賞式: 進行のつなぎに入れなかった —", e);
            cEls.banner.textContent = "進行がつながりません。電波を確かめて、開き直してください。";
            cEls.banner.classList.add("show");
          });
      } else if (ROLE === "view") {
        hint.classList.add("gone");
        initSync((data) => {
          // 古いスナップショットは無視(順序入れ替わりによる巻き戻り防止)
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          /* **1枚目のスナップショットでは飛ばさない。** OBS を開いた瞬間に
             前の紙吹雪が飛ぶのを止めるため。
             前は「lastConfetti が 0 でなければ」で見ていたが、月ごとの書類は
             `confetti: 0` から始まるので、**その月の1回目がいつも飲まれていた**
             （エミュレータに2枚のブラウザを繋いで確かめた）。
             「開いた直後か」と「まだ一度も飛ばしていないか」は別のこと。 */
          if (typeof data.confetti === "number" && data.confetti > lastConfetti) {
            if (seenFirstSnap) spawnConfetti(140);
            lastConfetti = data.confetti;
          }
          seenFirstSnap = true;
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          if (data.scene !== sceneIdx) {
            gotoScene(data.scene ?? 0, data.step ?? 0);
          } else {
            stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
            applySteps();
          }
          applyingRemote = false;
        }).catch(() => {
          /* 未設定・接続不可: ローカル操作のまま */
        });
      }

      if (AUTO_SEC > 0) setInterval(advance, AUTO_SEC * 1000);
    </script>
  </body>
</html>
