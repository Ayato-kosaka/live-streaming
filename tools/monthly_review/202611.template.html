<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2a63" />
    <title>11月のふりかえり授賞式</title>
    <!--
      **このファイルは書き出したもの。手で直さない。**
      元は tools/monthly_review/202611.template.html（見た目と仕掛け）と
      tools/monthly_review/2026-11.*.json（中身・出席・投げ銭）。
        node tools/monthly_review/build_202611.mjs     # 書き出す
        node tools/monthly_review/check.mjs            # 測る（#308 の線）
    -->
    <style>
      /*@@FONT_FACE@@*/
      /* =========================================
         202611 月末配信「1ヶ月ふりかえり授賞式」
         テーマ: あやと島の紙の札 ＋ 11月の投げ銭アラート（ブラン城の小さな城主ピポ、#1078）
         - OBS ブラウザソース 1920x1080 前提。**寸法は px で決める**（vw で決めない。
           画面の幅で字が縮むと、横向きスマホの OBS でさらに縮む。#308）
         - クリック / Enter / → で進行、← / Backspace で戻る
         - 外部依存なし（オフラインOK。例外は Firestore 同期の gstatic SDK）。字も絵も焼き込み

         決めごと（docs/island-misses.md #308 の線。tools/monthly_review/check.mjs が測る）:
         - 一覧の1行の高さ 46px 以上。**1画面の行は 16 まで**。超えたら面を割る（列を増やして詰めない）
         - 「…」で切らない。名前が入らないときは字を少しだけ縮める（.fit、下限 24px）
         - 本文の字 22px 以上
         - 色は島（site/app/css/tokens.css の紙・墨）と、城のアラート
           （app/alertbox/themes.ts の castle: クリーム #FFF4DC・窓の灯り #FFD54A・こげ茶 #2A1206）から借りる
         - 絵はアラートの絵をそのまま使う（public/alert/themes/castle/）。新しく描かない
         - UI の印に絵文字を使わない（docs/island-design.md 1章）。視聴者さんの字と配信の題の中はそのまま
         ========================================= */
      :root {
        /* 冬の夜。黒にしない。上は紺、地平に向かって暖かい紫 */
        --night-1: #1d2a63;
        --night-2: #2f3477;
        --night-3: #4e3a7a;
        --night-4: #7a4a73;
        /* 島の紙（tokens.css の --paper / --paper-2 と墨） */
        --paper: #fffae4;
        --paper-2: #fdf1cf;
        --paper-3: #f7e4b5;
        --paper-edge: #dcb879; /* 紙の厚み（ぼかさず真下） */
        --slip-edge: #e9d29c;
        --ink: #5b3f15;
        --ink-2: #72521b;
        --ink-3: #957128;
        /* 城のアラートの字の色 */
        --cream: #fff4dc;
        --lamp: #ffd54a;
        --cocoa: #2a1206;
        /* リボンの赤（ribbon.png の地） */
        --ribbon: #8a2433;
        --ribbon-deep: #5e1421;
        --gold: #ffcf4d;
        --gold-deep: #d79a17;
        --berry-ink: #a81139; /* 紙の上の赤い字（tokens.css --accent-ink） */
        --mint: #c4f2d9;
        --mint-ink: #1d5b3e;
        --font: "Maru Review", "Hiragino Maru Gothic ProN", ui-rounded, "Hiragino Sans", "Noto Sans JP",
          "Yu Gothic", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        font-weight: 700;
        color: var(--ink);
        overflow: hidden;
        background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 42%, var(--night-3) 78%, var(--night-4) 100%);
        background-color: var(--night-1);
        user-select: none;
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
      }

      /* 1920x1080 の舞台。窓がそれ以外の大きさのときだけ、まるごと縮める（OBS では 1 倍） */
      #world {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%) scale(var(--k, 1));
        transform-origin: 50% 50%;
        overflow: hidden;
      }

      /* ============ 夜空・雪・灯りの紐 ============
         動かすのは小さな雪の粒だけ（transform のみ）。画面いっぱいの形は動かさない */
      #sky { position: absolute; inset: 0; z-index: -3; pointer-events: none; overflow: hidden; }
      #sky .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(46% 36% at 84% 92%, rgba(255, 196, 92, 0.32), rgba(255, 196, 92, 0) 70%),
          radial-gradient(40% 30% at 10% 96%, rgba(255, 170, 110, 0.2), rgba(255, 170, 110, 0) 70%);
      }
      #sky .stars {
        position: absolute;
        inset: 0 0 40% 0;
        background-image:
          radial-gradient(2.4px 2.4px at 6% 18%, #fff8e0 60%, transparent 100%),
          radial-gradient(2px 2px at 14% 52%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.6px 2.6px at 23% 30%, #fff 60%, transparent 100%),
          radial-gradient(1.8px 1.8px at 31% 64%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.2px 2.2px at 42% 22%, #fff 60%, transparent 100%),
          radial-gradient(2px 2px at 55% 58%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.6px 2.6px at 63% 28%, #fff 60%, transparent 100%),
          radial-gradient(1.8px 1.8px at 71% 70%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.4px 2.4px at 79% 40%, #fff 60%, transparent 100%),
          radial-gradient(2px 2px at 88% 16%, #fff8e0 60%, transparent 100%),
          radial-gradient(2.2px 2.2px at 95% 56%, #fff 60%, transparent 100%);
        opacity: 0.75;
      }
      #sky .snow i {
        position: absolute;
        top: -20px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffffff, #e4ecff);
        opacity: 0.75;
        will-change: transform;
        animation: snow linear infinite;
      }
      @keyframes snow {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-40px, 1120px, 0); }
      }
      /* クリスマスマーケットの灯りの紐（上の端）。紐は細い線、電球はやわらかい階調 */
      #garland { position: absolute; left: 0; top: 0; width: 1920px; height: 70px; z-index: -2; pointer-events: none; }
      #garland .bulb { animation: twinkle 3.2s ease-in-out infinite; }
      #garland .bulb:nth-child(3n) { animation-delay: -1.1s; }
      #garland .bulb:nth-child(3n + 1) { animation-delay: -2.2s; }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      /* 足もとの雪。進行のドットはこの上 */
      #ground { position: absolute; left: 0; bottom: 0; width: 1920px; height: 92px; z-index: -1; pointer-events: none; }

      /* ============ 舞台の骨組み ============ */
      #stage {
        position: absolute;
        inset: 0;
        padding: 24px 80px 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.3s ease;
      }
      #stage.fading { opacity: 0; }

      /* コーナーの頭: 小さな札 ＋ リボン（ribbon.png を左右の房だけ固定して伸ばす） */
      /* 札（CORNER n）は左上に置いて、リボンの上に積まない。そのぶん紙を高く使える */
      .head { flex: none; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
      .tag {
        position: absolute;
        left: 80px;
        top: 50px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.14em;
        color: var(--cream);
        background: rgba(42, 18, 6, 0.42);
        padding: 4px 20px;
        border-radius: 999px;
        line-height: 1.3;
      }
      .ribbon {
        min-width: 560px;
        height: 116px;
        border-style: solid;
        border-width: 0 66px;
        border-image-source: var(--ribbon-img);
        border-image-slice: 0 70 0 70 fill;
        border-image-width: 0 66px;
        border-image-repeat: round;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px 12px;
      }
      .ribbon .title {
        margin: 0;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.1;
        color: var(--cream);
        white-space: nowrap;
        text-shadow: 0 3px 0 var(--ribbon-deep), 0 0 3px var(--ribbon-deep);
        letter-spacing: 0.04em;
      }
      .ribbon.big { height: 150px; border-width: 0 84px; border-image-width: 0 84px; padding-bottom: 16px; }
      .ribbon.big .title { font-size: 76px; }

      .body { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

      /* 島の紙の札。輪郭線なし。厚みは真下にぼかさず、落ち影は右下へ */
      .panel {
        position: relative;
        width: 100%;
        max-width: 1760px;
        background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
        border-radius: 28px;
        box-shadow: 0 8px 0 var(--paper-edge), 6px 22px 30px rgba(8, 6, 30, 0.42);
        padding: 30px 44px;
        color: var(--ink);
      }
      /* 札のうしろから顔を出すピポ（札の上の辺が、絵の下の辺を隠す） */
      .pipo-on { position: absolute; right: 64px; bottom: calc(100% - 30px); height: 150px; z-index: -1; pointer-events: none; }
      .pipo-on.peek { bottom: calc(100% - 4px); height: 128px; }
      .pipo-on.left { right: auto; left: 64px; }

      /* ステップ表示 */
      [data-step] { opacity: 0; transform: translateY(14px); transition: opacity 0.45s ease, transform 0.45s ease; }
      [data-step].on { opacity: 1; transform: none; }
      .hide { display: none !important; }

      .lead { font-size: 34px; font-weight: 900; color: var(--ink); text-align: center; line-height: 1.45; margin: 0 0 22px; }
      .foot { font-size: 24px; color: var(--ink-2); line-height: 1.55; margin-top: 18px; text-align: center; }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 2px 16px;
        font-size: 26px;
        font-weight: 900;
        line-height: 1.35;
        white-space: nowrap;
        background: var(--paper-3);
        color: var(--ink-2);
      }
      .pill.red { background: var(--ribbon); color: var(--cream); }
      .pill.gold { background: linear-gradient(180deg, #ffe58a, var(--gold)); color: var(--cocoa); }
      .pill.mint { background: var(--mint); color: var(--mint-ink); }

      /* ============ 顔（YouTube のアイコン）と、島のキャラクターの絵 ============ */
      .av {
        flex: none;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        overflow: hidden;
        display: inline-grid;
        place-items: center;
        background: linear-gradient(180deg, #ffe7a3, #f3c35e);
        color: var(--cocoa);
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 3px 0 rgba(91, 63, 21, 0.25);
      }
      .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .av-lg { width: 150px; height: 150px; font-size: 52px; box-shadow: 0 5px 0 rgba(91, 63, 21, 0.25); }
      .av-xl { width: 116px; height: 116px; font-size: 42px; }
      /* 島のキャラクターは全身の絵。**丸く切らない**（10月版と同じ） */
      .ch { flex: none; width: 60px; height: 60px; display: inline-grid; place-items: center; }
      .ch img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(2px 4px 2px rgba(46, 60, 30, 0.3)); }
      .ch-none {
        border-radius: 18px;
        background: linear-gradient(180deg, #ffe7a3, #f3c35e);
        color: var(--cocoa);
        font-size: 24px;
        font-weight: 900;
      }
      .ch-lg { width: 150px; height: 150px; }
      .ch-lg.ch-none { font-size: 52px; border-radius: 36px; }
      .ch-xl { width: 210px; height: 210px; }
      .ch-xl.ch-none { font-size: 72px; border-radius: 48px; }

      /* ============ 一覧（出席・投げ銭の4位以下） ============
         1行 68px。2列で、上から下へ読む（左の列のあとに右の列）。1面 16 行まで */
      .list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-flow: column; gap: 14px 40px; }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 68px;
        padding: 6px 28px 6px 8px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fffdf4 0%, var(--paper-3) 100%);
        box-shadow: 0 4px 0 var(--slip-edge);
      }
      .row .nm { flex: 1 1 auto; min-width: 0; font-size: 34px; font-weight: 900; color: var(--ink); white-space: nowrap; line-height: 1.2; }
      .row .st { flex: none; font-size: 32px; font-weight: 900; color: var(--ink-2); white-space: nowrap; }
      .row .st small { font-size: 24px; color: var(--ink-3); margin-left: 2px; }
      .row .rk {
        flex: none;
        min-width: 86px;
        text-align: center;
        font-size: 28px;
        font-weight: 900;
        color: var(--cocoa);
        background: linear-gradient(180deg, #ffe58a, var(--gold));
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .row .yen { flex: none; font-size: 34px; font-weight: 900; color: var(--berry-ink); white-space: nowrap; }

      /* ============ オープニング ============ */
      .op { flex: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
      .op-left { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
      .op-period { font-size: 30px; font-weight: 900; color: var(--cream); background: rgba(42, 18, 6, 0.42); border-radius: 999px; padding: 6px 24px; }
      .op-sub { font-size: 34px; font-weight: 900; color: var(--cream); line-height: 1.5; margin: 0; text-shadow: 0 2px 0 rgba(42, 18, 6, 0.6); }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; }
      .stat {
        background: linear-gradient(180deg, var(--paper), var(--paper-2));
        border-radius: 24px;
        box-shadow: 0 6px 0 var(--paper-edge), 4px 14px 20px rgba(8, 6, 30, 0.35);
        padding: 16px 6px 14px;
        text-align: center;
      }
      .stat .n { font-size: 64px; font-weight: 900; color: var(--ink); line-height: 1.05; }
      .stat .n small { font-size: 30px; margin-left: 2px; }
      .stat .l { font-size: 26px; color: var(--ink-2); margin-top: 6px; line-height: 1.35; }
      .program {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: rgba(255, 250, 228, 0.12);
        border-radius: 24px;
        padding: 16px;
      }
      .program span { font-size: 26px; font-weight: 900; color: var(--ink); background: var(--paper-2); border-radius: 999px; padding: 4px 16px; }

      /* ============ 城（アラートの絵そのもの）。下の階から窓に灯りがともる ============ */
      .castle { position: relative; flex: none; }
      .castle > img { position: absolute; left: 0; top: 0; height: auto; display: block; }
      .castle .c-lit { transition: clip-path 1.6s ease; }
      .castle .c-glow {
        position: absolute;
        inset: -14% 0 -6%; /* 横には出さない（隣の札の幅を押し広げない） */
        background: radial-gradient(closest-side, rgba(255, 213, 74, 0.5), rgba(255, 170, 60, 0.2) 55%, rgba(255, 170, 60, 0) 100%);
        opacity: 0;
        transition: opacity 1.6s ease;
      }
      .castle .c-flag { position: absolute; transition: transform 1.6s ease; }
      .castle .c-flag img { height: 100%; width: auto; display: block; transform-origin: 0% 50%; animation: wave 2.4s ease-in-out infinite; }
      @keyframes wave { 0%, 100% { transform: skewY(0deg); } 50% { transform: skewY(-4deg) scaleX(0.96); } }
      .castle .c-pipo { position: absolute; display: block; }

      /* ============ ふりかえり（3コマ） ============ */
      .recap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-items: stretch; }
      .rc {
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 24px;
        box-shadow: 0 5px 0 var(--slip-edge);
        padding: 22px 26px 26px;
      }
      .rc .top { display: flex; align-items: center; gap: 12px; }
      .rc .no {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ribbon);
        color: var(--cream);
        font-size: 30px;
        font-weight: 900;
        flex: none;
      }
      .rc h3 { margin: 14px 0 10px; font-size: 38px; font-weight: 900; line-height: 1.3; color: var(--ink); }
      .rc p { margin: 0; font-size: 30px; line-height: 1.6; color: var(--ink-2); }

      /* ============ 皆勤賞 ============ */
      .kk { display: flex; align-items: flex-end; gap: 36px; width: 100%; }
      .kk .cards { flex: 1; display: flex; gap: 24px; justify-content: center; align-items: stretch; }
      .kc {
        flex: 1 1 0;
        max-width: 460px;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 28px;
        box-shadow: 0 6px 0 var(--slip-edge);
        padding: 24px 22px 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      .kc .nm { font-size: 38px; font-weight: 900; color: var(--ink); line-height: 1.25; max-width: 100%; white-space: nowrap; }
      .kc .d { font-size: 28px; font-weight: 900; color: var(--ink-2); }
      .kc .w { font-size: 26px; line-height: 1.55; color: var(--ink-2); }
      .kc .pill { font-size: 28px; }

      /* ============ 引用の札（名言・おもしろ・はじめまして・調べもの） ============ */
      .qs { display: flex; flex-direction: column; gap: 20px; }
      .q2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 28px; }
      .qc {
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 24px;
        box-shadow: 0 5px 0 var(--slip-edge);
        padding: 18px 28px 20px;
        min-width: 0;
      }
      .qc .who { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .qc .who .nm { font-size: 30px; font-weight: 900; color: var(--ink); }
      .qc .msg { font-size: 34px; font-weight: 900; color: var(--ink); line-height: 1.5; margin-top: 10px; }
      .qc .note { font-size: 26px; color: var(--ink-2); line-height: 1.55; margin-top: 6px; }
      /* 調べもの大賞は**1面に収める**ので、札を一段だけ詰める（それでも字は 24px 以上） */
      .gd { padding-top: 22px; padding-bottom: 24px; }
      .gd .lead { margin-bottom: 14px; }
      .gd .q2 { gap: 14px 24px; }
      .gd .qc { padding: 12px 24px 14px; }
      .gd .qc .av { width: 40px; height: 40px; font-size: 20px; }
      .gd .qc .who .nm { font-size: 28px; }
      .gd .qc .msg { font-size: 28px; margin-top: 4px; line-height: 1.4; }
      .gd .qc .note { font-size: 24px; margin-top: 2px; line-height: 1.5; }
      .gd.dense .qc .msg { font-size: 26px; }

      /* ============ はじめまして ============ */
      .count { display: flex; align-items: baseline; justify-content: center; gap: 16px; margin-bottom: 22px; }
      .count .n { font-size: 110px; font-weight: 900; color: var(--berry-ink); line-height: 1; }
      .count .l { font-size: 38px; font-weight: 900; color: var(--ink); }

      /* ============ クイズ ============ */
      .quiz-q { display: flex; align-items: center; gap: 24px; margin-bottom: 26px; }
      .quiz-q .qn {
        flex: none;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ribbon);
        color: var(--cream);
        font-size: 44px;
        font-weight: 900;
      }
      .quiz-q .qt { font-size: 44px; font-weight: 900; line-height: 1.4; color: var(--ink); }
      .quiz-q .hint2 { font-size: 26px; color: var(--ink-3); margin-top: 4px; }
      .choices { display: flex; flex-direction: column; gap: 16px; }
      .choice {
        display: flex;
        align-items: center;
        gap: 20px;
        min-height: 86px;
        padding: 10px 30px 10px 14px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        box-shadow: 0 5px 0 var(--slip-edge);
        font-size: 36px;
        font-weight: 900;
        line-height: 1.3;
        transition: background 0.4s ease, opacity 0.4s ease;
      }
      .choice .abc {
        flex: none;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--paper-edge);
        color: var(--cream);
        font-size: 32px;
      }
      .choice .ok { margin-left: auto; flex: none; visibility: hidden; }
      .choices.done .choice { opacity: 0.45; }
      .choices.done .choice.right { opacity: 1; background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 5px 0 var(--gold-deep); }
      .choices.done .choice.right .abc { background: var(--ribbon); }
      .choices.done .choice.right .ok { visibility: visible; }
      .answer { margin-top: 22px; font-size: 30px; line-height: 1.55; color: var(--ink-2); text-align: center; }
      .answer b { font-size: 34px; color: var(--ink); }

      /* ============ 流行語 ============ */
      .bw .word { font-size: 44px; font-weight: 900; color: var(--berry-ink); line-height: 1.25; }

      /* ============ 発表（ドラムロール → 大賞） ============ */
      .drum { font-size: 60px; font-weight: 900; color: var(--ink); text-align: center; letter-spacing: 0.06em; margin: 8px 0 18px; }
      .win { text-align: center; position: relative; }
      .win .prize { display: inline-block; font-size: 32px; }
      .win .big { font-size: 120px; font-weight: 900; color: var(--berry-ink); line-height: 1.15; margin: 16px 0 10px; }
      .win .msg { font-size: 46px; font-weight: 900; color: var(--ink); line-height: 1.5; margin: 18px 0 12px; }
      .win .note { font-size: 30px; color: var(--ink-2); line-height: 1.6; }
      .win .who { display: inline-flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 900; margin-top: 10px; }

      /* ============ おまけ ============ */
      .om { display: grid; gap: 28px; }
      .om .oc {
        position: relative;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 24px;
        box-shadow: 0 5px 0 var(--slip-edge);
        padding: 26px 30px 30px;
      }
      .om h3 { margin: 0 0 12px; font-size: 40px; font-weight: 900; color: var(--ink); line-height: 1.3; padding-right: 120px; }
      .om p { margin: 0; font-size: 29px; line-height: 1.65; color: var(--ink-2); }
      .om .stamp { position: absolute; right: 22px; top: -36px; height: 120px; }

      /* ============ 投げ銭 ============ */
      .tp { display: flex; align-items: flex-end; gap: 40px; width: 100%; }
      .tp .side { flex: 1; display: flex; flex-direction: column; gap: 24px; justify-content: center; min-width: 0; }
      .tier {
        display: flex;
        align-items: center;
        gap: 24px;
        background: linear-gradient(180deg, #fffdf4, var(--paper-3));
        border-radius: 28px;
        box-shadow: 0 6px 0 var(--slip-edge);
        padding: 18px 36px 18px 22px;
        min-width: 0;
      }
      .tier .rkn { font-size: 32px; font-weight: 900; color: var(--ink-2); }
      .tier .nm { font-size: 46px; font-weight: 900; color: var(--ink); line-height: 1.25; white-space: nowrap; }
      .tier .who { flex: 1 1 auto; min-width: 0; }
      .tier .yen { flex: none; font-size: 54px; font-weight: 900; color: var(--berry-ink); white-space: nowrap; }
      .medal {
        flex: none;
        width: 74px;
        height: 74px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 38px;
        font-weight: 900;
        color: var(--cocoa);
        box-shadow: 0 4px 0 rgba(91, 63, 21, 0.25);
      }
      .medal.m1 { background: radial-gradient(circle at 35% 30%, #fff3b8, #ffd54a 55%, #e0a91b); }
      .medal.m2 { background: radial-gradient(circle at 35% 30%, #ffffff, #dfe4ec 55%, #aab4c3); }
      .medal.m3 { background: radial-gradient(circle at 35% 30%, #ffe0c4, #eaa874 55%, #c27a44); }
      .tier.t1 { padding: 26px 40px 26px 26px; }
      .tier.t1 .nm { font-size: 64px; }
      .tier.t1 .yen { font-size: 80px; }
      .tier.t1 .medal { width: 96px; height: 96px; font-size: 50px; }
      .total { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 44px; font-weight: 900; color: var(--cream); text-shadow: 0 3px 0 rgba(42, 18, 6, 0.7); }
      .total img { height: 72px; }
      .total .th { font-size: 36px; }

      /* ============ 手紙 ============ */
      .letter {
        background:
          repeating-linear-gradient(180deg, rgba(91, 63, 21, 0) 0 55px, rgba(201, 160, 90, 0.22) 55px 56px),
          linear-gradient(180deg, var(--paper), var(--paper-2));
        padding: 36px 64px 40px;
      }
      .letter p { margin: 0 0 16px; font-size: 32px; line-height: 1.75; color: var(--ink); text-indent: 1em; }
      .letter.dense p { font-size: 28px; }
      .letter .sig { text-align: right; font-size: 36px; font-weight: 900; color: var(--ink); margin-top: 10px; }

      /* ============ エンディング ============ */
      .end { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .end .sub { font-size: 32px; font-weight: 900; color: var(--cream); text-shadow: 0 2px 0 rgba(42, 18, 6, 0.6); text-align: center; margin: 0; line-height: 1.5; }
      .end .row2 { flex: 1; display: flex; align-items: flex-end; gap: 44px; width: 100%; justify-content: center; }
      .end .panel { max-width: 1080px; text-align: center; }
      .faces { display: flex; justify-content: center; gap: 22px; margin-bottom: 14px; }
      .end .thanks { font-size: 32px; line-height: 1.55; color: var(--ink); }
      .tap {
        display: inline-flex;
        align-items: baseline;
        gap: 16px;
        margin-top: 16px;
        padding: 8px 30px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fff3b8, var(--gold));
        box-shadow: 0 5px 0 var(--gold-deep);
      }
      .tap .l { font-size: 28px; font-weight: 900; color: var(--cocoa); }
      .tap .n { font-size: 48px; font-weight: 900; color: var(--cocoa); }
      .end .ps { font-size: 28px; color: var(--ink-2); margin-top: 14px; line-height: 1.5; }

      /* ============ 進行（雪の上のドット）と、合図 ============ */
      #progress { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; z-index: 5; }
      #progress .dot { width: 14px; height: 14px; border-radius: 999px; background: rgba(114, 82, 27, 0.32); transition: all 0.3s ease; }
      #progress .dot.act { width: 40px; background: var(--ribbon); }
      #hint { position: absolute; right: 36px; bottom: 22px; color: var(--ink-2); font-size: 22px; font-weight: 900; z-index: 5; transition: opacity 1s ease; }
      #hint.gone { opacity: 0; }

      /* ============ 紙吹雪 ============ */
      #confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
      .confetti { position: absolute; top: -40px; width: 14px; height: 22px; border-radius: 4px; opacity: 0.95; animation: fall linear forwards; }
      @keyframes fall {
        0% { transform: translateY(-60px) rotate(0deg); }
        100% { transform: translateY(1200px) rotate(720deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #sky .snow i, #garland .bulb, .castle .c-flag img { animation: none; }
        [data-step], .castle .c-lit, .castle .c-flag, .castle .c-glow { transition: none; }
      }

      /* ============ コントローラ（?role=ctrl。あやとの手元のスマホ） ============ */
      body.ctrl { cursor: default; overflow: hidden; background: linear-gradient(180deg, var(--night-1), var(--night-3)); }
      body.ctrl #world { display: none; }
      #ctrl-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        color: var(--cream);
      }
      body.ctrl #ctrl-ui { display: flex; }
      #ctrl-ui .c-head { display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 14px; }
      #ctrl-ui .c-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      #ctrl-ui .c-dot { width: 10px; height: 10px; border-radius: 999px; background: #8a7a68; }
      #ctrl-ui .c-dot.ok { background: #52d3ab; }
      #ctrl-ui .c-dot.ng { background: #f08aa0; }
      #ctrl-ui .c-now { background: var(--paper); color: var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--paper-edge); padding: 14px 18px; text-align: center; }
      #ctrl-ui .c-corner { font-weight: 900; font-size: clamp(20px, 6vw, 30px); }
      #ctrl-ui .c-step { color: var(--ink-2); font-weight: 700; font-size: 14px; margin-top: 2px; }
      #ctrl-ui .c-main { display: flex; gap: 12px; flex: none; }
      #ctrl-ui button {
        font-family: inherit;
        border: 0;
        border-radius: 22px;
        font-weight: 900;
        cursor: pointer;
        color: var(--ink);
        background: var(--paper-2);
        box-shadow: 0 5px 0 var(--paper-edge);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* ダブルタップズーム由来の余計な発火を防ぐ */
        user-select: none;
      }
      #ctrl-ui button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-edge); }
      #ctrl-ui .c-back { flex: 1; height: 26vh; font-size: clamp(18px, 5vw, 26px); color: var(--ink-2); }
      #ctrl-ui .c-next { flex: 2.4; height: 26vh; font-size: clamp(26px, 8vw, 40px); color: var(--cream); background: var(--ribbon); box-shadow: 0 6px 0 var(--ribbon-deep); }
      #ctrl-ui .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; padding-bottom: 6px; }
      #ctrl-ui .c-grid button { padding: 12px 10px; font-size: clamp(13px, 3.6vw, 17px); text-align: left; }
      #ctrl-ui .c-grid button.act { background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 5px 0 var(--gold-deep); }
      #ctrl-ui .c-extra { display: flex; gap: 8px; }
      #ctrl-ui .c-extra button { flex: 1; padding: 12px; font-size: 15px; }
      #ctrl-ui .c-banner { background: var(--paper); color: var(--ink); border-radius: 14px; font-size: 13px; font-weight: 700; line-height: 1.6; padding: 10px 14px; display: none; }
      #ctrl-ui .c-banner.show { display: block; }
    </style>
  </head>
  <body>
    <div id="world">
      <div id="sky" aria-hidden="true">
        <div class="glow"></div>
        <div class="stars"></div>
        <div class="snow" id="snow"></div>
      </div>
      <svg id="garland" viewBox="0 0 1920 70" aria-hidden="true"></svg>
      <svg id="ground" viewBox="0 0 1920 92" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7f9ff" />
            <stop offset="1" stop-color="#d6def4" />
          </linearGradient>
          <linearGradient id="snowg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e3e9fb" />
            <stop offset="1" stop-color="#c3cdea" />
          </linearGradient>
        </defs>
        <path d="M0 40 C 220 6, 460 30, 700 26 C 960 20, 1180 2, 1420 22 C 1620 38, 1800 14, 1920 24 L1920 92 L0 92 Z" fill="url(#snowg2)" />
        <path d="M0 58 C 260 30, 520 52, 820 44 C 1100 36, 1320 54, 1600 42 C 1760 36, 1860 48, 1920 46 L1920 92 L0 92 Z" fill="url(#snowg)" />
      </svg>
      <main id="stage" role="main" aria-live="polite"></main>
      <div id="progress" aria-hidden="true"></div>
      <div id="hint">クリック / Enter で進む ・ ← で戻る</div>
      <div id="confetti-layer" aria-hidden="true"></div>
    </div>

    <div id="ctrl-ui">
      <div class="c-head">
        <span>ふりかえり授賞式 コントローラ</span>
        <span class="c-status"><span class="c-dot" id="c-dot"></span><span id="c-status-text">接続中…</span></span>
      </div>
      <div class="c-banner" id="c-banner"></div>
      <div class="c-now">
        <div class="c-corner" id="c-corner">—</div>
        <div class="c-step" id="c-step"></div>
      </div>
      <div class="c-main">
        <button class="c-back" id="c-back">← もどる</button>
        <button class="c-next" id="c-next">つぎへ →</button>
      </div>
      <div class="c-extra">
        <button id="c-confetti">紙吹雪もう一回</button>
        <button id="c-top">最初から</button>
      </div>
      <div class="c-grid" id="c-grid"></div>
    </div>

    <script>
      "use strict";

      /* =========================================================
         11月のふりかえり授賞式
         中身は書き出しの道具が下の4つに差し込む（手で書かない）:
           REVIEW_DATA … 2026-11.content.json ＋ 2026-11.kinkin.json ＋ 2026-11.tips.json
           AVATARS     … YouTube のチャンネルの og:image（=s176-c-rj）。取れない人はイニシャルの丸
           CHARS       … 投げ銭の絵（図鑑のキャラクター。tips の icon が鍵）
           ART         … 11月の投げ銭アラートの絵（public/alert/themes/castle/）と castle.json

         決めごと:
         ・引用は原文のまま。`escapeHtml` を必ず通す
         ・**個人別のコメント数は1つも出さない**（欄も作らない）
         ・投げ銭は貢献額をそのまま出す。**画面で式を説明しない**
         ・見せる名前は「あやと島案内鳥」
         ========================================================= */
      const REVIEW_DATA = /*@@REVIEW_DATA@@*/ null;
      const AVATARS = /*@@AVATARS@@*/ {};
      const CHARS = /*@@CHARS@@*/ {};
      const ART = /*@@ART@@*/ {};
      const AVATAR_ALIAS = {};

      /* ============================ 基盤 ============================ */
      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      const e = escapeHtml;
      const clamp01 = (v) => Math.max(0, Math.min(1, Number(v) || 0));
      const yen = (n) => Number(n).toLocaleString("ja-JP");

      function initials(name) {
        const s = String(name).trim().replace(/^@/, "").replace(/ さん$/, "");
        return Array.from(s).slice(0, 1).join("") || "？";
      }
      function avatarKey(name) {
        const n = String(name).replace(/^@/, "").replace(/ さん$/, "").trim();
        return AVATAR_ALIAS[n] || n;
      }
      function avatarHtml(name, size) {
        const key = avatarKey(name);
        const src = AVATARS[key];
        const cls = `av ${size || ""}`;
        if (src) return `<span class="${cls}"><img src="${src}" alt="" decoding="async" /></span>`;
        return `<span class="${cls}">${e(initials(dispName(name)))}</span>`;
      }

      /* 画面に出す呼び名。**YouTube の生ハンドルを出さない。**（10月版と同じ決め）
         `-k1n` `-z3i` は YouTube が重複を避けるために勝手に付けた記号で、本人の名前ではない。
         `@` と、その記号と、末尾の数字を落として「さん」を付ける。
         **`AVATARS` を引く鍵は生のままにする**（辞書の鍵が生ハンドル）。 */
      const DISP_KEEP = new Set(["user"]);
      function dispName(raw) {
        let s = String(raw || "").replace(/^@/, "");
        const cut = s.replace(/-[A-Za-z0-9]{2,6}$/, "");
        if (cut !== s && cut.length >= 2 && !DISP_KEEP.has(cut.toLowerCase())) s = cut;
        const d = s.replace(/(\D)\d{3,}$/, "$1");
        if (d.length >= 2) s = d;
        return /(さん|ちゃん|くん)$/.test(s) ? s : s + " さん";
      }

      /* 投げ銭の絵は島のキャラクター。**丸く切らない。** 絵が無い人は頭文字の枠 */
      function charHtml(row, size) {
        const src = row.icon ? CHARS[row.icon] : null;
        if (src) return `<span class="ch ${size || ""}"><img src="${src}" alt="" decoding="async" /></span>`;
        return `<span class="ch ch-none ${size || ""}">${e(initials(dispName(row.display)))}</span>`;
      }

      /* ---------- ピポ（アラートの絵そのまま） ---------- */
      function pipoOn(pose, opts) {
        const o = opts || {};
        const src = ART.pipo && ART.pipo[pose];
        if (!src) return "";
        const peek = pose === "peek" || pose === "peekWave";
        return `<img class="pipo-on${peek ? " peek" : ""}${o.left ? " left" : ""}" src="${src}" alt="" />`;
      }

      /* ---------- 城。灯りは下の階から（アラートの lightY / flagY と同じ式） ----------
         `steps` は [ステップ, 灯り0〜1, 旗0〜1] の並び。そのステップまで来たら、その値へ動く */
      function lightClip(lv) {
        const d = ART.def;
        const y = d.light.bottom + (d.light.top - d.light.bottom) * clamp01(lv);
        return `inset(${((y / d.size[1]) * 100).toFixed(2)}% 0 0 0)`;
      }
      function flagShift(lv, s) {
        const d = ART.def;
        return `translateY(${((d.pole.top - d.pole.bottom) * clamp01(lv) * s).toFixed(1)}px)`;
      }
      function castleHtml(w, opts) {
        const o = opts || {};
        const d = ART.def;
        if (!d || !ART.castleBase) return "";
        const s = w / d.size[0];
        const h = Math.round(d.size[1] * s);
        const lv = o.lv ?? 1;
        const fl = o.flag ?? lv;
        const flagH = d.flag.h * s;
        /* ピポは門の前（顔の幅をアラートと同じ割合にそろえる）。`from`/`until` のステップで入れ替える */
        const pipos = (o.pipos || []).map((p) => {
          const sp = d.pipo.poses[p.pose];
          if (!sp || !ART.pipo[p.pose]) return "";
          const k = (d.pipo.face * d.size[0]) / (sp.face[2] - sp.face[0]);
          const pw = sp.size[0] * k * s;
          const ph = sp.size[1] * k * s;
          const at = p.at === "left" ? d.pipo.ledges[0] : p.at === "right" ? d.pipo.ledges[1] : d.pipo.gate;
          const left = at.x * s - pw * sp.foot[0];
          const top = at.y * s - ph * sp.foot[1];
          const fromTo = `${p.from != null ? ` data-from="${p.from}"` : ""}${p.until != null ? ` data-until="${p.until}"` : ""}`;
          return `<img class="c-pipo" src="${ART.pipo[p.pose]}" alt=""${fromTo} style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px;width:${pw.toFixed(1)}px;height:${ph.toFixed(1)}px" />`;
        });
        // 旗は竿の右に出る（絵の幅の外）。そのぶん箱を広げて、隣の札にはみ出さない
        const flagW = flagH * (91 / 72);
        const extra = Math.max(0, Math.ceil(d.pole.x * s + flagW - w) + 6);
        return `
          <div class="castle deco" style="width:${w + extra}px;height:${h}px" data-s="${s}" data-lv0="${lv}" data-flag0="${fl}" data-levels='${JSON.stringify(o.steps || [])}'>
            <div class="c-glow" style="opacity:${clamp01(lv)}"></div>
            <img class="c-base" src="${ART.castleBase}" alt="" style="width:${w}px" />
            <img class="c-lit" src="${ART.castleFill}" alt="" style="width:${w}px;clip-path:${lightClip(lv)}" />
            <div class="c-flag" style="left:${(d.pole.x * s).toFixed(1)}px;top:${(d.pole.bottom * s).toFixed(1)}px;height:${flagH.toFixed(1)}px;transform:${flagShift(fl, s)}"><img src="${ART.flag}" alt="" /></div>
            ${pipos.join("")}
          </div>`;
      }

      /* ---------- 面の割りかた ----------
         **1画面の行は 16 まで**（#308）。超えたら面を割る。列を増やして詰めない */
      const PER_SCREEN = 16;
      function split(rows, per) {
        const n = Math.max(1, Math.ceil(rows.length / per));
        const size = Math.ceil(rows.length / n);
        return Array.from({ length: n }, (_, i) => rows.slice(i * size, (i + 1) * size));
      }
      /* 字の量から、札が何 px になるかの見積もり（面を割るときだけ使う。描く寸法は CSS） */
      function linesOf(text, fontPx, widthPx) {
        const per = Math.max(1, Math.floor(widthPx / fontPx));
        return String(text || "")
          .split("\n")
          .reduce((n, part) => n + Math.max(1, Math.ceil(Array.from(part).length / per)), 0);
      }
      /* 札を、1面の高さ `budget` に入るぶんずつ前から詰める。1面 `maxPer` 枚まで */
      function pack(items, cost, budget, maxPer) {
        const out = [];
        let cur = [];
        let used = 0;
        for (const it of items) {
          const c = cost(it);
          if (cur.length && (used + c > budget || cur.length >= maxPer)) {
            out.push(cur);
            cur = [];
            used = 0;
          }
          cur.push(it);
          used += c;
        }
        if (cur.length || !out.length) out.push(cur);
        return out;
      }
      const PANEL_H = 700; // 頭（札＋リボン）と進行のドットを除いた、紙の中に置ける高さの目安

      function head(tag, title, big) {
        return `
          <header class="head">
            ${tag ? `<div class="tag">${e(tag)}</div>` : ""}
            <div class="ribbon${big ? " big" : ""}"><h2 class="title">${e(title)}</h2></div>
          </header>`;
      }
      const pageTag = (n, i, len) => `CORNER ${n}${len > 1 ? `　${i + 1} / ${len}` : ""}`;

      function quoteCard(o, step, opts) {
        const x = opts || {};
        return `
          <div class="qc" ${step != null ? `data-step="${step}"` : ""}>
            <div class="who">
              ${x.label ? `<span class="pill red">${e(x.label)}</span>` : ""}
              ${avatarHtml(o.name)}
              <span class="nm">${e(dispName(o.name))}</span>
              ${o.date ? `<span class="pill">${e(o.date)}</span>` : ""}
              ${x.extra ? `<span class="pill gold">${e(x.extra)}</span>` : ""}
            </div>
            <div class="msg">「${e(o.msg)}」</div>
            ${o.note ? `<div class="note">${e(o.note)}</div>` : ""}
          </div>`;
      }
      /* 1列の引用の札の高さの見積もり（紙の内幅 1672px） */
      const quoteCost = (o) => 18 + 20 + 60 + linesOf(`「${o.msg}」`, 34, 1610) * 51 + (o.note ? 6 + linesOf(o.note, 26, 1610) * 40 : 0) + 20;
      /* 2列の引用の札（1枚の内幅 760px） */
      const quoteCost2 = (o) => 18 + 20 + 60 + linesOf(`「${o.msg}」`, 34, 760) * 51 + (o.note ? 6 + linesOf(o.note, 26, 760) * 40 : 0) + 20;

      /* ======================== 各シーン描画 ======================== */
      const D = REVIEW_DATA;
      const YEAR = 2026;
      const PERIOD_FROM = String(D.period).split("〜")[0].trim();

      /* ⓪ オープニング。城の窓に、ステップごとに下から灯りがともる */
      function renderOpening() {
        return `
          <div class="op">
            <div class="op-left">
              <div class="op-period" data-step="0">${e(YEAR)} ・ ${e(D.period)}</div>
              <div class="ribbon big" data-step="0"><h1 class="title">${e(D.opening.title)}</h1></div>
              <p class="op-sub" data-step="0">${e(D.opening.sub)}</p>
              <div class="stats" data-step="1">
                ${D.opening.stats
                  .map(
                    (s) => `
                  <div class="stat">
                    <div class="n">${e(s.n)}<small>${e(s.unit)}</small></div>
                    <div class="l">${e(s.label)}</div>
                  </div>`
                  )
                  .join("")}
              </div>
              <div class="program" data-step="2">
                ${DOT_LABELS.slice(1, -1).map((x) => `<span>${e(x)}</span>`).join("")}
              </div>
            </div>
            ${castleHtml(600, { lv: 0.2, flag: 0, steps: [[1, 0.6, 0.4], [2, 1, 1]], pipos: [{ pose: "wait" }] })}
          </div>`;
      }

      /* ① 今月の6分割ふりかえり: 3コマずつ */
      const RECAP_PAGES = split(D.recap, 3);
      function renderRecap(i) {
        const rows = RECAP_PAGES[i];
        const base = RECAP_PAGES.slice(0, i).reduce((n, p) => n + p.length, 0);
        return `
          ${head(pageTag(1, i, RECAP_PAGES.length), "今月の6分割ふりかえり")}
          <div class="body"><div class="panel">
            ${pipoOn("walk0")}
            <div class="recap">
              ${rows
                .map(
                  (r, j) => `
                <div class="rc" data-step="${j + 1}">
                  <div class="top"><span class="no">${base + j + 1}</span><span class="pill">${e(r.when)}</span></div>
                  <h3>${e(r.title)}</h3>
                  <p>${e(r.body)}</p>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }

      /* ② 出席日数リスト。**皆勤賞より先。** 1面 16 行まで。超えたら割る */
      const KINKIN_PAGES = split(D.kinkin.others, PER_SCREEN);
      function renderKinkinList(i) {
        const K = D.kinkin;
        const rows = KINKIN_PAGES[i];
        const last = i === KINKIN_PAGES.length - 1;
        return `
          ${head(pageTag(2, i, KINKIN_PAGES.length), "今月の出席日数")}
          <div class="body"><div class="panel">
            ${pipoOn("sit")}
            <div class="list" data-step="0" style="grid-template-rows:repeat(${Math.ceil(rows.length / 2)}, auto)">
              ${rows
                .map(
                  (p) => `
                <div class="row" data-row>
                  ${avatarHtml(p.name)}
                  <span class="nm fit">${e(dispName(p.name))}</span>
                  <span class="st">${p.d}<small>/${K.denom}日</small></span>
                </div>`
                )
                .join("")}
            </div>
            ${last && K.note ? `<div class="foot" data-step="1">${e(K.note)}</div>` : ""}
          </div></div>`;
      }

      /* ③ 皆勤賞: 城に灯りがともって、表彰台。「N ヶ月連続」を必ず出す。
         **1ヶ月目は「1ヶ月連続」と書かない**——別の言葉と別の色 */
      function streakHtml(n) {
        const v = Number(n || 0);
        if (v >= 2) return `<span class="pill gold">${v}ヶ月連続</span>`;
        if (v === 1) return `<span class="pill mint">はじめての皆勤賞</span>`;
        return "";
      }
      function renderKinkinPodium() {
        const K = D.kinkin;
        const many = K.winners.length > 3;
        return `
          ${head("CORNER 3", "皆勤賞")}
          <div class="body">
            <p class="lead" data-step="0" style="color:var(--cream);text-shadow:0 2px 0 rgba(42,18,6,.6)">${e(PERIOD_FROM)}からの${K.denom}日間、ぜんぶの日に来てくれた${K.winners.length}人</p>
            <div class="kk">
              ${many ? "" : castleHtml(420, { lv: 0, flag: 0, steps: [[1, 1, 1]], pipos: [{ pose: "wait", until: 0 }, { pose: "cheer", from: 1 }] })}
              <div class="cards" data-step="1">
                ${K.winners
                  .map(
                    (p) => `
                  <div class="kc">
                    <span class="pill red">皆勤賞</span>
                    ${avatarHtml(p.name, "av-lg")}
                    <div class="nm fit">${e(dispName(p.name))}</div>
                    <div class="d">出席 ${K.denom}/${K.denom}日</div>
                    ${streakHtml(p.streak)}
                    ${p.word ? `<div class="w">${e(p.word)}</div>` : ""}
                  </div>`
                  )
                  .join("")}
              </div>
            </div>
          </div>`;
      }

      /* ④ はじめまして: 総数は出す。札にして並べるのは厳選した人だけ（2列、高さで面を割る） */
      const NEW_PAGES = pack(D.newcomers.featured, (o) => quoteCost2(o) / 2 + 10, PANEL_H - 150, 4);
      function renderNewcomers(i) {
        const N = D.newcomers;
        const rows = NEW_PAGES[i];
        const first = i === 0;
        const last = i === NEW_PAGES.length - 1;
        return `
          ${head(pageTag(4, i, NEW_PAGES.length), "はじめまして")}
          <div class="body"><div class="panel">
            ${pipoOn("peekWave")}
            ${first ? `<div class="count" data-step="1"><span class="l">${e(D.month)}、はじめてコメントしてくれたのは</span><span class="n">${e(N.count)}</span><span class="l">人</span></div>` : ""}
            <div class="${rows.length > 1 ? "q2" : "qs"}">
              ${rows.map((o, j) => quoteCard(o, j + 2, { extra: "初コメント" })).join("")}
            </div>
            ${last && N.note ? `<div class="foot" data-step="${rows.length + 2}">${e(N.note)}</div>` : ""}
          </div></div>`;
      }

      /* ⑤ どの配信でしょうクイズ: 1問1面。step0 問題 / step1 選択肢 / step2 正解 */
      function renderQuiz(qi) {
        const q = D.quiz[qi];
        const abc = ["A", "B", "C", "D"];
        return `
          ${head(`CORNER 5　Q${qi + 1} / ${D.quiz.length}`, "どの配信でしょうクイズ")}
          <div class="body"><div class="panel">
            ${pipoOn("peek")}
            <div class="quiz-q" data-step="0">
              <span class="qn">Q${qi + 1}</span>
              <div><div class="qt">${e(q.q)}</div><div class="hint2">チャットで答えてね</div></div>
            </div>
            <div class="choices" data-step="1" data-done-at="2">
              ${q.choices
                .map(
                  (c, i) => `
                <div class="choice${i === q.answer ? " right" : ""}">
                  <span class="abc">${abc[i]}</span><span>${e(c)}</span>
                  <span class="ok pill red">正解</span>
                </div>`
                )
                .join("")}
            </div>
            <div class="answer" data-step="2"><b>正解は ${abc[q.answer]}</b>　${e(q.note)}</div>
          </div></div>`;
      }

      /* ⑥ 流行語大賞: ノミネート（2列・6つまで）と発表。
         `first` は道具の「初出の日」。**今月より前から在る語は null** で、そのときは
         「◯◯から」を出さずに今月の件数だけ出す（件数は個人別ではないので出してよい。SKILL §6-2-3） */
      function buzzWhen(n) {
        const parts = [];
        if (n.first) parts.push(`<span class="pill">${e(n.first)} から</span>`);
        if (n.count != null) parts.push(`<span class="pill gold">今月 ${e(n.count)}件</span>`);
        return parts.join("");
      }
      const BUZZ_PAGES = split(D.buzzwords.nominees, 6);
      function renderBuzzNominees(i) {
        const rows = BUZZ_PAGES[i];
        return `
          ${head(pageTag(6, i, BUZZ_PAGES.length), "今月の流行語大賞")}
          <div class="body"><div class="panel">
            ${pipoOn("sit")}
            <p class="lead" data-step="0">ノミネート</p>
            <div class="q2">
              ${rows
                .map(
                  (n, j) => `
                <div class="qc bw" data-step="${j + 1}">
                  <div class="who"><span class="word">${e(n.word)}</span>${buzzWhen(n)}</div>
                  <div class="note">${e(n.note)}</div>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }
      function renderBuzzWinner() {
        const B = D.buzzwords;
        return `
          ${head("CORNER 6", "今月の流行語大賞")}
          <div class="body"><div class="panel">
            ${pipoOn("cheer")}
            <div class="drum" data-step="0">大賞は・・・・・・</div>
            <div class="win" data-step="1">
              <span class="pill red prize">${YEAR}年${e(D.month)} 流行語大賞</span>
              <div class="big">${e(B.grandPrix.word)}</div>
              <div class="note">${e(B.grandPrix.note)}</div>
              <div class="who" style="justify-content:center;display:flex;margin-top:14px">${buzzWhen(B.grandPrix)}</div>
            </div>
          </div></div>`;
      }

      /* ⑦ 名言・いい話: 1列。高さで面を割る（3枚まで） */
      const MEIGEN_PAGES = pack(D.meigen, quoteCost, PANEL_H, 3);
      function renderMeigen(i) {
        const rows = MEIGEN_PAGES[i];
        return `
          ${head(pageTag(7, i, MEIGEN_PAGES.length), "名言・いい話アワード")}
          <div class="body"><div class="panel">
            ${pipoOn("wait")}
            <div class="qs">${rows.map((m, j) => quoteCard(m, j + 1)).join("")}</div>
          </div></div>`;
      }

      /* ⑧ おもしろコメント大賞: 部門賞（1列、3枚まで）→ グランプリ1 */
      const FUNNY_PAGES = pack(D.funny.categories, quoteCost, PANEL_H, 3);
      function renderFunnyCats(i) {
        const rows = FUNNY_PAGES[i];
        return `
          ${head(pageTag(8, i, FUNNY_PAGES.length), "おもしろコメント大賞　部門賞")}
          <div class="body"><div class="panel">
            ${pipoOn("jump")}
            <div class="qs">${rows.map((c, j) => quoteCard(c, j + 1, { label: c.label })).join("")}</div>
          </div></div>`;
      }
      function renderFunnyGP() {
        const gp = D.funny.grandPrix;
        return `
          ${head("CORNER 8　グランプリ", "おもしろコメント大賞")}
          <div class="body"><div class="panel">
            ${pipoOn("cheer")}
            <div class="drum" data-step="0">グランプリは・・・・・・</div>
            <div class="win" data-step="1">
              <span class="pill red prize">${YEAR}年${e(D.month)} おもしろコメント大賞</span>
              <div class="msg">「${e(gp.winner.msg)}」</div>
              <div class="who">${avatarHtml(gp.winner.name, "av-xl")}<span>${e(dispName(gp.winner.name))}</span><span class="pill">${e(gp.winner.date)}</span></div>
              ${gp.note ? `<div class="note" style="margin-top:12px">${e(gp.note)}</div>` : ""}
            </div>
          </div></div>`;
      }

      /* ⑨ 調べもの大賞: **1面に収める**（あやと 2026-10-31。割ると見渡せない）。2列。
         入りきらない量のときは字を一段だけ小さくする（.dense。それでも 24px） */
      function renderGuides() {
        const G = D.guides;
        const card = (r) => r ? 26 + 40 + 4 + linesOf(`「${r.msg}」`, 28, 786) * 39 + 2 + linesOf(r.what, 24, 786) * 36 : 0;
        const cost = Array.from({ length: Math.ceil(G.rows.length / 2) }, (_, k) => Math.max(card(G.rows[2 * k]), card(G.rows[2 * k + 1]))).reduce((a, b) => a + b + 14, 0);
        const dense = cost > PANEL_H + 20;
        return `
          ${head("CORNER 9", "調べもの大賞")}
          <div class="body"><div class="panel gd${dense ? " dense" : ""}">
            ${pipoOn("catch")}
            <p class="lead" data-step="0">${e(G.lead)}</p>
            <div class="q2">
              ${G.rows
                .map(
                  (r, j) => `
                <div class="qc" data-step="${j + 1}">
                  <div class="who">
                    ${avatarHtml(r.name)}
                    <span class="nm">${e(dispName(r.name))}</span>
                    <span class="pill">${e(r.date)}</span>
                    ${r.hero ? `<span class="pill gold">大賞</span>` : ""}
                  </div>
                  <div class="msg">「${e(r.msg)}」</div>
                  <div class="note">${e(r.what)}</div>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }

      /* ⑩ 11月のおまけ。`emoji` 欄は画面に出さない（docs/island-design.md 1章）。印はピポの絵 */
      const OMAKE_STAMPS = ["flag", "catch", "yawn"];
      function renderOmake() {
        const n = Math.min(3, Math.max(1, D.omake.length));
        return `
          ${head("CORNER 10", `${D.month}のおまけ`)}
          <div class="body"><div class="panel">
            <div class="om" style="grid-template-columns:repeat(${n}, 1fr)">
              ${D.omake
                .map(
                  (o, i) => `
                <div class="oc" data-step="${i + 1}">
                  ${ART.pipo && ART.pipo[OMAKE_STAMPS[i % 3]] ? `<img class="stamp" src="${ART.pipo[OMAKE_STAMPS[i % 3]]}" alt="" />` : ""}
                  <h3>${e(o.title)}</h3>
                  <p>${e(o.body)}</p>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }

      /* ⑪ 投げ銭: 4位以下の一覧（1面 16 行まで）→ 3位・2位 → ドラムロール → 1位＋紙吹雪 → 合計。
         城の灯りは、順位が上がるほど上の階までともる（アラートと同じ見せかた） */
      const TIPS_LOW = D.tips.rows.filter((p) => p.rank >= 4);
      const TIPS_PAGES = TIPS_LOW.length ? split(TIPS_LOW, PER_SCREEN) : [];
      const tipsAt = (r) => D.tips.rows.filter((p) => p.rank === r);
      function renderTipsList(i) {
        const rows = TIPS_PAGES[i];
        return `
          ${head(pageTag(11, i, TIPS_PAGES.length), "投げ銭ありがとう")}
          <div class="body"><div class="panel">
            ${pipoOn("catch")}
            <p class="lead" data-step="0">応援してくれたみなさん（第${rows[0].rank}位〜）</p>
            <div class="list" data-step="1" style="grid-template-rows:repeat(${Math.ceil(rows.length / 2)}, auto)">
              ${rows
                .map(
                  (p) => `
                <div class="row" data-row>
                  <span class="rk">${p.rank}位</span>
                  ${charHtml(p)}
                  <span class="nm fit">${e(dispName(p.display))}</span>
                  <span class="yen">${yen(p.yen)}円</span>
                </div>`
                )
                .join("")}
            </div>
          </div></div>`;
      }
      function tierCard(p, rank, step, cls) {
        return `
          <div class="tier ${cls || ""}" ${step != null ? `data-step="${step}"` : ""}>
            <span class="medal m${rank}">${rank}</span>
            ${charHtml(p, rank === 1 ? "ch-xl" : "ch-lg")}
            <div class="who"><div class="rkn">第${rank}位</div><div class="nm fit">${e(dispName(p.display))}</div></div>
            <span class="yen">${yen(p.yen)}円</span>
          </div>`;
      }
      function renderTipsTop23() {
        const r3 = tipsAt(3);
        const r2 = tipsAt(2);
        return `
          ${head("CORNER 11", "投げ銭ありがとう")}
          <div class="body">
            <div class="tp">
              ${castleHtml(620, { lv: 0.3, flag: 0.2, steps: [[1, 0.55, 0.45], [2, 0.8, 0.7]], pipos: [{ pose: "catch" }] })}
              <div class="side">
                ${r3.map((p) => tierCard(p, 3, 1)).join("")}
                ${r2.map((p) => tierCard(p, 2, 2)).join("")}
              </div>
            </div>
          </div>`;
      }
      function renderTipsTop1() {
        const r1 = tipsAt(1);
        return `
          ${head("CORNER 11　第1位", "投げ銭ありがとう")}
          <div class="body">
            <div class="tp">
              ${castleHtml(640, { lv: 0.8, flag: 0.7, steps: [[1, 1, 1]], pipos: [{ pose: "wait", until: 0 }, { pose: "cheer", from: 1 }] })}
              <div class="side">
                <div class="drum" data-step="0" style="color:var(--cream);text-shadow:0 3px 0 rgba(42,18,6,.7)">第1位は・・・・・・</div>
                ${r1.map((p) => tierCard(p, 1, 1, "t1")).join("")}
                <div class="total" data-step="2">
                  ${ART.coin ? `<img src="${ART.coin}" alt="" />` : ""}
                  <span>合計 ${yen(D.tips.total)}円</span><span class="th">ありがとうございました</span>
                </div>
              </div>
            </div>
          </div>`;
      }

      /* ⑫ 手紙: 段落の字数で面を割る（1面 11 行ぶんまで。1行 49 字の見積もり） */
      const LETTER_LINES = 11;
      const LETTER_PAGES = pack(D.letter.paragraphs, (p) => linesOf(p, 32, 1600), LETTER_LINES, 6);
      function renderLetter(i) {
        const rows = LETTER_PAGES[i];
        const last = i === LETTER_PAGES.length - 1;
        const dense = rows.reduce((n, p) => n + linesOf(p, 32, 1600), 0) > LETTER_LINES;
        return `
          ${head(pageTag(12, i, LETTER_PAGES.length), "あやと島案内鳥 からの手紙")}
          <div class="body"><div class="panel letter${dense ? " dense" : ""}">
            ${pipoOn("sit")}
            ${rows.map((x, j) => `<p data-step="${j + 1}">${e(x)}</p>`).join("")}
            ${last ? `<div class="sig" data-step="${rows.length + 1}">${e(D.letter.sign)}</div>` : ""}
          </div></div>`;
      }

      /* ⑬ エンディング。城はぜんぶ灯って、ピポは門の前で眠る */
      function renderEnding() {
        const W = D.kinkin.winners;
        const talkers = (D.opening.stats || []).find((s) => /しゃべ|コメントしてくれた|話してくれた/.test(s.label || ""));
        return `
          <div class="end">
            <div class="ribbon big" data-step="0"><h1 class="title">${e(D.ending.title)}</h1></div>
            <p class="sub" data-step="0">${e(D.ending.sub)}</p>
            <div class="row2">
              ${castleHtml(600, { lv: 0.6, flag: 0.6, steps: [[1, 1, 1]], pipos: [{ pose: "sleep" }] })}
              <div class="panel" data-step="1">
                ${W.length ? `<div class="faces">${W.map((p) => avatarHtml(p.name, "av-xl")).join("")}</div>` : ""}
                <div class="thanks">${W.length ? `${D.kinkin.denom}日ぜんぶに来てくれた${W.length}人と、` : ""}${talkers ? `しゃべってくれた${e(talkers.n)}人に。` : "コメントしてくれたみなさんに。"}ありがとうございました。</div>
                ${D.ending.tapGoal ? `<div class="tap"><span class="l">タップタップ 今月の目標</span><span class="n">${yen(D.ending.tapGoal)}</span></div>` : ""}
                ${D.ending.ps ? `<div class="ps">${e(D.ending.ps)}</div>` : ""}
              </div>
            </div>
          </div>`;
      }

      /* ======================== シーン定義 ========================
         何面に割るかは**行数と字数から数える**。手で「2面」と書くと、人数が変わって黙って溢れる */
      const SCENES = [];
      const CORNER_OF = []; // シーンごとの「どのコーナーか」。手で数えない
      const push = (corner, scene) => {
        SCENES.push(scene);
        CORNER_OF.push(corner);
      };

      push(0, { total: 2, render: renderOpening });
      RECAP_PAGES.forEach((rows, i) => push(1, { total: rows.length, render: () => renderRecap(i) }));
      KINKIN_PAGES.forEach((_, i) => push(2, { total: i === KINKIN_PAGES.length - 1 && D.kinkin.note ? 1 : 0, render: () => renderKinkinList(i) }));
      push(3, { total: 1, render: renderKinkinPodium, confettiAt: 1 });
      NEW_PAGES.forEach((rows, i) => push(4, { total: rows.length + 1 + (i === NEW_PAGES.length - 1 && D.newcomers.note ? 1 : 0), render: () => renderNewcomers(i) }));
      D.quiz.forEach((_, i) => push(5, { total: 2, render: () => renderQuiz(i) }));
      BUZZ_PAGES.forEach((rows, i) => push(6, { total: rows.length, render: () => renderBuzzNominees(i) }));
      push(6, { total: 1, render: renderBuzzWinner, confettiAt: 1 });
      MEIGEN_PAGES.forEach((rows, i) => push(7, { total: rows.length, render: () => renderMeigen(i) }));
      FUNNY_PAGES.forEach((rows, i) => push(8, { total: rows.length, render: () => renderFunnyCats(i) }));
      push(8, { total: 1, render: renderFunnyGP, confettiAt: 1, confettiBig: true });
      // **1ページに収める**（あやと 2026-10-31）
      push(9, { total: D.guides.rows.length, render: renderGuides });
      push(10, { total: D.omake.length, render: renderOmake });
      TIPS_PAGES.forEach((_, i) => push(11, { total: 1, render: () => renderTipsList(i) }));
      if (tipsAt(3).length + tipsAt(2).length) push(11, { total: 2, render: renderTipsTop23 });
      push(11, { total: 2, render: renderTipsTop1, confettiAt: 1, confettiBig: true });
      LETTER_PAGES.forEach((rows, i) => push(12, { total: rows.length + (i === LETTER_PAGES.length - 1 ? 1 : 0), render: () => renderLetter(i) }));
      push(13, { total: 1, render: renderEnding, confettiAt: 1, confettiBig: true });

      const DOT_LABELS = [
        "オープニング",
        "今月の6分割ふりかえり",
        "今月の出席日数",
        "皆勤賞",
        "はじめまして",
        "どの配信でしょうクイズ",
        "流行語大賞",
        "名言・いい話アワード",
        "おもしろコメント大賞",
        "調べもの大賞",
        `${D.month}のおまけ`,
        "投げ銭ありがとう",
        "あやと島案内鳥 からの手紙",
        "エンディング",
      ];
      const DOT_OF_SCENE = CORNER_OF;
      const DOT_COUNT = DOT_LABELS.length;
      if (Math.max(...CORNER_OF) !== DOT_LABELS.length - 1) {
        // ドットの札とコーナー番号がずれると、進行ドットが別の名前を指す。黙って外れる
        console.error("DOT_LABELS とコーナー番号が合わない", Math.max(...CORNER_OF), DOT_LABELS.length);
      }

      /* ======================== ステート機械 ======================== */
      const world = document.getElementById("world");
      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const hint = document.getElementById("hint");
      let sceneIdx = 0;
      let stepIdx = 0;
      let interacted = false;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* 1920x1080 でない窓（手元の確かめ）では、舞台をまるごと縮める。OBS では 1 倍のまま */
      function fitWorld() {
        const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        world.style.setProperty("--k", String(k));
      }
      window.addEventListener("resize", fitWorld);
      fitWorld();
      if (ART.ribbon) document.documentElement.style.setProperty("--ribbon-img", `url("${ART.ribbon}")`);

      /* 雪と灯りの紐。数は少なく、動かすのは雪の粒の transform だけ */
      (function buildSky() {
        const snow = document.getElementById("snow");
        let h = "";
        for (let i = 0; i < 26; i++) {
          const x = (i * 73.7) % 100;
          const size = 6 + ((i * 7) % 6);
          const dur = 16 + ((i * 5) % 11);
          const delay = -((i * 3.7) % dur);
          h += `<i style="left:${x.toFixed(1)}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay.toFixed(1)}s"></i>`;
        }
        snow.innerHTML = h;
        const g = document.getElementById("garland");
        const colors = ["#ffd54a", "#ff9a6b", "#fff4dc", "#ffcf4d", "#ff7f8f"];
        let svg = "";
        let bulbs = "";
        [[0, 960], [960, 1920]].forEach(([a, b]) => {
          const mid = (a + b) / 2;
          svg += `<path d="M${a} 4 Q ${mid} 64 ${b} 4" fill="none" stroke="rgba(42,18,6,.55)" stroke-width="2" />`;
          for (let x = a + 40; x < b - 20; x += 64) {
            const t = (x - a) / (b - a);
            const y = 4 + 2 * t * (1 - t) * 60;
            const c = colors[Math.round(x / 64) % colors.length];
            bulbs += `<circle class="bulb" cx="${x}" cy="${(y + 9).toFixed(1)}" r="8" fill="${c}" />`;
          }
        });
        g.innerHTML = svg + `<g>${bulbs}</g>`;
      })();

      function buildDots() {
        progress.innerHTML = Array.from({ length: DOT_COUNT }, () => '<span class="dot"></span>').join("");
      }
      function updateDots() {
        const cur = DOT_OF_SCENE[sceneIdx];
        [...progress.children].forEach((d, i) => d.classList.toggle("act", i === cur));
      }

      /* 名前が札に入らないときは、字を少しだけ縮める（「…」で切らない。#308）。下限 24px */
      function fitTexts() {
        stage.querySelectorAll(".fit").forEach((el) => {
          el.style.fontSize = "";
          let fs = parseFloat(getComputedStyle(el).fontSize);
          let guard = 0;
          while (el.scrollWidth - el.clientWidth > 1 && fs > 24 && guard++ < 40) {
            fs -= 1;
            el.style.fontSize = fs + "px";
          }
        });
      }

      function applySteps() {
        stage.querySelectorAll("[data-step]").forEach((el) => {
          el.classList.toggle("on", Number(el.dataset.step) <= stepIdx);
        });
        stage.querySelectorAll("[data-from],[data-until]").forEach((el) => {
          const from = el.dataset.from != null ? Number(el.dataset.from) : -Infinity;
          const until = el.dataset.until != null ? Number(el.dataset.until) : Infinity;
          el.classList.toggle("hide", !(stepIdx >= from && stepIdx <= until));
        });
        stage.querySelectorAll("[data-done-at]").forEach((el) => {
          el.classList.toggle("done", Number(el.dataset.doneAt) <= stepIdx);
        });
        stage.querySelectorAll(".castle").forEach((c) => {
          let lv = Number(c.dataset.lv0);
          let fl = Number(c.dataset.flag0);
          for (const [st, l, f] of JSON.parse(c.dataset.levels || "[]")) {
            if (st <= stepIdx) {
              lv = l;
              fl = f;
            }
          }
          c.querySelector(".c-lit").style.clipPath = lightClip(lv);
          c.querySelector(".c-flag").style.transform = flagShift(fl, Number(c.dataset.s));
          c.querySelector(".c-glow").style.opacity = String(clamp01(lv));
        });
        const s = SCENES[sceneIdx];
        if (s.confettiAt != null && stepIdx === s.confettiAt) {
          spawnConfetti(s.confettiBig ? 160 : 90);
        }
      }

      function renderScene() {
        stage.innerHTML = SCENES[sceneIdx].render();
        updateDots();
        fitTexts();
        // 初期ステップ(0)を即時表示
        requestAnimationFrame(() => requestAnimationFrame(applySteps));
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTexts);

      function gotoScene(i, step) {
        sceneIdx = Math.max(0, Math.min(SCENES.length - 1, i));
        stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, step ?? 0));
        stage.classList.add("fading");
        setTimeout(() => {
          renderScene();
          stage.classList.remove("fading");
        }, reduceMotion ? 0 : 280);
        onStateChanged();
      }

      function advance() {
        dismissHint();
        if (stepIdx < SCENES[sceneIdx].total) {
          stepIdx++;
          applySteps();
          onStateChanged();
        } else if (sceneIdx < SCENES.length - 1) {
          gotoScene(sceneIdx + 1, 0);
        }
      }
      function back() {
        dismissHint();
        if (stepIdx > 0) {
          stepIdx--;
          applySteps();
          onStateChanged();
        } else if (sceneIdx > 0) {
          const prev = sceneIdx - 1;
          gotoScene(prev, SCENES[prev].total);
        }
      }
      function dismissHint() {
        if (!interacted) {
          interacted = true;
          setTimeout(() => hint.classList.add("gone"), 4000);
        }
      }

      /* ======================== 紙吹雪（城の色） ======================== */
      const COLORS = ["#ffd54a", "#fff4dc", "#8a2433", "#1565c0", "#ffcf4d", "#ff9a6b", "#c4f2d9"];
      function spawnConfetti(count) {
        if (reduceMotion || ROLE === "ctrl") return;
        const layer = document.getElementById("confetti-layer");
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * 1920 + "px";
          c.style.background = COLORS[(Math.random() * COLORS.length) | 0];
          c.style.width = 10 + Math.random() * 10 + "px";
          c.style.height = 16 + Math.random() * 12 + "px";
          c.style.animationDuration = 3.6 + Math.random() * 2.6 + "s";
          c.style.animationDelay = Math.random() * 0.9 + "s";
          layer.appendChild(c);
          setTimeout(() => c.remove(), 7500);
        }
      }

      /* ======================== 入力 ======================== */
      // 注意: ctrl モードではグローバル入力を登録しない。
      // (登録するとボタンの click と pointerdown が二重発火し、1タップで2つ以上進むバグになる)
      const IS_CTRL = new URLSearchParams(location.search).get("role") === "ctrl";
      if (!IS_CTRL) {
        window.addEventListener("pointerdown", (ev) => {
          if (ev.button === 2) return;
          advance();
        });
        window.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          back();
        });
      }
      window.addEventListener("keydown", (ev) => {
        const k = ev.key;
        if (k === "Enter" || k === " " || k === "ArrowRight" || k === "ArrowDown") {
          ev.preventDefault();
          advance();
        } else if (k === "Backspace" || k === "ArrowLeft" || k === "ArrowUp") {
          ev.preventDefault();
          back();
        } else if (/^[0-9]$/.test(k)) {
          // 数字キー: コーナー頭出し(リハーサル用)
          const dot = Number(k);
          const target = DOT_OF_SCENE.indexOf(dot);
          if (target >= 0) gotoScene(target, 0);
        }
      });

      // 検証・リハーサル用フック（tools/monthly_review/check.mjs が使う）
      window.__jump = (i, step) => gotoScene(i, step ?? 0);
      window.__sceneCount = SCENES.length;
      window.__state = () => ({ scene: sceneIdx, step: stepIdx, total: SCENES[sceneIdx].total, corner: CORNER_OF[sceneIdx] });
      window.__totals = SCENES.map((s) => s.total);
      window.__cornerOf = CORNER_OF.slice();


      /* =========================================================
         リモート同期(Firestore)
         - 無指定: 従来どおりローカル操作のみ(SDKは読み込まない)
         - ?role=view : Firestoreの状態に追従(スマホOBSオーバーレイ用)
         - ?role=ctrl : スマホ用コントローラ(進行操作を配信画面へ送る)
         - ?auto=秒数 : 自動進行(同期なしのフォールバック)

         ▼▼ 書けるのはあやとだけ ▼▼
         `firestore.rules` の monthlyReview は
           読む   … 誰でも(OBS はログインできないので、ここは開けてある)
           書く   … `islandUsers/{uid}.admin` が立っている人だけ
         になっている。だから **ctrl はログインしてからでないと進行を送れない。**

         同じ端末で島(`/`)にログインしてあれば、ここは何も押さずに繋がる
         (下の SDK の版と apiKey を島に合わせてあるのはそのため)。
         繋がらないときだけ、コントローラーに「Google でログイン」が出る。
         ========================================================= */
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDts2gpO2fepPYOdiMyiz5ydTIQHNtY5kM",
        authDomain: "live-streaming-d3cac.firebaseapp.com",
        projectId: "live-streaming-d3cac",
        storageBucket: "live-streaming-d3cac.firebasestorage.app",
        messagingSenderId: "291182823114",
        appId: "1:291182823114:web:84e7d7c52c8d3ca7d39633",
      };
      const SYNC_COLLECTION = "monthlyReview";
      const SYNC_DOC = "202611-14e963"; // 月ごとに新しく発行する。簡易ガード用トークン入り

      const params = new URLSearchParams(location.search);
      const ROLE = params.get("role"); // "ctrl" | "view" | null
      const AUTO_SEC = Math.max(0, Number(params.get("auto")) || 0);

      /* Firebase の SDK。**版を島(`site/package.json` の firebase ^12)に揃えてある。**
         ログインは localStorage に `firebase:authUser:<apiKey>:[DEFAULT]` の形で
         残るので、同じ apiKey・同じ既定アプリ名・同じ大版なら、島でログイン済みの
         端末はここでも押さずにログイン済みになる。配信の当日に押させない。 */
      const SDK = "https://www.gstatic.com/firebasejs/12.18.0";

      let publishFn = null; // ctrl時のみセット。**ログインするまで null**
      let signInFn = null; // ctrl時のみセット。「Google でログイン」の中身

      /* コントローラーの札。**「いま押せば OBS が動く」ときだけ緑にする。**
         Firestore に繋がっただけでも、ログインしただけでも足りない。
         別々の場所から `setCtrlStatus` を呼んでいると、あとから来たほうが
         上書きして「同期中と出ているのに押しても動かない」が起きる
         （実際に起きた。配信の最中にこれをやられると原因が分からない）。 */
      let linkOk = false; // Firestore からスナップショットが来ている
      let authOk = false; // ログインしている
      let sendErr = ""; // 直前の送信が落ちた理由。空なら落ちていない
      function refreshCtrlStatus() {
        if (ROLE !== "ctrl") return;
        if (!linkOk) setCtrlStatus(false, "つながっていません");
        else if (!authOk) setCtrlStatus(false, "ログインが要ります");
        else if (sendErr) setCtrlStatus(false, sendErr);
        else setCtrlStatus(true, "同期中");
      }
      let applyingRemote = false;
      let lastConfetti = 0;
      let lastSeenTs = 0; // これより古いスナップショットは無視(連打時の巻き戻り防止)
      let seenFirstSnap = false; // 1枚目のスナップショットを受けたか(紙吹雪の空撃ち防止)

      function onStateChanged() {
        updateCtrlLabels();
        if (publishFn && !applyingRemote) {
          const ts = Date.now();
          lastSeenTs = Math.max(lastSeenTs, ts);
          /* **落ちた理由を出す。** 「送信失敗」だけだと、配信の最中に
             ログインの問題なのか電波なのかが分からない。 */
          publishFn({ scene: sceneIdx, step: stepIdx, ts, confetti: lastConfetti })
            .then(() => {
              if (!sendErr) return;
              sendErr = "";
              cEls.banner.classList.remove("show");
              refreshCtrlStatus();
            })
            .catch((e) => {
              const denied = e && (e.code === "permission-denied" || /permission/i.test(String(e)));
              sendErr = denied ? "このアカウントでは操作できません" : "送信失敗";
              refreshCtrlStatus();
              if (denied) showSignIn("進行を動かせるのは、島の管理者のアカウントだけです。入り直してください。");
            });
        }
      }

      /** Firebase のアプリ。ログインと Firestore で**同じものを使う**(そうしないと別のログインになる)。 */
      async function firebaseApp() {
        const { initializeApp, getApps } = await import(`${SDK}/firebase-app.js`);
        return getApps()[0] ?? initializeApp(FIREBASE_CONFIG);
      }

      async function initSync(onRemote) {
        if (!FIREBASE_CONFIG) throw new Error("FIREBASE_CONFIG未設定");
        const fsm = await import(`${SDK}/firebase-firestore.js`);
        const db = fsm.getFirestore(await firebaseApp());
        const ref = fsm.doc(db, SYNC_COLLECTION, SYNC_DOC);
        fsm.onSnapshot(
          ref,
          (snap) => {
            if (snap.exists()) onRemote(snap.data(), snap.metadata.hasPendingWrites);
            /* ここは「繋がった」だけを伝える。**緑にするかは
               `refreshCtrlStatus` が決める**（ログインと送信の成否も見る）。 */
            linkOk = true;
            refreshCtrlStatus();
          },
          () => {
            linkOk = false;
            refreshCtrlStatus();
          }
        );
        return (data) => fsm.setDoc(ref, data);
      }

      /* ---------- ログイン(ctrl だけ) ----------
         進行を書けるのはあやとだけ(`firestore.rules` の monthlyReview)。
         OBS(view)は読むだけなので、**そちらでは firebase-auth を落とさない。**
         配信に映っている側に、押せもしないログインの札を出さないため。 */
      async function initAuth(onUser) {
        const am = await import(`${SDK}/firebase-auth.js`);
        const auth = am.getAuth(await firebaseApp());
        /* 島でログイン済みの端末なら、ここが最初から user 付きで呼ばれる。
           そのときは何も押さずに「同期中」まで行く。 */
        am.onAuthStateChanged(auth, onUser);
        return () => am.signInWithPopup(auth, new am.GoogleAuthProvider());
      }

      /** コントローラーに「Google でログイン」を出す。押せる札にする(文だけ出さない)。 */
      function showSignIn(msg) {
        if (ROLE !== "ctrl") return;
        cEls.banner.textContent = "";
        const p = document.createElement("div");
        p.textContent = msg;
        const b = document.createElement("button");
        b.textContent = "Google でログイン";
        b.style.cssText = "margin-top:8px;padding:10px 14px;font-size:15px;touch-action:manipulation";
        b.addEventListener("click", async () => {
          b.disabled = true;
          try {
            if (signInFn) await signInFn();
          } catch (e) {
            /* 落ちた符丁（`auth/popup-blocked` など）は画面に出さない。
               読むのはあやとで、できることは「もう一度押す」だけ。
               符丁は console にだけ残す。 */
            console.error("ふりかえり授賞式: ログインできなかった —", e);
            p.textContent = "ログインできませんでした。もう一度押してください。";
          } finally {
            b.disabled = false;
          }
        });
        cEls.banner.append(p, b);
        cEls.banner.classList.add("show");
      }

      /* ---------- コントローラUI ---------- */
      const cEls = {
        dot: document.getElementById("c-dot"),
        statusText: document.getElementById("c-status-text"),
        banner: document.getElementById("c-banner"),
        corner: document.getElementById("c-corner"),
        step: document.getElementById("c-step"),
        next: document.getElementById("c-next"),
        back: document.getElementById("c-back"),
        grid: document.getElementById("c-grid"),
        confetti: document.getElementById("c-confetti"),
        top: document.getElementById("c-top"),
      };
      function setCtrlStatus(ok, text) {
        if (ROLE !== "ctrl") return;
        cEls.dot.className = "c-dot " + (ok ? "ok" : "ng");
        cEls.statusText.textContent = text || (ok ? "同期中" : "未接続");
      }
      function updateCtrlLabels() {
        if (ROLE !== "ctrl") return;
        const dot = DOT_OF_SCENE[sceneIdx];
        cEls.corner.textContent = DOT_LABELS[dot];
        const local = SCENES.map((s, i) => (DOT_OF_SCENE[i] === dot ? i : null)).filter((v) => v != null);
        const pagePos = local.indexOf(sceneIdx) + 1;
        cEls.step.textContent = `画面 ${pagePos}/${local.length} ・ ステップ ${stepIdx}/${SCENES[sceneIdx].total} ・ 全体 ${sceneIdx + 1}/${SCENES.length}`;
        [...cEls.grid.children].forEach((b, i) => b.classList.toggle("act", i === dot));
      }
      function initCtrlUi() {
        document.body.classList.add("ctrl");
        cEls.next.addEventListener("click", advance);
        cEls.back.addEventListener("click", back);
        cEls.top.addEventListener("click", () => gotoScene(0, 0));
        cEls.confetti.addEventListener("click", () => {
          lastConfetti = Date.now();
          onStateChanged();
        });
        DOT_LABELS.forEach((label, dot) => {
          const b = document.createElement("button");
          b.textContent = `${dot}. ${label}`;
          b.addEventListener("click", () => gotoScene(DOT_OF_SCENE.indexOf(dot), 0));
          cEls.grid.appendChild(b);
        });
        updateCtrlLabels();
      }

      /* ---------- 起動 ---------- */
      buildDots();
      renderScene();

      if (ROLE === "ctrl") {
        initCtrlUi();
        initSync((data, isLocalEcho) => {
          // 自分の書き込みエコーと古いスナップショットは無視(多重進行・巻き戻り防止)
          if (isLocalEcho) return;
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          // 他の操作元(PC等)の状態も反映してコントローラ表示を同期
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          sceneIdx = Math.max(0, Math.min(SCENES.length - 1, data.scene ?? 0));
          stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
          lastConfetti = data.confetti || lastConfetti;
          updateCtrlLabels();
          applyingRemote = false;
        })
          .then(async (pub) => {
            setCtrlStatus(false, "ログインを確かめています…");
            /* **ログインが確かめられるまで publishFn を入れない。**
               入れてしまうと、押した瞬間に静かに 403 で落ちる。
               配信の最中にそれが起きると、何が悪いのか分からない。 */
            signInFn = await initAuth((user) => {
              authOk = !!user;
              sendErr = "";
              publishFn = user ? pub : null;
              if (user) {
                cEls.banner.classList.remove("show");
                refreshCtrlStatus();
                onStateChanged();
              } else {
                refreshCtrlStatus();
                showSignIn("進行を動かすにはログインが要ります。島と同じアカウントで入ってください。");
              }
            });
          })
          .catch((e) => {
            linkOk = false;
            setCtrlStatus(false, "つながりません");
            /* ここはコントローラ（あやとの手元）なので字を出してよいが、
               書いてよいのは**これから何をするか**だけ。
               前は `Firestore につながりませんでした(<符丁>)` と、置き場の
               名前と落ちた符丁をそのまま出していた。手元でそれを読んでも
               打つ手は変わらないし、コントローラを画面共有した日には
               置き場の名前ごと映る。詳しいことは console にだけ残す。 */
            console.error("ふりかえり授賞式: 進行のつなぎに入れなかった —", e);
            cEls.banner.textContent = "進行がつながりません。電波を確かめて、開き直してください。";
            cEls.banner.classList.add("show");
          });
      } else if (ROLE === "view") {
        hint.classList.add("gone");
        initSync((data) => {
          // 古いスナップショットは無視(順序入れ替わりによる巻き戻り防止)
          if (typeof data.ts === "number") {
            if (data.ts <= lastSeenTs) return;
            lastSeenTs = data.ts;
          }
          /* **1枚目のスナップショットでは飛ばさない。** OBS を開いた瞬間に
             前の紙吹雪が飛ぶのを止めるため。
             前は「lastConfetti が 0 でなければ」で見ていたが、月ごとの書類は
             `confetti: 0` から始まるので、**その月の1回目がいつも飲まれていた**
             （エミュレータに2枚のブラウザを繋いで確かめた）。
             「開いた直後か」と「まだ一度も飛ばしていないか」は別のこと。 */
          if (typeof data.confetti === "number" && data.confetti > lastConfetti) {
            if (seenFirstSnap) spawnConfetti(140);
            lastConfetti = data.confetti;
          }
          seenFirstSnap = true;
          if (data.scene === sceneIdx && data.step === stepIdx) return;
          applyingRemote = true;
          if (data.scene !== sceneIdx) {
            gotoScene(data.scene ?? 0, data.step ?? 0);
          } else {
            stepIdx = Math.max(0, Math.min(SCENES[sceneIdx].total, data.step ?? 0));
            applySteps();
          }
          applyingRemote = false;
        }).catch(() => {
          /* 未設定・接続不可: ローカル操作のまま */
        });
      }

      if (AUTO_SEC > 0) setInterval(advance, AUTO_SEC * 1000);
    </script>
  </body>
</html>
