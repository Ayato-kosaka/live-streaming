<!doctype html><html lang="ja"><meta charset="utf-8"><title>対照: 包んだ label から名前が来る欄</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0">
<h1>包んだ label から名前が来る欄の台</h1>
<h2>拾ってはいけない</h2>
<!-- 欄そのものは字を持たない。名前は包んでいる label から来る -->
<label><span>書くこと</span><textarea rows="2"></textarea></label>
<label for="nm">呼ばれたい名前</label><input id="nm">
<p><a href="/ok.html">戻る</a></p>
<img src="pix.png" width="16" height="16" alt="16px 四方の見本の絵">
</body></html>
