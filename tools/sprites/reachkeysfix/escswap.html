<!doctype html><html lang="ja"><meta charset="utf-8"><title>対照: 同じ節点のまま閉じるダイアログ</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0">
<h1>閉じても節点が残るダイアログの台</h1>
<h2>Esc で閉じる</h2>
<!-- **React が開いた姿と閉じた姿で同じ節点を使い回す形。**
     どちらも `<div>` なので、閉じても消えずに属性だけ書き替わる
     （`MapZoom` が `div.mzoom-sheet` → `div.mzoom`）。
     **拾ってはいけない。** 消えるのを待つ測りかただと、Esc が効いている
     面が「閉じこめ」に化ける（`docs/island-misses.md` #265）。 -->
<div id="box" role="dialog" aria-modal="true" aria-label="閉じられる札">
  <p>この札は Esc で閉じる。ただし節点はそのまま残る</p>
  <p><a href="/ok.html">戻る</a></p>
</div>
<img src="pix.png" width="16" height="16" alt="16px 四方の見本の絵">
<script>
  window.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.getElementById("box");
    if (!el || !el.hasAttribute("role")) return;
    el.removeAttribute("role");
    el.removeAttribute("aria-modal");
    el.removeAttribute("aria-label");
    el.innerHTML = '<p>閉じたあとの姿。<a href="/ok.html">戻る</a></p>';
  });
</script>
</body></html>
