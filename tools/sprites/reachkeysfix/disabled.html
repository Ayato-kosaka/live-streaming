<!doctype html><html lang="ja"><meta charset="utf-8"><title>対照: いま効かなくしてあるボタン</title>

<body style="margin:0">
<h1>いま効かなくしてあるボタンの台</h1>
<h2>拾ってはいけない</h2>
<!-- いま押せないので、Tab の列から外れているのが正しい。
     `/map` の「ひとつ前の国」が1件目の偽の赤だった -->
<p><button type="button" disabled onclick="document.title='押した'">ひとつ前へ</button></p>
<p><span role="button" aria-disabled="true" onclick="document.title='押した'">まだ押せない</span></p>
<p><a href="/ok.html">戻る</a></p>
<img src="pix.png" width="16" height="16" alt="16px 四方の見本の絵">
