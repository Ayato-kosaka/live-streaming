<!doctype html><html lang="ja"><meta charset="utf-8">
<title>対照: 返ってこない面</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  `reachwatch.mjs` の「返ってこない面」の対照。**着いてから固まる。**

  本物で起きたのは、開いて畳みを送っているあいだに描画の手（main thread）が
  止まり、`evaluate` が二度と返ってこない形だった（#944。CI で 39回中9回）。
  ここはそれを、着いて 300ms 後に手を回しっぱなしにして作る。
  `goto` は通る（DOMContentLoaded までは素直）ので、止まるのは**測っている最中**。

  道具は同じ字の `calm.html` と取り替えて配る（何回目に何を返すかは道具が持つ）。
  押しどころは 60px の1個だけ。測れたかどうかを「1個数えたか」で見る。
-->
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; color: #222 }
  a { display: block; width: 60px; height: 60px; line-height: 60px; background: #0a6; color: #fff }
</style>
<body><main>
<h1>返ってこない面</h1>
<a href="#calm">足大</a>
</main>
<script>
  /* 描画の手を返さない。**止まっているあいだは、Runtime.evaluate にも答えない**
     （本物で止まった回と同じ。CDP から生きているかを聞いても返事が無かった） */
  setTimeout(() => { for (;;) {} }, 300);
</script>
</body></html>
